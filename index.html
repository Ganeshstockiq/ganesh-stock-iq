// On Supabase no password is ever kept in the browser: after a save, the plain-text one just typed is dropped.
function stripPasswords_(m){
  ['cnfs','adminUsers','misUsers','scUsers'].forEach(k=>(m[k]||[]).forEach(r=>{ delete r.password; }));
}
async function saveMasters(){
  const sb = isSupabaseMode();
  if(!sb){ lsSet('masters', state.masters); lsSet('masterSyncedAt', Date.now()); }
  if(getApiUrl()){
    try{ await apiPost('saveMasters', {masters: state.masters}); }
    catch(e){
      showToast(sb ? '⚠ Not saved: '+((e&&e.message)||'server error') : '⚠ Could not sync to server — saved on this device only');
      if(sb){ stripPasswords_(state.masters); try{ await forceSyncMasters({fresh:true}); }catch(e2){} }  // put back what the server really has
      return false;
    }
  }
  if(sb){ stripPasswords_(state.masters); lsSet('masters', state.masters); lsSet('masterSyncedAt', Date.now()); }
  return true;
}

// Called right after a CNF's Final Submit. Optimistically already in
// state.submissions; this pushes it to the backend, or queues it for
// automatic retry if the device is offline right now. Returns a result
// so the caller can decide whether silence is OK (it's usually fine, in
// the background) or whether the person needs to actually be told.
// Hybrid save: the SAME submission goes to the Google Sheet (where it is stored) and to the
// Supabase reporting copy (so dashboards see it at once), both at the same time. Each side has
// its own retry list, filled BEFORE sending and emptied only when that side confirms — so a closed
// tab, a flaky network or a slow Apps Script can't make a submission vanish from either.
// The CNF is told it worked if at least one side confirmed: a submission that is safely in the
// database is not a failed submission just because the Sheet is slow, and its Sheet copy keeps
// retrying on its own. Both sides are idempotent by submission id, so a retry never doubles it.
function queueAdd_(key, sub){ const q = lsGet(key) || []; if(!q.some(x=>x.id===sub.id)){ q.push(sub); lsSet(key, q); } }
function queueRemove_(key, id){ lsSet(key, (lsGet(key)||[]).filter(x=>x.id!==id)); }
async function syncSubmissionHybrid_(sub){
  queueAdd_('pendingSubmissions', sub);
  queueAdd_('pendingSupabaseSubs', sub);
  const confirmed = v => !!(v && v.ok===true);
  const sheetP = appsScriptPost('addSubmission', {submission: sub}).then(v=>({ok:confirmed(v), v}), e=>({ok:false, e}));
  const supaP  = supabaseCall('addSubmission', {submission: sub}, 25000).then(v=>({ok:confirmed(v), v}), e=>({ok:false, e}));
  sheetP.then(r=>{ if(r.ok) queueRemove_('pendingSubmissions', sub.id); });
  supaP.then(r=>{ if(r.ok){ queueRemove_('pendingSupabaseSubs', sub.id); } else markReportStale('a submission could not be saved to Supabase yet'); });
  const supa = await supaP;
  let sheet;
  if(supa.ok){
    // Safe in the database already — give the Sheet a few seconds, but never make the CNF stare at a slow Sheet.
    sheet = await Promise.race([sheetP, new Promise(r=>setTimeout(()=>r(null), 4000))]);
    return {ok:true, sheetPending: !(sheet && sheet.ok), reportPending:false};
  }
  sheet = await sheetP;
  if(sheet.ok) return {ok:true, sheetPending:false, reportPending:true};
  return {ok:false, offline:false, error: (sheet.e && sheet.e.message) || (supa.e && supa.e.message) || 'Neither the Google Sheet nor the reporting database confirmed the save.'};
}

async function syncSubmission(sub){
  lsSet('submissions', state.submissions);
  if(!getApiUrl()) return {ok:false, offline:true, error:'No backend connected — running in Local Demo Mode.'};
  if(isHybridMode()) return await syncSubmissionHybrid_(sub);
  try{
    const result = await apiPost('addSubmission', {submission: sub});
    if(!result || result.ok!==true) throw new Error('Server responded but did not confirm the save — response: '+JSON.stringify(result));
    return {ok:true};
  }catch(e){
    const queue = lsGet('pendingSubmissions') || [];
    if(!queue.some(q=>q.id===sub.id)) queue.push(sub);
    lsSet('pendingSubmissions', queue);
    return {ok:false, offline:false, error: (e && e.message) || String(e)};
  }
}

// Downloads a CSV backup of one submission — used the moment a sync to the
// server fails, so the CNF has physical, human-readable proof of exactly
// what they submitted even if the network/backend is the problem, not them.
function downloadSubmissionBackup(sub){
  const headers = ['Submission ID','CNF Code','CNF Name','Stock Date','Timestamp','Product Code','Product Name','Category','Entered Qty','UOM','KG','MFD','SAP Qty (kg)','Variance Reason','Submitted By'];
  const rows = sub.items.map(it=>[sub.id, sub.cnfCode, sub.cnfName, fmtD(sub.date), sub.timestamp, it.code, it.name, it.category, it.qty, it.uom, it.kgQty.toFixed(2), fmtD(it.mfd), it.sapQtyKg??'', it.varianceReason||'', sub.submittedBy]);
  exportGenericCsv(`UNSYNCED-${sub.id}-${fmtD(sub.date)}.csv`, headers, rows);
}

// One column, one concrete task — this looks at BOTH signals a line can
// carry (ageing status), so the report tells someone what to actually DO
// about ageing/expiry — not just what's true. This deliberately does NOT
// recommend ordering more stock, even when a line is below its Safety
// Stock norm — that breach is already fully visible in the separate
// Safety Status and Shortfall (kg) columns on every row, and turning it
// into an instruction here ("Order Required") would read as this app
// directing a purchase decision, which isn't something it should ever
// tell someone to do. Expired always wins — a batch already past its
// shelf life is a quality/write-off question ("why is this still here,
// unsold, past expiry") that needs investigating before anything else.
function recommendedAction(ageingCls, isBelowSafety){
  if(ageingCls==='expired') return 'Check Reason';
  if(['ageing','critical','expiring'].includes(ageingCls)) return 'Needs Movement';
  return '—';
}
// The action-oriented label for a safety-status value — 'low' is what
// actually needs to happen (place an order for this CNF), 'no-norm' is a
// data gap that needs Admin/the CNF's file to actually set a figure (very
// different from a verified-healthy 'ok'), and everything else is genuinely
// fine.
function safetyStatusLabel(safetyStatus){
  if(safetyStatus==='low') return 'Replenishment Needed';
  if(safetyStatus==='no-norm') return 'No Safety Norm Set';
  return 'OK';
}

// Single source of truth for "what's this line's safety norm" — Safety
// Stock is CNF × product-code specific (Column M of the SAP Current Stock
// file each CNF uploads), captured on the submitted item itself, NOT a
// single global number in Product Master any more. Falls back to Product
// Master's own safetyStockKg only when the item has none — genuinely old
// submissions from before this change, or a file whose Safety Stock column
// couldn't be found. Every report and screen should read the norm through
// this function rather than reaching for product.safetyStockKg directly,
// so "Product Master's default" can never quietly stand in for "what this
// CNF's own file actually says" while looking identical in the UI.
function safetyNormFor(item, product){
  if(item && item.safetyStockKg!=null) return item.safetyStockKg;
  return product ? (product.safetyStockKg||0) : 0;
}

// Three-way, not just low/ok — a product that has genuinely never been
// given a Safety Stock figure (no value on this item's own SAP file AND no
// Product Master fallback either) is a data gap, not a clean bill of
// health. Showing it as a plain green "OK" would hide that nobody has
// actually told the system what this product's safety norm even is,
// behind the exact same label as stock that was checked and found fine.
// Every screen/report showing a safety verdict should go through this
// (or safetyStatusLabel for the text) rather than hand-rolling its own
// `kgQty < norm ? 'low' : 'ok'` comparison, so "no norm set" can never
// quietly get counted as, or displayed as, "OK".
function safetyStatusFor(item, product){
  const norm = safetyNormFor(item, product);
  if(!norm || norm<=0) return 'no-norm';
  return item.kgQty < norm ? 'low' : 'ok';
}

// Maps a safetyStatusFor() value to its badge CSS class — 'no-norm' (the
// status string) needs the 'unknown' class (the CSS name), so this is the
// one place that translation happens rather than repeating a ternary at
// every badge.
function safetyBadgeClass(safetyStatus){
  if(safetyStatus==='low') return 'low';
  if(safetyStatus==='no-norm') return 'unknown';
  return 'ok';
}


// The full, detailed per-line report for one submission — every product,
// its ageing status, self-life, remaining shelf life, and safety-stock
// standing. Used both for the auto-download right after every Final Submit
// and for the manual "Export" buttons on CNF Reports/History.
// A UOM value that isn't one of the three real units means it came from
// data corrupted somewhere upstream (an old product with a defaultUOM
// that ended up holding a raw number instead of "KG"/"PC"/"BAG", which
// then got copied into an actual submission when a batch's own uom was
// never explicitly changed from that default). Reports should never
// silently print that raw garbage value — showing it plainly as
// unrecognised is safer than passing through a number a reader could
// mistake for something meaningful.
function safeUomLabel(uom){
  return ['KG','PC','BAG'].includes(uom) ? uom : `${uom} (unrecognised — check Product Master)`;
}
function buildDetailedReportRows(sub){
  const headers = ['Product Code','Product Name','Category','Entered Qty','UOM','KG','1 Bag = KG (fixed)','BAG Equiv','1 PC = KG (fixed)','PC Equiv','MFD','Age (d)','Self-Life (d)','Remaining (d)','Status','Recommended Action','Safety Norm (kg)','Safety Status','Shortfall (kg)','SAP Qty (kg)','Approved Order','Pending Order','Variance Reason','Audit By'];
  const rows = rptItems_(sub).map(it=>{
    const p = state.masters.products.find(pp=>pp.code===it.code);
    const st = p ? ageingStatus(p, it.mfd) : {age:'',life:'',remaining:'',label:'',cls:''};
    const bagEquiv = p && p.bagToKg ? bagEquivDisplay(it.kgQty, p) : '';
    const pcEquiv = p && p.pcToKg ? pcEquivDisplay(it.kgQty, p) : '';
    const safetyStat = safetyStatusFor(it, p);
    const safetyNorm = safetyNormFor(it, p);
    const shortfall = safetyStat==='low' ? (safetyNorm - it.kgQty).toFixed(1) : safetyStat==='ok' ? 'No Shortfall' : '';
    return [it.code, it.name, it.category, it.qty, safeUomLabel(it.uom), it.kgQty.toFixed(2), p&&p.bagToKg?p.bagToKg:'', bagEquiv, p&&p.pcToKg?p.pcToKg:'', pcEquiv, fmtD(it.mfd), st.age??'', st.life??'', st.remaining??'', (st.label ? ageingStatusCell(st) : ''), recommendedAction(st.cls, safetyStat==='low'), safetyNorm, safetyStatusLabel(safetyStat), shortfall, it.sapQtyKg??'', it.approvedOrder??'', it.pendingOrder??'', it.varianceReason||'', auditByLabel(sub)];
  });
  // CNF/CFA-code-wise Summary — becomes sheet ONE of the workbook. Built from
  // the submission itself, so every download (fresh, re-download, History,
  // old submissions) carries it.
  const byCat = {}, byStatus = {};
  let totalKg = 0, belowSafety = 0, noMfd = 0;
  rptItems_(sub).forEach(it=>{
    const p = state.masters.products.find(pp=>pp.code===it.code);
    const st = p ? ageingStatus(p, it.mfd) : {label:''};
    const kg = Number(it.kgQty)||0;
    totalKg += kg;
    byCat[it.category||'Other'] = (byCat[it.category||'Other']||0) + kg;
    const lbl = it.mfd ? (st.label||'Unknown') : 'No MFD';
    byStatus[lbl] = (byStatus[lbl]||0) + 1;
    if(!it.mfd) noMfd++;
    if(safetyStatusFor(it, p)==='low') belowSafety++;
  });
  const kf = n => Number(n.toFixed(1));
  const summaryRows = [
    ['CNF / CFA DETAILS',''],
    ['CNF / CFA Code', sub.cnfCode||''],
    ['CNF / CFA Name', sub.cnfName||''],
    ['Stock Date', sub.date||''],
    ['Submission ID', sub.id||''],
    ['Audit By', auditByLabel(sub)],
    ['',''],
    ['AT A GLANCE',''],
    ['Total Stock (kg)', kf(totalKg)],
    ['Total Lines', sub.items.length],
    ['Below Safety Stock', belowSafety],
    ['Lines without MFD', noMfd],
    ['',''],
    ['STOCK BY CATEGORY (kg)',''],
    ...Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,kg])=>[c, kf(kg)]),
    ['',''],
    ['AGEING BREAKDOWN (line count)',''],
    ...['Expired','Near Expiry','Critical','Ageing','Normal','Fresh','No MFD'].filter(x=>byStatus[x]).map(x=>[x, byStatus[x]]),
    ...Object.keys(byStatus).filter(x=>!['Expired','Near Expiry','Critical','Ageing','Normal','Fresh','No MFD'].includes(x)).map(x=>[x, byStatus[x]]),
  ];
  const SEV = ['Expired','Near Expiry','Critical','Ageing','Normal','Fresh'];
  const byProd = {};
  rptItems_(sub).forEach(it=>{
    const p = state.masters.products.find(pp=>pp.code===it.code);
    const st = p && it.mfd ? ageingStatus(p, it.mfd) : null;
    const o = byProd[it.code] || (byProd[it.code] = {code:it.code, name:it.name, cat:it.category||'', kg:0, lines:0, mfd:'', sev:99, label:'No MFD'});
    o.kg += Number(it.kgQty)||0; o.lines++;
    if(it.mfd && (!o.mfd || it.mfd < o.mfd)) o.mfd = it.mfd;
    if(st && st.label){ const sv = SEV.indexOf(st.label); const v = sv<0?50:sv; if(v < o.sev){ o.sev = v; o.label = st.label; } }
  });
  const summaryTable = {
    title: 'PRODUCT-WISE SUMMARY',
    headers: ['Product Code','Product Name','Category','Total Stock (kg)','Batches / Lines','Oldest MFD','Worst Status'],
    rows: Object.values(byProd).sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true})).map(o=>[o.code,o.name,o.cat,kf(o.kg),o.lines,fmtD(o.mfd),o.label]),
    statusColIndex: 6,
  };
  return {headers, rows, summaryRows, summaryTable, statusColIndex: headers.indexOf('Status'), filename: `${sub.cnfCode}-detailed-report-${fmtD(sub.date)}.csv`};
}

// Builds an HTML table of just the ageing-flagged lines (Ageing/Critical/
// Near-Expiry/Expired — never Fresh/Normal) from a submission, colour-coded
// like a highlighted Excel sheet, for embedding directly in the Full
// Submission Report email's body. Deliberately reuses ageingStatus() — the
// exact same function that drives every ageing badge/report elsewhere in
// the app — rather than having the backend recompute a simplified version
// of its own; that's what keeps this table showing exactly what the CNF's
// own attached report and screen already show, with no drift between the
// two. Returns {html, count} — html is '' (and count 0) when nothing is
// flagged, so the caller can skip embedding an empty table entirely.
function buildAgeingHighlightTableHtml(sub){
  const flagged = [];
  rptItems_(sub).forEach(it=>{
    const p = state.masters.products.find(pp=>pp.code===it.code);
    if(!p || !it.mfd) return;
    const st = ageingStatus(p, it.mfd);
    if(['ageing','critical','expiring','expired'].includes(st.cls)) flagged.push({it, st});
  });
  if(!flagged.length) return {html:'', count:0};
  // Same visual language as the app's own badges — Expired is the darkest/
  // most severe, Near Expiry next, then Critical, then Ageing lightest —
  // just recoloured for a white email background instead of the dark UI.
  const colorFor = cls => cls==='expired' ? '#7a1f1f' : cls==='expiring' ? '#c0392b' : cls==='critical' ? '#e67e22' : '#d9a441';
  const rowsHtml = flagged.map(({it,st})=>
    `<tr><td style="padding:5px 8px;border:1px solid #e0d5bd;">${it.code}</td>` +
    `<td style="padding:5px 8px;border:1px solid #e0d5bd;">${it.name}</td>` +
    `<td style="padding:5px 8px;border:1px solid #e0d5bd;">${fmtD(it.mfd)||''}</td>` +
    `<td style="padding:5px 8px;border:1px solid #e0d5bd;">${it.kgQty.toFixed(1)} kg</td>` +
    `<td style="padding:5px 8px;border:1px solid #e0d5bd;background:${colorFor(st.cls)};color:${st.cls==='ageing'?'#3a2c00':st.cls==='critical'?'#2b1400':'#ffffff'};font-weight:bold;">${st.label} (${st.remaining}d left)</td></tr>`
  ).join('');
  const html = `<table style="border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:12px;width:100%;">` +
    `<tr><th style="padding:6px 8px;background:#cc8f3f;color:#fff;border:1px solid #a97a30;">Code</th>` +
    `<th style="padding:6px 8px;background:#cc8f3f;color:#fff;border:1px solid #a97a30;">Product</th>` +
    `<th style="padding:6px 8px;background:#cc8f3f;color:#fff;border:1px solid #a97a30;">MFD</th>` +
    `<th style="padding:6px 8px;background:#cc8f3f;color:#fff;border:1px solid #a97a30;">Qty</th>` +
    `<th style="padding:6px 8px;background:#cc8f3f;color:#fff;border:1px solid #a97a30;">Status</th></tr>${rowsHtml}</table>`;
  return {html, count: flagged.length};
}

/* ---------------- Optional: save reports directly to a chosen folder ----------------
   Browsers do NOT allow a website to silently write to an arbitrary folder
   on your computer — that's a security boundary, not a limitation of this
   app. What IS possible (Chrome/Edge on desktop only, not phones, not
   Firefox/Safari): you pick a folder ONCE via a native picker, the browser
   grants this tab permission to write into it, and every report after that
   saves straight there with no download prompt — until the tab is closed
   (the permission doesn't survive a reload; you'd pick again next session).
   On any device where this isn't supported, downloads fall back to the
   normal browser Downloads folder automatically — nothing breaks. */
let reportFolderHandle = null;
function folderSaveSupported(){ return typeof window!=='undefined' && !!window.showDirectoryPicker; }
async function chooseReportFolder(){
  if(!folderSaveSupported()) throw new Error('Your browser doesn\'t support saving directly to a folder (this needs desktop Chrome or Edge). Reports will download to your normal Downloads folder instead.');
  reportFolderHandle = await window.showDirectoryPicker({mode:'readwrite'});
  return reportFolderHandle.name;
}
async function writeCsvToChosenFolder(filename, csvText){
  const fileHandle = await reportFolderHandle.getFileHandle(filename, {create:true});
  const writable = await fileHandle.createWritable();
  await writable.write(csvText);
  await writable.close();
}
// Same CSV-building path as exportGenericCsv, but saves into the chosen
// folder silently if one is set, otherwise falls back to a normal download.
async function saveOrDownloadCsv(filename, headers, dataRows){
  const esc = v => { const s = (v===null||v===undefined) ? '' : String(v); return s.includes(',') ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = [headers.map(esc).join(',')];
  dataRows.forEach(r=> lines.push(r.map(esc).join(',')));
  const csvText = lines.join('\n');
  if(reportFolderHandle){
    try{ await writeCsvToChosenFolder(filename, csvText); showToast(`✓ Saved to ${reportFolderHandle.name}/${filename}`); return; }
    catch(e){ /* permission revoked or folder issue — fall through to normal download */ }
  }
  downloadCsvFile(filename, csvText);
}
// Real-XLSX counterpart of the above — same "Choose Folder" support, same
// silent-fallback-to-download behaviour, writing a genuine .xlsx workbook
// (built by buildXlsxWorkbook, via ExcelJS) instead of plain CSV text.
// Deliberately a REAL Excel file, not an HTML file wearing an .xls
// extension — that earlier approach triggered Excel's own "format and
// extension don't match, could be corrupted or unsafe" warning on every
// single open, which is exactly the kind of thing that erodes trust in a
// report that's supposed to be authoritative.
async function writeXlsxToChosenFolder(filename, wb){
  const buffer = await wb.xlsx.writeBuffer();
  const fileHandle = await reportFolderHandle.getFileHandle(filename, {create:true});
  const writable = await fileHandle.createWritable();
  await writable.write(buffer);
  await writable.close();
}
async function saveOrDownloadRealXlsx(filenameBase, wb){
  const filename = filenameBase.replace(/\.(csv|xlsx?)$/i,'') + '.xlsx';
  if(reportFolderHandle){
    try{ await writeXlsxToChosenFolder(filename, wb); showToast(`✓ Saved to ${reportFolderHandle.name}/${filename}`); return; }
    catch(e){ /* permission revoked or folder issue — fall through to normal download */ }
  }
  await downloadRealXlsx(filenameBase, wb);
}

// Whose queued submission may go out through the current sign-in: a CNF's own entry only through that CNF's login,
// a Sales Coordinator's audit only through that same coordinator's login.
function canSendQueued_(sub){
  const a = parseAuditBy(sub.submittedBy);
  if(a.role==='SC') return !!state.scUser && a.id===state.scUser.userId;
  return !!(state.role==='cnf' && !state.auditor && state.cnfUser && String(sub.cnfCode)===String(state.cnfUser.code));
}
async function flushSheetQueue_(){
  if(!getApiUrl()) return;
  const queue = lsGet('pendingSubmissions') || [];
  if(!queue.length) return;
  if(isSupabaseMode() && !getAuthToken()) return;        // nobody signed in: the server would refuse, and the queue stays safe on the device
  const remaining = [];
  for(const sub of queue){
    // Supabase files a CNF's stock under the CNF that is signed in — never send another CNF's queued stock through this login.
    if(isSupabaseMode() && !canSendQueued_(sub)){ remaining.push(sub); continue; }
    try{
      const result = await apiPost('addSubmission', {submission: sub});
      if(!result || result.ok!==true) throw new Error('Server did not confirm the save.');
      if(isHybridMode()) queueAdd_('pendingSupabaseSubs', sub);   // saved to the Sheet — make sure the reporting copy has it too
    }catch(e){ remaining.push(sub); }
  }
  lsSet('pendingSubmissions', remaining);
  if(remaining.length !== queue.length) showToast('✓ Synced pending submissions to server');
  return {synced: queue.length-remaining.length, stillPending: remaining.length};
}
// The reporting-database retry list. Runs wherever the Sheet's does.
async function flushSupabaseQueue_(){
  if(!isHybridMode()) return;
  const queue = lsGet('pendingSupabaseSubs') || [];
  if(!queue.length) return;
  for(const sub of queue){
    try{
      const r = await supabaseCall('addSubmission', {submission: sub}, 25000);
      if(r && r.ok===true) queueRemove_('pendingSupabaseSubs', sub.id);
    }catch(e){ markReportStale('pending submissions could not reach Supabase'); break; } // the same failure will repeat — try again next round
  }
}
async function flushPendingQueue(){
  const sheet = await flushSheetQueue_();
  try{ await flushSupabaseQueue_(); }catch(e){}
  return sheet;
}
if(typeof window!=='undefined' && window.addEventListener) window.addEventListener('online', flushPendingQueue);
// Belt-and-braces on top of the 'online' event: rural/mobile connections
// often go weak-but-technically-connected rather than cleanly offline, so
// a request can keep failing without the browser ever firing 'online' to
// re-trigger a retry. This periodic check means nothing pending ever waits
// longer than a minute for the next attempt, network permitting — cheap,
// safe no-op when the queue is empty.
if(typeof window!=='undefined' && window.setInterval) setInterval(()=>{ if(state.loaded) flushPendingQueue(); }, 60000);
// Catches a newly-deployed version even for a tab that's been sitting open
// for hours without the person ever touching Sync or logging back in —
// exactly the CNF session that most needs to hear about a fix. 4 minutes
// is frequent enough that a rollout reaches everyone within a few minutes
// of going out, without being a meaningfully heavier polling load than the
// other periodic checks already running here.
if(typeof window!=='undefined' && window.setInterval) setInterval(()=>{
  if(state.loaded && state.role && !state.newVersionAvailable) checkForNewVersion().catch(()=>{});
}, 4*60000);
// Same idea for messages — a CNF with the tab open (even backgrounded,
// e.g. they've switched to WhatsApp) still gets a desktop notification
// within a minute or two of a new rate/scheme message going out, not only
// at their next explicit login or Sync tap. This is still not a true push
// notification — nothing can run once the tab is actually closed, that
// needs a whole different (service-worker + push-server) setup — but it's
// a real improvement for the common "app's open somewhere" case.
if(typeof window!=='undefined' && window.setInterval) setInterval(()=>{
  if(state.loaded && state.cnfUser && !state.auditor) loadMessagesForCnf(state.cnfUser.code).catch(()=>{});
}, 75000);

// Full submission history for one CNF (History screen) or all CNFs
// (Admin Audit Log) — fetched on demand since bootstrap only carries
// the latest submission per CNF, to keep the main dashboards fast.
//
// This merges by submission ID instead of replacing outright — this is
// the fix for a real bug: a submission that's already visible on screen
// (from the optimistic local push right after Final Submit) must never
// vanish just because a history fetch came back incomplete or lagging.
// Anything known locally that the server response doesn't (yet) include
// is kept, not discarded.
function mergeSubmissionsForCnf(cnfCode, list){
  cnfCode = String(cnfCode);
  list = dedupeResentSubmissions(normalizeSubmissionList(list));
  const existingForCnf = state.submissions.filter(s=>s.cnfCode===cnfCode);
  const serverIds = new Set(list.map(s=>s.id));
  const keepLocalOnly = existingForCnf.filter(s=>!serverIds.has(s.id));
  state.submissions = state.submissions.filter(s=>s.cnfCode!==cnfCode).concat(list).concat(keepLocalOnly);
}
async function ensureCnfHistory(cnfCode){
  if(!getApiUrl()) return; // local mode already has full history in memory
  try{
    const res = await apiGet('cnfSubmissions', {cnf:cnfCode});
    mergeSubmissionsForCnf(cnfCode, res.submissions||[]);
  }catch(e){ /* keep whatever we already have */ }
}
// Returns true if the full history actually loaded, false if it didn't (and
// whatever was already known is kept either way). It used to return nothing,
// so every caller had to assume success — and "Load Full History" cheerfully
// reported "loaded" after a timeout.
async function ensureAllHistory(opts){
  if(!getApiUrl()) return true; // local mode already holds full history in memory
  try{
    const res = await apiGet('allSubmissions', null, opts);
    const serverList = dedupeResentSubmissions(normalizeSubmissionList(res.submissions||[])); // a submission saved twice by a retry counts once
    const serverIds = new Set(serverList.map(s=>s.id));
    const localOnly = state.submissions.filter(s=>!serverIds.has(s.id));
    state.submissions = serverList.concat(localOnly);
    return true;
  }catch(e){ return false; /* keep whatever we already have */ }
}

/* ---------------- Domain logic ---------------- */
function selfLifeFor(product){
  if(!product) return 180; // orphaned/missing product reference — a safe generic fallback beats crashing the whole screen
  return product.selfLifeOverride || state.masters.categorySelfLife[product.category] || 180;
}
function ageDays(mfd){
  if(!mfd) return null;
  const d = (new Date(todayISO()) - new Date(mfd)) / 86400000;
  return Math.max(0, Math.round(d));
}
function ageingStatus(product, mfd){
  if(!product) return {label:'Unknown', cls:'normal', age:null, life:null, remaining:null}; // same defensive fallback as selfLifeFor, for the same reason
  if(!mfd) return {label:'No MFD', cls:'normal'};
  const life = selfLifeFor(product);
  const age = ageDays(mfd);
  const remaining = life - age;
  const pct = (remaining/life)*100;
  let t = (state.masters.categoryThresholds && state.masters.categoryThresholds[product.category]) || state.masters.thresholds;
  // A product-specific Ageing override — expressed in DAYS SINCE MFD (age),
  // not days remaining: e.g. Ageing=30 means "once this product is more
  // than 30 days old, flag it as Ageing" — confirmed directly against the
  // real GCPL Product-Wise Shelf-Life data (e.g. Ageing=90 on a 360-day
  // shelf life). Converted here to this product's own self-life PERCENT so
  // the rest of the Critical/Near-Expiry/Expired math (percentage-based)
  // stays internally consistent instead of needing four separate
  // day-thresholds. Overrides t.normal specifically: that's the field that
  // actually decides the "Ageing" label's cutoff below (pct <= t.normal ->
  // "Ageing") — despite the similar name, t.ageing is a different tier's
  // boundary (the one for "Critical").
  const ageingOverrideDays = product.ageingDaysOverride || null;
  if(ageingOverrideDays){
    const ageingPct = Math.max(0, Math.min(100, ((life - ageingOverrideDays) / life) * 100));
    // Never let the override end up BELOW the category's own Critical cutoff
    // (t.ageing) — that would invert the tiers and make "Ageing" literally
    // unreachable (pct would hit the Critical check first, every time).
    t = Object.assign({}, t, {normal: Math.max(ageingPct, t.ageing)});
  }
  const base = {pct, remaining, age, life, thresholds:t, ageingOverrideDays};
  if(remaining <= 0) return Object.assign({label:'Expired', cls:'expired'}, base);
  if(pct <= t.critical) return Object.assign({label:'Near Expiry', cls:'expiring'}, base);
  if(pct <= t.ageing) return Object.assign({label:'Critical', cls:'critical'}, base);
  if(pct <= t.normal) return Object.assign({label:'Ageing', cls:'ageing'}, base);
  if(pct <= t.fresh) return Object.assign({label:'Normal', cls:'normal'}, base);
  return Object.assign({label:'Fresh', cls:'fresh'}, base);
}
// Plain-language "why" for the Status column — merged directly into that
// same cell (not a separate column) so the report doesn't keep growing
// wider every time something needs explaining. Deliberately doesn't repeat
// the label itself (that's the part right before this in the combined
// cell) — just the supporting number(s) that produced it, so it reads as
// one phrase: "Ageing — 31d old, past 30d threshold (self-life 90d)".
function ageingStatusReason(status){
  if(status.cls==='expired') return `${Math.abs(status.remaining)}d past expiry (self-life ${status.life}d)`;
  if(!status.thresholds) return status.label==='No MFD' ? 'no MFD entered' : '';
  const t = status.thresholds;
  if(status.ageingOverrideDays && status.cls==='ageing'){
    return `${status.age}d old, past ${status.ageingOverrideDays}d threshold (self-life ${status.life}d)`;
  }
  const pct = Math.round(status.pct);
  const rangeFor = {
    fresh: `>${t.fresh}%`, normal: `${t.normal}–${t.fresh}%`, ageing: `${t.ageing}–${t.normal}%`,
    critical: `${t.critical}–${t.ageing}%`, expiring: `≤${t.critical}%`
  }[status.cls] || '';
  return `${pct}% remaining (range ${rangeFor})`;
}
// The single combined cell for the Status column — label plus its reason,
// one phrase, one column.
function ageingStatusCell(status){
  const reason = ageingStatusReason(status);
  return reason ? `${status.label} — ${reason}` : status.label;
}

// Shared "act on this now" ranking used by both the CNF Dashboard (own
// latest submission) and the MIS Overview (across all CNFs) — worst ageing
// first (Expired > Near Expiry > Critical > Ageing), ties broken by whoever
// has the least shelf life left.
const ATTENTION_ORDER = {expired:0, expiring:1, critical:2, ageing:3, normal:4, fresh:5};
// "Slow Moving" — genuinely checked against this CNF's OWN submission
// history now, not guessed from a single snapshot. There's no sales feed
// this app has access to (no POS/dispatch tracking), so actual SALE
// velocity isn't a signal it can compute — but MOVEMENT is: comparing
// this product's quantity between the two most recent submissions tells
// whether it's genuinely being drawn down (real movement, even without
// knowing WHY — dispatch, sale, whatever) or sitting flat/growing while
// ageing (genuinely stuck). Only falls back to the old "still above
// safety norm" snapshot guess when there's no prior submission for this
// CNF to compare against yet (e.g. their very first entry).
function isSlowMoving(cnfCode, code, currentKgQty, safetyStockKg){
  const cnfSubs = state.submissions.filter(s=>s.cnfCode===cnfCode).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(cnfSubs.length >= 2){
    const previous = cnfSubs[1];
    const hadPrevData = previous.items.some(it=>it.code===code);
    if(hadPrevData){
      const prevKg = previous.items.filter(it=>it.code===code).reduce((s,it)=>s+it.kgQty,0);
      return currentKgQty >= prevKg; // flat or grown while ageing = genuinely not moving
    }
  }
  return currentKgQty > (safetyStockKg||0); // no comparable history yet — best available guess
}
function buildAttentionList(items, limit, cnfCode){
  const rows = items.map(it=>{
    const p = state.masters.products.find(pp=>pp.code===it.code);
    if(!p) return null;
    const st = ageingStatus(p, it.mfd);
    const isAgeingOrWorse = ['ageing','critical','expiring','expired'].includes(st.cls);
    const slowMoving = isAgeingOrWorse && cnfCode && isSlowMoving(cnfCode, it.code, it.kgQty, safetyNormFor(it,p));
    return {code:it.code, name:p.name, category:p.category, kgQty:it.kgQty, mfd:it.mfd, status:st, slowMoving};
  }).filter(Boolean);
  const flagged = rows.filter(r=>['ageing','critical','expiring','expired'].includes(r.status.cls));
  flagged.sort((a,b)=> ATTENTION_ORDER[a.status.cls]-ATTENTION_ORDER[b.status.cls] || (a.status.remaining??999)-(b.status.remaining??999));
  return limit ? flagged.slice(0,limit) : flagged;
}
function AttentionPanel(attention, totalFlagged, opts){
  opts = opts || {};
  if(!attention.length) return '';
  return `<div class="attn-panel ${opts.dark?'dark':''}">
    <div class="attn-head">⚠ Needs Attention <span class="num">${totalFlagged}</span> <span class="attn-sub">near expiry, ageing &amp; slow-moving, worst first</span></div>
    ${attention.map(a=>`<div class="attn-row attn-${a.status.cls}" ${opts.clickable?`data-attn="${a.code}|${a.mfd||''}"`:''}>
      <div class="an"><b>${a.name}</b><div class="am">${a.code} · ${a.kgQty.toFixed(1)}kg · MFD ${fmtD(a.mfd)||'—'} · ${a.status.age}d old${opts.showCnf&&a.cnfName?` · ${a.cnfName}`:''}${a.slowMoving?' · <span style="color:var(--orange);">Slow Moving</span>':''}</div></div>
      <span class="badge ${a.status.cls}">${a.status.label}</span>
    </div>`).join('')}
  </div>`;
}
function convertToKg(product, qty, uom){
  qty = Number(qty)||0;
  if(uom==='KG') return qty;
  if(uom==='BAG') return product.bagToKg ? qty*product.bagToKg : qty;
  if(uom==='PC') return product.pcToKg ? qty*product.pcToKg : qty;
  return qty;
}

/* ---------------- SAP Current Stock upload (mandatory pre-step for Submit Stock) ----------------
   Parses the SAP export (.xlsx), keeps only Plant/Material/Description/UoM/Current Stock
   (the yellow-highlighted "Current Stock" column, already in KG), auto-creates any product
   the CNF hasn't got in the master yet, and sets it as the baseline every MFD-batch entry
   is validated against. */
function readFileAsArrayBuffer(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('Could not read the file.'));
    reader.readAsArrayBuffer(file);
  });
}
function findCol(headerRow, names){
  const norm = headerRow.map(h=>String(h||'').trim().toLowerCase());
  for(const name of names){
    const idx = norm.indexOf(name.toLowerCase());
    if(idx>-1) return idx;
  }
  return -1;
}
// Learns which words tend to belong to which category from the Product
// Master the Admin already submitted — e.g. if most products with "SOOJI"
// in the name are categorised SOOJI, and most with "MATAR BESAN" are
// categorised M.BESAN, that association is picked up automatically. This
// is what classifies materials that show up in a SAP Current Stock upload
// but were never in the curated Product Master (e.g. "LAB REJECTION"
// variants) — instead of silently dumping them all into Others.
const CATEGORY_WORD_STOPLIST = new Set(['KG','GM','GMS','ML','MM','LTR','LTRS','INCH','RS','NO','THE','AND','OF','WITH','FOR','NEW','LAB','REJECTION','PACK','PKT']);
function tokenizeProductName(name){
  return String(name||'').toUpperCase().split(/[^A-Z]+/).filter(w=>w.length>=3 && !CATEGORY_WORD_STOPLIST.has(w));
}
function buildCategoryWordMap(){
  const map = {}; // word -> {CATEGORY: occurrenceCount}
  state.masters.products.forEach(p=>{
    if(!p.category || p.category==='OTHERS') return;
    tokenizeProductName(p.name).forEach(w=>{
      map[w] = map[w] || {};
      map[w][p.category] = (map[w][p.category]||0) + 1;
    });
  });
  return map;
}
function inferCategoryFromName(name, wordMap){
  const scores = {};
  tokenizeProductName(name).forEach(w=>{
    const catCounts = wordMap[w];
    if(!catCounts) return;
    Object.entries(catCounts).forEach(([cat,count])=>{ scores[cat] = (scores[cat]||0) + count; });
  });
  let best = null, bestScore = 0;
  Object.entries(scores).forEach(([cat,score])=>{ if(score>bestScore){ best=cat; bestScore=score; } });
  return best; // null if nothing in the existing Product Master resembles this name
}

// SAP exports often store quantities as TEXT ("1,234.500", "1234.500-", " 25 ", "(5)", "1.234,50").
// Number() turns all of those into NaN -> 0, which made SAP stock look like zero until the sheet was
// converted to numbers by hand. This reads them the way Excel's "Convert to Number" would.
function sapNum_(v){
  if(typeof v==='number') return isFinite(v) ? v : 0;
  let t = String(v==null?'':v).replace(/[\s\u00a0\u202f\u2009']/g,'');
  if(!t) return 0;
  let neg = false;
  if(/^\(.*\)$/.test(t)){ neg = true; t = t.slice(1,-1); }
  if(/-$/.test(t)){ neg = true; t = t.slice(0,-1); }
  if(/^[-\u2212]/.test(t)){ neg = true; t = t.slice(1); }
  t = t.replace(/[^0-9.,]/g,'');
  if(!t) return 0;
  const lc = t.lastIndexOf(','), ld = t.lastIndexOf('.');
  if(lc>-1 && ld>-1){
    if(lc>ld) t = t.replace(/\./g,'').replace(',','.'); else t = t.replace(/,/g,'');
  } else if(lc>-1){
    t = (/^\d{1,3}(,\d{3})+$/.test(t) || (t.match(/,/g)||[]).length>1) ? t.replace(/,/g,'') : t.replace(',','.');
  } else if(ld>-1 && (t.match(/\./g)||[]).length>1){
    t = t.replace(/\./g,'');
  }
  const n = parseFloat(t);
  return isFinite(n) ? (neg ? -n : n) : 0;
}
async function handleSapUpload(file){
  if(typeof XLSX === 'undefined') throw new Error('Excel reader failed to load — check your internet connection and try again.');
  const buf = await readFileAsArrayBuffer(file);
  const wb = XLSX.read(buf, {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
  if(!raw.length) throw new Error('This file has no rows.');
  const header = raw[0];
  const cPlant = findCol(header, ['Plant']);
  const cMaterial = findCol(header, ['Material']);
  const cDesc = findCol(header, ['Material Description']);
  // Second accepted format — SAP's MB52 (stock overview) export: "Base
  // Unit of Measure" instead of "A UoM", "Unrestricted" instead of
  // "Current Stock". MB52 has no Approved/Pending Order or Safety Stock
  // columns at all, which is fine — those just come back null/0 below,
  // same as any file missing them.
  const cUom = findCol(header, ['A UoM','UoM','UOM','Base Unit of Measure']);
  const cStock = findCol(header, ['Current Stock','Unrestricted']);
  const cApproved = findCol(header, ['Approved Order']);
  const cPending = findCol(header, ['Unpproved Order','Unapproved Order','Un-approved Order']);
  // Safety Stock (Column M in the standard export) — CNF × product-code
  // specific, straight from THIS CNF's own file, same as Current Stock.
  // This is now the real, only source of truth for safety norms; Product
  // Master's own Safety field is kept purely as a fallback default for the
  // rare item this column is blank/missing for.
  const cSafety = findCol(header, ['Safety Stock']);
  if(cMaterial===-1 || cDesc===-1 || cStock===-1){
    throw new Error('Missing expected columns — need at least Material, Material Description, and Current Stock (or, in an MB52 export, Unrestricted).');
  }
  let rows = raw.slice(1)
    .filter(r=>r[cMaterial]!=='' && r[cMaterial]!==undefined)
    .map(r=>({
      plant: cPlant>-1 ? String(r[cPlant]).trim() : '',
      code: String(r[cMaterial]).trim(),
      name: String(r[cDesc]).trim() || ('Material '+r[cMaterial]),
      uom: cUom>-1 ? String(r[cUom]).trim() : '',
      currentStockKg: sapNum_(r[cStock]),
      approvedOrder: cApproved>-1 ? sapNum_(r[cApproved]) : 0,
      pendingOrder: cPending>-1 ? sapNum_(r[cPending]) : 0,
      safetyStockKg: cSafety>-1 ? sapNum_(r[cSafety]) : null
    }));
  if(!rows.length) throw new Error('No product rows found in this file.');

  const matchingPlant = rows.filter(r=>r.plant===state.cnfUser.code);
  if(matchingPlant.length) rows = matchingPlant;
  // else: no rows tagged with this CNF's plant code — fall back to using every row in the file
  // rather than blocking the CNF, since plant coding can vary by export.

  // Material code is the single source of truth for what a row IS — if the
  // same code appears more than once in the export (a real, if uncommon,
  // SAP export data-quality issue), only the FIRST occurrence is kept.
  // Silently accepting duplicates would double-list the same product in
  // the entry screen and double-count it in the KPI totals.
  const mergedByCode = {};
  const codeOrder = [];
  let duplicateLineCount = 0;
  rows.forEach(r=>{
    const existing = mergedByCode[r.code];
    if(!existing){
      mergedByCode[r.code] = Object.assign({}, r);
      codeOrder.push(r.code);
      return;
    }
    duplicateLineCount++;
    // Quantities are additive across split lines for the same material —
    // this is what makes a 0/3000 + 1980/0 pair correctly add up to 1980,
    // not silently lose the 1980.
    existing.currentStockKg += r.currentStockKg;
    existing.approvedOrder += r.approvedOrder;
    existing.pendingOrder += r.pendingOrder;
    // Safety Stock is a NORM, not a quantity — never sum it. Whichever
    // line actually had one wins; if neither did, it stays null (falls
    // back to Product Master's default, same as any file lacking it).
    if(existing.safetyStockKg==null && r.safetyStockKg!=null) existing.safetyStockKg = r.safetyStockKg;
  });
  rows = codeOrder.map(c=>mergedByCode[c]);
  if(duplicateLineCount) showToast(`ℹ ${duplicateLineCount} material(s) appeared on more than one line in this file (common in SAP stock-overview exports) — combined into one total each.`);

  // Auto-create any material not already in the product master — no manual
  // mapping needed. Category is inferred from the Product Master you've
  // already submitted (see buildCategoryWordMap/inferCategoryFromName above)
  // rather than defaulting straight to Others, so items like "SOOJI - LAB
  // REJECTION" still land under SOOJI even though that exact SKU was never
  // in the curated master. Uses the concurrency-safe addProducts endpoint
  // (not a full saveMasters overwrite) so two CNFs uploading SAP files
  // around the same moment can't lose each other's newly-added products.
  const wordMap = buildCategoryWordMap();
  const newProducts = [];
  rows.forEach(r=>{
    if(isBogusProductRow(r.code, r.name)) return; // a stray header row, not a real material — never auto-create a product from it
    if(!state.masters.products.some(p=>p.code===r.code)){
      const inferredCategory = inferCategoryFromName(r.name, wordMap) || 'OTHERS';
      // pendingReview:true — this material has no real Product Master entry yet,
      // it only exists so the CNF isn't blocked from recording its stock. It shows
      // up in Admin → Product Master → "New Product Suggestions" until Admin fills
      // in the real details; until then it can only be submitted in KG (see
      // BatchRow's UOM restriction), never PC/BAG, since no conversion is trustworthy yet.
      const np = { code:r.code, name:r.name, category:inferredCategory, defaultUOM:'KG', bagToKg:null, pcToKg:null, safetyStockKg:0, selfLifeOverride:null, ageingDaysOverride:null, pendingReview:true };
      state.masters.products.push(np); // reflect locally right away — this CNF's list must not wait on the network
      newProducts.push(np);
    }
  });
  if(newProducts.length){
    lsSet('masters', state.masters);
    if(getApiUrl()){
      try{ await apiPost('addProducts', {products: newProducts}); }
      catch(e){ /* worst case: another CNF's later SAP upload or an Admin re-import recreates the same codes safely (dedup by code) */ }
    }
  }

  state.sapUpload = { fileName: file.name, uploadedAt: new Date().toISOString(), rows };
  state.draftItems = {};
  state.varianceReasons = {};
  state.sapShowZero = false;
  state.sapSearch = '';
  state.submitCat = null;
  state.sapMissingOnlyFilter = false;
  await saveDraft(state.cnfUser.code, {date: state.submitDate, items:{}, sapUpload: state.sapUpload, varianceReasons:{}});
}

// Forces CNF/product codes to strings on any submission data entering the
// app — this is the client-side half of a real bug fix: Google Sheets
// silently converts a numeric-looking cell ("3100") into an actual number
// on read, and every comparison in this app expects a string (masters.cnfs
// codes are always strings). One raw number slipping through made a CNF's
// entire submission invisible to every dashboard — no error, just silently
// treated as belonging to a CNF that doesn't match anything. Every place
// submissions data enters state (server fetch, cache, merge) runs through
// this, so the bug class can't resurface even if some other path someday
// sends a number again.
//
// cleanDateField guards against the SAME class of Sheets auto-conversion —
// a date-shaped cell becomes an actual Date object server-side, and if a
// backend that predates the fix (or hasn't been redeployed yet) sends its
// full toString() ("Tue Aug 18 2026 00:00:00 GMT+0530 (India Standard
// Time)") instead of a clean "2026-08-18", this actually parses and
// re-formats it correctly — not just a blind slice(), which would have
// chopped that string into the wrong thing ("Tue Aug 18"). A no-op on an
// already-clean date string.
function cleanDateField(raw){
  const s = String(raw||'');
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10); // already clean (or ISO-with-time) — just trim
  const dm = s.trim().match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/); // DD-MM-YYYY, as shown in the app and in exports
  if(dm) return `${dm[3]}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`;
  const parsed = new Date(s);
  return isNaN(parsed.getTime()) ? s : localDateISO(parsed); // recovers from a verbose Date.toString() dump
}
function normalizeSubmissionList(list){
  return (list||[]).map(s=>Object.assign({}, s, {
    cnfCode: String(s.cnfCode),
    date: cleanDateField(s.date),
    items: (s.items||[]).map(it=>Object.assign({}, it, {code: String(it.code)}))
  }));
}

function latestSubmissionFor(cnfCode){
  const subs = state.submissions.filter(s=>String(s.cnfCode)===String(cnfCode)).sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp));
  const newest = subs[0] || null;
  // MIS/Admin look at each CNF's CURRENT stock — every product it holds
  // right now — which, after a Partial following a Final, is the server's
  // merged picture, not whatever the single newest submission happened to
  // touch. The merged picture wins unless something genuinely newer is
  // already known locally. (The CNF panel keeps its own existing behaviour
  // untouched — this is only about what MIS/Admin see and export.)
  if(state.role==='mis' || state.role==='admin'){
    const snap = state.currentSnapshots && state.currentSnapshots[String(cnfCode)];
    if(snap && (!newest || new Date(snap.timestamp) >= new Date(newest.timestamp))) return snap;
  }
  return newest;
}

// Submission cadence — each CNF has its own required frequency (Admin →
// CNF Master, default weekly/7 days). Used to flag CNFs who haven't
// submitted on time, on the CNF's own dashboard and in Admin/MIS.
function daysSinceLastSubmission(cnfCode){
  const sub = latestSubmissionFor(cnfCode);
  if(!sub) return null;
  return Math.floor((new Date(todayISO()) - new Date(sub.date)) / 86400000);
}
function cnfSubmissionStatus(cnf){
  const days = daysSinceLastSubmission(cnf.code);
  const freq = cnf.submissionFrequencyDays || 7;
  if(days===null) return {days:null, freq, overdue:true, neverSubmitted:true};
  return {days, freq, overdue: days > freq, neverSubmitted:false};
}

// ---- Demo CNF (training) and Sales Coordinator audits ----
// A CNF whose name starts with "Demo" is the training account. It is left OUT of every "All CNFs" export/report
// and only appears when it is picked on purpose.
function isDemoCnf(c){ return !!c && /^\s*demo\b/i.test(String(c.name||'')); }
// Promo / non-stock items CNFs submit by mistake. They are never part of any
// report, export or email body (the stored submission itself is left untouched).
const EXCLUDED_REPORT_PRODUCTS_ = new Set(['608852','608914','610320','610463','610536','609743','609744','608857','609557','609248','609251','609563','602199','609252','600114','609250','609253','608853','609060']);
function rptItems_(sub){ return ((sub&&sub.items)||[]).filter(it=>!EXCLUDED_REPORT_PRODUCTS_.has(String(it.code).trim())); }
function isDemoCode_(code){ return isDemoCnf((state.masters&&state.masters.cnfs||[]).find(c=>String(c.code)===String(code))); }
// Who made a submission. The server stamps a Sales Coordinator's audit as  SC|<id>|<name>;  anything else is the CNF's own entry.
function parseAuditBy(by){
  const t = String(by==null?'':by);
  if(t.startsWith('SC|')){ const p = t.split('|'); return {role:'SC', id:p[1]||'', name:p.slice(2).join('|')||p[1]||''}; }
  return {role:'CNF', id:t, name:''};
}
function auditByLabel(sub){ const a = parseAuditBy(sub && sub.submittedBy); return a.role==='SC' ? `Audit by SC - ${a.name}` : 'Audit by CNF'; }
function stockSubmittedByText_(sub){ const a = parseAuditBy(sub && sub.submittedBy); return a.role==='SC' ? `Stock Submitted by SC - ${a.name}` : 'Stock Submitted by CNF'; }
function submittedByText(sub){ const a = parseAuditBy(sub && sub.submittedBy); return a.role==='SC' ? `SC - ${a.name}` : String((sub&&sub.submittedBy)||''); }
function submitterTag_(){ return state.auditor ? `SC|${state.auditor.userId}|${String(state.auditor.name||state.auditor.userId).replace(/\|/g,' ')}` : state.cnfUser.userId; }
function draftKey_(code){ return 'draft:'+code+(state.auditor ? ':sc:'+state.auditor.userId : ''); }
function userIdTaken_(id, exceptList){
  const t = String(id||'').trim().toLowerCase(); if(!t) return false;
  const m = state.masters;
  return (m.cnfs||[]).some(c=>String(c.code).toLowerCase()===t || String(c.userId||'').toLowerCase()===t)
    || ['adminUsers','misUsers','scUsers'].some(k=>(m[k]||[]).some(u=>String(u.userId).toLowerCase()===t));
}
function allCurrentStockRows(cnfFilterList){
  // one row per CNF x product, from each CNF's latest submission
  const rows = [];
  const cnfs = state.masters.cnfs.filter(c => cnfFilterList==='ALL' ? !isDemoCnf(c) : cnfFilterList.includes(c.code));
  cnfs.forEach(cnf=>{
    const sub = latestSubmissionFor(cnf.code);
    if(!sub) return;
    rptItems_(sub).forEach(it=>{
      const product = state.masters.products.find(p=>p.code===it.code);
      if(!product) return;
      const st = ageingStatus(product, it.mfd);
      const safetyStatus = safetyStatusFor(it, product);
      rows.push({cnf, sub, item:it, product, ageStatus:st, safetyStatus});
    });
  });
  return rows;
}

/* ---------------- Render root ---------------- */
function render(){
  const app = document.getElementById('app');
  if(!state.loaded || state.loadingActive){ app.innerHTML = LoadingScreen(); return; }
  // A browser tab left open across midnight never finds out the calendar
  // day changed on its own — state.submitDate was set once (at login) and
  // nothing re-checks it against the real clock. There's no date picker
  // for a CNF to deliberately choose any other date any more, so as long
  // as nothing is actually in progress yet (no SAP file, no draft
  // entries), it's simply forced back to the real today on every render.
  // If someone genuinely IS mid-entry when the day rolls over, the
  // Partial/Final Submit guard (checked fresh at that moment, in
  // bindGlobal) still catches and blocks a now-stale date — a clear stop,
  // not a silent reassignment of data they were actively working with.
  if(state.cnfUser && !state.sapUpload && Object.keys(state.draftItems||{}).length===0){
    state.submitDate = todayISO();
  }
  const loggedIn = !!(state.cnfUser || state.adminUser || state.misUser || state.scUser);
  // A real, confirmed failure mode this guards against: if building the
  // actual app screen throws for ANY reason (a data shape one screen
  // doesn't expect, anything), the loading screen above had ALREADY been
  // cleared from state (loadingActive=false) — but without this try/catch,
  // app.innerHTML is simply never reassigned, so the OLD loading screen's
  // HTML stays exactly where it was, forever. Visually indistinguishable
  // from "still loading," with no way out except knowing to hard-reload —
  // exactly the symptom this exists to make impossible. A clear recovery
  // screen with a reload button is always better than silently frozen HTML
  // that still LOOKS like progress is happening.
  try{
    setHtml_(app, `
      ${Topbar()}
      ${DemoBanner()}
      ${NewVersionBanner()}
      ${BackendErrorBanner()}
      <main>
        ${!loggedIn ? UnifiedLoginScreen() : state.role==='cnf' ? CnfPanel() : state.role==='admin' ? AdminPanel() : state.role==='sc' ? ScPanel() : MisPanel()}
      </main>
    `);
    bindGlobal();
    wireIdleLogout_(); if(loggedIn) armIdleLogout_();
  }catch(e){
    console.error('Render failed:', e);
    app.innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--silo-dark);gap:16px;padding:24px;text-align:center;">
      <div style="width:52px;height:52px;">${Mark()}</div>
      <div style="font-family:var(--serif);font-size:19px;color:var(--wheat-light);">Ganesh&nbsp;Stock&nbsp;IQ</div>
      <div style="max-width:380px;font-family:var(--mono);font-size:12.5px;color:var(--wheat-dim);line-height:1.7;">Something went wrong while loading this screen. Your data is safe — reloading should fix it.</div>
      <button id="btnRenderErrorReload" style="background:var(--wheat);color:#1c1712;border:none;border-radius:8px;padding:10px 22px;font-family:var(--mono);font-weight:700;font-size:13px;cursor:pointer;margin-top:6px;">Reload</button>
    </div>`;
    const btn = document.getElementById('btnRenderErrorReload');
    if(btn) btn.onclick = ()=>{ if(typeof window!=='undefined' && window.location) window.location.reload(); };
  }
}

function DemoBanner(){

}

function NewVersionBanner(){
  if(!state.newVersionAvailable) return '';
  // Deliberately no close/skip button — a stale tab left open for days is
  // exactly the scenario a data or logic fix (a corrected conversion
  // factor, a validation rule) needs to actually reach, and a dismissible
  // banner is too easy to permanently ignore. Reload is always safe here:
  // in-progress batch entry is autosaved as a draft (both locally and to
  // the backend) well before this could ever appear, so nothing is lost.
  return `<div class="modal-bg dark" style="z-index:999;">

}

// A URL being configured is not the same as data actually having synced —
// this is the persistent, unmissable version of that distinction. A fleeting
// toast (or a status line buried inside Admin → API Connection, which
// nobody but Admin ever visits) let this go unnoticed for a long time: the
// header could say "● LIVE" while every screen was quietly running on
// fallback demo data because the real fetch had failed. Whenever there's a
// genuine backend error, everyone — CNF, Admin, MIS — sees this, with the
// actual technical reason, not just "something's wrong."
// "LIVE" used to mean only "a URL is saved" — so it sat in green right next
// to the red failure banner. It now also requires that the last attempt
// actually worked.
function liveStatusLabel(){
  if(state.backendConnected && !state.backendError) return `<span style="color:var(--green);">· ● LIVE — ${isHybridMode()?'reports from Supabase, saves to the Google Sheet':isSupabaseMode()?'synced to Supabase':'synced to your Google Sheet'}</span>`;
  if(state.backendConnected) return '<span style="color:var(--red);">· ● NOT CONNECTED — showing the last data loaded</span>';
  return '<span style="color:var(--orange);">· ● LOCAL DEMO MODE — this device only</span>';
}
function BackendErrorBanner(){
  if(!state.backendError) return '';

    ${state.role==='admin' ? ' · <span class="linklike" data-adminnav="api" style="cursor:pointer;">Check API Connection →</span>' : ''}
  </div>`;
}

// A password <input> with a built-in 👁 show/hide toggle — used everywhere

// exactly what they typed before submitting.
function passwordProblem_(pw){
  pw = String(pw==null?'':pw);
  if(isSupabaseMode()){
    if(pw.length<8 || !/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)) return 'Password must be at least 8 characters and contain a letter and a number.';
    if(/^(password|admin|ganesh|12345678)/i.test(pw)) return 'That password is too easy to guess — choose another.';
    return '';
  }
  return pw.length<4 ? 'Password must be at least 4 characters.' : '';
}

// A believable, animated "percentage" for any wait that doesn't have real
// granular progress to report (a network fetch is just one opaque promise —
// it doesn't tell us "40% done"). This is the same honest trick used by
// most apps: ease toward ~92% on a decelerating curve so it never looks
// finished before the real work is, cycling through a few named steps so
// it reads as "doing something specific," not just a spinner. The moment
// the real operation resolves, finishFakeProgress() snaps it to 100% and
// the screen changes — so the number is never a lie about whether
// something's actually happening, only about exactly how far along.
let __progressTimer = null;
let __progressWatchdog = null;
function startFakeProgress(messages){
  state.loadingActive = true;
  state.loadingProgress = 2;
  state.loadingMessage = messages[0];
  let msgIdx = 0;
  if(__progressTimer) clearInterval(__progressTimer);
  if(__progressWatchdog) clearTimeout(__progressWatchdog);
  __progressTimer = setInterval(()=>{
    const ceiling = 92;
    state.loadingProgress = Math.min(ceiling, state.loadingProgress + (ceiling - state.loadingProgress) * 0.09 + 0.3);
    const newMsgIdx = Math.min(messages.length-1, Math.floor((state.loadingProgress/ceiling) * messages.length));
    if(newMsgIdx !== msgIdx){ msgIdx = newMsgIdx; state.loadingMessage = messages[msgIdx]; }
    render();
  }, 280);
  // Belt-and-suspenders: every real operation this drives already has its
  // own timeout (apiGet/apiPost race against 20s), but those compose —
  // two sequential calls each hitting their own timeout is 40s+ before
  // finishFakeProgress() would naturally run, and any future code path
  // added here that forgets to wrap a fetch in that timeout would hang
  // this screen forever with no way out but to reload. This is the actual
  // hard ceiling: no matter what's slow or broken underneath, the loading
  // screen releases control back to the person within 30s, full stop.
  __progressWatchdog = setTimeout(()=>{
    if(state.loadingActive){ finishFakeProgress(null); render(); }
  }, 30000);
}
function finishFakeProgress(finalMessage){
  if(__progressTimer){ clearInterval(__progressTimer); __progressTimer = null; }
  if(__progressWatchdog){ clearTimeout(__progressWatchdog); __progressWatchdog = null; }
  state.loadingProgress = 100;
  if(finalMessage) state.loadingMessage = finalMessage;
  state.loadingActive = false;
}

// Wipes everything locally cached (masters, submissions, drafts, remembered
// session) EXCEPT the backend URL and theme choice, which are settings, not
// stale data. Used from the login screen so a stale local password/CNF list
// can't lock someone out with no way back in.
function clearAppCache(){
  try{
    const keep = new Set([LS_PREFIX+'apiUrl', LS_PREFIX+'apiDisconnected', LS_PREFIX+'theme']);
    const toRemove = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(LS_PREFIX) && !keep.has(k)) toRemove.push(k);
    }
    toRemove.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
}

/* ---------------- Remember Me — session persists across reloads on this device ---------------- */
// Supabase mode: the "session" is the server token + who it belongs to, kept in sessionStorage (this tab only,
// gone when it closes). A role+id pair in localStorage proved nothing, so it is no longer used there.
function saveRememberedSession(role, id, name){
  try{
    if(isSupabaseMode()) sessionStorage.setItem('gsi:session', JSON.stringify({role, id, name:name||''}));
    else localStorage.setItem('gsi:session', JSON.stringify({role, id}));
  }catch(e){}
}
function clearRememberedSession(){ try{ localStorage.removeItem('gsi:session'); sessionStorage.removeItem('gsi:session'); }catch(e){} }
function getRememberedSession(){
  try{
    if(isSupabaseMode()){ if(!getAuthToken()) return null; const v = sessionStorage.getItem('gsi:session'); return v ? JSON.parse(v) : null; }
    const v = localStorage.getItem('gsi:session'); return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}

// Split deliberately: the FAST part (role/user/draft — all local, no
// network) runs first and is all that's needed to actually SHOW the
// dashboard. The SYNC part (masters refresh + messages) used to be
// awaited before the loading screen would release — meaning every login
// waited on two Apps Script round-trips just to show data that was
// usually already sitting in localStorage from last time. Now the
// dashboard appears immediately from cache, and the sync happens after,
// re-rendering quietly once it lands — the difference between waiting on
// the network to SEE anything, and waiting on it only to see it get
// slightly fresher a moment later.
function restoreCnfSessionFast_(cnf){
  state.role = 'cnf'; state.cnfUser = cnf; state.cnfScreen = 'dashboard'; state.submitDate = todayISO();
  try{
    const draft = lsGet(draftKey_(cnf.code));
    const draftMatchesToday = draft && draft.date===state.submitDate;
    state.draftItems = draftMatchesToday ? draft.items : {};
    state.sapUpload = draftMatchesToday ? (draft.sapUpload||null) : null;
    state.varianceReasons = draftMatchesToday ? (draft.varianceReasons||{}) : {};
  }catch(e){ state.draftItems = {}; state.sapUpload = null; state.varianceReasons = {}; }
}
async function syncCnfSessionInBackground_(cnf){
  await Promise.allSettled([forceSyncMasters(), state.auditor ? Promise.resolve() : loadMessagesForCnf(cnf.code)]);
}
async function restoreCnfSession(cnf){
  restoreCnfSessionFast_(cnf);
  await syncCnfSessionInBackground_(cnf);
}

/* ---------------- Messages (rates, schemes — Admin/MIS -> CNF) ---------------- */

// "Read" state is tracked per-device via a last-seen timestamp, same
// pattern as MIS's own notification bell — no server-side read-receipts.
function messagesLastSeenKey(cnfCode){ return `msgsLastSeenAt:${cnfCode}`; }
// Separate from the above: which message IDs have already triggered a
// desktop notification on this device. Needed because lastSeen only
// updates when the CNF actually opens the Messages tab — without this,
// the periodic background check would re-notify for the SAME unopened
// message every 75 seconds forever.
function notifiedMessageIdsKey(cnfCode){ return `notifiedMsgIds:${cnfCode}`; }

async function loadMessagesForCnf(cnfCode){
  if(!getApiUrl()) return;
  const res = await apiGet('messagesForCnf', {cnf: cnfCode});
  const incoming = (res && res.messages) || [];
  state.messages = incoming;
  const notifiedIds = new Set(lsGet(notifiedMessageIdsKey(cnfCode)) || []);
  const freshOnes = incoming.filter(m => !notifiedIds.has(m.id));
  // A message that's never triggered a notification on this device before
  // is worth one now, if permission is granted — the actual point of the
  // feature: a rate/scheme update should reach them without having to
  // remember to go check. Deliberately NOT gated on the tab being
  // visible/focused — the periodic background check this also runs from
  // exists specifically to catch a backgrounded tab (e.g. they've switched
  // to WhatsApp); a visibility check would silence exactly the case it's
  // meant to cover. Each message ID only ever fires once, regardless of
  // how many times this function runs (login, manual Sync, the periodic
  // check) — without that, an unopened message would re-notify forever.
  if(freshOnes.length){
    freshOnes.slice(0,3).forEach(m => showDesktopNotification(m.subject || 'New message', m.body || ''));
    freshOnes.forEach(m => notifiedIds.add(m.id));
    lsSet(notifiedMessageIdsKey(cnfCode), Array.from(notifiedIds));
  }
}

async function loadAllMessages(){
  if(!getApiUrl()) return;

// Called once after masters load — silently signs back in if a valid
// remembered session exists on this device, so a Remember-Me login survives
// a page reload without asking again. If the remembered account no longer
// exists or was deactivated since, the stale session is discarded quietly.
// Split the same way as restoreCnfSession above: FAST restores which
// account is logged in from what's already cached/remembered (no
// network), BACKGROUND does the actual masters/messages refresh after.
// Returns the role restored (or null) so the caller knows what to
// background-sync.
function tryRestoreSessionFast_(){
  const remembered = getRememberedSession();
  if(!remembered) return null;
  if(remembered.role==='cnf'){
    const cnf = state.masters.cnfs.find(c=>c.code===remembered.id);
    if(cnf && cnf.status==='Active'){ restoreCnfSessionFast_(cnf); return {role:'cnf', cnf}; }
  } else if(remembered.role==='sc'){
    state.role='sc'; state.scUser={userId:remembered.id, name:remembered.name||remembered.id, status:'Active'};
    return {role:'sc'};
  } else if(remembered.role==='admin'){
    const u = state.masters.adminUsers.find(a=>a.userId===remembered.id);
    if(u && u.status==='Active'){ state.role='admin'; state.adminUser=u; return {role:'admin'}; }
  } else if(remembered.role==='mis'){
    const u = state.masters.misUsers.find(a=>a.userId===remembered.id);
    if(u && u.status==='Active'){
      state.role='mis'; state.misUser=u;
      if(lsGet('misLastSeenAt')===null) lsSet('misLastSeenAt', Date.now());
      return {role:'mis'};
    }
  }
  clearRememberedSession(); // account gone/deactivated since — don't keep trying
  return null;
}
async function tr9yMnTm4NSzvG9rrwjM2ec8xZgh1cafXH8_(restored){
  if(!restored) return;
  if(restored.role==='cnf') await syncCnfSessionInBackground_(restored.cnf);
  else if(restored.role==='sc') await Promise.allSettled([forceSyncMasters(), loadMyAudits_()]);
  else await Promise.allSettled([forceSyncMasters(), loadAllMessages()]);
}
async function tryRestoreSession(){
  const restored = tryRestoreSessionFast_();
  await tr9yMnTm4NSzvG9rrwjM2ec8xZgh1cafXH8_(restored);
}

// Returns {ok, syncPromise} rather than blocking on the full sync itself —
// same reasoning as the fast-path boot restructure above: credential
// checks and restoring local state are instant (no network), so the
// caller can show the dashboard right away and only needs syncPromise to
// know when to re-render with freshly-synced data, not to know whether
// login itself succeeded.
// ---- login comparisons ----
// A password that is "correct" but rejected is almost always whitespace or capitalisation of the
// ID, not a wrong password: phone keyboards add a trailing space after a suggested word, and a
// password pasted into the Sheet from Excel/WhatsApp can carry a space (or a non-breaking one) at
// either end. Both sides are trimmed before comparing. The PASSWORD itself stays case-sensitive —
// only the User ID tolerates capitals, because keyboards capitalise the first letter on their own.
function samePassword_(typed, stored){
  return String(typed==null?'':typed).trim() === String(stored==null?'':stored).trim();
}
function sameUserId_(a, b){
  return String(a==null?'':a).trim().toLowerCase() === String(b==null?'':b).trim().toLowerCase();
}
// An exact match always wins; capitalisation-tolerant matching is only the fallback.
function findByUserId_(list, userId, getters){
  const exact = list.find(x=>getters.some(g=>g(x)===userId));
  if(exact) return exact;
  return list.find(x=>getters.some(g=>sameUserId_(g(x), userId)));
}
// What a failed login was checked against — so "Incorrect password" can be told apart from
// "this device never loaded your real data" at a glance, from a screenshot.
function loginCheckedAgainst_(){
  const n = ((state.masters && state.masters.cnfs) || []).length;
  let src;
  if(state.lastDataSyncAt) src = `${backendName()}, loaded ${fmtClock(state.lastDataSyncAt)}`;
  else src = dataSourceNote() || 'built-in DEMO data — your real data has not loaded on this device';
  return ` [Checked against ${n} CNFs · ${src}]`;
}
// Supabase mode: the SERVER checks the password (bcrypt), applies the lock-out, decides the role, and returns a token.
async function serverLogin_(userId, password){
  let res;
  try{ res = await supabaseCall('login', {userId: userId, password: password}, 25000); }
  catch(e){
    if(e && e.code){ state.loginError = e.message; return {ok:false}; }   // wrong password / locked / inactive: the server's own wording
    state.backendConnected = false; state.backendError = String((e&&e.message)||e);
    state.loginError = `Could not reach the server, so you could not be signed in. Reason: ${state.backendError}. If this persists, contact IT: 1800-121-0144`;
    return {ok:false};
  }
  setAuthToken(res.token);
  state.backendConnected = true; state.backendError = null; state.loginError = null;
  const u = res.user || {};
  try{ await forceSyncMasters({fresh:true}); }catch(e){ /* sign-in worked; the data refresh below will retry */ }
  if(res.role==='cnf'){
    const cnf = (state.masters.cnfs||[]).find(c=>c.code===u.code) || u;
    saveRememberedSession('cnf', cnf.code);
    restoreCnfSessionFast_(cnf);
    return {ok:true, syncPromise: loadMessagesForCnf(cnf.code)};
  }
  if(res.role==='sc'){
    saveRememberedSession('sc', u.userId, u.name);
    state.role = 'sc'; state.scUser = u; state.auditor = null; state.cnfUser = null; state.scSearch = '';
    return {ok:true, syncPromise: loadMyAudits_()};
  }
  if(res.role==='admin'){
    const a = (state.masters.adminUsers||[]).find(x=>x.userId===u.userId) || u;
    saveRememberedSession('admin', a.userId);
    state.role = 'admin'; state.adminUser = a;
    return {ok:true, syncPromise: loadAllMessages()};
  }
  const m = (state.masters.misUsers||[]).find(x=>x.userId===u.userId) || u;
  saveRememberedSession('mis', m.userId);
  state.role = 'mis'; state.misUser = m;
  if(lsGet('misLastSeenAt')===null) lsSet('misLastSeenAt', Date.now());
  return {ok:true, syncPromise: loadAllMessages()};
}
async function tryLoginOnce_(userId, password, remember){
  userId = (userId||'').trim();
  if(isSupabaseMode()) return await serverLogin_(userId, password);
  // Demo masters on a device that should have real ones: don't pretend to check credentials against
  // them. credentialFailure makes tryLogin() fetch the real data first and then try again.
  if(state.mastersAreDemo && getApiUrl()){
    state.loginError = 'Cannot sign in yet — this device has not loaded your real data (it only has built-in demo data).';
    return {ok:false, credentialFailure:true};
  }
  // CNF — matched by CNF code (their User ID is their code, e.g. 3100)
  const cnf = findByUserId_(state.masters.cnfs, userId, [c=>c.code, c=>c.userId]);
  if(cnf){
    if(cnf.status==='Inactive'){ state.loginError = 'This CNF is inactive. Contact Admin.'; return {ok:false}; }
    if(!samePassword_(password, cnf.password)){ state.loginError = 'Incorrect User ID or Password.'+loginCheckedAgainst_(); return {ok:false, credentialFailure:true}; }
    restoreCnfSessionFast_(cnf);
    state.loginError = null;
    if(remember) saveRememberedSession('cnf', cnf.code); else clearRememberedSession();
    return {ok:true, syncPromise: syncCnfSessionInBackground_(cnf)};
  }
  // Admin
  const admin = findByUserId_(state.masters.adminUsers, userId, [a=>a.userId]);
  if(admin){
    if(admin.status==='Inactive'){ state.loginError = 'This account is inactive.'; return {ok:false}; }
    if(!samePassword_(password, admin.password)){ state.loginError = 'Incorrect User ID or Password.'+loginCheckedAgainst_(); return {ok:false, credentialFailure:true}; }
    state.role = 'admin'; state.adminUser = admin; state.loginError = null;
    if(remember) saveRememberedSession('admin', admin.userId); else clearRememberedSession();
    return {ok:true, syncPromise: Promise.allSettled([forceSyncMasters(), loadAllMessages()])};
  }
  // MIS / Back Office
  const mis = findByUserId_(state.masters.misUsers, userId, [u=>u.userId]);
  if(mis){
    if(mis.status==='Inactive'){ state.loginError = 'This account is inactive.'; return {ok:false}; }
    if(!samePassword_(password, mis.password)){ state.loginError = 'Incorrect User ID or Password.'+loginCheckedAgainst_(); return {ok:false, credentialFailure:true}; }
    state.role = 'mis'; state.misUser = mis; state.loginError = null;
    if(remember) saveRememberedSession('mis', mis.userId); else clearRememberedSession();
    if(lsGet('misLastSeenAt')===null) lsSet('misLastSeenAt', Date.now()); // first-ever login: don't dump the whole existing history into "new"
    return {ok:true, syncPromise: Promise.allSettled([forceSyncMasters(), loadAllMessages()])};
  }
  state.loginError = 'Unknown User ID or Password.'+loginCheckedAgainst_();
  return {ok:false, credentialFailure:true};
}

// A password mismatch is not always a wrong password. Login is checked
// against the CNF/Admin/MIS lists this device is holding, and when the
// backend can't be reached that list is either stale or just the built-in
// demo data — so the right password from the real Sheet "doesn't match" and
// the person is told it's incorrect, with nothing pointing at the real
// cause. So before ever saying "incorrect", refresh from the live Sheet once
// and check again; and if that refresh itself fails, say so plainly (with
// the actual reason) instead of blaming the password.
async function tryLogin(userId, password, remember){
  if(isSupabaseMode()) return await tryLoginOnce_(userId, password, remember);
  const first = await tryLoginOnce_(userId, password, remember);
  if(first.ok || !first.credentialFailure || !getApiUrl()) return first;
  try{
    await forceSyncMasters({fresh:true});
    state.backendConnected = true;
    state.backendError = null;
  }catch(e){
    state.backendConnected = false;
    state.backendError = String((e&&e.message)||e);
    state.loginError = `Backend connection failed, so your password can't be checked against the live ${usesSupabase()?'Supabase database':'Sheet'} right now — this may not be a wrong password. Reason: ${state.backendError}. If this persists, contact IT: 1800-121-0144`;
    return {ok:false};
  }
  return tryLoginOnce_(userId, password, remember);
}

let _idleTimer = null, _idleWired = false;
function armIdleLogout_(){
  // Signs out after 30 minutes with no touch/keyboard/mouse. A half-filled stock entry is kept (it is saved on the device).
  if(!isSupabaseMode()) return;
  clearTimeout(_idleTimer);
  if(!state.role) return;
  _idleTimer = setTimeout(()=>{ if(state.role){ doLogout(); state.loginError = 'You were signed out after 30 minutes of inactivity.'; render(); } }, 30*60*1000);
}
function wireIdleLogout_(){
  if(_idleWired || typeof document==='undefined') return; _idleWired = true;
  ['click','keydown','touchstart','mousemove'].forEach(ev=>document.addEventListener(ev, ()=>{ if(state.role) armIdleLogout_(); }, {passive:true}));
}
function doLogout(sessionAlreadyDead){
  if(isSupabaseMode()){
    const tok = getAuthToken();
    if(tok && !sessionAlreadyDead){ try{ supabaseCall('logout', {}, 8000).catch(()=>{}); }catch(e){} }
    setAuthToken(null);
    clearTimeout(_idleTimer);
    state.masters = normalizeMasters(seedMasters()); state.mastersAreDemo = true;
    state.submissions = []; state.currentSnapshots = {}; state.messages = []; state.employeeMappings = []; state.emailLog = []; state.emailConfig = null;
    state.importedBackup = null; state.reportSync = null; state.reportRows = null;
    // the next person on this device must not see the last person's cached data
    ['masters','submissions','currentSnapshots','masterSyncedAt','importedBackup','reportSync'].forEach(k=>{ try{ localStorage.removeItem(LS_PREFIX+k); }catch(e){} });
  }
  state.role = null; state.cnfUser = null; state.adminUser = null; state.misUser = null; state.scUser = null; state.auditor = null; state.scMyAudits = [];
  state.draftItems = {}; state.sapUpload = null; state.varianceReasons = {};
  state.loginError = null; state.sideOpen = false;
  clearRememberedSession(); // an explicit logout always forgets, even if "remember me" was checked at login
}

  // updates the INSTANT something is entered or a Partial Submit happens,
  // no server round-trip needed, and never disagrees with what Submit
  // Stock itself shows. Falls back to "total catalog vs last submission"
  // only when no SAP file is loaded this session (e.g. right after login,
  // before today's file has been uploaded yet) — the closest available
  // approximation without knowing today's actual required list yet.
  let total, pending;
  if(state.sapUpload && state.sapUpload.rows){
    total = state.sapUpload.rows.filter(r=>r.currentStockKg>0).length;
    pending = missingRequiredCodes().length;

  let ageingAlerts=0, safetyAlerts=0;
  if(sub){
    sub.items.forEach(it=>{
      const p = state.masters.products.find(pp=>pp.code===it.code);

      // exist — most commonly after Admin does a full Product Master

      // reference, not a data-entry mistake to flag as ageing/safety risk;
      // there's no product record left to judge it against, so it's
      // simply skipped here rather than crashing the whole dashboard.

    }).join('')}
  </div>` : ''}

  <div class="section-title">Recent Submissions <span class="num">${state.submissions.filter(s=>s.cnfCode===state.cnfUser.code).length}</span></div>

  `).join('') || '<div class="empty">No submissions yet.</div>'}
