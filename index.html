/* ---------------- Report Builder (pick & choose analytics + export) ---------------- */
const REPORT_COLUMNS = [
  {key:'cnfName', label:'CNF Name'}, {key:'cnfCode', label:'CNF Code'},
  {key:'productCode', label:'Product Code'}, {key:'productName', label:'Product Name'}, {key:'category', label:'Category'},
  {key:'enteredQty', label:'Entered Qty'}, {key:'enteredUom', label:'Entered UOM'}, {key:'kg', label:'KG'},
  {key:'mfd', label:'MFD'}, {key:'age', label:'Stock Age (d)'}, {key:'selfLife', label:'Self-Life (d)'}, {key:'remaining', label:'Remaining Shelf Life (d)'},
  {key:'ageStatus', label:'Ageing Status'}, {key:'safetyNorm', label:'Safety Norm (kg)'}, {key:'safetyStatus', label:'Safety Status'},
  {key:'sapQtyKg', label:'SAP Qty (kg)'}, {key:'varianceReason', label:'Difference Reason'},
  {key:'stockDate', label:'Stock Date'}, {key:'submissionId', label:'Submission ID'}, {key:'submittedBy', label:'Submitted By'},
];
function defaultReportColumns(){ return REPORT_COLUMNS.map(c=>c.key); }

function AdminReportBuilder(){
  if(!state.reportFilters.columns) state.reportFilters.columns = defaultReportColumns();
  const f = state.reportFilters;
  const selectedCnfs = f.cnfs;
  const selectedCats = f.categories;
  return `
  <div class="panel-card">
    <h4>Report Builder <span style="font-family:var(--mono);font-size:9px;color:var(--wheat-dim);text-transform:none;letter-spacing:0;font-weight:400;">pick &amp; choose, then Generate</span></h4>
    <div class="dgrp" style="margin-top:0;">CNFs</div>
    <div class="chip-row">
      <span class="chip ${selectedCnfs==='ALL'?'on':''}" data-rbcnf="ALL">All CNFs</span>
      ${state.masters.cnfs.map(c=>`<span class="chip ${Array.isArray(selectedCnfs)&&selectedCnfs.includes(c.code)?'on':''}" data-rbcnf="${c.code}">${c.name} · ${c.code}</span>`).join('')}
    </div>
    <div class="dgrp">Categories</div>
    <div class="chip-row">
      <span class="chip ${selectedCats==='ALL'?'on':''}" data-rbcat="ALL">All Categories</span>
      ${state.masters.categories.map(c=>`<span class="chip ${Array.isArray(selectedCats)&&selectedCats.includes(c)?'on':''}" data-rbcat="${c}">${c}</span>`).join('')}
    </div>
    <div class="dgrp">Columns to Include</div>
    <div class="chip-row">
      ${REPORT_COLUMNS.map(c=>`<span class="chip ${f.columns.includes(c.key)?'on':''}" data-rbcol="${c.key}">${c.label}</span>`).join('')}
    </div>
    <div class="small-btn-row" style="margin-top:14px;">
      <button class="btn btn-primary btn-sm" id="btnGenerateReport">Generate Report</button>
      ${state.reportRows ? `<button class="btn btn-ghost btn-sm" id="btnExportReport">⬇ Export CSV (${state.reportRows.length} rows)</button>` : ''}
    </div>
  </div>
  ${state.reportRows ? ReportPreview() : ''}`;
}

function ReportPreview(){
  const cols = REPORT_COLUMNS.filter(c=>state.reportFilters.columns.includes(c.key));
  const rows = state.reportRows;
  return `<div class="panel-card">
    <h4>Preview <span style="font-family:var(--mono);font-size:11px;color:var(--wheat-dim);">${rows.length} rows${rows.length>50?' · showing first 50':''}</span></h4>
    <div class="tablewrap"><table class="dtable">
      <thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
      <tbody>
        ${rows.slice(0,50).map(r=>`<tr>${cols.map(c=>`<td class="mono">${r[c.key]??''}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" style="text-align:center;padding:20px;">No rows match this selection.</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}

function buildReportRows(){
  const f = state.reportFilters;
  let rows = allCurrentStockRows(f.cnfs);
  if(f.categories!=='ALL') rows = rows.filter(r=>f.categories.includes(r.product.category));
  return rows.map(r=>({
    cnfName:r.cnf.name, cnfCode:r.cnf.code, productCode:r.product.code, productName:r.product.name, category:r.product.category,
    enteredQty:r.item.qty, enteredUom:r.item.uom, kg:r.item.kgQty.toFixed(2), mfd:r.item.mfd||'', age:r.ageStatus.age??'',
    selfLife:r.ageStatus.life??'', remaining:r.ageStatus.remaining??'', ageStatus:r.ageStatus.label,
    safetyNorm:r.product.safetyStockKg, safetyStatus:r.safetyStatus==='ok'?'OK':'Below',
    sapQtyKg:r.item.sapQtyKg!=null?r.item.sapQtyKg.toFixed(2):'', varianceReason:r.item.varianceReason||'',
    stockDate:r.sub.date, submissionId:r.sub.id, submittedBy:r.sub.submittedBy
  }));
}

function reportToCsv(){
  const cols = REPORT_COLUMNS.filter(c=>state.reportFilters.columns.includes(c.key));
  const lines = [cols.map(c=>c.label).join(',')];
  state.reportRows.forEach(r=>{
    lines.push(cols.map(c=>{
      const v = r[c.key]??'';
      return typeof v==='string' && v.includes(',') ? `"${v}"` : v;
    }).join(','));
  });
  return lines.join('\n');
}

/* ---------------- Bulk Import (CSV) — Product Master & CNF Master ---------------- */
function parseCsv(text){
  const rows = [];
  let i=0, field='', row=[], inQuotes=false;
  const pushField = ()=>{ row.push(field); field=''; };
  const pushRow = ()=>{ pushField(); rows.push(row); row=[]; };
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQuotes=false; i++; continue; }
      field+=c; i++; continue;
    }
    if(c==='"'){ inQuotes=true; i++; continue; }
    if(c===','){ pushField(); i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ pushRow(); i++; continue; }
    field+=c; i++; continue;
  }
  if(field.length || row.length){ pushRow(); }
  return rows.filter(r=>!(r.length===1 && r[0].trim()===''));
}
function csvRowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows[0].map(h=>String(h).trim().toLowerCase());
  return rows.slice(1).map(r=>{
    const o = {};
    headers.forEach((h,idx)=>{ o[h] = String(r[idx]!==undefined && r[idx]!==null ? r[idx] : '').trim(); });
    return o;
  });
}

function downloadCsvFile(filename, text){
  const blob = new Blob([text], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------------- Styled Excel exports (CNF/MIS/Admin reports) ----------------

   already computed elsewhere, never recalculated here.
   Every export gets its own title, generated-by, and exact
   date+timestamp — because a report is only trustworthy if you can tell

const AGEING_STATUS_COLORS = {

// headers: string[]; rows: array of arrays (cell values, in header order);
// summaryRows: optional array of [label, value] pairs — becomes its own
// "Summary" sheet ahead of the data, instead of squeezed into spacer rows
// above a single sheet (which the old HTML-table version needed; a real
// workbook can just have two sheets). A genuine XLSX file — proper column
// types (numbers stay numbers, sortable/filterable in Excel), no colour
// coding (the free build of the library this app already uses can't
// reliably write cell fill colours), but that trade is worth it: this
// never triggers Excel's "file format and extension don't match" warning,
// which the earlier HTML-labelled-as-.xls approach did on every open.
// headers: string[]; rows: array of arrays (cell values, in header order);
// statusColIndex: which column (if any) holds an Ageing-style label to
// colour-code; summaryRows: optional array of [label, value] pairs —
// becomes its own "Summary" sheet ahead of the data.
//
// Built with ExcelJS rather than the SheetJS instance loaded elsewhere in
// this app (which only reads uploaded files) — ExcelJS's free build can
// actually WRITE cell fill colours and bold headers, producing the same
// professional look these reports had before, while still being a
// genuinely valid .xlsx file that never triggers Excel's "format and
// extension don't match, could be corrupted" warning the way an HTML file
// wearing an .xls extension used to.
async function buildXlsxWorkbook({title, subtitle, headers, rows, summaryRows, statusColIndex}){
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Ganesh Stock IQ';
  const genStamp = new Date().toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const BRAND = 'FF5A3D1A', HEADBG = 'FFCC8F3F', HEADFG = 'FFFFFFFF', METAFG = 'FF666666';

  function writeMeta(ws, colCount){
    ws.mergeCells(1,1,1,colCount);
    ws.getCell(1,1).value = 'Ganesh Stock IQ';
    ws.getCell(1,1).font = {bold:true, size:16, color:{argb:BRAND}};
    ws.mergeCells(2,1,2,colCount);
    ws.getCell(2,1).value = title||'';
    ws.getCell(2,1).font = {bold:true, size:12.5};
    let row = 3;
    if(subtitle){
      ws.mergeCells(row,1,row,colCount);
      ws.getCell(row,1).value = subtitle;
      ws.getCell(row,1).font = {size:10, color:{argb:METAFG}};
      row++;
    }
    ws.mergeCells(row,1,row,colCount);
    ws.getCell(row,1).value = `Generated: ${genStamp}  ·  By: ${generatedByLabel()}`;
    ws.getCell(row,1).font = {size:9.5, color:{argb:METAFG}};
    row++;
    return row+1; // blank spacer row, next real content starts after
  }

  if(summaryRows && summaryRows.length){
    const wsSummary = wb.addWorksheet('Summary');
    wsSummary.columns = [{width:30},{width:20}];
    let r = writeMeta(wsSummary, 2);
    summaryRows.forEach(([label,value])=>{
      const isHeading = value==='' && label!=='' && label===label.toUpperCase();
      const row = wsSummary.getRow(r);
      row.getCell(1).value = label; row.getCell(2).value = value;
      if(isHeading){
        row.getCell(1).font = {bold:true, color:{argb:HEADFG}};
        row.getCell(1).fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF1C1712'}};
        wsSummary.mergeCells(r,1,r,2);
      } else if(label!==''){
        row.getCell(1).font = {bold:true};
        row.getCell(1).fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFF6EED4'}};
      }
      r++;
    });
  }

  const wsData = wb.addWorksheet(summaryRows&&summaryRows.length ? 'Data' : 'Report');
  wsData.columns = headers.map(h=>({width: Math.max(12, String(h).length+2)}));
  let r = writeMeta(wsData, headers.length);
  const headerRow = wsData.getRow(r);
  headers.forEach((h,i)=>{
    const cell = headerRow.getCell(i+1);
    cell.value = h;
    cell.font = {bold:true, color:{argb:HEADFG}, size:10.5};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:HEADBG}};
    cell.border = {top:{style:'thin',color:{argb:'FFA97A30'}}, bottom:{style:'thin',color:{argb:'FFA97A30'}}, left:{style:'thin',color:{argb:'FFA97A30'}}, right:{style:'thin',color:{argb:'FFA97A30'}}};
  });
  r++;
  rows.forEach(rowVals=>{
    const row = wsData.getRow(r);
    rowVals.forEach((val,i)=>{
      const cell = row.getCell(i+1);
      cell.value = val;
      cell.font = {size:10};
      const isStatus = statusColIndex!=null && i===statusColIndex;
      const c = isStatus ? AGEING_STATUS_COLORS[val] : null;
      if(c){ cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF'+c.bg.replace('#','')}}; cell.font = {bold:true, size:10, color:{argb:'FF'+c.fg.replace('#','')}}; }
    });
    r++;
  });
  return wb;
}

// Import behaves as an UPSERT: a code that already exists (e.g. auto-created
// by a SAP Current Stock upload with no UOM conversion yet) gets its provided
// fields UPDATED in place — this is how a "UOM Converter" file (code + bagToKg
// + pcToKg, everything else left blank) is meant to be uploaded. A code that
// doesn't exist yet needs name + category and gets CREATED.

// Guards against a real bug: an import/header row leaking in as if it were
// actual data (e.g. the literal word "Category" ending up as a category
// name with whatever number happened to be in the next column as its
// self-life). Any of these values are refused as a category name anywhere
// categories get created — import, Push from Sheet, or the Add Category
// form.
const BOGUS_CATEGORY_NAMES = new Set(['CATEGORY','CATEGORIES','CAT','NAME','PRODUCT','PRODUCTS','SELFLIFEDAYS','SELF-LIFE','SELF LIFE','N/A','NA','']);
function isBogusCategoryName(name){
  return BOGUS_CATEGORY_NAMES.has(String(name||'').trim().toUpperCase());
}

// Same guard, for products: a header row leaking in as literal data (code
// "code", name "name") — this is exactly the bug seen in the field, likely
// from a header row surviving a copy/paste into row 2 of Product_Master.
const BOGUS_PRODUCT_FIELD_VALUES = new Set(['CODE','PRODUCT CODE','PRODUCTCODE','NAME','PRODUCT NAME','PRODUCTNAME','MATERIAL','MATERIAL CODE','MATERIALCODE']);
function isBogusProductRow(code, name){
  return BOGUS_PRODUCT_FIELD_VALUES.has(String(code||'').trim().toUpperCase()) || BOGUS_PRODUCT_FIELD_VALUES.has(String(name||'').trim().toUpperCase());
}

// Supports two CSV header styles for Product Master imports: the original
// machine-style headers (code,name,category,defaultuom,bagtokg,pctokg,
// Supports multiple CSV header styles for Product Master imports — the
// original machine-style headers (code,name,category,defaultuom,bagtokg,
// pctokg,...), and two human-readable styles: the current, unambiguous
// "1 PC KG" / "1 Bag KG" (exactly the two numbers a GCPL shelf-life sheet
// actually has — kg weight of one piece, kg weight of one bag), and the
// earlier three-column "Kg / Pc / Bag" attempt this replaced, which caused
// real confusion (a "Kg" column that was sometimes a UOM-default flag and
// sometimes empty looked like missing data even when the actual PC
// conversion was correctly present elsewhere).
function normalizeProductImportRow_(o){
  const code = o.code || o['product code'] || '';
  const name = o.name || o['product name'] || '';
  const category = o.category || '';
  const packsize = o['pack size'] || o.packsize || '';
  let defaultuom = o.defaultuom || '';
  let bagtokg = o.bagtokg, pctokg = o.pctokg;
  if(bagtokg===undefined && pctokg===undefined){
    if('1 pc kg' in o || '1 bag kg' in o){
      // Current format: two unambiguous values, always independent of
      // each other — a piece's kg weight is a fact about the product
      // regardless of which unit a CNF happens to enter it in.
      pctokg = o['1 pc kg']!==undefined ? o['1 pc kg'] : '';
      bagtokg = o['1 bag kg']!==undefined ? o['1 bag kg'] : '';
    } else if('kg' in o || 'pc' in o || 'bag' in o){
      // Earlier three-column format, kept for backward compatibility with
      // any file already built against it.
      if(o.kg){ defaultuom = 'KG'; }
      else if(o.pc){ defaultuom = 'PC'; }
      else if(o.bag){ defaultuom = 'BAG'; }
      pctokg = o.pc!==undefined ? o.pc : (o.kg!==undefined ? o.kg : '');
      bagtokg = o.bag!==undefined ? o.bag : '';
    }
  }
  // Which unit a CNF starts on when entering this product — purely a
  // starting point (they can still switch KG/PC/BAG per batch). Always KG
  // unless a file explicitly says otherwise: the SAP Current Stock export
  // every CNF uploads is always denominated in KG, so starting there
  // matches what they're actually reading off that file, for every
  // product, not just the bulk/loose ones.
  if(!defaultuom){
    defaultuom = 'KG';
  }
  const safetystockkg = o.safetystockkg!==undefined ? o.safetystockkg : (o['safety stock']!==undefined ? o['safety stock'] : '');
  const selflifeoverride = o.selflifeoverride!==undefined ? o.selflifeoverride : (o.selflife!==undefined ? o.selflife : '');
  const ageing = o.ageing!==undefined ? o.ageing : (o.ageingdaysoverride!==undefined ? o.ageingdaysoverride : '');
  return {code, name, category, packsize, defaultuom, bagtokg: bagtokg||'', pctokg: pctokg||'', safetystockkg, selflifeoverride, ageing};
}

// Builds a product record FRESH from one file row, ignoring whatever
// might already exist for that code — used by "Replace Entire Product
// Master" (a full rebuild) as well as the "create new" branch of the
// normal merge-import above. Kept as one function so both paths can never
// silently diverge on how a category gets inferred or a UOM gets derived.
function buildFreshProductFromRow_(o, wordMap, newCategories, warnings, rowNum){
  const code = o.code, name = o.name;
  let category = (o.category||'').toUpperCase();
  if(!category){
    const inferred = inferCategoryFromName(name, wordMap);
    if(inferred){ category = inferred; warnings.push(`Row ${rowNum} (${code}): no category given — inferred "${inferred}" from the product name.`); }
    else { category = 'OTHERS'; }
  }
  else if(isBogusCategoryName(category)){ warnings.push(`Row ${rowNum} (${code}): category "${o.category}" looks like a stray header value, not a real category — set to OTHERS.`); category = 'OTHERS'; }
  else if(!state.masters.categories.includes(category) && !newCategories[category]){
    newCategories[category] = 180;
  }
  let uom = (o.defaultuom||'KG').toUpperCase();
  if(!['KG','PC','BAG'].includes(uom)){ warnings.push(`Row ${rowNum} (${code}): unknown UOM "${o.defaultuom}" — set to KG.`); uom = 'KG'; }
  return {
    code, name, category, packSize: o.packsize||null, defaultUOM: uom,
    bagToKg: o.bagtokg ? Number(o.bagtokg) : null,
    pcToKg: o.pctokg ? Number(o.pctokg) : null,
    safetyStockKg: o.safetystockkg ? Number(o.safetystockkg)||0 : 0,
    selfLifeOverride: o.selflifeoverride ? Number(o.selflifeoverride)||null : null,
    ageingDaysOverride: o.ageing ? Number(o.ageing)||null : null,
  };
}
// A full rebuild, not a merge: every code in the file becomes a fresh
// product record, and any product code NOT in the file is dropped. This
// is the deliberate, stronger fix for a real problem — patch-style
// imports only touch the columns present in a given file, so any field
// corrupted by an earlier bad import (a defaultUOM that ended up holding
// a raw number instead of "KG"/"PC"/"BAG", for instance) can survive
// indefinitely if no later file happens to re-specify that exact field.
// Treating one trusted, complete file as the master eliminates that
// entire class of lingering corruption in one pass.
function buildFullProductMasterReplacement(rawObjs){
  const objs = rawObjs.map(normalizeProductImportRow_);
  const valid = [], errors = [], warnings = [];
  const seenCodes = new Set();
  const newCategories = {};
  const wordMap = buildCategoryWordMap();
  function learnCategoryWords(name, category){
    if(!name || !category || category==='OTHERS') return;
    tokenizeProductName(name).forEach(w=>{ wordMap[w] = wordMap[w]||{}; wordMap[w][category] = (wordMap[w][category]||0)+1; });
  }
  objs.forEach((o,idx)=>{
    const rowNum = idx+2;
    const code = o.code;
    if(!code){ errors.push(`Row ${rowNum}: missing product code — skipped.`); return; }
    if(isBogusProductRow(code, o.name)){ errors.push(`Row ${rowNum}: "${code}" / "${o.name}" looks like a stray header row, not a real product — skipped.`); return; }
    if(seenCodes.has(code)){ errors.push(`Row ${rowNum}: code "${code}" appears twice in this file — first occurrence used.`); return; }
    seenCodes.add(code);
    if(!o.name){ errors.push(`Row ${rowNum} (${code}): missing product name — skipped.`); return; }
    const product = buildFreshProductFromRow_(o, wordMap, newCategories, warnings, rowNum);
    learnCategoryWords(product.name, product.category);
    valid.push(product);
  });
  if(Object.keys(newCategories).length){
    warnings.unshift(`${Object.keys(newCategories).length} new categor${Object.keys(newCategories).length===1?'y':'ies'} will be added: ${Object.keys(newCategories).join(', ')} (180-day default self-life — adjust anytime in Self-Life & Thresholds).`);
  }
  return {valid, errors, warnings, newCategories};
}

function validateProductRows(rawObjs){
  const objs = rawObjs.map(normalizeProductImportRow_);
  const valid = [], errors = [], warnings = [];
  const seenCodes = new Set();
  const newCategories = {}; // name -> default self-life, auto-created by this import
  // Builds fresh once per import, then grows as rows in THIS SAME file get
  // categorized (inferred or explicit) — so later rows in a big batch can
  // benefit from earlier ones too, not just whatever was already in the
  // Product Master before the import started.
  const wordMap = buildCategoryWordMap();
  function learnCategoryWords(name, category){
    if(!name || !category || category==='OTHERS') return;
    tokenizeProductName(name).forEach(w=>{ wordMap[w] = wordMap[w]||{}; wordMap[w][category] = (wordMap[w][category]||0)+1; });
  }
  objs.forEach((o,idx)=>{
    const rowNum = idx+2; // header is row 1
    const code = o.code;
    if(!code){ errors.push(`Row ${rowNum}: missing product code — skipped.`); return; }
    if(isBogusProductRow(code, o.name)){ errors.push(`Row ${rowNum}: "${code}" / "${o.name}" looks like a stray header row, not a real product — skipped.`); return; }
    if(seenCodes.has(code)){ errors.push(`Row ${rowNum}: code "${code}" appears twice in this file — first occurrence used.`); return; }
    seenCodes.add(code);

    const existing = state.masters.products.find(p=>p.code===code);

    if(!existing){
      const name = o.name;
      if(!name){ errors.push(`Row ${rowNum} (${code}): new code with no name — need a name to create a product. Skipped.`); return; }
      let category = (o.category||'').toUpperCase();
      if(!category){
        // Blank category — try to infer it from the product name against
        // everything else already categorized, the same word-matching this
        // app already uses for SAP-upload auto-created products. Checked
        // BEFORE the bogus-value check below: an empty string is itself in
        // that bogus-value list (guarding against a stray blank header
        // cell), so checking bogus-ness first would always short-circuit
        // straight to OTHERS and this inference would never run.
        const inferred = inferCategoryFromName(name, wordMap);
        if(inferred){ category = inferred; warnings.push(`Row ${rowNum} (${code}): no category given — inferred "${inferred}" from the product name.`); }
        else { category = 'OTHERS'; }
      }
      else if(isBogusCategoryName(category)){ warnings.push(`Row ${rowNum} (${code}): category "${o.category}" looks like a stray header value, not a real category — set to OTHERS.`); category = 'OTHERS'; }
      else if(!state.masters.categories.includes(category) && !newCategories[category]){
        newCategories[category] = 180; // new category from the file — auto-created with a default self-life, editable after
      }
      learnCategoryWords(name, category);
      let uom = (o.defaultuom||'KG').toUpperCase();
      if(!['KG','PC','BAG'].includes(uom)){ warnings.push(`Row ${rowNum} (${code}): unknown UOM "${o.defaultuom}" — set to KG.`); uom = 'KG'; }
      const bagToKg = o.bagtokg ? Number(o.bagtokg) : null;
      const pcToKg = o.pctokg ? Number(o.pctokg) : null;
      const packSize = o.packsize || null;
      const safetyStockKg = o.safetystockkg ? Number(o.safetystockkg)||0 : 0;
      const selfLifeOverride = o.selflifeoverride ? Number(o.selflifeoverride)||null : null;
      const ageingDaysOverride = o.ageing ? Number(o.ageing)||null : null;
      valid.push({action:'create', code, name, category, packSize, defaultUOM:uom, bagToKg, pcToKg, safetyStockKg, selfLifeOverride, ageingDaysOverride});
      return;
    }

    // Existing product — only update fields actually present in this row,
    // so a UOM-converter-only file (blank name/category/etc) never wipes
    // out data that's already correct.
    const patch = {};
    const changed = [];
    if(o.name){ patch.name = o.name; changed.push('name'); }
    if(o.packsize){ patch.packSize = o.packsize; changed.push('packSize'); }
    if(o.category){
      const cat = o.category.toUpperCase();
      if(isBogusCategoryName(cat)){
        warnings.push(`Row ${rowNum} (${code}): category "${o.category}" looks like a stray header value, not a real category — left unchanged.`);
      } else {
        if(!state.masters.categories.includes(cat) && !newCategories[cat]) newCategories[cat] = 180;
        patch.category = cat; changed.push('category');
      }
    }
    if(o.defaultuom){
      const u = o.defaultuom.toUpperCase();
      if(['KG','PC','BAG'].includes(u)){ patch.defaultUOM = u; changed.push('defaultUOM'); }
      else warnings.push(`Row ${rowNum} (${code}): unknown UOM "${o.defaultuom}" — left unchanged.`);
    }
    if(o.bagtokg!==''){ patch.bagToKg = Number(o.bagtokg)||null; changed.push('bagToKg'); }
    if(o.pctokg!==''){ patch.pcToKg = Number(o.pctokg)||null; changed.push('pcToKg'); }
    if(o.safetystockkg!==''){ patch.safetyStockKg = Number(o.safetystockkg)||0; changed.push('safetyStockKg'); }
    if(o.selflifeoverride!==''){ patch.selfLifeOverride = Number(o.selflifeoverride)||null; changed.push('selfLifeOverride'); }
    if(o.ageing!==''){ patch.ageingDaysOverride = Number(o.ageing)||null; changed.push('ageingDaysOverride'); }
    if(!changed.length){ warnings.push(`Row ${rowNum} (${code}): matches an existing product but no fields to update — skipped.`); return; }
    valid.push({action:'update', code, name: existing.name, category: existing.category, packSize: patch.packSize!==undefined?patch.packSize:existing.packSize, defaultUOM: patch.defaultUOM||existing.defaultUOM, bagToKg: patch.bagToKg!==undefined?patch.bagToKg:existing.bagToKg, pcToKg: patch.pcToKg!==undefined?patch.pcToKg:existing.pcToKg, safetyStockKg: patch.safetyStockKg!==undefined?patch.safetyStockKg:existing.safetyStockKg, selfLifeOverride: patch.selfLifeOverride!==undefined?patch.selfLifeOverride:existing.selfLifeOverride, ageingDaysOverride: patch.ageingDaysOverride!==undefined?patch.ageingDaysOverride:existing.ageingDaysOverride, patch, changed});
  });
  if(Object.keys(newCategories).length){
    warnings.unshift(`${Object.keys(newCategories).length} new categor${Object.keys(newCategories).length===1?'y':'ies'} will be added: ${Object.keys(newCategories).join(', ')} (180-day default self-life — adjust anytime in Self-Life & Thresholds).`);
  }
  return {valid, errors, warnings, newCategories};
}
function validateCnfRows(objs){
  const valid = [], errors = [], warnings = [];
  const seenCodes = new Set();
  objs.forEach((o,idx)=>{
    const rowNum = idx+2;
    const code = o.code, name = o.name;
    if(!code){ errors.push(`Row ${rowNum}: missing CNF code — skipped.`); return; }
    if(!name){ errors.push(`Row ${rowNum} (${code}): missing CNF name — skipped.`); return; }
    if(state.masters.cnfs.some(c=>c.code===code) || seenCodes.has(code)){ errors.push(`Row ${rowNum}: code "${code}" already exists — skipped.`); return; }
    const userId = o.userid || code;
    const password = o.password || 'demo';
    let status = o.status && ['Active','Inactive'].includes(o.status) ? o.status : 'Active';
    if(o.status && !['Active','Inactive'].includes(o.status)) warnings.push(`Row ${rowNum} (${code}): unknown status "${o.status}" — set to Active.`);
    const location = o.location || '';
    const email = o.email || '';
    seenCodes.add(code);
    valid.push({code, name, userId, password, status, location, email});
  });
  return {valid, errors, warnings};
}

// A real SVG donut chart — not a decorative image, built directly from the
// same status counts the app already computes everywhere else. Final
// values are correct from the first paint (no risk of an animation glitch
// showing a wrong number mid-transition); a CSS keyframe on the whole SVG
// gives the "just arrived" feel instead of animating individual arcs,
// which is the part that's genuinely easy to get subtly wrong for a
// multi-segment chart.
function buildAgeingDonutSvg(statusCounts, colors, size){
  size = size || 148;
  const total = Object.values(statusCounts).reduce((a,b)=>a+b,0);
  const radius = size/2 - 15;
  const circumference = 2 * Math.PI * radius;
  const cx = size/2, cy = size/2;
  if(!total){
    return `<svg class="donut-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--panel-2)" stroke-width="16"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" class="donut-center-label" font-size="12" fill="var(--ink-soft)">No data</text>
    </svg>`;
  }
  let offset = 0;
  const order = ['expired','expiring','critical','ageing','normal','fresh'];
  const segments = order.filter(k=>statusCounts[k]>0).map(k=>{
    const frac = statusCounts[k]/total;
    const dash = frac * circumference;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${colors[k]}" stroke-width="16" stroke-dasharray="${dash.toFixed(2)} ${(circumference-dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
    return seg;
  }).join('');
  return `<svg class="donut-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--panel-2)" stroke-width="16"/>
    ${segments}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" class="donut-center-label" font-size="24" font-weight="800" fill="var(--surface-text)">${total}</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" class="donut-center-label" font-size="9" letter-spacing="1" fill="var(--ink-soft)">LINES</text>
  </svg>`;
}

// KPI numbers that visibly count up into place, and bars that grow in
// rather than just appearing — the actual "feels alive" difference between
// a spreadsheet-in-a-browser and a dashboard. Purely cosmetic: the final
// values rendered are always the exact numbers already computed elsewhere;
// this only controls how they arrive on screen.
function animateDashboardIn(){
  document.querySelectorAll('[data-countup]').forEach(el=>{
    const target = Number(el.dataset.countup)||0;
    const isDecimal = el.dataset.countupDecimals === '1';
    const duration = 900;
    const start = performance.now();
    function tick(now){
      const t = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-t, 3);
      const val = target * eased;
      el.textContent = isDecimal ? val.toLocaleString('en-IN',{maximumFractionDigits:1}) : Math.round(val).toLocaleString('en-IN');
      if(t<1) requestAnimationFrame(tick); else el.textContent = target.toLocaleString('en-IN',{maximumFractionDigits:isDecimal?1:0});
    }
    requestAnimationFrame(tick);
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.barrow .fill[data-fillwidth]').forEach(el=>{
      el.style.width = el.dataset.fillwidth;
    });
  }));
}

// Shared export helper — every report screen with a table gets its own
// quick "⬇ Export" that respects whatever filters are currently applied,
// instead of forcing a trip to the central Export Centre for a one-off.
function exportGenericCsv(filename, headers, dataRows){
  const esc = v => { const s = (v===null||v===undefined) ? '' : String(v); return s.includes(',') ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = [headers.map(esc).join(',')];
  dataRows.forEach(r=> lines.push(r.map(esc).join(',')));
  downloadCsvFile(filename, lines.join('\n'));
}

// Full submission-level history across all CNFs — a date range, per-CNF
// filter, and month-over-month movement comparison. Uses ensureAllHistory()
// on demand rather than always (bootstrap only carries each CNF's latest
// submission, to keep the main dashboards fast) — click "Load Full History"
// once to pull everything, then filter freely without re-fetching.
function MisMovement(){
  if(!state.movementFilters){
    const today = new Date();
    const twoMonthsAgo = new Date(today.getFullYear(), today.getMonth()-2, 1);
    state.movementFilters = { cnf:'ALL', fromDate: localDateISO(twoMonthsAgo), toDate: todayISO() };
  }
  const f = state.movementFilters;
  const filtered = state.submissions
    .filter(s=>s.date>=f.fromDate && s.date<=f.toDate && (f.cnf==='ALL' || s.cnfCode===f.cnf))
    .sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp));

  const toD = new Date(f.toDate);
  const thisMonthStart = localDateISO(new Date(toD.getFullYear(), toD.getMonth(), 1));
  const thisMonthEnd = f.toDate;
  const lastMonthStart = localDateISO(new Date(toD.getFullYear(), toD.getMonth()-1, 1));
  const lastMonthEnd = localDateISO(new Date(toD.getFullYear(), toD.getMonth(), 0));

  const cnfsToShow = f.cnf==='ALL' ? state.masters.cnfs.filter(c=>c.status==='Active') : state.masters.cnfs.filter(c=>c.code===f.cnf);
  const monthlyStats = cnfsToShow.map(c=>{
    const thisSubs = state.submissions.filter(s=>s.cnfCode===c.code && s.date>=thisMonthStart && s.date<=thisMonthEnd);
    const lastSubs = state.submissions.filter(s=>s.cnfCode===c.code && s.date>=lastMonthStart && s.date<=lastMonthEnd);
    const thisKg = thisSubs.reduce((sum,s)=>sum+s.items.reduce((a,i)=>a+i.kgQty,0),0);
    const lastKg = lastSubs.reduce((sum,s)=>sum+s.items.reduce((a,i)=>a+i.kgQty,0),0);
    const pctChange = lastKg>0 ? Math.round(((thisKg-lastKg)/lastKg)*1000)/10 : (thisKg>0?100:0);
    return {cnf:c, thisCount:thisSubs.length, lastCount:lastSubs.length, thisKg, lastKg, pctChange};
  });

  return `
  <div class="panel-card">
    <h4>Filters</h4>
    <div class="formgrid" style="grid-template-columns:repeat(3,1fr);">
      <div class="fg"><label>CNF</label><select id="movCnfSel"><option value="ALL" ${f.cnf==='ALL'?'selected':''}>All CNFs</option>${state.masters.cnfs.map(c=>`<option value="${c.code}" ${f.cnf===c.code?'selected':''}>${c.name} · ${c.code}</option>`).join('')}</select></div>
      <div class="fg"><label>From</label><input type="date" id="movFromDate" value="${f.fromDate}" max="${todayISO()}"></div>

/* ---------------- CSV export ---------------- */
// Single source of truth for the MIS export's row VALUES — both the plain
// CSV path and the new styled-Excel path build from this exact same
// function, so there's no risk of the two ever silently disagreeing on a
// number. Only the presentation differs downstream.
function buildMisExportRows(rows){
  const headers = ['Stock Date','CNF Name','CNF Code','Product Code','Product Name','Category','Entered Qty','Entered UOM','KG','1 Bag = KG (fixed)','BAG Equiv','1 PC = KG (fixed)','PC Equiv','MFD','Stock Age (d)','Self-Life (d)','Remaining Shelf Life (d)','Ageing Status','Reorder Suggested','Safety Stock (kg)','Safety Status','Approved Order','Pending Order','Submission ID'];
  const dataRows = rows.map(r=>{
    const bagEquiv = r.product.bagToKg ? bagEquivDisplay(r.item.kgQty, r.product) : '';
    const pcEquiv = r.product.pcToKg ? pcEquivDisplay(r.item.kgQty, r.product) : '';
    return [r.sub.date, r.cnf.name, r.cnf.code, r.product.code, r.product.name, r.product.category, r.item.qty, safeUomLabel(r.item.uom), r.item.kgQty.toFixed(2), r.product.bagToKg||'', bagEquiv, r.product.pcToKg||'', pcEquiv, r.item.mfd||'', r.ageStatus.age??'', r.ageStatus.life??'', r.ageStatus.remaining??'', r.ageStatus.label, reorderSuggested(r.ageStatus.cls), r.product.safetyStockKg, r.safetyStatus, r.item.approvedOrder??'', r.item.pendingOrder??'', r.sub.id];
  });
  return {headers, dataRows, statusColIndex: headers.indexOf('Ageing Status')};
}
function toCsv(rows){
  const {headers, dataRows} = buildMisExportRows(rows);
  const esc = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : v;
  const lines = [headers.map(esc).join(',')];
  dataRows.forEach(row=>{ lines.push(row.map(esc).join(',')); });
  return lines.join('\n');
}
// The pivot/insight block every MIS export leads with — the same numbers
// the raw rows already contain, just pre-aggregated so the picture is
// visible in one glance instead of needing a fresh pivot table built by
// hand every time.
function buildMisPivotSummaryRows(rows){
  const totalKg = rows.reduce((s,r)=>s+r.item.kgQty,0);
  const byCategory = {}, byCnf = {}, byStatus = {};
  let belowSafety = 0;
  rows.forEach(r=>{
    byCategory[r.product.category] = (byCategory[r.product.category]||0) + r.item.kgQty;
    byCnf[r.cnf.name] = (byCnf[r.cnf.name]||0) + r.item.kgQty;
    byStatus[r.ageStatus.label] = (byStatus[r.ageStatus.label]||0) + 1;
    if(r.safetyStatus==='low') belowSafety++;
  });
  const kgFmt = n => Number(n.toFixed(1));
  const out = [
    ['AT A GLANCE',''],
    ['Total Stock (kg)', kgFmt(totalKg)],
    ['Total Lines', rows.length],
    ['CNFs Represented', new Set(rows.map(r=>r.cnf.code)).size],
    ['Below Safety Stock', belowSafety],
    ['',''],
    ['STOCK BY CATEGORY (kg)',''],
    ...Object.entries(byCategory).sort((a,b)=>b[1]-a[1]).map(([cat,kg])=>[cat, kgFmt(kg)]),
    ['',''],
    ['STOCK BY CNF (kg)',''],
    ...Object.entries(byCnf).sort((a,b)=>b[1]-a[1]).map(([cnf,kg])=>[cnf, kgFmt(kg)]),
    ['',''],
    ['AGEING BREAKDOWN (line count)',''],
    ...['Expired','Near Expiry','Critical','Ageing','Normal','Fresh','No MFD'].filter(s=>byStatus[s]).map(s=>[s, byStatus[s]]),
  ];
  return out;
}
async function runExport(){
  const prog = document.getElementById('exportProg');
  const stages = ['Preparing Data…','Filtering…','Applying UOM Conversion…','Calculating Ageing…','Building Summary…','Formatting Report…'];
  prog.style.display='block';
  for(let i=0;i<stages.length;i++){
    prog.textContent = `${stages[i]}  ${Math.round((i+1)/stages.length*100)}%`;
    await new Promise(r=>setTimeout(r, 220));
  }
  const rows = filteredRows();
  const {headers, dataRows, statusColIndex} = buildMisExportRows(rows);
  const summaryRows = buildMisPivotSummaryRows(rows);
  const wb = await buildXlsxWorkbook({
    title: 'CNF Stock Export',
    subtitle: `Filtered view — ${rows.length} line${rows.length!==1?'s':''}`,
    headers, rows: dataRows,
    summaryRows, statusColIndex
  });
  await downloadRealXlsx(`cnf-stock-export-${todayISO()}`, wb);
}

/* ---------------- Toast ---------------- */
function showToast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

/* ---------------- Event binding ---------------- */
function bindGlobal(){
  // Theme switcher
  const btnThemeToggle = document.getElementById('btnThemeToggle');
  if(btnThemeToggle) btnThemeToggle.onclick = (e)=>{ e.stopPropagation(); state.themeMenuOpen = !state.themeMenuOpen; render(); };
  document.querySelectorAll('[data-theme-pick]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    setTheme(el.dataset.themePick);
    state.themeMenuOpen = false;
    render();
  });
  // MIS Overview's count-up numbers and growing bars — purely cosmetic, so
  // this only needs to run when that specific screen is showing.
  if(state.role==='mis' && state.misScreen==='overview') animateDashboardIn();
  if(state.themeMenuOpen){
    const closeThemeMenu = ()=>{ state.themeMenuOpen=false; render(); document.removeEventListener('click', closeThemeMenu); };
    // Deferred so this doesn't fire on the same click that opened the menu
    setTimeout(()=>document.addEventListener('click', closeThemeMenu), 0);
  }

  // Notification bell (MIS only) — "what's new since I last checked"
  const btnNotifToggle = document.getElementById('btnNotifToggle');
  if(btnNotifToggle) btnNotifToggle.onclick = (e)=>{ e.stopPropagation(); state.notifMenuOpen = !state.notifMenuOpen; render(); };
  document.querySelectorAll('[data-notifcnf]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    state.misFilters.cnfs = [el.dataset.notifcnf];
    state.misScreen = 'stock';
    state.notifMenuOpen = false;
    render();
  });
  const btnClearMisFilters = document.getElementById('btnClearMisFilters');
  if(btnClearMisFilters) btnClearMisFilters.onclick = ()=>{
    state.misFilters = { cnfs:'ALL', category:'ALL', status:'ALL' };
    render();
  };
  const btnNotifMarkRead = document.getElementById('btnNotifMarkRead');
  if(btnNotifMarkRead) btnNotifMarkRead.onclick = (e)=>{
    e.stopPropagation();
    lsSet('misLastSeenAt', Date.now());
    state.notifMenuOpen = false;
    render();
  };
  if(state.notifMenuOpen){
    const closeNotifMenu = ()=>{ state.notifMenuOpen=false; render(); document.removeEventListener('click', closeNotifMenu); };
    setTimeout(()=>document.addEventListener('click', closeNotifMenu), 0);
  }

  // Password show/hide (👁) — every PasswordField() on the page
  document.querySelectorAll('[data-pweye]').forEach(btn=>btn.onclick=()=>{
    const input = document.getElementById(btn.dataset.pweye);
    if(!input) return;
    const revealed = input.type==='text';
    input.type = revealed ? 'password' : 'text';
    btn.classList.toggle('revealed', !revealed);
  });

  // Unified login (User ID + Password -> role determined automatically)
  const btnUnifiedLogin = document.getElementById('btnUnifiedLogin');
  if(btnUnifiedLogin) btnUnifiedLogin.onclick = async ()=>{
    const userId = document.getElementById('loginUserId').value;
    const pw = document.getElementById('loginPw').value;
    const rememberEl = document.getElementById('loginRemember');
    const remember = rememberEl ? rememberEl.checked : false;
    if(!userId || !pw){ showToast('Enter your User ID and Password'); return; }
    startFakeProgress(['Checking your details…','Loading your data…','Almost there…']);
    const ok = await tryLogin(userId, pw, remember);
    finishFakeProgress(ok ? 'Welcome!' : null);
    render();
    if(ok) checkForNewVersion();
  };
  const loginPwEnter = document.getElementById('loginPw');
  if(loginPwEnter) loginPwEnter.onkeydown = (e)=>{ if(e.key==='Enter'){ const btn = document.getElementById('btnUnifiedLogin'); if(btn) btn.click(); } };
  const btnClearCacheLogin = document.getElementById('btnClearCacheLogin');
  if(btnClearCacheLogin) btnClearCacheLogin.onclick = ()=>{
    clearAppCache();
    if(typeof window!=='undefined' && window.location && window.location.reload) window.location.reload();
    else loadAll();
  };

  // Logout — same for every role, always returns to the single login screen
  const btnLogout = document.getElementById('btnCnfLogout');
  if(btnLogout) btnLogout.onclick = ()=>{ doLogout(); render(); };
  const btnAdminLogout = document.getElementById('btnAdminLogout');
  if(btnAdminLogout) btnAdminLogout.onclick = ()=>{ doLogout(); render(); };
  const btnMisLogout = document.getElementById('btnMisLogout');
  if(btnMisLogout) btnMisLogout.onclick = ()=>{ doLogout(); render(); };

  // Sync-failure popup (shown right after a Final Submit that couldn't reach the server)
  const syncFailBg = document.getElementById('syncFailBg');
  if(syncFailBg){
    const btnDismissSyncFail = document.getElementById('btnDismissSyncFail');
    if(btnDismissSyncFail) btnDismissSyncFail.onclick = ()=>{ state.syncFailureInfo=null; render(); };
    const btnRetrySyncNow = document.getElementById('btnRetrySyncNow');
    if(btnRetrySyncNow) btnRetrySyncNow.onclick = async ()=>{
      btnRetrySyncNow.textContent = 'Retrying…'; btnRetrySyncNow.disabled = true;
      const result = await flushPendingQueue();
      state.syncFailureInfo = null;
      render();
      showToast(result && result.stillPending ? `Still ${result.stillPending} unsynced — will keep retrying` : '✓ All submissions synced');
    };
  }
  // Persistent "N unsynced" banner on the dashboard (survives dismissing the popup above)
  const btnRetryPendingDash = document.getElementById('btnRetryPendingDash');
  if(btnRetryPendingDash) btnRetryPendingDash.onclick = async ()=>{
    btnRetryPendingDash.textContent = 'Retrying…'; btnRetryPendingDash.disabled = true;
    const result = await flushPendingQueue();
    render();
    showToast(result && result.stillPending ? `Still ${result.stillPending} unsynced — will keep retrying` : '✓ All submissions synced');
  };

  document.querySelectorAll('[data-cnfnav]').forEach(el=>el.onclick=async ()=>{
    state.cnfScreen=el.dataset.cnfnav; render();
    if(state.cnfScreen==='history'){ await ensureCnfHistory(state.cnfUser.code); render(); }
  });

  // CNF Reports — click any breached/stock row for full detail
  document.querySelectorAll('[data-attn]').forEach(el=>el.onclick=()=>{
    const [code, mfd] = el.dataset.attn.split('|');
    state.cnfLineDetail = {code, mfd};
    render();
  });
  const cnfLineDetailBg = document.getElementById('cnfLineDetailBg');
  if(cnfLineDetailBg){
    cnfLineDetailBg.onclick = (e)=>{ if(e.target===cnfLineDetailBg){ state.cnfLineDetail=null; render(); } };
    const btnCloseCnfLineDetail = document.getElementById('btnCloseCnfLineDetail');
    if(btnCloseCnfLineDetail) btnCloseCnfLineDetail.onclick = ()=>{ state.cnfLineDetail=null; render(); };
  }
  // Export the CNF's own full current-stock report
  const btnExportCnfReport = document.getElementById('btnExportCnfReport');
  if(btnExportCnfReport) btnExportCnfReport.onclick = async ()=>{
    const sub = latestSubmissionFor(state.cnfUser.code);
    if(!sub) return;
    const report = buildDetailedReportRows(sub);
    const wb = await buildXlsxWorkbook({
      title: `${state.cnfUser.name} (${state.cnfUser.code}) — Current Stock Report`,
      subtitle: `Stock date: ${sub.date} · Submission ID: ${sub.id}`,
      headers: report.headers, rows: report.rows, statusColIndex: report.statusColIndex,
    });
    await saveOrDownloadRealXlsx(report.filename, wb);
  };
  const btnChooseFolder = document.getElementById('btnChooseFolder');
  if(btnChooseFolder) btnChooseFolder.onclick = async ()=>{
    try{ const name = await chooseReportFolder(); showToast(`✓ Reports will now save to "${name}"`); render(); }
    catch(e){ showToast((e&&e.message)||'Could not access that folder'); }
  };
  // Export any past submission by date, from History
  document.querySelectorAll('[data-exportsub]').forEach(el=>el.onclick=async ()=>{
    const sub = state.submissions.find(s=>s.id===el.dataset.exportsub && s.cnfCode===state.cnfUser.code);
    if(!sub) return;
    const headers = ['Product Code','Product Name','Category','Entered Qty','UOM','KG','MFD','SAP Qty (kg)','Variance Reason'];
    const rows = sub.items.map(it=>[it.code, it.name, it.category, it.qty, safeUomLabel(it.uom), it.kgQty.toFixed(2), it.mfd||'', it.sapQtyKg??'', it.varianceReason||'']);
    const wb = await buildXlsxWorkbook({
      title: `${state.cnfUser.name} (${state.cnfUser.code}) — Stock Submission`,
      subtitle: `Stock date: ${sub.date} · Submission ID: ${sub.id}`,
      headers, rows,
    });
    await downloadRealXlsx(`${state.cnfUser.code}-stock-${sub.date}`, wb);
  });

  // Submit screen interactions — stock is ALWAYS current/today's physical
  // stock, or yesterday's if catching up a day late; a CNF must never be
  // able to pick a future date, or anything older than yesterday, here.
  const clearForNewDate = ()=>{ state.sapUpload=null; state.draftItems={}; state.varianceReasons={}; state.sapSearch=''; state.submitCat=null; state.sapMissingOnlyFilter=false; };
  const monthPills = document.getElementById('monthPills');
  if(monthPills) monthPills.querySelectorAll('.month-pill').forEach(el=>el.onclick=()=>{
    const mon = Number(el.dataset.mon);
    const d = new Date(state.submitDate); d.setMonth(mon);
    state.submitDate = clampSubmitDate(localDateISO(d));
    state.submitDateManuallySet = true;
    clearForNewDate();
    render();
  });
  const dateSel = document.getElementById('dateSel');
  if(dateSel) dateSel.onchange = ()=>{ state.submitDate = clampSubmitDate(dateSel.value); state.submitDateManuallySet = true; clearForNewDate(); render(); };
  const yearSel = document.getElementById('yearSel');
  if(yearSel) yearSel.onchange = ()=>{ const d=new Date(state.submitDate); d.setFullYear(Number(yearSel.value)); state.submitDate=clampSubmitDate(localDateISO(d)); state.submitDateManuallySet = true; clearForNewDate(); render(); };

  // SAP Current Stock upload gate
  const btnChooseSapFile = document.getElementById('btnChooseSapFile');
  if(btnChooseSapFile) btnChooseSapFile.onclick = ()=>document.getElementById('sapFileInput').click();
  const sapFileInput = document.getElementById('sapFileInput');
  if(sapFileInput) sapFileInput.onchange = async ()=>{
    const file = sapFileInput.files[0];
    if(!file) return;
    state.sapFileLoading = true;
    render();
    try{
      await handleSapUpload(file);
      state.sapFileLoading = false;
      render();
      showToast('SAP Current Stock loaded');
    }catch(e){
      state.sapFileLoading = false;
      render();
      const errEl = document.getElementById('sapUploadErr');
      if(errEl) errEl.textContent = e.message || 'Could not read this file. Make sure it matches the SAP export format.';
    }
  };
  const btnReplaceSap = document.getElementById('btnReplaceSap');
  if(btnReplaceSap) btnReplaceSap.onclick = ()=>{
    state.sapUpload = null; state.draftItems = {}; state.varianceReasons = {};
    saveDraft(state.cnfUser.code, {date: state.submitDate, items:{}, sapUpload:null, varianceReasons:{}});
    render();
  };

  document.querySelectorAll('[data-sapzero]').forEach(el=>el.onclick=()=>{ state.sapShowZero = el.dataset.sapzero==='show'; render(); });

  const btnNextCategory = document.getElementById('btnNextCategory');
  if(btnNextCategory) btnNextCategory.onclick = ()=>{ goToNextCategory(btnNextCategory.dataset.nextcat); };
  document.querySelectorAll('[data-missingfilter]').forEach(el=>el.onclick=()=>{ state.sapMissingOnlyFilter = el.dataset.missingfilter==='on'; render(); });

  const search = document.getElementById('sapSearch');
  if(search){ search.oninput = ()=>{ state.sapSearch = search.value; renderRowsOnly(); }; search.focus(); search.setSelectionRange(search.value.length,search.value.length); }

  bindRowInputs();

  const btnSaveDraft = document.getElementById('btnSaveDraft');
  if(btnSaveDraft) btnSaveDraft.onclick = async ()=>{
    await saveDraft(state.cnfUser.code, {date: state.submitDate, items: state.draftItems, sapUpload: state.sapUpload, varianceReasons: state.varianceReasons});
    showToast('Draft saved');
  };
  const btnFinal = document.getElementById('btnFinalReview');
  if(btnFinal) btnFinal.onclick = async ()=>{
    // Silently pull the freshest Product Master right before the numbers
    // in this submission get locked in — a CNF's session can sit open for
    // days, and without this, a conversion factor Admin fixed after they
    // logged in would never reach them until their next login or manual
    // Sync, meaning today's submission could still compute kg from a
    // stale (possibly wrong) pcToKg/bagToKg without anyone noticing.
    const originalLabel = btnFinal.textContent;
    btnFinal.disabled = true; btnFinal.textContent = 'Checking for updates…';
    try{ await forceSyncMasters(); }catch(e){ /* offline or backend hiccup — proceed with whatever's cached rather than blocking them entirely */ }
    btnFinal.disabled = false; btnFinal.textContent = originalLabel;
    const violations = findOpenBagViolations();
    if(violations.length){
      const names = violations.slice(0,3).map(v=>v.name).join(', ');
      const kind = violations.some(v=>v.uom==='BAG') && violations.some(v=>v.uom==='PC') ? 'Bag opened / PC not whole' : violations[0].uom==='BAG' ? 'Bag opened' : 'PC must be a whole number';
      showToast(`⚠️ ${kind} for ${names}${violations.length>3?` and ${violations.length-3} more`:''} — submit stock in KG instead.`);
      return;
    }
    state.cnfModal = CnfFinalModal();

      // Any submission for a date that isn't literally today requires an
      // explicit, in-the-moment acknowledgment — checked FRESH, right here,
      // at the actual point of submission. This replaces relying on an
      // internal flag for "did they touch the date picker earlier" (which
      // can go stale across a session spanning midnight, or if a stale SAP
      // upload sits open) with a real, unavoidable confirmation exactly
      // when it matters — the moment of submission, not sometime earlier.
      if(state.submitDate !== todayISO()){
        const proceed = confirm(`⚠ You are submitting stock dated ${state.submitDate} — today is ${todayISO()}.\n\nOnly confirm this if you are deliberately submitting yesterday's closing stock.\n\nOK = Yes, submit for ${state.submitDate}\nCancel = No, switch to today (${todayISO()}) instead`);

          state.cnfModal = null;
          clearForNewDate();
          state.submitDate = todayISO();
          state.submitDateManuallySet = false;
          showToast(`Reset to today (${todayISO()}) — please re-upload the SAP Current Stock file.`);
          render();
          return;
        }
      }
      const unresolved = state.sapUpload ? state.sapUpload.rows.filter(r=>hasUnresolvedVariance(r.code)) : [];
      if(unresolved.length){ showToast(`${unresolved.length} item(s) still need a difference reason`); return; }
      const missing = missingRequiredCodes();
      if(missing.length){ showToast(`${missing.length} item(s) with SAP stock still need entry`); return; }
      const items = buildSubmissionItems();
      const distinctCodes = new Set(items.map(i=>i.code));
      const zeroCodes = [...distinctCodes].filter(code => items.filter(i=>i.code===code).reduce((s,i)=>s+i.qty,0)===0);
      const sub = {
        id: 'SUB'+Math.random().toString(36).slice(2,9).toUpperCase(),
        cnfCode: state.cnfUser.code, cnfName: state.cnfUser.name,
        date: state.submitDate, timestamp: new Date().toISOString(),
        items, productsUpdated: distinctCodes.size,
        productsZero: zeroCodes.length,
        submittedBy: state.cnfUser.userId, status:'Final',
        sapFileName: state.sapUpload ? state.sapUpload.fileName : '',
        sapUploadedAt: state.sapUpload ? state.sapUpload.uploadedAt : ''
      };
      // Optimistic: the CNF's screen updates INSTANTLY on-device — it never
      // waits on a network round-trip. Sync to the backend happens after,
      // in the background, so a slow/busy server (e.g. 26 CNFs submitting
      // at once) never makes the app feel stuck. BUT a failed sync is never
      // allowed to fail silently — see the .then() below.
      state.submissions.unshift(sub);
      state.draftItems = {}; state.sapUpload = null; state.varianceReasons = {};

      const backendOn = !!getApiUrl();
      showToast(backendOn ? 'Stock submitted — syncing…' : 'Stock submitted successfully (local demo mode)');
      if(backendOn){

function ensureBatch(code, idx){
  const p = state.masters.products.find(pp=>pp.code===code);
  if(!state.draftItems[code] || !state.draftItems[code].length){
    state.draftItems[code] = [{qty:'', uom:p.defaultUOM, mfd:''}];
  }
  while(state.draftItems[code].length <= idx){
    state.draftItems[code].push({qty:'', uom:p.defaultUOM, mfd:''});
  }
  return state.draftItems[code][idx];
}

// Debounced auto-save — every quantity, MFD, or UOM change now persists to
// this device automatically, not just on an explicit "Save Draft" click.
// This is the actual fix for a real risk: entered data only ever lived in
// memory until someone remembered to tap Save Draft — a crashed tab, an
// accidental back-navigation, or a phone that killed the browser to save
// memory would silently lose everything typed since the last manual save.
// Debounced (not on every keystroke) so rapid typing doesn't hammer
// localStorage; 800ms after the last change is plenty fast to survive
// anything short of the exact instant of a crash.
let __autoSaveDraftTimer = null;
function autoSaveDraft(){
  if(!state.cnfUser) return;
  if(__autoSaveDraftTimer) clearTimeout(__autoSaveDraftTimer);
  __autoSaveDraftTimer = setTimeout(()=>{
    saveDraft(state.cnfUser.code, {date: state.submitDate, items: state.draftItems, sapUpload: state.sapUpload, varianceReasons: state.varianceReasons});
  }, 800);
}

// Once every SAP line in the active category that needs entry has a
// A CNF taps "Next Category" only when THEY decide this category is truly
// done — never automatically. A single filled batch does not mean a
// product is finished: many products arrive as several dated lots
// (multiple MFD batches), and jumping away the moment the first batch got
// a quantity would skip the rest before they'd had a chance to add them.
// This function is only ever called from that manual button click, and
// always goes to the specific category shown on the button — no
// recomputation that could disagree with what was actually on screen.
function goToNextCategory(targetCat){
  if(!targetCat) return;
  state.submitCat = targetCat;
  state.sapMissingOnlyFilter = false;
  state.categoryJustAdvanced = targetCat;
  render();
  setTimeout(()=>{ state.categoryJustAdvanced = null; render(); }, 900);
}

function bindRowInputs(){
  document.querySelectorAll('[data-qtycode]').forEach(inp=>inp.oninput=()=>{
    const code = inp.dataset.qtycode, idx = Number(inp.dataset.batch);
    const b = ensureBatch(code, idx);
    b.qty = inp.value;
    updateRowMeta(code);
    updateUomWarning(code, idx, b.uom || (state.masters.products.find(p=>p.code===code)||{}).defaultUOM);
    autoSaveDraft();
  });
  document.querySelectorAll('[data-uomcode]').forEach(sel=>sel.onchange=()=>{
    const code = sel.dataset.uomcode, idx = Number(sel.dataset.batch);
    const b = ensureBatch(code, idx);
    b.uom = sel.value;
    updateRowMeta(code);
    updateUomWarning(code, idx, sel.value);
    autoSaveDraft();
  });
  // MFD as a typed text field — fast entry with flexible formats
  // ("1-8-26", "01.08.2026", "1,8.26", "010826"), but never silently
  // accepts a guess it isn't sure about (see parseFlexibleDate). An
  // invalid/ambiguous entry shows a clear inline error and leaves the
  // stored MFD blank rather than risk a wrong date corrupting ageing
  // calculations downstream.
  document.querySelectorAll('[data-mfdcode]').forEach(inp=>inp.onblur=()=>{
    const code = inp.dataset.mfdcode, idx = Number(inp.dataset.batch);
    const errEl = document.querySelector(`[data-mfderror="${code}:${idx}"]`);
    const raw = inp.value.trim();
    const b = ensureBatch(code, idx);
    if(!raw){
      b.mfd = '';
      inp.classList.remove('mfd-error-state');
      if(errEl){ errEl.style.display='none'; errEl.textContent=''; }
      autoSaveDraft();
      return;
    }
    const parsed = parseFlexibleDate(raw);
    if(parsed){
      b.mfd = parsed;
      inp.value = ddmmyyyy(parsed);
      inp.classList.remove('mfd-error-state');
      if(errEl){ errEl.style.display='none'; errEl.textContent=''; }
      const picker = document.querySelector(`[data-mfdpicker="${code}:${idx}"]`);
      if(picker) picker.value = parsed;
      autoSaveDraft();
    } else {
      b.mfd = ''; // never keep a half-guessed date silently — force a clear correction
      inp.classList.add('mfd-error-state');
      if(errEl){ errEl.style.display='block'; errEl.textContent = `⚠ "${raw}" not understood — try DD-MM-YYYY (e.g. 01-08-2026), or tap 📅.`; }
    }
  });
  document.querySelectorAll('[data-mfdcal]').forEach(btn=>btn.onclick=()=>{
    const [code, idxStr] = btn.dataset.mfdcal.split(':');
    const picker = document.querySelector(`[data-mfdpicker="${code}:${idxStr}"]`);
    if(picker && picker.showPicker) { try{ picker.showPicker(); }catch(e){ picker.focus(); picker.click(); } }
    else if(picker){ picker.focus(); picker.click(); }
  });
  document.querySelectorAll('[data-mfdpicker]').forEach(picker=>picker.onchange=()=>{
    const [code, idxStr] = picker.dataset.mfdpicker.split(':');
    const idx = Number(idxStr);
    const b = ensureBatch(code, idx);
    b.mfd = picker.value;
    const textInp = document.querySelector(`[data-mfdcode="${code}"][data-batch="${idx}"]`);
    if(textInp){ textInp.value = ddmmyyyy(picker.value); textInp.classList.remove('mfd-error-state'); }
    const errEl = document.querySelector(`[data-mfderror="${code}:${idx}"]`);
    if(errEl){ errEl.style.display='none'; errEl.textContent=''; }
    autoSaveDraft();
  });
  document.querySelectorAll('[data-addbatch]').forEach(btn=>btn.onclick=()=>{
    const code = btn.dataset.addbatch;
    const p = state.masters.products.find(pp=>pp.code===code);
    if(!state.draftItems[code] || !state.draftItems[code].length){
      state.draftItems[code] = [{qty:'', uom:p.defaultUOM, mfd:''}];
    }
    state.draftItems[code].push({qty:'', uom:p.defaultUOM, mfd:''});
    rerenderOneRow(code);
    autoSaveDraft();
  });
  document.querySelectorAll('[data-removebatch]').forEach(btn=>btn.onclick=()=>{
    const [code, idxStr] = btn.dataset.removebatch.split(':');
    const idx = Number(idxStr);
    if(state.draftItems[code] && state.draftItems[code].length>1){
      state.draftItems[code].splice(idx,1);
      rerenderOneRow(code);
      autoSaveDraft();
    }
  });
  // "Same date for all N" — for a product with many MFD batches (e.g. 50kg+
  // stock split across a dozen dated lots), typing the identical date into
  // every single batch one at a time was the actual reported time sink.
  // One tap fills every batch with batch #1's date; anything genuinely
  // different just gets corrected on that one row afterward, instead of
  // typed from scratch N times.
  document.querySelectorAll('[data-copymfd]').forEach(btn=>btn.onclick=()=>{
    const code = btn.dataset.copymfd;
    const batches = state.draftItems[code];
    if(!batches || !batches.length) return;
    const firstMfd = batches[0].mfd;
    if(!firstMfd){ showToast('Enter the first MFD date, then tap this to copy it to the rest.'); return; }
    batches.forEach(b=>{ b.mfd = firstMfd; });
    rerenderOneRow(code);
    autoSaveDraft();
    showToast(`Copied ${firstMfd} to all ${batches.length} batches — adjust any that are actually different.`);
  });
  document.querySelectorAll('[data-reasoncode]').forEach(inp=>inp.oninput=()=>{
    state.varianceReasons[inp.dataset.reasoncode] = inp.value;
    autoSaveDraft();
  });
  wireKeyboardFlow();
}

// Enter-to-advance so a CNF entering 50+ batches never has to reach for
// the mouse: MFD -> Enter -> lands in that same batch's Quantity ->
// Enter -> jumps straight to the NEXT batch's MFD (which may be the next
// batch of the same product, or the first batch of the next product —
// whichever comes next on screen). UOM is skipped in this chain since it's
// almost always left at the product default; it's still reachable with a
// normal Tab press for the rare case it needs changing. If the date just
// typed didn't parse, focus deliberately stays put so the error (shown by
// the blur handler) doesn't get jumped past unnoticed.
function wireKeyboardFlow(){
  const mfdInputs = Array.from(document.querySelectorAll('.mfd-text'));
  const qtyInputs = Array.from(document.querySelectorAll('.qty'));
  mfdInputs.forEach((inp,i)=>{
    inp.onkeydown = (e)=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      inp.blur(); // runs the existing parse/validate/normalize logic synchronously
      if(!inp.classList.contains('mfd-error-state') && qtyInputs[i]){
        qtyInputs[i].focus();
        qtyInputs[i].select();
      }
    };
  });
  qtyInputs.forEach((inp,i)=>{
    inp.onkeydown = (e)=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const next = mfdInputs[i+1];
      if(next){ next.focus(); next.select(); }
      else { inp.blur(); } // last field on the page — nothing further to jump to
    };
  });
}

function rerenderOneRow(code){
  const row = document.querySelector(`[data-prow="${code}"]`);
  if(!row) return;
  const sapRow = state.sapUpload && state.sapUpload.rows.find(r=>r.code===code);
  row.outerHTML = sapRow ? SapProductRow(sapRow) : '';
  bindRowInputs();
  updateProgress();
}

// PC/Bag-opened check lives here alongside the missing-conversion-factor
// check since both are "something about this UOM choice needs the CNF's
// attention" — PC and BAG are both physical, whole-number units (a
// piece or a sealed bag either exists or it doesn't), so a non-whole
// count in either means the actual stock is loose/opened and should be
// counted in KG instead. This both warns inline and (via the CSS class)
// marks the field as blocking so Final Submit can refuse to go through
// with it still set.
function updateUomWarning(code, idx, uom){
  const p = state.masters.products.find(pp=>pp.code===code);
  const warnEl = document.querySelector(`[data-uomwarn="${code}:${idx}"]`);
  if(!warnEl || !p) return;
  const batch = (state.draftItems[code]||[])[idx];
  const qty = batch && batch.qty!==undefined && batch.qty!=='' ? Number(batch.qty) : null;
  const notWhole = (uom==='BAG' || uom==='PC') && qty!==null && !isNaN(qty) && Math.abs(qty - Math.round(qty)) > 0.001;
  const noConversion = (uom==='BAG' && !p.bagToKg) || (uom==='PC' && !p.pcToKg);
  if(notWhole){
    warnEl.style.display = '';
    warnEl.classList.add('uom-warn-blocking');
    warnEl.innerHTML = uom==='BAG' ? `⚠️ Bag opened. Submit stock in KG or PC.` : `⚠️ PC must be a whole number. Submit stock in KG instead.`;
  } else if(noConversion){
    warnEl.style.display = '';
    warnEl.classList.remove('uom-warn-blocking');
    warnEl.innerHTML = `⚠ No ${uom} size set for this product yet — Admin can add it in Product Master or via UOM Converter import. Until then, this ${uom} quantity is <b>not converted</b>, it's used as-is.`;
  } else {
    warnEl.style.display = 'none';
    warnEl.classList.remove('uom-warn-blocking');
    warnEl.innerHTML = '';
  }
}
// Whole-catalog version of the same check — used right before Final
// Submit so a partial bag or a fractional piece can never slip through
// just because nobody happened to re-trigger the inline warning for that
// one row.
function findOpenBagViolations(){
  const violations = [];
  Object.keys(state.draftItems).forEach(code=>{
    (state.draftItems[code]||[]).forEach((b,idx)=>{
      if((b.uom==='BAG' || b.uom==='PC') && b.qty!==undefined && b.qty!==''){
        const qty = Number(b.qty);
        if(!isNaN(qty) && Math.abs(qty - Math.round(qty)) > 0.001){
          const p = state.masters.products.find(pp=>pp.code===code);
          violations.push({code, idx, name: p?p.name:code, qty, uom: b.uom});
        }
      }
    });
  });
  return violations;
}

function updateProgress(){
  const prog = document.querySelector('.sticky-submit .prog');
  if(!prog || !state.sapUpload) return;
  const unresolved = state.sapUpload.rows.filter(r=>hasUnresolvedVariance(r.code)).length;
  const requiredTotal = state.sapUpload.rows.filter(r=>r.currentStockKg>0).length;
  const requiredDone = requiredTotal - missingRequiredCodes().length;
  prog.textContent = `${requiredDone}/${requiredTotal} required entered${unresolved?` · ${unresolved} unresolved`:''}`;
}

// Updates only the meta line + reason-field visibility for a row, WITHOUT
// touching the batch inputs themselves — full re-render would drop input
// focus mid-keystroke while the CNF is still typing a quantity.
function updateRowMeta(code){
  const row = document.querySelector(`[data-prow="${code}"]`);
  if(!row || !state.sapUpload) return;
  const sapRow = state.sapUpload.rows.find(r=>r.code===code);
  if(!sapRow) return;
  const p = state.masters.products.find(pp=>pp.code===code);
  const batches = state.draftItems[code] || [];
  const filledBatches = batches.filter(b=>b.qty!==undefined && b.qty!=='');
  const filled = filledBatches.length>0;
  const totalKg = filledBatches.reduce((s,b)=>s+convertToKg(p,b.qty,b.uom||p.defaultUOM),0);
  const diff = filled ? roundedDiffKg(totalKg, sapRow.currentStockKg) : null;
  const needsReason = filled && diff!==null && !withinTolerance(diff);
  const reasonFilled = state.varianceReasons[code] && state.varianceReasons[code].trim();

  row.classList.toggle('filled', !!filled);
  row.classList.toggle('needs-reason', needsReason && !reasonFilled);

  const meta = row.querySelector('.pmeta');
  if(meta){
    meta.innerHTML = `${p.code} · SAP Current Stock <b>${sapRow.currentStockKg.toFixed(1)}kg</b>${formatUomEquivalents(sapRow.currentStockKg, p)}${filled?` · Entered <b>${totalKg.toFixed(1)}kg</b>${formatUomEquivalents(totalKg, p)}`:''}
      ${filled ? (withinTolerance(diff) ? ' · <span class="badge ok">Matches SAP</span>' : ` · <span class="badge low">Δ ${diff>0?'+':''}${diff.toFixed(1)}kg vs SAP</span>`) : ''}`;
  }

  let reasonRow = row.querySelector('.reason-row');
  if(filled && !reasonRow){
    const div = document.createElement('div');
    div.className = needsReason ? 'reason-row' : 'reason-row reason-row-optional';
    div.innerHTML = `<label>${needsReason?'Reason for difference (required)':'Note (optional)'}</label><input type="text" data-reasoncode="${code}" placeholder="${needsReason?'e.g. Damage, unrecorded dispatch, counting error…':'Matches SAP — add a note if you want to record anything'}" value="${state.varianceReasons[code]||''}">`;
    row.appendChild(div);
    div.querySelector('input').oninput = (e)=>{ state.varianceReasons[code] = e.target.value; autoSaveDraft(); };
  } else if(filled && reasonRow){
    // matched/mismatched can flip live as someone edits quantity — keep the
    // label and required/optional styling in sync without losing whatever
    // they've already typed into the note.
    reasonRow.className = needsReason ? 'reason-row' : 'reason-row reason-row-optional';
    const label = reasonRow.querySelector('label');
    const input = reasonRow.querySelector('input');
    if(label) label.textContent = needsReason ? 'Reason for difference (required)' : 'Note (optional)';
    if(input) input.placeholder = needsReason ? 'e.g. Damage, unrecorded dispatch, counting error…' : 'Matches SAP — add a note if you want to record anything';
  } else if(!filled && reasonRow){
    reasonRow.remove();
  }
  updateProgress();
}

function renderRowsOnly(){
  const wrap = document.getElementById('prodRows');
  if(!wrap || !state.sapUpload) return;
  const missing = missingRequiredCodes();
  let baseRows;
  if(state.sapMissingOnlyFilter){
    baseRows = state.sapUpload.rows.filter(r=>missing.includes(r.code));
  } else {
    const catGroups = sapCategoryGroups();
    const activeGroup = catGroups.find(g=>g.cat===state.submitCat);
    baseRows = activeGroup ? activeGroup.rows : [];
  }
  let rows = state.sapMissingOnlyFilter ? baseRows : baseRows.filter(r => state.sapShowZero || r.currentStockKg > 0);
  if(state.sapSearch) rows = rows.filter(r => r.name.toLowerCase().includes(state.sapSearch.toLowerCase()) || r.code.toLowerCase().includes(state.sapSearch.toLowerCase()));
  wrap.innerHTML = rows.map(r=>SapProductRow(r)).join('') || '<div class="empty"><div class="big">No items</div>Try another search term, or enable "Show all".</div>';
  bindRowInputs();
}

setTheme(getTheme());
// A CNF opening this on a slow mobile connection could otherwise stare at
// a genuinely blank white page for however long the first network fetch
// takes — nothing was ever rendered before that fetch resolved. This
// paints the "Loading stock system…" state immediately, synchronously,
// before any async work starts, so there's always something on screen
// within milliseconds — worst case a loading message, never true blankness.
render();
loadAll();
</script>
