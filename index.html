function seedSubmissions(masters){
  // Build a couple of historical + current submissions so MIS/Admin have data to show.
  const out = [];
  const mk = (cnf, daysAgoSubmitted, ageProfile) => {
    const submDate = new Date(Date.now() - daysAgoSubmitted*86400000);
    const items = [];
    masters.products.forEach((p,idx)=>{
      const totalQty = Math.round(20 + Math.random()*180);
      const uom = 'KG';
      // Demo: every 6th product on this CNF's stock arrived across several
      // production runs, so it's held as multiple MFD batches, not one line.
      const batchCount = (idx % 6 === 0) ? (2 + (idx % 3)) : 1;
      let remaining = totalQty;
      for(let b=0; b<batchCount; b++){
        const isLast = b===batchCount-1;
        const qty = isLast ? remaining : Math.max(1, Math.round(totalQty/batchCount));
        remaining -= qty;
        const ageDays = ageProfile==='fresh' ? Math.round(Math.random()*15)
                       : ageProfile==='mixed' ? Math.round(Math.random()* (idx%5===0?200:60)) + b*20
                       : Math.round(40+Math.random()*250) + b*15;
        const mfd = new Date(submDate.getTime() - ageDays*86400000).toISOString().slice(0,10);
        items.push({code:p.code,name:p.name,category:p.category,qty,uom,kgQty:qty,mfd});
      }
    });
    return {
      id: 'SUB'+Math.random().toString(36).slice(2,9).toUpperCase(),
      cnfCode: cnf.code, cnfName: cnf.name,
      date: localDateISO(submDate),
      timestamp: submDate.toISOString(),
      items,
      productsUpdated: new Set(items.map(i=>i.code)).size,
      productsZero: 0,
      submittedBy: cnf.userId,
      status:'Final'
    };
  };
  out.push(mk(masters.cnfs[0], 0, 'mixed'));
  out.push(mk(masters.cnfs[0], 6, 'mixed'));
  out.push(mk(masters.cnfs[1], 1, 'fresh'));
  out.push(mk(masters.cnfs[2], 2, 'old'));
  out.push(mk(masters.cnfs[3], 0, 'mixed'));
  return out;
}

/* ---------------- Storage layer ----------------
   Three tiers, in priority order:
   1. Real backend (Google Apps Script Web App) if configured — this is
      what makes the app actually multi-device: CNF phones, Admin, and
      MIS desktops all read/write the same Google Sheet.
   2. localStorage — used as an offline cache + pending-submission queue
      even when a backend IS configured, and as the full store when it
      is NOT (single-device local/demo mode).
   3. window.storage — kept only so this file still behaves inside a
      Claude.ai chat preview; irrelevant once actually deployed.
*/
const LS_PREFIX = 'gsi:';
function lsGet(key){ try{ const v = localStorage.getItem(LS_PREFIX+key); return v===null?null:JSON.parse(v); }catch(e){ return null; } }
function lsSet(key, value){ try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); }catch(e){} }

// Bump this string every time an updated file is deployed. checkForNewVersion()
// below fetches this SAME page fresh (bypassing cache) and compares — if the
// deployed copy's version differs from what's currently running in this tab,
// people get a "a newer version is available" prompt instead of silently
// staying on stale code until they happen to hard-refresh. This works no
// matter where the file is hosted (GitHub Pages, S3, etc.) since it reads
// its own URL rather than a hardcoded host.
const APP_VERSION = '2026-08-21.13';

// Called right after login for every role — "sync" for DATA (masters/
// submissions) already happens automatically on login via forceSyncMasters();
// this is the equivalent for CODE — catching a newer deployed version of the
// app itself, which a data sync can never do (a running page can't rewrite
// its own already-loaded JavaScript).
async function checkForNewVersion(){
  try{
    const res = await fetch(window.location.href, {cache:'no-store'});
    const text = await res.text();
    const match = text.match(/const APP_VERSION = '([^']+)'/);
    if(match && match[1] && match[1] !== APP_VERSION){
      state.newVersionAvailable = true;
      render();
    }
  }catch(e){ /* not critical — worst case they see it on the next normal check */ }
}

// Baked-in default so EVERY device that opens this hosted file connects to
// the live backend automatically — no per-device manual setup. A CNF's
// phone opening this link for the first time is already live; nobody has
// to visit Admin on that specific device first. Admin can still override
// per-device via API Connection if ever needed (e.g. pointing a test device
// at a different backend); "Disconnect" is remembered explicitly so it
// doesn't just snap back to this default.
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbzu5mehQ-8pPVTHUv-sLig90Sl6Q0A9tlCuQU6u0Bb24_EJaZfBLpwzyKRheToproAIhg/exec';
function getApiUrl(){
  try{
    if(localStorage.getItem(LS_PREFIX+'apiDisconnected')==='1') return '';
    return localStorage.getItem(LS_PREFIX+'apiUrl') || DEFAULT_API_URL || '';
  }catch(e){ return DEFAULT_API_URL || ''; }
}
function setApiUrl(url){
  try{
    if(url){ localStorage.setItem(LS_PREFIX+'apiUrl', url); localStorage.removeItem(LS_PREFIX+'apiDisconnected'); }
    else { localStorage.setItem(LS_PREFIX+'apiDisconnected', '1'); localStorage.removeItem(LS_PREFIX+'apiUrl'); }
  }catch(e){}
}

// Fails fast instead of hanging the UI if the backend is slow/congested —
// with 26 CNFs potentially hitting it at once, a request should either
// succeed quickly or drop into the offline retry queue, never spin forever.
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('Request timed out')), ms))
  ]);
}
async function apiGet(action, params){
  const apiUrl = getApiUrl();
  if(!apiUrl) return null;
  const qs = new URLSearchParams(Object.assign({action}, params||{})).toString();
  const res = await withTimeout(fetch(apiUrl + (apiUrl.indexOf('?')>-1?'&':'?') + qs), 20000);
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}
async function apiPost(action, payload){
  const apiUrl = getApiUrl();
  if(!apiUrl) throw new Error('No backend configured');
  const res = await withTimeout(fetch(apiUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight against Apps Script
    body: JSON.stringify(Object.assign({action}, payload||{}))
  }), 20000);
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

// Master data is treated as a STATIC, locally-cached set for speed — a CNF
// opening their dashboard should never wait on a network round-trip just to
// see it. The very first login on a device (or after the cache is cleared)
// does one real fetch; every load after that renders instantly from the
// local copy, and only refreshes from the server in the background, at
// most once every MASTER_SYNC_INTERVAL — not on every single open. New
// products from a SAP upload are still pushed live immediately (that's a
// separate, targeted sync) — this only throttles the general "pull
// everything again" refresh.
const MASTER_SYNC_INTERVAL_MS = 6 * 60 * 60 * 1000; // 6 hours

async function loadAll(){
  const apiUrl = getApiUrl();
  state.backendConnected = !!apiUrl;
  state.backendError = null;

  const cachedMasters = lsGet('masters');
  if(cachedMasters){
    // FAST PATH — the cached copy is already good enough to work from, so
    // the only real wait left is restoring who's logged in (which itself
    // does a live sync) — animate that instead of a static "Loading…".
    state.masters = normalizeMasters(cachedMasters);
    state.submissions = normalizeSubmissionList(lsGet('submissions') || []);
    state.loaded = true;
    startFakeProgress(['Restoring your session…','Syncing latest stock…','Loading dashboard…']);
    await tryRestoreSession();
    finishFakeProgress('Ready');
    render();
    flushPendingQueue();
    if(apiUrl) maybeBackgroundSyncMasters(); // silent, throttled, never blocks the UI
    if(state.role) checkForNewVersion(); // fire-and-forget — "sync" for the app's own code, not just its data
    return;
  }

  // COLD START — nothing cached yet on this device, so a real fetch is
  // unavoidable exactly once.
  startFakeProgress(['Connecting to Google Sheet…','Loading CNF list…','Loading product catalog…','Almost ready…']);
  if(apiUrl){
    try{
      const boot = await apiGet('bootstrap');
      state.masters = normalizeMasters(boot.masters);
      state.submissions = normalizeSubmissionList(boot.latestSubmissions || []);
      lsSet('masters', state.masters);
      lsSet('submissions', state.submissions);
      lsSet('masterSyncedAt', Date.now());
    }catch(e){
      // A URL being configured is NOT the same as the fetch having actually
      // succeeded — this was a real, misleading bug: on failure, this used
      // to silently fall back to fake demo data (3 seed CNFs) while the
      // header kept claiming "● LIVE — synced to your Google Sheet", because
      // backendConnected was only ever set from "is a URL present", never
      // from "did the last real fetch work." Someone could stare at a
      // "LIVE" label backed entirely by demo data with no way to tell.
      state.backendConnected = false;
      state.backendError = String((e&&e.message)||e);
      state.masters = normalizeMasters((await legacyWindowStorageMasters()) || seedMasters());
      state.submissions = [];
    }
  } else {
    state.masters = normalizeMasters((await legacyWindowStorageMasters()) || seedMasters());
    state.submissions = seedSubmissions(state.masters);
    lsSet('masters', state.masters);
    lsSet('submissions', state.submissions);
  }
  await tryRestoreSession();
  state.loaded = true;
  finishFakeProgress('Ready');
  render();
  flushPendingQueue();
  if(state.role) checkForNewVersion();
}

// Refreshes the cached master data in the background, at most once per
// MASTER_SYNC_INTERVAL_MS, and never interrupts a CNF mid-submission —
// if they've already started filling in stock, the refresh still fetches
// (to keep the cache warm) but holds off re-rendering until they're back
// on the dashboard, so nothing shifts under their fingers while typing.
async function maybeBackgroundSyncMasters(){
  const lastSync = Number(lsGet('masterSyncedAt')) || 0;
  if(Date.now() - lastSync < MASTER_SYNC_INTERVAL_MS) return;
  try{
    const boot = await apiGet('bootstrap');
    state.masters = normalizeMasters(boot.masters);
    lsSet('masters', state.masters);
    lsSet('masterSyncedAt', Date.now());
    const midSubmission = state.cnfUser && Object.keys(state.draftItems||{}).length>0;
    if(!midSubmission) render();
  }catch(e){ /* silent — keep using the cached copy, try again next throttle window */ }
}

// Manual "get me the truth right now" — pulls BOTH masters AND every
// CNF's latest submission fresh from the server, regardless of the
// throttle window. This is what was missing: Admin's old "Sync Now" only
// refreshed masters (CNFs/products), never submissions — so a CNF's brand
// new stock submission could sync to the server just fine and still never
// show up in MIS, because MIS's cached "latest submissions" pool was never
// told to refresh. MIS calls this on login and via its own Refresh button.
//
// IMPORTANT: this merges with whatever's already known locally rather than
// blindly replacing it. A server response that's momentarily behind (lag,
// read timing, or a sync that's still in flight) must never make a
// just-submitted, already-visible-on-screen submission disappear — that's
// strictly worse than just leaving it stale for a few seconds.
async function forceSyncMasters(){
  if(!getApiUrl()) return;
  const boot = await apiGet('bootstrap');
  state.masters = normalizeMasters(boot.masters);
  const serverList = normalizeSubmissionList(boot.latestSubmissions || []);
  const serverIds = new Set(serverList.map(s=>s.id));
  const localOnly = state.submissions.filter(s=>!serverIds.has(s.id));
  state.submissions = serverList.concat(localOnly);
  lsSet('masters', state.masters);
  lsSet('submissions', state.submissions);
  lsSet('masterSyncedAt', Date.now());
}

// Only relevant when previewed inside a Claude.ai chat that has window.storage wired up.
async function legacyWindowStorageMasters(){
  try{
    if(!(window.storage && window.storage.get)) return null;
    const m = await window.storage.get('gcpl-cnf:masters', true);
    return m ? JSON.parse(m.value) : null;
  }catch(e){ return null; }
}

async function saveMasters(){
  lsSet('masters', state.masters);
  lsSet('masterSyncedAt', Date.now());
  if(getApiUrl()){
    try{ await apiPost('saveMasters', {masters: state.masters}); }
    catch(e){ showToast('⚠ Could not sync to server — saved on this device only'); }
  }
}

// Called right after a CNF's Final Submit. Optimistically already in
// state.submissions; this pushes it to the backend, or queues it for
// automatic retry if the device is offline right now. Returns a result
// so the caller can decide whether silence is OK (it's usually fine, in
// the background) or whether the person needs to actually be told.
async function syncSubmission(sub){
  lsSet('submissions', state.submissions);
  if(!getApiUrl()) return {ok:false, offline:true, error:'No backend connected — running in Local Demo Mode.'};
  try{
    const result = await apiPost('addSubmission', {submission: sub});
    if(!result || result.ok!==true) throw new Error('Server responded but did not confirm the save — response: '+JSON.stringify(result));
    return {ok:true};
  }catch(e){
    const queue = lsGet('pendingSubmissions') || [];
    if(!queue.some(q=>q.id===sub.id)) queue.push(sub);
    lsSet('pendingSubmissions', queue);
    return {ok:false, offline:false, error: (e && e.message) || String(e)};
  }
}

// Downloads a CSV backup of one submission — used the moment a sync to the
// server fails, so the CNF has physical, human-readable proof of exactly
// what they submitted even if the network/backend is the problem, not them.
function downloadSubmissionBackup(sub){
  const headers = ['Submission ID','CNF Code','CNF Name','Stock Date','Timestamp','Product Code','Product Name','Category','Entered Qty','UOM','KG','MFD','SAP Qty (kg)','Variance Reason','Submitted By'];
  const rows = sub.items.map(it=>[sub.id, sub.cnfCode, sub.cnfName, sub.date, sub.timestamp, it.code, it.name, it.category, it.qty, it.uom, it.kgQty.toFixed(2), it.mfd||'', it.sapQtyKg??'', it.varianceReason||'', sub.submittedBy]);
  exportGenericCsv(`UNSYNCED-${sub.id}-${sub.date}.csv`, headers, rows);
}

// Shared across every CNF/MIS export: does this line's ageing status mean
// a fresh order should be placed? Matches the same bucket MIS Overview
// already highlights as "Ageing / Critical Lines" — Ageing, Critical, Near
// Expiry, and Expired all mean "don't wait, reorder."
const REORDER_STATUSES = ['ageing','critical','expiring','expired'];
function reorderSuggested(cls){ return REORDER_STATUSES.includes(cls) ? 'Yes' : 'No'; }

// The full, detailed per-line report for one submission — every product,
// its ageing status, self-life, remaining shelf life, and safety-stock
// standing. Used both for the auto-download right after every Final Submit
// and for the manual "Export" buttons on CNF Reports/History.
// A UOM value that isn't one of the three real units means it came from
// data corrupted somewhere upstream (an old product with a defaultUOM
// that ended up holding a raw number instead of "KG"/"PC"/"BAG", which
// then got copied into an actual submission when a batch's own uom was
// never explicitly changed from that default). Reports should never
// silently print that raw garbage value — showing it plainly as
// unrecognised is safer than passing through a number a reader could
// mistake for something meaningful.
function safeUomLabel(uom){
  return ['KG','PC','BAG'].includes(uom) ? uom : `${uom} (unrecognised — check Product Master)`;
}
function buildDetailedReportRows(sub){
  const headers = ['Product Code','Product Name','Category','Entered Qty','UOM','KG','1 Bag = KG (fixed)','BAG Equiv','1 PC = KG (fixed)','PC Equiv','MFD','Age (d)','Self-Life (d)','Remaining (d)','Status','Reorder Suggested','Safety Norm (kg)','Safety Status','SAP Qty (kg)','Approved Order','Pending Order','Variance Reason'];
  const rows = sub.items.map(it=>{
    const p = state.masters.products.find(pp=>pp.code===it.code);
    const st = p ? ageingStatus(p, it.mfd) : {age:'',life:'',remaining:'',label:'',cls:''};
    const bagEquiv = p && p.bagToKg ? bagEquivDisplay(it.kgQty, p) : '';
    const pcEquiv = p && p.pcToKg ? pcEquivDisplay(it.kgQty, p) : '';
    return [it.code, it.name, it.category, it.qty, safeUomLabel(it.uom), it.kgQty.toFixed(2), p&&p.bagToKg?p.bagToKg:'', bagEquiv, p&&p.pcToKg?p.pcToKg:'', pcEquiv, it.mfd||'', st.age??'', st.life??'', st.remaining??'', st.label||'', reorderSuggested(st.cls), p?p.safetyStockKg:'', (p&&it.kgQty<p.safetyStockKg)?'Below':'OK', it.sapQtyKg??'', it.approvedOrder??'', it.pendingOrder??'', it.varianceReason||''];
  });
  return {headers, rows, statusColIndex: headers.indexOf('Status'), filename: `${sub.cnfCode}-detailed-report-${sub.date}.csv`};
}

/* ---------------- Optional: save reports directly to a chosen folder ----------------
   Browsers do NOT allow a website to silently write to an arbitrary folder
   on your computer — that's a security boundary, not a limitation of this
   app. What IS possible (Chrome/Edge on desktop only, not phones, not
   Firefox/Safari): you pick a folder ONCE via a native picker, the browser
   grants this tab permission to write into it, and every report after that
   saves straight there with no download prompt — until the tab is closed
   (the permission doesn't survive a reload; you'd pick again next session).
   On any device where this isn't supported, downloads fall back to the
   normal browser Downloads folder automatically — nothing breaks. */
let reportFolderHandle = null;
function folderSaveSupported(){ return typeof window!=='undefined' && !!window.showDirectoryPicker; }
async function chooseReportFolder(){
  if(!folderSaveSupported()) throw new Error('Your browser doesn\'t support saving directly to a folder (this needs desktop Chrome or Edge). Reports will download to your normal Downloads folder instead.');
  reportFolderHandle = await window.showDirectoryPicker({mode:'readwrite'});
  return reportFolderHandle.name;
}
async function writeCsvToChosenFolder(filename, csvText){
  const fileHandle = await reportFolderHandle.getFileHandle(filename, {create:true});
  const writable = await fileHandle.createWritable();
  await writable.write(csvText);
  await writable.close();
}
// Same CSV-building path as exportGenericCsv, but saves into the chosen
// folder silently if one is set, otherwise falls back to a normal download.
async function saveOrDownloadCsv(filename, headers, dataRows){
  const esc = v => { const s = (v===null||v===undefined) ? '' : String(v); return s.includes(',') ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = [headers.map(esc).join(',')];
  dataRows.forEach(r=> lines.push(r.map(esc).join(',')));
  const csvText = lines.join('\n');
  if(reportFolderHandle){
    try{ await writeCsvToChosenFolder(filename, csvText); showToast(`✓ Saved to ${reportFolderHandle.name}/${filename}`); return; }
    catch(e){ /* permission revoked or folder issue — fall through to normal download */ }
  }
  downloadCsvFile(filename, csvText);
}
// Real-XLSX counterpart of the above — same "Choose Folder" support, same
// silent-fallback-to-download behaviour, writing a genuine .xlsx workbook
// (built by buildXlsxWorkbook, via ExcelJS) instead of plain CSV text.
// Deliberately a REAL Excel file, not an HTML file wearing an .xls
// extension — that earlier approach triggered Excel's own "format and
// extension don't match, could be corrupted or unsafe" warning on every
// single open, which is exactly the kind of thing that erodes trust in a
// report that's supposed to be authoritative.
async function writeXlsxToChosenFolder(filename, wb){
  const buffer = await wb.xlsx.writeBuffer();
  const fileHandle = await reportFolderHandle.getFileHandle(filename, {create:true});
  const writable = await fileHandle.createWritable();
  await writable.write(buffer);
  await writable.close();
}
async function saveOrDownloadRealXlsx(filenameBase, wb){
  const filename = filenameBase.replace(/\.(csv|xlsx?)$/i,'') + '.xlsx';
  if(reportFolderHandle){
    try{ await writeXlsxToChosenFolder(filename, wb); showToast(`✓ Saved to ${reportFolderHandle.name}/${filename}`); return; }
    catch(e){ /* permission revoked or folder issue — fall through to normal download */ }
  }
  await downloadRealXlsx(filenameBase, wb);
}

async function flushPendingQueue(){
  if(!getApiUrl()) return;
  const queue = lsGet('pendingSubmissions') || [];
  if(!queue.length) return;
  const remaining = [];
  for(const sub of queue){
    try{
      const result = await apiPost('addSubmission', {submission: sub});
      if(!result || result.ok!==true) throw new Error('Server did not confirm the save.');
    }catch(e){ remaining.push(sub); }
  }
  lsSet('pendingSubmissions', remaining);
  if(remaining.length !== queue.length) showToast('✓ Synced pending submissions to server');
  return {synced: queue.length-remaining.length, stillPending: remaining.length};
}
if(typeof window!=='undefined' && window.addEventListener) window.addEventListener('online', flushPendingQueue);
// Belt-and-braces on top of the 'online' event: rural/mobile connections
// often go weak-but-technically-connected rather than cleanly offline, so
// a request can keep failing without the browser ever firing 'online' to
// re-trigger a retry. This periodic check means nothing pending ever waits
// longer than a minute for the next attempt, network permitting — cheap,
// safe no-op when the queue is empty.
if(typeof window!=='undefined' && window.setInterval) setInterval(()=>{ if(state.loaded) flushPendingQueue(); }, 60000);
// Catches a newly-deployed version even for a tab that's been sitting open
// for hours without the person ever touching Sync or logging back in —
// exactly the CNF session that most needs to hear about a fix. 4 minutes
// is frequent enough that a rollout reaches everyone within a few minutes
// of going out, without being a meaningfully heavier polling load than the
// other periodic checks already running here.
if(typeof window!=='undefined' && window.setInterval) setInterval(()=>{
  if(state.loaded && state.role && !state.newVersionAvailable) checkForNewVersion().catch(()=>{});
}, 4*60000);
// Same idea for messages — a CNF with the tab open (even backgrounded,
// e.g. they've switched to WhatsApp) still gets a desktop notification
// within a minute or two of a new rate/scheme message going out, not only
// at their next explicit login or Sync tap. This is still not a true push
// notification — nothing can run once the tab is actually closed, that
// needs a whole different (service-worker + push-server) setup — but it's
// a real improvement for the common "app's open somewhere" case.
if(typeof window!=='undefined' && window.setInterval) setInterval(()=>{
  if(state.loaded && state.cnfUser) loadMessagesForCnf(state.cnfUser.code).catch(()=>{});
}, 75000);

// Full submission history for one CNF (History screen) or all CNFs
// (Admin Audit Log) — fetched on demand since bootstrap only carries
// the latest submission per CNF, to keep the main dashboards fast.
//
// This merges by submission ID instead of replacing outright — this is
// the fix for a real bug: a submission that's already visible on screen
// (from the optimistic local push right after Final Submit) must never
// vanish just because a history fetch came back incomplete or lagging.
// Anything known locally that the server response doesn't (yet) include
// is kept, not discarded.
function mergeSubmissionsForCnf(cnfCode, list){
  cnfCode = String(cnfCode);
  list = normalizeSubmissionList(list);
  const existingForCnf = state.submissions.filter(s=>s.cnfCode===cnfCode);
  const serverIds = new Set(list.map(s=>s.id));
  const keepLocalOnly = existingForCnf.filter(s=>!serverIds.has(s.id));
  state.submissions = state.submissions.filter(s=>s.cnfCode!==cnfCode).concat(list).concat(keepLocalOnly);
}
async function ensureCnfHistory(cnfCode){
  if(!getApiUrl()) return; // local mode already has full history in memory
  try{
    const res = await apiGet('cnfSubmissions', {cnf:cnfCode});
    mergeSubmissionsForCnf(cnfCode, res.submissions||[]);
  }catch(e){ /* keep whatever we already have */ }
}
async function ensureAllHistory(){
  if(!getApiUrl()) return;
  try{
    const res = await apiGet('allSubmissions');
    const serverList = normalizeSubmissionList(res.submissions||[]);
    const serverIds = new Set(serverList.map(s=>s.id));
    const localOnly = state.submissions.filter(s=>!serverIds.has(s.id));
    state.submissions = serverList.concat(localOnly);
  }catch(e){ /* keep whatever we already have */ }
}

async function loadDraft(cnfCode){ return lsGet('draft:'+cnfCode); }
async function saveDraft(cnfCode, draft){ lsSet('draft:'+cnfCode, draft); }

/* ---------------- Domain logic ---------------- */
function selfLifeFor(product){
  return product.selfLifeOverride || state.masters.categorySelfLife[product.category] || 180;
}
function ageDays(mfd){
  if(!mfd) return null;
  const d = (new Date(todayISO()) - new Date(mfd)) / 86400000;
  return Math.max(0, Math.round(d));
}
function ageingStatus(product, mfd){
  if(!mfd) return {label:'No MFD', cls:'normal'};
  const life = selfLifeFor(product);
  const age = ageDays(mfd);
  const remaining = life - age;
  const pct = (remaining/life)*100;
  let t = (state.masters.categoryThresholds && state.masters.categoryThresholds[product.category]) || state.masters.thresholds;
  // A product-specific Ageing override — expressed in DAYS SINCE MFD (age),
  // not days remaining: e.g. Ageing=30 means "once this product is more
  // than 30 days old, flag it as Ageing" — confirmed directly against the
  // real GCPL Product-Wise Shelf-Life data (e.g. Ageing=90 on a 360-day
  // shelf life). Converted here to this product's own self-life PERCENT so
  // the rest of the Critical/Near-Expiry/Expired math (percentage-based)
  // stays internally consistent instead of needing four separate
  // day-thresholds. Overrides t.normal specifically: that's the field that
  // actually decides the "Ageing" label's cutoff below (pct <= t.normal ->
  // "Ageing") — despite the similar name, t.ageing is a different tier's
  // boundary (the one for "Critical").
  if(product.ageingDaysOverride){
    const ageingPct = Math.max(0, Math.min(100, ((life - product.ageingDaysOverride) / life) * 100));
    // Never let the override end up BELOW the category's own Critical cutoff
    // (t.ageing) — that would invert the tiers and make "Ageing" literally
    // unreachable (pct would hit the Critical check first, every time).
    t = Object.assign({}, t, {normal: Math.max(ageingPct, t.ageing)});
  }
  if(remaining <= 0) return {label:'Expired', cls:'expired', pct, remaining, age, life};
  if(pct <= t.critical) return {label:'Near Expiry', cls:'expiring', pct, remaining, age, life};
  if(pct <= t.ageing) return {label:'Critical', cls:'critical', pct, remaining, age, life};
  if(pct <= t.normal) return {label:'Ageing', cls:'ageing', pct, remaining, age, life};
  if(pct <= t.fresh) return {label:'Normal', cls:'normal', pct, remaining, age, life};
  return {label:'Fresh', cls:'fresh', pct, remaining, age, life};
}

// Shared "act on this now" ranking used by both the CNF Dashboard (own
// latest submission) and the MIS Overview (across all CNFs) — worst ageing
// first (Expired > Near Expiry > Critical > Ageing), ties broken by whoever
// has the least shelf life left. "Slow Moving" is a heuristic (no sales feed
// to compute real velocity from): ageing-or-worse AND still holding more
// than the safety-stock norm, i.e. it's not just old, it's sitting there.
const ATTENTION_ORDER = {expired:0, expiring:1, critical:2, ageing:3, normal:4, fresh:5};
function buildAttentionList(items, limit){
  const rows = items.map(it=>{
    const p = state.masters.products.find(pp=>pp.code===it.code);
    if(!p) return null;
    const st = ageingStatus(p, it.mfd);
    const slowMoving = ['ageing','critical','expiring','expired'].includes(st.cls) && it.kgQty > (p.safetyStockKg||0);
    return {code:it.code, name:p.name, category:p.category, kgQty:it.kgQty, mfd:it.mfd, status:st, slowMoving};
  }).filter(Boolean);
  const flagged = rows.filter(r=>['ageing','critical','expiring','expired'].includes(r.status.cls));
  flagged.sort((a,b)=> ATTENTION_ORDER[a.status.cls]-ATTENTION_ORDER[b.status.cls] || (a.status.remaining??999)-(b.status.remaining??999));
  return limit ? flagged.slice(0,limit) : flagged;
}
function AttentionPanel(attention, totalFlagged, opts){
  opts = opts || {};
  if(!attention.length) return '';
  return `<div class="attn-panel ${opts.dark?'dark':''}">
    <div class="attn-head">⚠ Needs Attention <span class="num">${totalFlagged}</span> <span class="attn-sub">near expiry, ageing &amp; slow-moving, worst first</span></div>
    ${attention.map(a=>`<div class="attn-row attn-${a.status.cls}" ${opts.clickable?`data-attn="${a.code}|${a.mfd||''}"`:''}>
      <div class="an"><b>${a.name}</b><div class="am">${a.code} · ${a.kgQty.toFixed(1)}kg · MFD ${a.mfd||'—'} · ${a.status.age}d old${opts.showCnf&&a.cnfName?` · ${a.cnfName}`:''}${a.slowMoving?' · <span style="color:var(--orange);">Slow Moving</span>':''}</div></div>
      <span class="badge ${a.status.cls}">${a.status.label}</span>
    </div>`).join('')}
  </div>`;
}
function convertToKg(product, qty, uom){
  qty = Number(qty)||0;
  if(uom==='KG') return qty;
  if(uom==='BAG') return product.bagToKg ? qty*product.bagToKg : qty;
  if(uom==='PC') return product.pcToKg ? qty*product.pcToKg : qty;
  return qty;
}

/* ---------------- SAP Current Stock upload (mandatory pre-step for Submit Stock) ----------------
   Parses the SAP export (.xlsx), keeps only Plant/Material/Description/UoM/Current Stock
   (the yellow-highlighted "Current Stock" column, already in KG), auto-creates any product
   the CNF hasn't got in the master yet, and sets it as the baseline every MFD-batch entry
   is validated against. */
function readFileAsArrayBuffer(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('Could not read the file.'));
    reader.readAsArrayBuffer(file);
  });
}
function findCol(headerRow, names){
  const norm = headerRow.map(h=>String(h||'').trim().toLowerCase());
  for(const name of names){
    const idx = norm.indexOf(name.toLowerCase());
    if(idx>-1) return idx;
  }
  return -1;
}
// Learns which words tend to belong to which category from the Product
// Master the Admin already submitted — e.g. if most products with "SOOJI"
// in the name are categorised SOOJI, and most with "MATAR BESAN" are
// categorised M.BESAN, that association is picked up automatically. This
// is what classifies materials that show up in a SAP Current Stock upload
// but were never in the curated Product Master (e.g. "LAB REJECTION"
// variants) — instead of silently dumping them all into Others.
const CATEGORY_WORD_STOPLIST = new Set(['KG','GM','GMS','ML','MM','LTR','LTRS','INCH','RS','NO','THE','AND','OF','WITH','FOR','NEW','LAB','REJECTION','PACK','PKT']);
function tokenizeProductName(name){
  return String(name||'').toUpperCase().split(/[^A-Z]+/).filter(w=>w.length>=3 && !CATEGORY_WORD_STOPLIST.has(w));
}
function buildCategoryWordMap(){
  const map = {}; // word -> {CATEGORY: occurrenceCount}
  state.masters.products.forEach(p=>{
    if(!p.category || p.category==='OTHERS') return;
    tokenizeProductName(p.name).forEach(w=>{
      map[w] = map[w] || {};
      map[w][p.category] = (map[w][p.category]||0) + 1;
    });
  });
  return map;
}
function inferCategoryFromName(name, wordMap){
  const scores = {};
  tokenizeProductName(name).forEach(w=>{
    const catCounts = wordMap[w];
    if(!catCounts) return;
    Object.entries(catCounts).forEach(([cat,count])=>{ scores[cat] = (scores[cat]||0) + count; });
  });
  let best = null, bestScore = 0;
  Object.entries(scores).forEach(([cat,score])=>{ if(score>bestScore){ best=cat; bestScore=score; } });
  return best; // null if nothing in the existing Product Master resembles this name
}

async function handleSapUpload(file){
  if(typeof XLSX === 'undefined') throw new Error('Excel reader failed to load — check your internet connection and try again.');
  const buf = await readFileAsArrayBuffer(file);
  const wb = XLSX.read(buf, {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
  if(!raw.length) throw new Error('This file has no rows.');
  const header = raw[0];
  const cPlant = findCol(header, ['Plant']);
  const cMaterial = findCol(header, ['Material']);
  const cDesc = findCol(header, ['Material Description']);
  const cUom = findCol(header, ['A UoM','UoM','UOM']);
  const cStock = findCol(header, ['Current Stock']);
  const cApproved = findCol(header, ['Approved Order']);
  const cPending = findCol(header, ['Unpproved Order','Unapproved Order','Un-approved Order']);
  if(cMaterial===-1 || cDesc===-1 || cStock===-1){
    throw new Error('Missing expected columns — need at least Material, Material Description, and Current Stock.');
  }
  let rows = raw.slice(1)
    .filter(r=>r[cMaterial]!=='' && r[cMaterial]!==undefined)
    .map(r=>({
      plant: cPlant>-1 ? String(r[cPlant]).trim() : '',
      code: String(r[cMaterial]).trim(),
      name: String(r[cDesc]).trim() || ('Material '+r[cMaterial]),
      uom: cUom>-1 ? String(r[cUom]).trim() : '',
      currentStockKg: Number(r[cStock])||0,
      approvedOrder: cApproved>-1 ? (Number(r[cApproved])||0) : 0,
      pendingOrder: cPending>-1 ? (Number(r[cPending])||0) : 0
    }));
  if(!rows.length) throw new Error('No product rows found in this file.');

  const matchingPlant = rows.filter(r=>r.plant===state.cnfUser.code);
  if(matchingPlant.length) rows = matchingPlant;
  // else: no rows tagged with this CNF's plant code — fall back to using every row in the file
  // rather than blocking the CNF, since plant coding can vary by export.

  // Material code is the single source of truth for what a row IS — if the
  // same code appears more than once in the export (a real, if uncommon,
  // SAP export data-quality issue), only the FIRST occurrence is kept.
  // Silently accepting duplicates would double-list the same product in
  // the entry screen and double-count it in the KPI totals.
  const seenCodes = new Set();
  const duplicateCodes = [];
  rows = rows.filter(r=>{
    if(seenCodes.has(r.code)){ duplicateCodes.push(r.code); return false; }
    seenCodes.add(r.code);
    return true;
  });
  if(duplicateCodes.length) showToast(`⚠ ${duplicateCodes.length} duplicate material code(s) in this file — kept the first occurrence of each, ignored the rest.`);

  // Auto-create any material not already in the product master — no manual
  // mapping needed. Category is inferred from the Product Master you've
  // already submitted (see buildCategoryWordMap/inferCategoryFromName above)
  // rather than defaulting straight to Others, so items like "SOOJI - LAB
  // REJECTION" still land under SOOJI even though that exact SKU was never
  // in the curated master. Uses the concurrency-safe addProducts endpoint
  // (not a full saveMasters overwrite) so two CNFs uploading SAP files
  // around the same moment can't lose each other's newly-added products.
  const wordMap = buildCategoryWordMap();
  const newProducts = [];
  rows.forEach(r=>{
    if(isBogusProductRow(r.code, r.name)) return; // a stray header row, not a real material — never auto-create a product from it
    if(!state.masters.products.some(p=>p.code===r.code)){
      const inferredCategory = inferCategoryFromName(r.name, wordMap) || 'OTHERS';
      const np = { code:r.code, name:r.name, category:inferredCategory, defaultUOM:'KG', bagToKg:null, pcToKg:null, safetyStockKg:0, selfLifeOverride:null };
      state.masters.products.push(np); // reflect locally right away — this CNF's list must not wait on the network
      newProducts.push(np);
    }
  });
  if(newProducts.length){
    lsSet('masters', state.masters);
    if(getApiUrl()){
      try{ await apiPost('addProducts', {products: newProducts}); }
      catch(e){ /* worst case: another CNF's later SAP upload or an Admin re-import recreates the same codes safely (dedup by code) */ }
    }
  }

  state.sapUpload = { fileName: file.name, uploadedAt: new Date().toISOString(), rows };
  state.draftItems = {};
  state.varianceReasons = {};
  state.sapShowZero = false;
  state.sapSearch = '';
  state.submitCat = null;
  state.sapMissingOnlyFilter = false;
  await saveDraft(state.cnfUser.code, {date: state.submitDate, items:{}, sapUpload: state.sapUpload, varianceReasons:{}});
}

// Forces CNF/product codes to strings on any submission data entering the
// app — this is the client-side half of a real bug fix: Google Sheets
// silently converts a numeric-looking cell ("3100") into an actual number
// on read, and every comparison in this app expects a string (masters.cnfs
// codes are always strings). One raw number slipping through made a CNF's
// entire submission invisible to every dashboard — no error, just silently
// treated as belonging to a CNF that doesn't match anything. Every place
// submissions data enters state (server fetch, cache, merge) runs through
// this, so the bug class can't resurface even if some other path someday
// sends a number again.
//
// cleanDateField guards against the SAME class of Sheets auto-conversion —
// a date-shaped cell becomes an actual Date object server-side, and if a
// backend that predates the fix (or hasn't been redeployed yet) sends its
// full toString() ("Tue Aug 18 2026 00:00:00 GMT+0530 (India Standard
// Time)") instead of a clean "2026-08-18", this actually parses and
// re-formats it correctly — not just a blind slice(), which would have
// chopped that string into the wrong thing ("Tue Aug 18"). A no-op on an
// already-clean date string.
function cleanDateField(raw){
  const s = String(raw||'');
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10); // already clean (or ISO-with-time) — just trim
  const parsed = new Date(s);
  return isNaN(parsed.getTime()) ? s : localDateISO(parsed); // recovers from a verbose Date.toString() dump
}
function normalizeSubmissionList(list){
  return (list||[]).map(s=>Object.assign({}, s, {
    cnfCode: String(s.cnfCode),
    date: cleanDateField(s.date),
    items: (s.items||[]).map(it=>Object.assign({}, it, {code: String(it.code)}))
  }));
}

function latestSubmissionFor(cnfCode){
  const subs = state.submissions.filter(s=>String(s.cnfCode)===String(cnfCode)).sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp));
  return subs[0] || null;
}

// Submission cadence — each CNF has its own required frequency (Admin →
// CNF Master, default weekly/7 days). Used to flag CNFs who haven't
// submitted on time, on the CNF's own dashboard and in Admin/MIS.
function daysSinceLastSubmission(cnfCode){
  const sub = latestSubmissionFor(cnfCode);
  if(!sub) return null;
  return Math.floor((new Date(todayISO()) - new Date(sub.date)) / 86400000);
}
function cnfSubmissionStatus(cnf){
  const days = daysSinceLastSubmission(cnf.code);
  const freq = cnf.submissionFrequencyDays || 7;
  if(days===null) return {days:null, freq, overdue:true, neverSubmitted:true};
  return {days, freq, overdue: days > freq, neverSubmitted:false};
}

function allCurrentStockRows(cnfFilterList){
  // one row per CNF x product, from each CNF's latest submission
  const rows = [];
  const cnfs = state.masters.cnfs.filter(c => cnfFilterList==='ALL' ? true : cnfFilterList.includes(c.code));
  cnfs.forEach(cnf=>{
    const sub = latestSubmissionFor(cnf.code);
    if(!sub) return;
    sub.items.forEach(it=>{
      const product = state.masters.products.find(p=>p.code===it.code);
      if(!product) return;
      const st = ageingStatus(product, it.mfd);
      const safetyStatus = it.kgQty < product.safetyStockKg ? 'low' : 'ok';
      rows.push({cnf, sub, item:it, product, ageStatus:st, safetyStatus});
    });
  });
  return rows;
}

/* ---------------- Render root ---------------- */
function render(){
  const app = document.getElementById('app');
  if(!state.loaded || state.loadingActive){ app.innerHTML = LoadingScreen(); return; }
  // A browser tab left open across midnight never finds out the calendar
  // day changed on its own — state.submitDate was set once (at login) and
  // nothing re-checks it against the real clock. A plain range-clamp isn't
  // enough here: "yesterday" is a genuinely valid, intentional choice (for
  // catching up a missed day), so a stale value that happens to now equal
  // "yesterday" looks indistinguishable from someone deliberately picking
  // it — it would silently stay wrong. This tracks whether the CNF actually
  // touched the date picker THIS session; if not, and nothing is in
  // progress yet (no SAP file, no draft entries), it's forced back to the
  // real today on every render. An explicit choice is always respected. If
  // someone genuinely IS mid-entry when the day rolls over, the Final
  // Submit guard (checked fresh at that moment) still catches and blocks a
  // now-stale date — a clear stop, not a silent reassignment of data they
  // were actively working with.
  if(state.cnfUser && !state.submitDateManuallySet && !state.sapUpload && Object.keys(state.draftItems||{}).length===0){
    state.submitDate = todayISO();
  }
  const loggedIn = !!(state.cnfUser || state.adminUser || state.misUser);
  app.innerHTML = `
    ${Topbar()}
    ${DemoBanner()}
    ${NewVersionBanner()}
    ${BackendErrorBanner()}
    <main>
      ${!loggedIn ? UnifiedLoginScreen() : state.role==='cnf' ? CnfPanel() : state.role==='admin' ? AdminPanel() : MisPanel()}
    </main>
  `;
  bindGlobal();
}

// A believable, animated "percentage" for any wait that doesn't have real
// granular progress to report (a network fetch is just one opaque promise —
// it doesn't tell us "40% done"). This is the same honest trick used by
// most apps: ease toward ~92% on a decelerating curve so it never looks
// finished before the real work is, cycling through a few named steps so
// it reads as "doing something specific," not just a spinner. The moment
// the real operation resolves, finishFakeProgress() snaps it to 100% and
// the screen changes — so the number is never a lie about whether
// something's actually happening, only about exactly how far along.
let __progressTimer = null;
function startFakeProgress(messages){
  state.loadingActive = true;
  state.loadingProgress = 2;
  state.loadingMessage = messages[0];
  let msgIdx = 0;
  if(__progressTimer) clearInterval(__progressTimer);
  __progressTimer = setInterval(()=>{
    const ceiling = 92;
    state.loadingProgress = Math.min(ceiling, state.loadingProgress + (ceiling - state.loadingProgress) * 0.09 + 0.3);
    const newMsgIdx = Math.min(messages.length-1, Math.floor((state.loadingProgress/ceiling) * messages.length));
    if(newMsgIdx !== msgIdx){ msgIdx = newMsgIdx; state.loadingMessage = messages[msgIdx]; }
    render();
  }, 280);
}
function finishFakeProgress(finalMessage){
  if(__progressTimer){ clearInterval(__progressTimer); __progressTimer = null; }
  state.loadingProgress = 100;
  if(finalMessage) state.loadingMessage = finalMessage;
  state.loadingActive = false;
}

function LoadingScreen(){

function getMisLastSeen(){ return Number(lsGet('misLastSeenAt')) || 0; }
function computeMisNotifications(){

    .filter(s=>new Date(s.timestamp).getTime() > lastSeen)

// Wipes everything locally cached (masters, submissions, drafts, remembered
// session) EXCEPT the backend URL and theme choice, which are settings, not
// stale data. Used from the login screen so a stale local password/CNF list
// can't lock someone out with no way back in.
function clearAppCache(){
  try{
    const keep = new Set([LS_PREFIX+'apiUrl', LS_PREFIX+'apiDisconnected', LS_PREFIX+'theme']);
    const toRemove = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(LS_PREFIX) && !keep.has(k)) toRemove.push(k);
    }
    toRemove.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
}

/* ---------------- Remember Me — session persists across reloads on this device ---------------- */
function saveRememberedSession(role, id){ try{ localStorage.setItem('gsi:session', JSON.stringify({role, id})); }catch(e){} }
function clearRememberedSession(){ try{ localStorage.removeItem('gsi:session'); }catch(e){} }
function getRememberedSession(){ try{ const v = localStorage.getItem('gsi:session'); return v ? JSON.parse(v) : null; }catch(e){ return null; } }

async function restoreCnfSession(cnf){
  state.role = 'cnf'; state.cnfUser = cnf; state.cnfScreen = 'dashboard'; state.submitDate = todayISO(); state.submitDateManuallySet = false;
  const draft = await loadDraft(cnf.code);
  const draftMatchesToday = draft && draft.date===state.submitDate;
  state.draftItems = draftMatchesToday ? draft.items : {};
  state.sapUpload = draftMatchesToday ? (draft.sapUpload||null) : null;
  state.varianceReasons = draftMatchesToday ? (draft.varianceReasons||{}) : {};
  try{ await forceSyncMasters(); }catch(e){ /* keep cached data if this fails, still lets them in */ } // e.g. submitted from a different phone earlier — dashboard shouldn't show a stale "Pending"
  try{ await loadMessagesForCnf(cnf.code); }catch(e){ /* not critical to getting them logged in */ }
}

/* ---------------- Messages (rates, schemes — Admin/MIS -> CNF) ---------------- */

// "Read" state is tracked per-device via a last-seen timestamp, same
// pattern as MIS's own notification bell — no server-side read-receipts.
function messagesLastSeenKey(cnfCode){ return `msgsLastSeenAt:${cnfCode}`; }
// Separate from the above: which message IDs have already triggered a
// desktop notification on this device. Needed because lastSeen only
// updates when the CNF actually opens the Messages tab — without this,
// the periodic background check would re-notify for the SAME unopened
// message every 75 seconds forever.
function notifiedMessageIdsKey(cnfCode){ return `notifiedMsgIds:${cnfCode}`; }

async function loadMessagesForCnf(cnfCode){
  if(!getApiUrl()) return;
  const res = await apiGet('messagesForCnf', {cnf: cnfCode});
  const incoming = (res && res.messages) || [];
  state.messages = incoming;
  const notifiedIds = new Set(lsGet(notifiedMessageIdsKey(cnfCode)) || []);
  const freshOnes = incoming.filter(m => !notifiedIds.has(m.id));
  // A message that's never triggered a notification on this device before
  // is worth one now, if permission is granted — the actual point of the
  // feature: a rate/scheme update should reach them without having to
  // remember to go check. Deliberately NOT gated on the tab being
  // visible/focused — the periodic background check this also runs from
  // exists specifically to catch a backgrounded tab (e.g. they've switched
  // to WhatsApp); a visibility check would silence exactly the case it's
  // meant to cover. Each message ID only ever fires once, regardless of
  // how many times this function runs (login, manual Sync, the periodic
  // check) — without that, an unopened message would re-notify forever.
  if(freshOnes.length){
    freshOnes.slice(0,3).forEach(m => showDesktopNotification(m.subject || 'New message', m.body || ''));
    freshOnes.forEach(m => notifiedIds.add(m.id));
    lsSet(notifiedMessageIdsKey(cnfCode), Array.from(notifiedIds));
  }
}

async function loadAllMessages(){

// Called once after masters load — silently signs back in if a valid
// remembered session exists on this device, so a Remember-Me login survives
// a page reload without asking again. If the remembered account no longer
// exists or was deactivated since, the stale session is discarded quietly.
async function tryRestoreSession(){
  const remembered = getRememberedSession();
  if(!remembered) return;
  if(remembered.role==='cnf'){
    const cnf = state.masters.cnfs.find(c=>c.code===remembered.id);
    if(cnf && cnf.status==='Active'){ await restoreCnfSession(cnf); return; }
  } else if(remembered.role==='admin'){
    const u = state.masters.adminUsers.find(a=>a.userId===remembered.id);
    if(u && u.status==='Active'){
      state.role='admin'; state.adminUser=u;
      try{ await forceSyncMasters(); }catch(e){ /* keep cached data if this fails, still lets them in */ }
      try{ await loadAllMessages(); }catch(e){ /* not critical to getting them logged in */ }
      return;
    }
  } else if(remembered.role==='mis'){
    const u = state.masters.misUsers.find(a=>a.userId===remembered.id);
    if(u && u.status==='Active'){
      state.role='mis'; state.misUser=u;
      if(lsGet('misLastSeenAt')===null) lsSet('misLastSeenAt', Date.now());
      try{ await forceSyncMasters(); }catch(e){ /* keep cached data if this fails, still lets them in */ } // Remember Me shouldn't mean "stuck on whatever was cached at last login"
      try{ await loadAllMessages(); }catch(e){ /* not critical to getting them logged in */ }
      return;
    }
  }
  clearRememberedSession(); // account gone/deactivated since — don't keep trying
}

async function tryLogin(userId, password, remember){
  userId = (userId||'').trim();
  // CNF — matched by CNF code (their User ID is their code, e.g. 3100)
  const cnf = state.masters.cnfs.find(c=>c.code===userId || c.userId===userId);
  if(cnf){
    if(cnf.status==='Inactive'){ state.loginError = 'This CNF is inactive. Contact Admin.'; return false; }
    if(password !== cnf.password){ state.loginError = 'Incorrect User ID or Password.'; return false; }
    await restoreCnfSession(cnf);
    state.loginError = null;
    if(remember) saveRememberedSession('cnf', cnf.code); else clearRememberedSession();
    return true;
  }
  // Admin
  const admin = state.masters.adminUsers.find(a=>a.userId===userId);
  if(admin){
    if(admin.status==='Inactive'){ state.loginError = 'This account is inactive.'; return false; }
    if(password !== admin.password){ state.loginError = 'Incorrect User ID or Password.'; return false; }
    state.role = 'admin'; state.adminUser = admin; state.loginError = null;
    if(remember) saveRememberedSession('admin', admin.userId); else clearRememberedSession();
    try{ await forceSyncMasters(); }catch(e){ /* keep cached data if this fails, still lets them in */ }
    try{ await loadAllMessages(); }catch(e){ /* not critical to getting them logged in */ }
    return true;
  }
  // MIS / Back Office
  const mis = state.masters.misUsers.find(u=>u.userId===userId);
  if(mis){
    if(mis.status==='Inactive'){ state.loginError = 'This account is inactive.'; return false; }
    if(password !== mis.password){ state.loginError = 'Incorrect User ID or Password.'; return false; }
    state.role = 'mis'; state.misUser = mis; state.loginError = null;
    if(remember) saveRememberedSession('mis', mis.userId); else clearRememberedSession();
    if(lsGet('misLastSeenAt')===null) lsSet('misLastSeenAt', Date.now()); // first-ever login: don't dump the whole existing history into "new"
    try{ await forceSyncMasters(); }catch(e){ /* keep cached data if this fails, still lets them in */ } // pull every CNF's latest submission fresh the moment MIS opens, not whatever was cached last
    try{ await loadAllMessages(); }catch(e){ /* not critical to getting them logged in */ }
    return true;
  }
  state.loginError = 'Unknown User ID or Password.';
  return false;
}

function doLogout(){
  state.role = null; state.cnfUser = null; state.adminUser = null; state.misUser = null;
  state.draftItems = {}; state.sapUpload = null; state.varianceReasons = {};
  state.loginError = null; state.sideOpen = false;
  clearRememberedSession(); // an explicit logout always forgets, even if "remember me" was checked at login
}

// A product's draft entry is an ARRAY of MFD batches: [{qty,uom,mfd}, ...]
// This lets the same product (e.g. 100kg on hand) be entered as several
// lines with different Manufacturing Dates — required for FIFO/ageing
// when godown stock for one product spans multiple production batches.
function getBatches(code, product){
  const arr = state.draftItems[code];
  if(arr && arr.length) return arr;
  return [{qty:'', uom:product.defaultUOM||'KG', mfd:''}];
}

function enteredKgFor(code){
  const p = state.masters.products.find(pp=>pp.code===code);
  if(!p) return 0;
  const batches = state.draftItems[code] || [];
  return batches.filter(b=>b.qty!==undefined && b.qty!=='').reduce((s,b)=>s+convertToKg(p,b.qty,b.uom||p.defaultUOM),0);
}
function batchFilled(code){
  const batches = state.draftItems[code] || [];
  return batches.some(b=>b.qty!==undefined && b.qty!=='');
}
// Is every SAP line in this category that actually needs entry (nonzero
// current stock) filled in yet? Drives the tab auto-advance below — a
// category with nothing to enter counts as trivially complete so it's
// skipped over rather than stalling the flow.
function categoryComplete(cat){
  const group = sapCategoryGroups().find(g=>g.cat===cat);
  if(!group) return false;
  const required = group.rows.filter(r=>r.currentStockKg>0);
  if(!required.length) return true;
  return required.every(r=>batchFilled(r.code));
}
// Real entry progress for a category — how many of the SAP lines that
// actually need a batch (nonzero current stock) have one yet. Drives the
// silo-style fill gauge on each category tab.
function categoryEntryProgress(cat){
  const group = sapCategoryGroups().find(g=>g.cat===cat);
  if(!group) return {required:0, entered:0, pct:100};
  const required = group.rows.filter(r=>r.currentStockKg>0);
  if(!required.length) return {required:0, entered:0, pct:100};
  const entered = required.filter(r=>batchFilled(r.code)).length;
  return {required: required.length, entered, pct: Math.round((entered/required.length)*100)};
}
// Groups the uploaded SAP rows by the matching product's category, sorted so
// categories that actually have current stock come first (alphabetically
// among themselves), with all-zero categories pushed to the end.
function sapCategoryGroups(){
  if(!state.sapUpload) return [];
  const groups = {};
  state.sapUpload.rows.forEach(r=>{
    const p = state.masters.products.find(pp=>pp.code===r.code);
    const cat = (p && p.category) || 'OTHERS';
    (groups[cat] = groups[cat]||[]).push(r);
  });
  const cats = Object.keys(groups).map(cat=>{
    const rows = groups[cat];
    const stockedCount = rows.filter(r=>r.currentStockKg>0).length;
    return {cat, rows, hasStock: stockedCount>0, stockedCount, total: rows.length};
  });
  cats.sort((a,b)=>{
    if(a.hasStock !== b.hasStock) return a.hasStock ? -1 : 1;
    return a.cat.localeCompare(b.cat);
  });
  return cats;
}
// Every SAP line with current stock > 0 must get at least one MFD batch
// entered before Final Submit — this is the mandatory-coverage rule.
function missingRequiredCodes(){
  if(!state.sapUpload) return [];
  return state.sapUpload.rows.filter(r=>r.currentStockKg>0 && !batchFilled(r.code)).map(r=>r.code);
}
// Sub-50g gaps between entered and SAP stock are floating-point/unit-
// conversion rounding noise (e.g. converting BAG/PC to kg with a
// non-round factor), not a real physical difference — don't force anyone
// to write a reason explaining a 10-gram rounding artifact. Everything
// that decides "does this need a reason" or "does this match SAP" goes
// through these two so the threshold is consistent everywhere.
const VARIANCE_TOLERANCE_KG = 0.05;
function roundedDiffKg(a, b){ return Math.round((a-b)*100)/100; }
function withinTolerance(diff){ return Math.abs(diff) <= VARIANCE_TOLERANCE_KG; }

function hasUnresolvedVariance(code){
  if(!state.sapUpload) return false;
  const row = state.sapUpload.rows.find(r=>r.code===code);
  if(!row) return false;
  const batches = state.draftItems[code] || [];
  const anyEntered = batches.some(b=>b.qty!==undefined && b.qty!=='');
  if(!anyEntered) return false; // nothing entered yet — not a variance until they start entering
  const entered = enteredKgFor(code);
  const diff = roundedDiffKg(entered, row.currentStockKg);
  return !withinTolerance(diff) && !(state.varianceReasons[code] && state.varianceReasons[code].trim());
}

// Convenience-only display: shows what a KG figure equals in BAG/PC too,
// wherever a product's conversion factors are known. Never changes any
// actual math — KG stays the number of record everywhere; this is purely
// "so a CNF doesn't have to do the division in their head."
// BAG and PC are PHYSICAL units — a bag or a piece either exists or it
// doesn't, so neither can ever be shown as a fraction (0.999 BAG, 999.5
// PC are never valid). Only KG is a true weight and can be decimal.
//
// BAG specifically represents physical bag COUNT, not "kg divided by bag
// size" — once a bag is opened, it still counts as one of the bags on
// hand (nothing physically vanished), it's just no longer sealed. So the
// count of whole, still-sealed bags is shown, PLUS a "(1 Open)" note the
// moment there's any partial remainder — never a fractional bag number.
function bagEquivDisplay(kgQty, product){
  if(!product || !product.bagToKg) return '';
  const bagKg = product.bagToKg;
  const wholeBags = Math.floor((kgQty/bagKg) + 1e-6); // tiny epsilon absorbs float rounding noise
  const remainder = kgQty - wholeBags*bagKg;
  return remainder > 0.0005 ? `${wholeBags+1} (1 Open)` : String(wholeBags);
}
// PC is always a whole physical piece count — rounds, never shows a
// decimal, unlike KG.
function pcEquivDisplay(kgQty, product){
  if(!product || !product.pcToKg) return '';
  return String(Math.round(kgQty / product.pcToKg));
}
// How many pieces make up one whole bag — a purely informational number
// (Bag KG ÷ PC KG), shown so a CNF or Admin can see the full picture (e.g.
// "1 BAG = 30 KG = 600 PC") without doing the division themselves.
function pcPerBag(product){
  if(!product || !product.bagToKg || !product.pcToKg) return null;
  return Math.round(product.bagToKg / product.pcToKg);
}
function formatUomEquivalents(kg, product){
  const parts = [];
  if(product.bagToKg) parts.push(`${bagEquivDisplay(kg, product)} BAG`);
  if(product.pcToKg) parts.push(`${pcEquivDisplay(kg, product)} PC`);
  return parts.length ? ` <span class="uom-equiv">(≈ ${parts.join(' / ')})</span>` : '';
}

function SapProductRow(sapRow){
  const p = state.masters.products.find(pp=>pp.code===sapRow.code);
  if(!p) return '';
  const batches = getBatches(p.code, p);
  const filledBatches = batches.filter(b=>b.qty!==undefined && b.qty!=='');
  const filled = filledBatches.length>0;
  const totalKg = enteredKgFor(p.code);
  const diff = filled ? roundedDiffKg(totalKg, sapRow.currentStockKg) : null;
  const needsReason = filled && diff!==null && !withinTolerance(diff);
  const reasonFilled = state.varianceReasons[p.code] && state.varianceReasons[p.code].trim();
  return `
  <div class="prow ${filled?'filled':''} ${needsReason && !reasonFilled?'needs-reason':''}" data-prow="${p.code}">
    <div class="pinfo">
      <div class="pname">${p.name} <span class="cat-pill">${p.category}</span></div>
      <div class="pmeta">${p.code} · SAP Current Stock <b>${sapRow.currentStockKg.toFixed(1)}kg</b>${formatUomEquivalents(sapRow.currentStockKg, p)}${filled?` · Entered <b>${totalKg.toFixed(1)}kg</b>${formatUomEquivalents(totalKg, p)}`:''}
        ${filled ? (withinTolerance(diff) ? ' · <span class="badge ok">Matches SAP</span>' : ` · <span class="badge low">Δ ${diff>0?'+':''}${diff.toFixed(1)}kg vs SAP</span>`) : ''}
      </div>
      <div class="pmeta2">Approved Order <b>${(sapRow.approvedOrder||0).toLocaleString('en-IN',{maximumFractionDigits:1})}</b> · Pending Order <b>${(sapRow.pendingOrder||0).toLocaleString('en-IN',{maximumFractionDigits:1})}</b>${pcPerBag(p) ? ` · 1 BAG = ${p.bagToKg}kg = ${pcPerBag(p)} PC` : ''}</div>
    </div>
    <div class="batchlist">
      ${batches.map((b,i)=>BatchRow(p,b,i,batches.length)).join('')}
    </div>
    <button class="addbatch-btn" data-addbatch="${p.code}">+ Add another MFD batch</button>
    ${filled ? `<div class="reason-row ${needsReason?'':'reason-row-optional'}">
      <label>${needsReason ? 'Reason for difference (required)' : 'Note (optional)'}</label>
      <input type="text" data-reasoncode="${p.code}" placeholder="${needsReason ? 'e.g. Damage, unrecorded dispatch, counting error…' : 'Matches SAP — add a note if you want to record anything'}" value="${state.varianceReasons[p.code]||''}">
    </div>` : ''}
  </div>`;
}

function ddmmyyyy(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}-${m}-${y}`;
}

function BatchRow(p,b,i,total){
  const uom = b.uom || p.defaultUOM || 'KG';
  const noConversion = (uom==='BAG' && !p.bagToKg) || (uom==='PC' && !p.pcToKg);
  return `
  <div class="batchrow" data-batchrow="${p.code}:${i}">
    ${total>1?`<div class="batch-badge">${i+1}</div>`:''}
    <div class="batch-fields">
    <div class="mfd-row">
      ${total>1?'':'<label>MFD</label>'}
      <div class="mfd-input-wrap">
        <input type="text" class="mfd-text" data-mfdcode="${p.code}" data-batch="${i}" value="${ddmmyyyy(b.mfd)}" placeholder="DD-MM-YYYY" inputmode="numeric" autocomplete="off">
        <button type="button" class="mfd-cal-btn" data-mfdcal="${p.code}:${i}" tabindex="-1" title="Pick from calendar instead">📅</button>
        <input type="date" class="mfd-picker-hidden" data-mfdpicker="${p.code}:${i}" value="${b.mfd||''}" tabindex="-1">
      </div>
      ${i===0 && total>1 ? `<button type="button" class="mfd-copyall-btn" data-copymfd="${p.code}" title="Fill every batch below with this same date — then just fix the few that differ">Same date for all ${total}</button>` : ''}
    </div>
    <div class="mfd-error" data-mfderror="${p.code}:${i}" style="display:none;"></div>
    <div class="pinputs">
      <input type="number" min="0" class="qty" data-qtycode="${p.code}" data-batch="${i}" placeholder="0" value="${b.qty!==undefined?b.qty:''}">

      <select class="uom" data-uomcode="${p.code}" data-batch="${i}">
        ${['KG','PC','BAG'].map(u=>`<option value="${u}" ${uom===u?'selected':''}>${u}</option>`).join('')}
      </select>
      ${total>1?`<button type="button" class="rmbatch-btn" data-removebatch="${p.code}:${i}" title="Remove this batch">✕</button>`:''}
    </div>
    <div class="uom-warn" data-uomwarn="${p.code}:${i}" style="${noConversion?'':'display:none;'}">⚠ No ${uom} size set for this product yet — Admin can add it in Product Master or via UOM Converter import. Until then, this ${uom} quantity is <b>not converted</b>, it's used as-is.</div>
    </div>
  </div>`;
}

function CnfHistory(){
  // Always scoped to the current calendar month — this is a submission
  // log for "what have I sent this month," not an ever-growing archive to
  // scroll through. Export any older submission's date directly from its
  // audit trail on request if ever needed (the full history is never
  // deleted server-side, only this view is scoped).
  const now = new Date();
  const monthStart = localDateISO(new Date(now.getFullYear(), now.getMonth(), 1));
  const monthLabel = now.toLocaleDateString('en-IN', {month:'long', year:'numeric'});
  const subs = state.submissions.filter(s=>s.cnfCode===state.cnfUser.code && s.date>=monthStart).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  return `<div class="section-title">Submission History <span class="num">${subs.length}</span> <span style="font-family:var(--mono);font-size:10px;color:var(--ink-soft);font-weight:400;">${monthLabel} · click Export on any date to download that day's full stock report</span></div>
  ${subs.map(s=>`
    <div class="hist-item">
      <div><div class="d">${s.date}</div><div class="m">${new Set(s.items.map(i=>i.code)).size} products · ${s.items.length} MFD batch lines · Submitted ${new Date(s.timestamp).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} · ID ${s.id}</div></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="badge ok">${s.status}</span>
        <button class="btn btn-ghost btn-sm" data-exportsub="${s.id}">⬇ Export</button>
      </div>
    </div>`).join('') || `<div class="empty">No submissions yet in ${monthLabel}.</div>`}
  `;
}

function CnfReports(){
  const sub = latestSubmissionFor(state.cnfUser.code);
  if(!sub) return `<div class="section-title">Reports &amp; Analytics</div><div class="empty"><div class="big">No submission yet</div>Submit stock at least once to see your ageing, near-expiry and safety analytics here.</div>`;

  const allFlagged = buildAttentionList(sub.items); // uncapped — every breach, not just top 6
  const expiredCount = allFlagged.filter(a=>a.status.cls==='expired').length;
  const nearExpiryCount = allFlagged.filter(a=>a.status.cls==='expiring').length;
  const criticalCount = allFlagged.filter(a=>a.status.cls==='critical').length;
  const ageingCount = allFlagged.filter(a=>a.status.cls==='ageing').length;
  const belowSafety = sub.items.filter(it=>{
    const p = state.masters.products.find(pp=>pp.code===it.code);
    return p && it.kgQty < p.safetyStockKg;
  });
  const totalKg = sub.items.reduce((s,it)=>s+it.kgQty,0);

  return `
  <div class="section-title">Reports &amp; Analytics <span class="num">as of ${sub.date}</span> <button class="btn btn-ghost btn-sm" id="btnExportCnfReport" style="margin-left:auto;">⬇ Export Full Report</button></div>

  <div class="hist-item" style="align-items:flex-start;">
    <div>
      <div class="d" style="font-size:12px;">Auto-download on every submit</div>
      <div class="m">Every time you tap Final Submit, a detailed report downloads automatically to this device.${reportFolderHandle?` Currently saving straight to <b>${reportFolderHandle.name}</b>.`:folderSaveSupported()?' Optionally, pick a folder below so reports save there directly instead of the usual Downloads folder.':' (Folder picking needs desktop Chrome/Edge — on this device, reports go to your normal Downloads.)'}</div>
    </div>
    ${folderSaveSupported() ? `<button class="btn btn-ghost btn-sm" id="btnChooseFolder">${reportFolderHandle?'Change Folder':'Choose Folder'}</button>` : ''}
  </div>

  <div class="kpi-row four">
    <div class="kpi"><div class="lbl">Total Stock (kg)</div><div class="val">${totalKg.toLocaleString('en-IN',{maximumFractionDigits:0})}</div></div>
    <div class="kpi"><div class="lbl">Expired</div><div class="val ${expiredCount?'alert':''}">${expiredCount}</div></div>
    <div class="kpi"><div class="lbl">Near Expiry</div><div class="val ${nearExpiryCount?'alert':''}">${nearExpiryCount}</div></div>
    <div class="kpi"><div class="lbl">Below Safety</div><div class="val ${belowSafety.length?'warn':''}">${belowSafety.length}</div></div>
  </div>

  <div class="section-title">Ageing Breach &amp; Near Expiry <span class="num">${allFlagged.length}</span></div>
  ${AttentionPanel(allFlagged, allFlagged.length, {clickable:true})}
  ${!allFlagged.length ? '<div class="empty">Nothing ageing, near expiry, or slow-moving right now 🎉</div>' : ''}

  ${belowSafety.length ? `<div class="section-title">Below Safety Stock <span class="num">${belowSafety.length}</span></div>
  ${belowSafety.map(it=>{
    const p = state.masters.products.find(pp=>pp.code===it.code);
    return `<div class="attn-row attn-critical" data-attn="${it.code}|${it.mfd||''}">
      <div class="an"><b>${it.name}</b><div class="am">${it.code} · ${it.kgQty.toFixed(1)}kg on hand · Safety norm ${p.safetyStockKg}kg</div></div>
      <span class="badge low">Short ${(p.safetyStockKg-it.kgQty).toFixed(1)}kg</span>
    </div>`;
  }).join('')}` : ''}

  <div class="section-title">Full Current Stock <span class="num">${new Set(sub.items.map(i=>i.code)).size} products</span></div>
  <div class="tablewrap"><table class="dtable dtable-light" style="background:#fff;border-radius:11px;overflow:hidden;">
    <thead><tr><th>Product Code</th><th>Product</th><th>Category</th><th class="mono">Qty</th><th class="mono">UOM</th><th class="mono">kg</th><th class="mono">SAP kg</th><th>Diff. Reason</th><th>MFD</th><th class="mono">Age (d)</th><th>Status</th></tr></thead>
    <tbody>
    ${sub.items.map(it=>{
      const p = state.masters.products.find(pp=>pp.code===it.code);
      if(!p) return '';
      const st = ageingStatus(p, it.mfd);
      const hasSap = it.sapQtyKg!=null;
      const diff = hasSap ? roundedDiffKg(it.kgQty, it.sapQtyKg) : null;
      return `<tr data-attn="${it.code}|${it.mfd||''}" style="cursor:pointer;">
        <td class="mono">${it.code}</td><td>${it.name}</td><td>${it.category}</td>
        <td class="mono">${it.qty}</td><td class="mono">${it.uom}</td><td class="mono">${it.kgQty.toFixed(1)}</td>
        <td class="mono">${hasSap?it.sapQtyKg.toFixed(1):'—'}</td>
        <td>${!hasSap ? '—' : withinTolerance(diff) ? '<span class="badge ok">Matches</span>' : `<span style="color:var(--red);font-size:11.5px;">${it.varianceReason||'(no reason given)'}</span>`}</td>
        <td class="mono">${it.mfd||'—'}</td><td class="mono">${st.age??'—'}</td>
        <td><span class="badge ${st.cls}">${st.label}</span></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>
  `;
}

  const item = sub.items.find(it=>it.code===code && (it.mfd||'')===mfd);
  const p = state.masters.products.find(pp=>pp.code===code);
  if(!item || !p) return '';
  const st = ageingStatus(p, item.mfd);
  const safetyStatus = item.kgQty < p.safetyStockKg ? 'low' : 'ok';
  const otherBatches = sub.items.filter(it=>it.code===code && (it.mfd||'')!==mfd);
  return `<div class="modal-bg dark" id="cnfLineDetailBg"><div class="modal-dark">
    <h3>${p.name}</h3>

    <button class="btn btn-dark modal-close" id="btnCloseCnfLineDetail">Close</button>
  </div></div>`;
}

function buildSubmissionItems(){
  // Flattens {code: [batches]} into one line per MFD batch — a product with
  // 6 different manufacturing dates produces 6 items with the same code.
  const items = [];
  Object.entries(state.draftItems).forEach(([code,batches])=>{
    const p = state.masters.products.find(pp=>pp.code===code);
    if(!p) return;
    const sapRow = state.sapUpload ? state.sapUpload.rows.find(r=>r.code===code) : null;
    (batches||[]).forEach(b=>{
      if(b.qty===undefined || b.qty==='') return;
      items.push({
        code, name:p.name, category:p.category, qty:Number(b.qty)||0, uom:b.uom||p.defaultUOM,
        kgQty: convertToKg(p, b.qty, b.uom||p.defaultUOM), mfd: b.mfd||'',
        sapQtyKg: sapRow ? sapRow.currentStockKg : null,
        varianceReason: sapRow ? (state.varianceReasons[code]||'') : '',
        approvedOrder: sapRow ? (sapRow.approvedOrder||0) : null,
        pendingOrder: sapRow ? (sapRow.pendingOrder||0) : null
      });
    });
  });
  return items;
}

function CnfFinalModal(){
  const items = buildSubmissionItems();
  const byCode = {};
  items.forEach(i=>{ (byCode[i.code]=byCode[i.code]||[]).push(i); });
  const productsUpdated = Object.keys(byCode).length;
  const productsZero = Object.values(byCode).filter(list=>list.reduce((s,i)=>s+i.qty,0)===0).length;
  const multiMfd = Object.values(byCode).filter(list=>list.length>1).length;
  const unresolvedCodes = state.sapUpload ? state.sapUpload.rows.filter(r=>hasUnresolvedVariance(r.code)) : [];
  const missing = missingRequiredCodes();
  const varianceCount = Object.entries(byCode).filter(([code,list])=>{
    const sapRow = state.sapUpload && state.sapUpload.rows.find(r=>r.code===code);
    if(!sapRow) return false;
    const total = list.reduce((s,i)=>s+i.kgQty,0);
    return !withinTolerance(roundedDiffKg(total, sapRow.currentStockKg));
  }).length;
  const canSubmit = unresolvedCodes.length===0 && missing.length===0 && productsUpdated>0;
  return `<div class="modal-bg center" id="finalModalBg"><div class="modal">
    <h3>Confirm Final Submission</h3>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:0;">Review before locking today's physical stock position.</p>
    <div class="confirm-row"><span>Stock Date</span><b>${state.submitDate}</b></div>
    <div class="confirm-row"><span>CNF</span><b>${state.cnfUser.name} (${state.cnfUser.code})</b></div>
    <div class="confirm-row"><span>SAP Current Stock File</span><b>${state.sapUpload?state.sapUpload.fileName:'—'}</b></div>
    <div class="confirm-row"><span>Products with SAP Stock &gt; 0</span><b>${state.sapUpload?state.sapUpload.rows.filter(r=>r.currentStockKg>0).length:0}</b></div>
    <div class="confirm-row"><span>Products Updated</span><b>${productsUpdated}</b></div>
    <div class="confirm-row"><span>Total MFD Batch Lines</span><b>${items.length}</b></div>
    <div class="confirm-row"><span>Products with Multiple MFD Batches</span><b>${multiMfd}</b></div>
    <div class="confirm-row"><span>Products with Zero Stock</span><b>${productsZero}</b></div>
    <div class="confirm-row"><span>Products with a Difference vs SAP</span><b style="color:${varianceCount?'var(--orange)':'inherit'}">${varianceCount}</b></div>
    ${missing.length ? `<div class="confirm-row" style="border:none;"><span style="color:var(--red);font-weight:600;">⚠ ${missing.length} product${missing.length!==1?'s':''} with SAP current stock still ${missing.length===1?'has':'have'} nothing entered — every product with stock must be submitted. Go back and fill ${missing.length===1?'it':'them'} in.</span></div>` : ''}
    ${unresolvedCodes.length ? `<div class="confirm-row" style="border:none;"><span style="color:var(--red);font-weight:600;">⚠ ${unresolvedCodes.length} item${unresolvedCodes.length!==1?'s':''} still need${unresolvedCodes.length===1?'s':''} a difference reason before you can submit — go back and fill ${unresolvedCodes.length===1?'it':'them'} in.</span></div>` : ''}
    <div style="display:flex;gap:8px;margin-top:18px;">
      <button class="btn btn-ghost btn-block" id="btnCancelFinal">Cancel</button>
      <button class="btn btn-primary btn-block" id="btnConfirmFinal" ${canSubmit?'':'disabled'}>FINAL SUBMIT STOCK</button>
    </div>
  </div></div>`;
}

    <div class="drow" style="border:none;padding:4px 0;"><span style="font-family:var(--mono);font-size:11px;color:var(--wheat-dim);text-transform:uppercase;">Last synced</span><b style="font-family:var(--mono);font-size:13px;">${lsGet('masterSyncedAt') ? new Date(Number(lsGet('masterSyncedAt'))).toLocaleString('en-IN') : 'never'}</b></div>

  </div>
  <div class="panel-card">
    <h4>What "Local Demo Mode" means</h4>
