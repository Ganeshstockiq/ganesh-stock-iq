function buildSubmissionItems(){
  // Flattens {code: [batches]} into one line per MFD batch — a product with
  // 6 different manufacturing dates produces 6 items with the same code.
  const items = [];
  Object.entries(state.draftItems).forEach(([code,batches])=>{
    const p = state.masters.products.find(pp=>pp.code===code);
    if(!p) return;
    const sapRow = state.sapUpload ? state.sapUpload.rows.find(r=>r.code===code) : null;
    (batches||[]).forEach(b=>{
      if(b.qty===undefined || b.qty==='') return;
      items.push({
        code, name:p.name, category:p.category, qty:Number(b.qty)||0, uom:b.uom||p.defaultUOM,
        kgQty: convertToKg(p, b.qty, b.uom||p.defaultUOM), mfd: b.mfd||'',
        sapQtyKg: sapRow ? sapRow.currentStockKg : null,
        varianceReason: sapRow ? (state.varianceReasons[code]||'') : '',
        approvedOrder: sapRow ? (sapRow.approvedOrder||0) : null,
        pendingOrder: sapRow ? (sapRow.pendingOrder||0) : null
      });
    });
  });
  return items;
}

function CnfFinalModal(){
  const items = buildSubmissionItems();
  const byCode = {};
  items.forEach(i=>{ (byCode[i.code]=byCode[i.code]||[]).push(i); });
  const productsUpdated = Object.keys(byCode).length;
  const productsZero = Object.values(byCode).filter(list=>list.reduce((s,i)=>s+i.qty,0)===0).length;
  const multiMfd = Object.values(byCode).filter(list=>list.length>1).length;
  const unresolvedCodes = state.sapUpload ? state.sapUpload.rows.filter(r=>hasUnresolvedVariance(r.code)) : [];
  const missing = missingRequiredCodes();
  const varianceCount = Object.entries(byCode).filter(([code,list])=>{
    const sapRow = state.sapUpload && state.sapUpload.rows.find(r=>r.code===code);
    if(!sapRow) return false;
    const total = list.reduce((s,i)=>s+i.kgQty,0);
    return !withinTolerance(roundedDiffKg(total, sapRow.currentStockKg));
  }).length;
  const canSubmit = unresolvedCodes.length===0 && missing.length===0 && productsUpdated>0;
  return `<div class="modal-bg center" id="finalModalBg"><div class="modal">
    <h3>Confirm Final Submission</h3>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:0;">Review before locking today's physical stock position.</p>
    <div class="confirm-row"><span>Stock Date</span><b>${state.submitDate}</b></div>
    <div class="confirm-row"><span>CNF</span><b>${state.cnfUser.name} (${state.cnfUser.code})</b></div>
    <div class="confirm-row"><span>SAP Current Stock File</span><b>${state.sapUpload?state.sapUpload.fileName:'—'}</b></div>
    <div class="confirm-row"><span>Products with SAP Stock &gt; 0</span><b>${state.sapUpload?state.sapUpload.rows.filter(r=>r.currentStockKg>0).length:0}</b></div>
    <div class="confirm-row"><span>Products Updated</span><b>${productsUpdated}</b></div>
    <div class="confirm-row"><span>Total MFD Batch Lines</span><b>${items.length}</b></div>
    <div class="confirm-row"><span>Products with Multiple MFD Batches</span><b>${multiMfd}</b></div>
    <div class="confirm-row"><span>Products with Zero Stock</span><b>${productsZero}</b></div>
    <div class="confirm-row"><span>Products with a Difference vs SAP</span><b style="color:${varianceCount?'var(--orange)':'inherit'}">${varianceCount}</b></div>
    ${missing.length ? `<div class="confirm-row" style="border:none;"><span style="color:var(--red);font-weight:600;">⚠ ${missing.length} product${missing.length!==1?'s':''} with SAP current stock still ${missing.length===1?'has':'have'} nothing entered — every product with stock must be submitted. Go back and fill ${missing.length===1?'it':'them'} in.</span></div>` : ''}
    ${unresolvedCodes.length ? `<div class="confirm-row" style="border:none;"><span style="color:var(--red);font-weight:600;">⚠ ${unresolvedCodes.length} item${unresolvedCodes.length!==1?'s':''} still need${unresolvedCodes.length===1?'s':''} a difference reason before you can submit — go back and fill ${unresolvedCodes.length===1?'it':'them'} in.</span></div>` : ''}
    <div style="display:flex;gap:8px;margin-top:18px;">
      <button class="btn btn-ghost btn-block" id="btnCancelFinal">Cancel</button>
      <button class="btn btn-primary btn-block" id="btnConfirmFinal" ${canSubmit?'':'disabled'}>FINAL SUBMIT STOCK</button>
    </div>
  </div></div>`;
}

function parseCsv(text){
  const rows = [];
  let i=0, field='', row=[], inQuotes=false;
  const pushField = ()=>{ row.push(field); field=''; };
  const pushRow = ()=>{ pushField(); rows.push(row); row=[]; };
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQuotes=false; i++; continue; }
      field+=c; i++; continue;
    }
    if(c==='"'){ inQuotes=true; i++; continue; }
    if(c===','){ pushField(); i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ pushRow(); i++; continue; }
    field+=c; i++; continue;
  }
  if(field.length || row.length){ pushRow(); }
  return rows.filter(r=>!(r.length===1 && r[0].trim()===''));
}
function csvRowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows[0].map(h=>String(h).trim().toLowerCase());
  return rows.slice(1).map(r=>{
    const o = {};
    headers.forEach((h,idx)=>{ o[h] = String(r[idx]!==undefined && r[idx]!==null ? r[idx] : '').trim(); });
    return o;
  });
}

function downloadCsvFile(filename, text){
  const blob = new Blob([text], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// Import behaves as an UPSERT: a code that already exists (e.g. auto-created
// by a SAP Current Stock upload with no UOM conversion yet) gets its provided
// fields UPDATED in place — this is how a "UOM Converter" file (code + bagToKg
// + pcToKg, everything else left blank) is meant to be uploaded. A code that
// doesn't exist yet needs name + category and gets CREATED.

// Guards against a real bug: an import/header row leaking in as if it were
// actual data (e.g. the literal word "Category" ending up as a category
// name with whatever number happened to be in the next column as its
// self-life). Any of these values are refused as a category name anywhere
// categories get created — import, Push from Sheet, or the Add Category
// form.
const BOGUS_CATEGORY_NAMES = new Set(['CATEGORY','CATEGORIES','CAT','NAME','PRODUCT','PRODUCTS','SELFLIFEDAYS','SELF-LIFE','SELF LIFE','N/A','NA','']);
function isBogusCategoryName(name){
  return BOGUS_CATEGORY_NAMES.has(String(name||'').trim().toUpperCase());
}

function validateProductRows(objs){
  const valid = [], errors = [], warnings = [];
  const seenCodes = new Set();
  const newCategories = {}; // name -> default self-life, auto-created by this import
  objs.forEach((o,idx)=>{
    const rowNum = idx+2; // header is row 1
    const code = o.code;
    if(!code){ errors.push(`Row ${rowNum}: missing product code — skipped.`); return; }
    if(seenCodes.has(code)){ errors.push(`Row ${rowNum}: code "${code}" appears twice in this file — first occurrence used.`); return; }
    seenCodes.add(code);

    const existing = state.masters.products.find(p=>p.code===code);

    if(!existing){
      const name = o.name;
      if(!name){ errors.push(`Row ${rowNum} (${code}): new code with no name — need a name to create a product. Skipped.`); return; }
      let category = (o.category||'').toUpperCase();
      if(isBogusCategoryName(category)){ warnings.push(`Row ${rowNum} (${code}): category "${o.category}" looks like a stray header value, not a real category — set to OTHERS.`); category = 'OTHERS'; }
      else if(!category){ category = 'OTHERS'; }
      else if(!state.masters.categories.includes(category) && !newCategories[category]){
        newCategories[category] = 180; // new category from the file — auto-created with a default self-life, editable after
      }
      let uom = (o.defaultuom||'KG').toUpperCase();
      if(!['KG','PC','BAG'].includes(uom)){ warnings.push(`Row ${rowNum} (${code}): unknown UOM "${o.defaultuom}" — set to KG.`); uom = 'KG'; }
      const bagToKg = o.bagtokg ? Number(o.bagtokg) : null;
      const pcToKg = o.pctokg ? Number(o.pctokg) : null;
      const safetyStockKg = o.safetystockkg ? Number(o.safetystockkg)||0 : 0;
      const selfLifeOverride = o.selflifeoverride ? Number(o.selflifeoverride)||null : null;
      valid.push({action:'create', code, name, category, defaultUOM:uom, bagToKg, pcToKg, safetyStockKg, selfLifeOverride});
      return;
    }

    // Existing product — only update fields actually present in this row,
    // so a UOM-converter-only file (blank name/category/etc) never wipes
    // out data that's already correct.
    const patch = {};
    const changed = [];
    if(o.name){ patch.name = o.name; changed.push('name'); }
    if(o.category){
      const cat = o.category.toUpperCase();
      if(isBogusCategoryName(cat)){
        warnings.push(`Row ${rowNum} (${code}): category "${o.category}" looks like a stray header value, not a real category — left unchanged.`);
      } else {
        if(!state.masters.categories.includes(cat) && !newCategories[cat]) newCategories[cat] = 180;
        patch.category = cat; changed.push('category');
      }
    }
    if(o.defaultuom){
      const u = o.defaultuom.toUpperCase();
      if(['KG','PC','BAG'].includes(u)){ patch.defaultUOM = u; changed.push('defaultUOM'); }
      else warnings.push(`Row ${rowNum} (${code}): unknown UOM "${o.defaultuom}" — left unchanged.`);
    }
    if(o.bagtokg!==''){ patch.bagToKg = Number(o.bagtokg)||null; changed.push('bagToKg'); }
    if(o.pctokg!==''){ patch.pcToKg = Number(o.pctokg)||null; changed.push('pcToKg'); }
    if(o.safetystockkg!==''){ patch.safetyStockKg = Number(o.safetystockkg)||0; changed.push('safetyStockKg'); }
    if(o.selflifeoverride!==''){ patch.selfLifeOverride = Number(o.selflifeoverride)||null; changed.push('selfLifeOverride'); }
    if(!changed.length){ warnings.push(`Row ${rowNum} (${code}): matches an existing product but no fields to update — skipped.`); return; }
    valid.push({action:'update', code, name: existing.name, category: existing.category, defaultUOM: patch.defaultUOM||existing.defaultUOM, bagToKg: patch.bagToKg!==undefined?patch.bagToKg:existing.bagToKg, pcToKg: patch.pcToKg!==undefined?patch.pcToKg:existing.pcToKg, safetyStockKg: patch.safetyStockKg!==undefined?patch.safetyStockKg:existing.safetyStockKg, selfLifeOverride: patch.selfLifeOverride!==undefined?patch.selfLifeOverride:existing.selfLifeOverride, patch, changed});
  });
  if(Object.keys(newCategories).length){
    warnings.unshift(`${Object.keys(newCategories).length} new categor${Object.keys(newCategories).length===1?'y':'ies'} will be added: ${Object.keys(newCategories).join(', ')} (180-day default self-life — adjust anytime in Self-Life & Thresholds).`);
  }
  return {valid, errors, warnings, newCategories};
}
function validateCnfRows(objs){
  const valid = [], errors = [], warnings = [];
  const seenCodes = new Set();
  objs.forEach((o,idx)=>{
    const rowNum = idx+2;
    const code = o.code, name = o.name;
    if(!code){ errors.push(`Row ${rowNum}: missing CNF code — skipped.`); return; }
    if(!name){ errors.push(`Row ${rowNum} (${code}): missing CNF name — skipped.`); return; }
    if(state.masters.cnfs.some(c=>c.code===code) || seenCodes.has(code)){ errors.push(`Row ${rowNum}: code "${code}" already exists — skipped.`); return; }
    const userId = o.userid || code;
    const password = o.password || 'demo';
    let status = o.status && ['Active','Inactive'].includes(o.status) ? o.status : 'Active';
    if(o.status && !['Active','Inactive'].includes(o.status)) warnings.push(`Row ${rowNum} (${code}): unknown status "${o.status}" — set to Active.`);
    const location = o.location || '';
    seenCodes.add(code);
    valid.push({code, name, userId, password, status, location});
  });
  return {valid, errors, warnings};
}

function ImportPreviewModal(){
  if(!state.importPreview) return '';
  const {type, valid, errors, warnings} = state.importPreview;
  const label = type==='product' ? 'Products' : 'CNFs';
  const cols = type==='product' ? ['action','code','name','category','defaultUOM','bagToKg','pcToKg','safetyStockKg'] : ['code','name','userId','location','status'];
  const creates = type==='product' ? valid.filter(r=>r.action==='create').length : valid.length;
  const updates = type==='product' ? valid.filter(r=>r.action==='update').length : 0;
  return `<div class="modal-bg dark" id="importPreviewBg"><div class="modal-dark" style="max-width:680px;">
    <h3>Import ${label} — Preview</h3>
    <div class="msub">${creates?`${creates} new`:''}${creates&&updates?' · ':''}${updates?`${updates} updated (existing codes)`:''}${!creates&&!updates?'0 rows':''}${errors.length?` · ${errors.length} skipped`:''}${warnings.length?` · ${warnings.length} warning${warnings.length!==1?'s':''}`:''}</div>
    ${valid.length ? `<div class="tablewrap" style="max-height:220px;overflow-y:auto;"><table class="dtable">
      <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody>${valid.slice(0,100).map(r=>`<tr>${cols.map(c=>c==='action'?`<td><span class="badge ${r.action==='create'?'ok':'low'}">${r.action||'create'}</span></td>`:`<td class="mono">${r[c]??''}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>` : `<p style="color:var(--red);font-size:13px;">No valid rows found to import.</p>`}
    ${warnings.length ? `<div class="dgrp">Warnings</div><div style="max-height:100px;overflow-y:auto;font-size:12px;color:var(--amber);">${warnings.map(w=>`<div>${w}</div>`).join('')}</div>` : ''}
    ${errors.length ? `<div class="dgrp">Skipped rows</div><div style="max-height:100px;overflow-y:auto;font-size:12px;color:#e28a76;">${errors.map(e=>`<div>${e}</div>`).join('')}</div>` : ''}
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost btn-block" id="btnCancelImport">Cancel</button>
      <button class="btn btn-primary btn-block" id="btnConfirmImport" ${valid.length?'':'disabled'}>Import ${valid.length} ${label}</button>
    </div>
  </div></div>`;
}

// Impossible-to-miss banner whenever ANY filter is narrowing what's shown —
// this is the actual fix for a real bug: clicking a CNF from the
// notification bell silently narrowed the global filter to just that one
// CNF, with nothing anywhere clearly showing that had happened. Someone
// checking a different CNF's data afterward would see it "missing" with no
// visible reason why. This makes the active filter state impossible to
// overlook, on every MIS screen, regardless of how it got set.
function ActiveFilterBanner(){
  const f = state.misFilters;
  const cnfFiltered = f.cnfs!=='ALL';
  const catFiltered = f.category!=='ALL';
  const statusFiltered = f.status!=='ALL';
  if(!cnfFiltered && !catFiltered && !statusFiltered) return '';
  const parts = [];
  if(cnfFiltered){
    const names = (Array.isArray(f.cnfs)?f.cnfs:[f.cnfs]).map(code=>{
      const c = state.masters.cnfs.find(cc=>cc.code===code);
      return c ? c.name : code;
    });
    parts.push(`CNF: ${names.join(', ')}`);
  }
  if(catFiltered) parts.push(`Category: ${f.category}`);
  if(statusFiltered) parts.push(`Status: ${f.status}`);
  return `<div class="cadence-banner overdue" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
    <span>🔍 <b>Filtered</b> — ${parts.join(' · ')}. Other CNFs/products won't show until this is cleared.</span>
    <button class="btn btn-dark btn-sm" id="btnClearMisFilters">Clear Filter</button>
  </div>`;
}

function MisFilters(){
  const selectedCnfs = state.misFilters.cnfs;
  return `<div class="panel-card">
    <div class="chip-row">
      <span class="chip ${selectedCnfs==='ALL'?'on':''}" data-cnfchip="ALL">All CNFs</span>
      ${state.masters.cnfs.map(c=>`<span class="chip ${Array.isArray(selectedCnfs)&&selectedCnfs.includes(c.code)?'on':''}" data-cnfchip="${c.code}">${c.name} · ${c.code}</span>`).join('')}

      <div class="fg"><label>Ageing Status</label><select id="misStatus"><option value="ALL">All</option>${['fresh','normal','ageing','critical','expiring','expired'].map(s=>`<option value="${s}" ${state.misFilters.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
  </div>`;
}

function filteredRows(){

}

      <tbody>

    <div class="bars">
      ${Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`

  <div class="panel-card">

// Shared export helper — every report screen with a table gets its own
// quick "⬇ Export" that respects whatever filters are currently applied,
// instead of forcing a trip to the central Export Centre for a one-off.
function exportGenericCsv(filename, headers, dataRows){
  const esc = v => { const s = (v===null||v===undefined) ? '' : String(v); return s.includes(',') ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = [headers.map(esc).join(',')];
  dataRows.forEach(r=> lines.push(r.map(esc).join(',')));
  downloadCsvFile(filename, lines.join('\n'));
}

// Full submission-level history across all CNFs — a date range, per-CNF
// filter, and month-over-month movement comparison. Uses ensureAllHistory()
// on demand rather than always (bootstrap only carries each CNF's latest
// submission, to keep the main dashboards fast) — click "Load Full History"
// once to pull everything, then filter freely without re-fetching.
function MisMovement(){
  if(!state.movementFilters){
    const today = new Date();
    const twoMonthsAgo = new Date(today.getFullYear(), today.getMonth()-2, 1);
    state.movementFilters = { cnf:'ALL', fromDate: localDateISO(twoMonthsAgo), toDate: todayISO() };
  }
  const f = state.movementFilters;
  const filtered = state.submissions
    .filter(s=>s.date>=f.fromDate && s.date<=f.toDate && (f.cnf==='ALL' || s.cnfCode===f.cnf))
    .sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp));

  const toD = new Date(f.toDate);
  const thisMonthStart = localDateISO(new Date(toD.getFullYear(), toD.getMonth(), 1));
  const thisMonthEnd = f.toDate;
  const lastMonthStart = localDateISO(new Date(toD.getFullYear(), toD.getMonth()-1, 1));
  const lastMonthEnd = localDateISO(new Date(toD.getFullYear(), toD.getMonth(), 0));

  const cnfsToShow = f.cnf==='ALL' ? state.masters.cnfs.filter(c=>c.status==='Active') : state.masters.cnfs.filter(c=>c.code===f.cnf);
  const monthlyStats = cnfsToShow.map(c=>{
    const thisSubs = state.submissions.filter(s=>s.cnfCode===c.code && s.date>=thisMonthStart && s.date<=thisMonthEnd);
    const lastSubs = state.submissions.filter(s=>s.cnfCode===c.code && s.date>=lastMonthStart && s.date<=lastMonthEnd);
    const thisKg = thisSubs.reduce((sum,s)=>sum+s.items.reduce((a,i)=>a+i.kgQty,0),0);
    const lastKg = lastSubs.reduce((sum,s)=>sum+s.items.reduce((a,i)=>a+i.kgQty,0),0);
    const pctChange = lastKg>0 ? Math.round(((thisKg-lastKg)/lastKg)*1000)/10 : (thisKg>0?100:0);
    return {cnf:c, thisCount:thisSubs.length, lastCount:lastSubs.length, thisKg, lastKg, pctChange};
  });

  return `
  <div class="panel-card">
    <h4>Filters</h4>
    <div class="formgrid" style="grid-template-columns:repeat(3,1fr);">
      <div class="fg"><label>CNF</label><select id="movCnfSel"><option value="ALL" ${f.cnf==='ALL'?'selected':''}>All CNFs</option>${state.masters.cnfs.map(c=>`<option value="${c.code}" ${f.cnf===c.code?'selected':''}>${c.name} · ${c.code}</option>`).join('')}</select></div>
      <div class="fg"><label>From</label><input type="date" id="movFromDate" value="${f.fromDate}" max="${todayISO()}"></div>
      <div class="fg"><label>To</label><input type="date" id="movToDate" value="${f.toDate}" max="${todayISO()}"></div>
    </div>
    <div class="small-btn-row" style="margin-top:8px;">
      <button class="btn btn-dark btn-sm" id="btnLoadFullHistory">${state.allHistoryLoaded?'⟳ Refresh Full History':'Load Full History'}</button>
      <button class="btn btn-ghost btn-sm" id="btnExportMovement">⬇ Export</button>
    </div>
    ${!state.allHistoryLoaded ? `<p style="font-family:var(--mono);font-size:11px;color:var(--orange);margin-top:8px;">⚠ Only showing what's already cached (usually just each CNF's latest submission) — click "Load Full History" to pull every submission in this range from the server.</p>` : ''}
  </div>

  <div class="panel-card">
    <h4>Month-over-Month <span style="font-family:var(--mono);font-size:9px;color:var(--wheat-dim);text-transform:none;letter-spacing:0;font-weight:400;">${new Date(thisMonthStart+'T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})} vs ${new Date(lastMonthStart+'T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</span></h4>
    <div class="tablewrap"><table class="dtable">
      <thead><tr><th>CNF</th><th class="mono">Code</th><th class="mono">This Month Submits</th><th class="mono">This Month kg</th><th class="mono">Last Month Submits</th><th class="mono">Last Month kg</th><th class="mono">Change</th><th>Trend</th></tr></thead>
      <tbody>
      ${monthlyStats.map(m=>`<tr>
        <td>${m.cnf.name}</td><td class="mono">${m.cnf.code}</td>
        <td class="mono">${m.thisCount}</td><td class="mono">${m.thisKg.toFixed(0)}</td>
        <td class="mono">${m.lastCount}</td><td class="mono">${m.lastKg.toFixed(0)}</td>
        <td class="mono" style="color:${m.pctChange>0?'var(--green)':m.pctChange<0?'var(--red)':'inherit'}">${m.pctChange>0?'+':''}${m.pctChange}%</td>
        <td>${m.pctChange>5?'📈 Up':m.pctChange<-5?'📉 Down':'➡ Flat'}</td>
      </tr>`).join('') || `<tr><td colspan="8" style="text-align:center;padding:20px;">No active CNFs to compare.</td></tr>`}
      </tbody>
    </table></div>
    <p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-top:8px;">"kg" is the total physical stock across all products in that CNF's submissions that month — a rough movement/volume signal, not a sales figure (this app tracks stock levels, not dispatches).</p>
  </div>

  <div class="panel-card">
    <h4>Submission History <span style="font-family:var(--mono);font-size:11px;color:var(--wheat-dim);">${filtered.length} submissions in range · click a row for that day's full stock</span></h4>
    <div class="tablewrap"><table class="dtable">
      <thead><tr><th class="mono">Date</th><th>CNF</th><th class="mono">Code</th><th class="mono">Products</th><th class="mono">Batch Lines</th><th class="mono">Total kg</th><th class="mono">Ageing/Critical</th><th>Submission ID</th></tr></thead>
      <tbody>
      ${filtered.map(s=>{
        const kg = s.items.reduce((a,i)=>a+i.kgQty,0);
        const ag = s.items.filter(it=>{
          const p = state.masters.products.find(pp=>pp.code===it.code);
          if(!p) return false;
          const st = ageingStatus(p, it.mfd);
          return ['critical','expiring','expired'].includes(st.cls);
        }).length;
        return `<tr data-movsub="${s.id}"><td class="mono">${s.date}</td><td>${s.cnfName}</td><td class="mono">${s.cnfCode}</td>
          <td class="mono">${new Set(s.items.map(i=>i.code)).size}</td><td class="mono">${s.items.length}</td>
          <td class="mono">${kg.toFixed(0)}</td><td class="mono" style="color:${ag?'var(--orange)':'inherit'}">${ag}</td>
          <td class="mono">${s.id}</td></tr>`;
      }).join('') || `<tr><td colspan="8" style="text-align:center;padding:20px;">No submissions in this range.</td></tr>`}
      </tbody>
    </table></div>
  </div>
  `;
}

/* ---------------- CSV export ---------------- */
function toCsv(rows){
  const headers = ['Stock Date','CNF Name','CNF Code','Product Code','Product Name','Category','Entered Qty','Entered UOM','KG','MFD','Stock Age (d)','Self-Life (d)','Remaining Shelf Life (d)','Ageing Status','Safety Stock (kg)','Safety Status','Submission ID'];
  const lines = [headers.join(',')];
  rows.forEach(r=>{
    const line = [r.sub.date, r.cnf.name, r.cnf.code, r.product.code, `"${r.product.name}"`, r.product.category, r.item.qty, r.item.uom, r.item.kgQty.toFixed(2), r.item.mfd||'', r.ageStatus.age??'', r.ageStatus.life??'', r.ageStatus.remaining??'', r.ageStatus.label, r.product.safetyStockKg, r.safetyStatus, r.sub.id];
    lines.push(line.join(','));
  });
  return lines.join('\n');
}
async function runExport(){
  const prog = document.getElementById('exportProg');
  const stages = ['Preparing Data…','Filtering…','Applying UOM Conversion…','Calculating Ageing…','Preparing CSV…','Download Ready'];
  prog.style.display='block';
  for(let i=0;i<stages.length;i++){
    prog.textContent = `${stages[i]}  ${Math.round((i+1)/stages.length*100)}%`;
    await new Promise(r=>setTimeout(r, 220));
  }
  const rows = filteredRows();
  const csv = toCsv(rows);
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `cnf-stock-export-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

}

/* ---------------- Event binding ---------------- */
function bindGlobal(){
  // Theme switcher
  const btnThemeToggle = document.getElementById('btnThemeToggle');
  if(btnThemeToggle) btnThemeToggle.onclick = (e)=>{ e.stopPropagation(); state.themeMenuOpen = !state.themeMenuOpen; render(); };
  document.querySelectorAll('[data-theme-pick]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    setTheme(el.dataset.themePick);
    state.themeMenuOpen = false;
    render();
  });
  if(state.themeMenuOpen){
    const closeThemeMenu = ()=>{ state.themeMenuOpen=false; render(); document.removeEventListener('click', closeThemeMenu); };
    // Deferred so this doesn't fire on the same click that opened the menu
    setTimeout(()=>document.addEventListener('click', closeThemeMenu), 0);
  }

  // Notification bell (MIS only) — "what's new since I last checked"
  const btnNotifToggle = document.getElementById('btnNotifToggle');
  if(btnNotifToggle) btnNotifToggle.onclick = (e)=>{ e.stopPropagation(); state.notifMenuOpen = !state.notifMenuOpen; render(); };
  document.querySelectorAll('[data-notifcnf]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    state.misFilters.cnfs = [el.dataset.notifcnf];
    state.misScreen = 'stock';
    state.notifMenuOpen = false;
    render();
  });
  const btnClearMisFilters = document.getElementById('btnClearMisFilters');
  if(btnClearMisFilters) btnClearMisFilters.onclick = ()=>{
    state.misFilters = { cnfs:'ALL', category:'ALL', status:'ALL' };
    render();
  };
  const btnNotifMarkRead = document.getElementById('btnNotifMarkRead');
  if(btnNotifMarkRead) btnNotifMarkRead.onclick = (e)=>{
    e.stopPropagation();
    lsSet('misLastSeenAt', Date.now());
    state.notifMenuOpen = false;
    render();

    if(!input) return;
    input.onchange = ()=>{
      const file = input.files[0];
      if(!file) return;
      const type = input.dataset.importType;
      const isExcel = /\.xlsx?$/i.test(file.name);
      const reader = new FileReader();
      reader.onload = ()=>{
        let rows;
        if(isExcel){
          if(typeof XLSX === 'undefined'){ showToast('Excel reader failed to load — check your connection and try again.'); return; }
          const wb = XLSX.read(reader.result, {type:'array'});
          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
        } else {
          rows = parseCsv(String(reader.result));
        }
        const objs = csvRowsToObjects(rows);
        const result = type==='product' ? validateProductRows(objs) : validateCnfRows(objs);
        state.importPreview = Object.assign({type}, result);
        input.value = '';
        render();
      };
      if(isExcel) reader.readAsArrayBuffer(file); else reader.readAsText(file);
    };
  });
  const importPreviewBg = document.getElementById('importPreviewBg');
  if(importPreviewBg){
    importPreviewBg.onclick = (e)=>{ if(e.target===importPreviewBg){ state.importPreview=null; render(); } };
    const btnCancelImport = document.getElementById('btnCancelImport');
    if(btnCancelImport) btnCancelImport.onclick = ()=>{ state.importPreview=null; render(); };
    const btnConfirmImport = document.getElementById('btnConfirmImport');
    if(btnConfirmImport) btnConfirmImport.onclick = async ()=>{
      const {type, valid, newCategories} = state.importPreview;
      if(type==='product'){
        if(newCategories){
          Object.entries(newCategories).forEach(([cat,life])=>{
            if(!state.masters.categories.includes(cat)){
              state.masters.categories.push(cat);
              state.masters.categorySelfLife[cat] = life;
            }
          });
        }
        let created=0, updated=0;
        valid.forEach(r=>{
          if(r.action==='update'){
            const existing = state.masters.products.find(p=>p.code===r.code);
            if(existing){ Object.assign(existing, r.patch); updated++; }
          } else {
            state.masters.products.push({code:r.code, name:r.name, category:r.category, defaultUOM:r.defaultUOM, bagToKg:r.bagToKg, pcToKg:r.pcToKg, safetyStockKg:r.safetyStockKg, selfLifeOverride:r.selfLifeOverride});
            created++;
          }
        });
        await saveMasters();
        state.importPreview = null;
        render();
        const newCatCount = newCategories ? Object.keys(newCategories).length : 0;
        showToast(`${created} product${created!==1?'s':''} added, ${updated} updated${newCatCount?`, ${newCatCount} new categor${newCatCount===1?'y':'ies'}`:''}`);
      } else {
        state.masters.cnfs.push(...valid);
        await saveMasters();
        state.importPreview = null;
        render();
        showToast(`${valid.length} CNFs imported`);
      }
    };

  // Report Builder
  document.querySelectorAll('[data-rbcnf]').forEach(el=>el.onclick=()=>{
    const code = el.dataset.rbcnf;
    if(code==='ALL'){ state.reportFilters.cnfs='ALL'; }
    else{
      let cur = Array.isArray(state.reportFilters.cnfs) ? state.reportFilters.cnfs.slice() : [];
      if(cur.includes(code)) cur = cur.filter(c=>c!==code); else cur.push(code);
      state.reportFilters.cnfs = cur.length ? cur : 'ALL';
    }
    render();
  });
  document.querySelectorAll('[data-rbcat]').forEach(el=>el.onclick=()=>{
    const cat = el.dataset.rbcat;
    if(cat==='ALL'){ state.reportFilters.categories='ALL'; }
    else{
      let cur = Array.isArray(state.reportFilters.categories) ? state.reportFilters.categories.slice() : [];
      if(cur.includes(cat)) cur = cur.filter(c=>c!==cat); else cur.push(cat);
      state.reportFilters.categories = cur.length ? cur : 'ALL';
    }
    render();
  });
  document.querySelectorAll('[data-rbcol]').forEach(el=>el.onclick=()=>{
    const key = el.dataset.rbcol;

    state.reportFilters.columns = cols.includes(key) ? cols.filter(c=>c!==key) : cols.concat([key]);
    render();
  });
  const btnGenerateReport = document.getElementById('btnGenerateReport');
  if(btnGenerateReport) btnGenerateReport.onclick = ()=>{
    state.reportRows = buildReportRows();
    render();
    showToast(state.reportRows.length+' rows generated');
  };
  const btnExportReport = document.getElementById('btnExportReport');
  if(btnExportReport) btnExportReport.onclick = ()=>{
    const csv = reportToCsv();
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `ganesh-stock-iq-report-${todayISO()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  // API Connection screen
  const btnSaveApiUrl = document.getElementById('btnSaveApiUrl');
  if(btnSaveApiUrl) btnSaveApiUrl.onclick = async ()=>{
    const url = document.getElementById('apiUrlInput').value.trim();
    setApiUrl(url);
    showToast(url ? 'Connecting…' : 'Disconnected — using local demo mode');
    render();
    await loadAll();
  };
  const btnTestApiUrl = document.getElementById('btnTestApiUrl');
  if(btnTestApiUrl) btnTestApiUrl.onclick = async ()=>{
    const url = document.getElementById('apiUrlInput').value.trim();
    const result = document.getElementById('apiTestResult');
    if(!url){ result.textContent = 'Enter a URL first.'; result.style.color = 'var(--orange)'; return; }
    result.textContent = 'Testing…'; result.style.color = 'var(--wheat-dim)';
    const prevUrl = getApiUrl();
    setApiUrl(url);
    try{
      const ping = await apiGet('ping');
      const boot = await apiGet('bootstrap');
      result.innerHTML = `✓ Connected to Google Sheet <b>"${ping.connectedSpreadsheet}"</b> — found ${(boot.masters.cnfs||[]).length} CNFs and ${(boot.masters.products||[]).length} products.<br><span style="font-family:var(--mono);font-size:10px;">Sheet ID: ${ping.spreadsheetId} · Tabs: ${(ping.sheets||[]).join(', ')}</span>`;
      result.style.color = 'var(--green)';
    }catch(e){

  const btnDisconnectApi = document.getElementById('btnDisconnectApi');
  if(btnDisconnectApi) btnDisconnectApi.onclick = async ()=>{
    setApiUrl('');
    showToast('Disconnected — using local demo mode');
    render();
    await loadAll();
  };

  // MIS nav & filters
  document.querySelectorAll('[data-misnav]').forEach(el=>el.onclick=()=>{ state.misScreen=el.dataset.misnav; state.sideOpen=false; render(); });
  const btnNavToggle = document.getElementById('btnNavToggle');
  if(btnNavToggle) btnNavToggle.onclick = ()=>{ state.sideOpen = !state.sideOpen; render(); };
  const navOverlay = document.getElementById('navOverlay');
  if(navOverlay) navOverlay.onclick = ()=>{ state.sideOpen = false; render(); };
  document.querySelectorAll('[data-cnfchip]').forEach(el=>el.onclick=()=>{
    const code = el.dataset.cnfchip;
    if(code==='ALL'){ state.misFilters.cnfs='ALL'; }
    else{
      let cur = Array.isArray(state.misFilters.cnfs) ? state.misFilters.cnfs.slice() : [];
      if(cur.includes(code)) cur = cur.filter(c=>c!==code); else cur.push(code);

    }

  const misCat = document.getElementById('misCat');
  if(misCat) misCat.onchange = ()=>{ state.misFilters.category = misCat.value; render(); };
  const misStatus = document.getElementById('misStatus');
  if(misStatus) misStatus.onchange = ()=>{ state.misFilters.status = misStatus.value; render(); };
  const btnExport = document.getElementById('btnExportCsv');
  if(btnExport) btnExport.onclick = runExport;

  // Per-screen quick exports (respect current filters, no trip to Export Centre needed)
  const btnExportStockTable = document.getElementById('btnExportStockTable');
  if(btnExportStockTable) btnExportStockTable.onclick = ()=>{
    const rows = filteredRows();
    exportGenericCsv('current-stock.csv', ['CNF Code','CNF Name','Product Code','Product Name','Category','Entered Qty','UOM','KG','SAP Qty (kg)','Difference Reason','MFD','Age (d)','Status','Safety'],
      rows.map(r=>[r.cnf.code,r.cnf.name,r.product.code,r.product.name,r.product.category,r.item.qty,r.item.uom,r.item.kgQty.toFixed(1),r.item.sapQtyKg!=null?r.item.sapQtyKg.toFixed(1):'',r.item.varianceReason||'',r.item.mfd||'',r.ageStatus.age??'',r.ageStatus.label,r.safetyStatus==='ok'?'OK':'Below']));
  };
  const btnExportFifo = document.getElementById('btnExportFifo');
  if(btnExportFifo) btnExportFifo.onclick = ()=>{
    const rows = filteredRows().filter(r=>r.item.mfd).sort((a,b)=> new Date(a.item.mfd) - new Date(b.item.mfd));
    exportGenericCsv('fifo-monitor.csv', ['#','CNF Code','CNF Name','Product Code','Product Name','MFD','Age (d)','Self-Life','Remaining','Qty (kg)','Status'],
      rows.map((r,i)=>[i+1,r.cnf.code,r.cnf.name,r.product.code,r.product.name,r.item.mfd,r.ageStatus.age,r.ageStatus.life,r.ageStatus.remaining,r.item.kgQty.toFixed(1),r.ageStatus.label]));
  };
  const btnExportAgeing = document.getElementById('btnExportAgeing');
  if(btnExportAgeing) btnExportAgeing.onclick = ()=>{
    const rows = filteredRows();
    const groups = {};
    rows.forEach(r=>{ (groups[r.ageStatus.label]=groups[r.ageStatus.label]||[]).push(r); });
    exportGenericCsv('ageing-analysis.csv', ['Status','Lines','Total kg','Sample Product Codes','Sample Products'],
      Object.entries(groups).map(([label,rs])=>[label, rs.length, rs.reduce((s,r)=>s+r.item.kgQty,0).toFixed(0), [...new Set(rs.map(r=>r.product.code))].slice(0,3).join('; '), [...new Set(rs.map(r=>r.product.name))].slice(0,3).join('; ')]));
  };
  const btnExportSafety = document.getElementById('btnExportSafety');
  if(btnExportSafety) btnExportSafety.onclick = ()=>{
    const rows = filteredRows().filter(r=>r.safetyStatus==='low');
    exportGenericCsv('below-safety-stock.csv', ['CNF Code','CNF Name','Product Code','Product Name','Category','Current (kg)','Safety Norm (kg)','Shortfall'],
      rows.map(r=>[r.cnf.code,r.cnf.name,r.product.code,r.product.name,r.product.category,r.item.kgQty.toFixed(1),r.product.safetyStockKg,(r.product.safetyStockKg-r.item.kgQty).toFixed(1)]));
  };
  const btnExportCnfSummary = document.getElementById('btnExportCnfSummary');
  if(btnExportCnfSummary) btnExportCnfSummary.onclick = ()=>{
    const rows = filteredRows();
    exportGenericCsv('cnf-wise-summary.csv', ['CNF Code','CNF Name','Products','Batch Lines','Total kg','Ageing/Critical','Below Safety','Last Submission','Compliance'],
      state.masters.cnfs.map(c=>{
        const crows = rows.filter(r=>r.cnf.code===c.code);
        const sub = latestSubmissionFor(c.code);
        const cadence = cnfSubmissionStatus(c);
        const kg = crows.reduce((s,r)=>s+r.item.kgQty,0);
        const ag = crows.filter(r=>['critical','expiring','expired'].includes(r.ageStatus.cls)).length;
        const bs = crows.filter(r=>r.safetyStatus==='low').length;
        const distinctProducts = new Set(crows.map(r=>r.product.code)).size;
        return [c.code,c.name,distinctProducts,crows.length,kg.toFixed(0),ag,bs,sub?sub.date:'',cadence.neverSubmitted?'Never':cadence.overdue?cadence.days+'d overdue':'On time'];
      }));
  };
  const btnExportAudit = document.getElementById('btnExportAudit');
  if(btnExportAudit) btnExportAudit.onclick = ()=>{
    const rows = [...state.submissions].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
    exportGenericCsv('audit-log.csv', ['Submission ID','CNF Code','CNF Name','Date','Timestamp','Products','Batch Lines','Submitted By','Status'],
      rows.map(s=>[s.id,s.cnfCode,s.cnfName,s.date,new Date(s.timestamp).toLocaleString('en-IN'),new Set(s.items.map(i=>i.code)).size,s.items.length,s.submittedBy,s.status]));
  };

  // Movement & History (MIS)
  const movCnfSel = document.getElementById('movCnfSel');
  if(movCnfSel) movCnfSel.onchange = ()=>{ state.movementFilters.cnf = movCnfSel.value; render(); };
  const movFromDate = document.getElementById('movFromDate');
  if(movFromDate) movFromDate.onchange = ()=>{ state.movementFilters.fromDate = movFromDate.value; render(); };
  const movToDate = document.getElementById('movToDate');
  if(movToDate) movToDate.onchange = ()=>{ const v = movToDate.value>todayISO()?todayISO():movToDate.value; state.movementFilters.toDate = v; render(); };
  const btnLoadFullHistory = document.getElementById('btnLoadFullHistory');
  if(btnLoadFullHistory) btnLoadFullHistory.onclick = async ()=>{
    btnLoadFullHistory.textContent = 'Loading…'; btnLoadFullHistory.disabled = true;
    try{ await ensureAllHistory(); state.allHistoryLoaded = true; showToast('✓ Full history loaded'); }
    catch(e){ showToast('Could not load full history — check connection'); }

  const btnExportMovement = document.getElementById('btnExportMovement');
  if(btnExportMovement) btnExportMovement.onclick = ()=>{
    const f = state.movementFilters;
    const rows = state.submissions.filter(s=>s.date>=f.fromDate && s.date<=f.toDate && (f.cnf==='ALL' || s.cnfCode===f.cnf)).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
    exportGenericCsv(`movement-${f.fromDate}-to-${f.toDate}.csv`, ['Date','CNF Name','CNF Code','Products','Batch Lines','Total kg','Submission ID','Submitted By'],
      rows.map(s=>[s.date, s.cnfName, s.cnfCode, new Set(s.items.map(i=>i.code)).size, s.items.length, s.items.reduce((a,i)=>a+i.kgQty,0).toFixed(1), s.id, s.submittedBy]));
  };
  document.querySelectorAll('[data-movsub]').forEach(el=>el.onclick=()=>{ state.misSubDetail = el.dataset.movsub; render(); });
  const misSubDetailBg = document.getElementById('misSubDetailBg');

    const btnCloseMisSubDetail = document.getElementById('btnCloseMisSubDetail');
    if(btnCloseMisSubDetail) btnCloseMisSubDetail.onclick = ()=>{ state.misSubDetail=null; render(); };
  }

  // --- Drill-down: KPI cards ---

    const k = el.dataset.kpi;

    if(k==='ageing'){ state.misScreen='ageing'; state.sideOpen=false; render(); return; }
    if(k==='safety'){ state.misScreen='safety'; state.sideOpen=false; render(); return; }
  });

  // --- Drill-down: category bars (Category-wise Stock) ---
  document.querySelectorAll('[data-catbar]').forEach(el=>el.onclick=()=>{
    state.misFilters.category = el.dataset.catbar;
    state.misScreen = 'stock';
    render();
  });

  // --- Drill-down: ageing-status bars (Ageing Distribution + Ageing Analysis rows) ---
  document.querySelectorAll('[data-statusbar]').forEach(el=>el.onclick=()=>{

    state.misScreen = 'stock';
    render();
  });

  // --- Drill-down: CNF-wise Summary rows ---
  document.querySelectorAll('[data-cnfrow]').forEach(el=>el.onclick=()=>{
    state.misFilters.cnfs = [el.dataset.cnfrow];
    state.misScreen = 'stock';
    render();
  });

  // --- Drill-down: individual stock/FIFO/safety table rows -> full line detail modal ---
  document.querySelectorAll('[data-rowdetail]').forEach(el=>el.onclick=()=>{
    const [subId, itemIdxStr] = el.dataset.rowdetail.split('::');
    state.misDetail = {type:'line', subId, itemIdx:Number(itemIdxStr)};
    render();
  });

  // --- Detail modal close ---
  const misDetailBg = document.getElementById('misDetailBg');
  if(misDetailBg){
    misDetailBg.onclick = (e)=>{ if(e.target===misDetailBg){ state.misDetail=null; render(); } };
    const btnCloseMisDetail = document.getElementById('btnCloseMisDetail');
    if(btnCloseMisDetail) btnCloseMisDetail.onclick = ()=>{ state.misDetail=null; render(); };
  }
}

function ensureBatch(code, idx){
  const p = state.masters.products.find(pp=>pp.code===code);
  if(!state.draftItems[code] || !state.draftItems[code].length){
    state.draftItems[code] = [{qty:'', uom:p.defaultUOM, mfd:''}];
  }
  while(state.draftItems[code].length <= idx){
    state.draftItems[code].push({qty:'', uom:p.defaultUOM, mfd:''});
  }
  return state.draftItems[code][idx];
}

function bindRowInputs(){
  document.querySelectorAll('[data-qtycode]').forEach(inp=>inp.oninput=()=>{
    const code = inp.dataset.qtycode, idx = Number(inp.dataset.batch);
    const b = ensureBatch(code, idx);
    b.qty = inp.value;
    updateRowMeta(code);
  });
  document.querySelectorAll('[data-uomcode]').forEach(sel=>sel.onchange=()=>{
    const code = sel.dataset.uomcode, idx = Number(sel.dataset.batch);
    const b = ensureBatch(code, idx);
    b.uom = sel.value;
    updateRowMeta(code);
    updateUomWarning(code, idx, sel.value);
  });
  document.querySelectorAll('[data-mfdcode]').forEach(inp=>inp.onchange=()=>{
    const code = inp.dataset.mfdcode, idx = Number(inp.dataset.batch);
    const b = ensureBatch(code, idx);
    b.mfd = inp.value;
  });
  document.querySelectorAll('[data-addbatch]').forEach(btn=>btn.onclick=()=>{
    const code = btn.dataset.addbatch;
    const p = state.masters.products.find(pp=>pp.code===code);
    if(!state.draftItems[code] || !state.draftItems[code].length){
      state.draftItems[code] = [{qty:'', uom:p.defaultUOM, mfd:''}];
    }
    state.draftItems[code].push({qty:'', uom:p.defaultUOM, mfd:''});
    rerenderOneRow(code);
  });
  document.querySelectorAll('[data-removebatch]').forEach(btn=>btn.onclick=()=>{
    const [code, idxStr] = btn.dataset.removebatch.split(':');
    const idx = Number(idxStr);
    if(state.draftItems[code] && state.draftItems[code].length>1){
      state.draftItems[code].splice(idx,1);
      rerenderOneRow(code);
    }
  });
  document.querySelectorAll('[data-reasoncode]').forEach(inp=>inp.oninput=()=>{
    state.varianceReasons[inp.dataset.reasoncode] = inp.value;
  });
}

function rerenderOneRow(code){
  const row = document.querySelector(`[data-prow="${code}"]`);
  if(!row) return;
  const sapRow = state.sapUpload && state.sapUpload.rows.find(r=>r.code===code);
  row.outerHTML = sapRow ? SapProductRow(sapRow) : '';
  bindRowInputs();
  updateProgress();
}

function updateUomWarning(code, idx, uom){
  const p = state.masters.products.find(pp=>pp.code===code);
  const warnEl = document.querySelector(`[data-uomwarn="${code}:${idx}"]`);
  if(!warnEl || !p) return;
  const noConversion = (uom==='BAG' && !p.bagToKg) || (uom==='PC' && !p.pcToKg);
  if(noConversion){
    warnEl.style.display = '';
    warnEl.innerHTML = `⚠ No ${uom} size set for this product yet — Admin can add it in Product Master or via UOM Converter import. Until then, this ${uom} quantity is <b>not converted</b>, it's used as-is.`;
  } else {
    warnEl.style.display = 'none';
    warnEl.innerHTML = '';
  }
}

function updateProgress(){
  const prog = document.querySelector('.sticky-submit .prog');
  if(!prog || !state.sapUpload) return;
  const unresolved = state.sapUpload.rows.filter(r=>hasUnresolvedVariance(r.code)).length;
  const requiredTotal = state.sapUpload.rows.filter(r=>r.currentStockKg>0).length;
  const requiredDone = requiredTotal - missingRequiredCodes().length;
  prog.textContent = `${requiredDone}/${requiredTotal} required entered${unresolved?` · ${unresolved} unresolved`:''}`;
}

// Updates only the meta line + reason-field visibility for a row, WITHOUT
// touching the batch inputs themselves — full re-render would drop input
// focus mid-keystroke while the CNF is still typing a quantity.
function updateRowMeta(code){
  const row = document.querySelector(`[data-prow="${code}"]`);
  if(!row || !state.sapUpload) return;
  const sapRow = state.sapUpload.rows.find(r=>r.code===code);
  if(!sapRow) return;
  const p = state.masters.products.find(pp=>pp.code===code);
  const batches = state.draftItems[code] || [];
  const filledBatches = batches.filter(b=>b.qty!==undefined && b.qty!=='');
  const filled = filledBatches.length>0;
  const totalKg = filledBatches.reduce((s,b)=>s+convertToKg(p,b.qty,b.uom||p.defaultUOM),0);
  const diff = filled ? roundedDiffKg(totalKg, sapRow.currentStockKg) : null;
  const needsReason = filled && diff!==null && !withinTolerance(diff);
  const reasonFilled = state.varianceReasons[code] && state.varianceReasons[code].trim();

  row.classList.toggle('filled', !!filled);
  row.classList.toggle('needs-reason', needsReason && !reasonFilled);

  const meta = row.querySelector('.pmeta');
  if(meta){
    meta.innerHTML = `${p.code} · SAP Current Stock <b>${sapRow.currentStockKg.toFixed(1)}kg</b>${formatUomEquivalents(sapRow.currentStockKg, p)}${filled?` · Entered <b>${totalKg.toFixed(1)}kg</b>${formatUomEquivalents(totalKg, p)}`:''}
      ${filled ? (withinTolerance(diff) ? ' · <span class="badge ok">Matches SAP</span>' : ` · <span class="badge low">Δ ${diff>0?'+':''}${diff.toFixed(1)}kg vs SAP</span>`) : ''}`;
  }

  let reasonRow = row.querySelector('.reason-row');
  if(needsReason && !reasonRow){
    const div = document.createElement('div');
    div.className = 'reason-row';
    div.innerHTML = `<label>Reason for difference (required)</label><input type="text" data-reasoncode="${code}" placeholder="e.g. Damage, unrecorded dispatch, counting error…" value="${state.varianceReasons[code]||''}">`;
    row.appendChild(div);
    div.querySelector('input').oninput = (e)=>{ state.varianceReasons[code] = e.target.value; };
  } else if(!needsReason && reasonRow){
    reasonRow.remove();
  }
  updateProgress();
}

function renderRowsOnly(){
  const wrap = document.getElementById('prodRows');
  if(!wrap || !state.sapUpload) return;
  const missing = missingRequiredCodes();
  let baseRows;
  if(state.sapMissingOnlyFilter){
    baseRows = state.sapUpload.rows.filter(r=>missing.includes(r.code));
  } else {
    const catGroups = sapCategoryGroups();
    const activeGroup = catGroups.find(g=>g.cat===state.submitCat);
    baseRows = activeGroup ? activeGroup.rows : [];
  }
  let rows = state.sapMissingOnlyFilter ? baseRows : baseRows.filter(r => state.sapShowZero || r.currentStockKg > 0);
  if(state.sapSearch) rows = rows.filter(r => r.name.toLowerCase().includes(state.sapSearch.toLowerCase()) || r.code.toLowerCase().includes(state.sapSearch.toLowerCase()));
  wrap.innerHTML = rows.map(r=>SapProductRow(r)).join('') || '<div class="empty"><div class="big">No items</div>Try another search term, or enable "Show all".</div>';
  bindRowInputs();
}

setTheme(getTheme());
loadAll();
