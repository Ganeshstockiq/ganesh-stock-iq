  --wheat-light:#e6b46f;
  --wheat-dim:#8a6a3d;
  --cream:#f7f1e4;
  --cream-2:#efe4cc;
  --ink:#2a2318;
  --ink-soft:#7a6f58;
  --green:#5f8f5a;
  --green-bg:#e7efe1;
  --amber:#c99a2e;
  --amber-bg:#f6eed4;
  --orange:#c97a35;
  --orange-bg:#f5e5d3;
  --red:#b64d3d;
  --red-bg:#f4ded9;
  --mono:'JetBrains Mono',monospace;
  --disp:'Fraunces',serif;
  --sans:'Inter',sans-serif;
  --surface-text:#f7f1e4;
  --muted-text:#c9bd9f;
  --input-bg:#1c1712;
  --btn-strong-bg:#1c1712;
  --btn-strong-bg-2:#33291b;
  --btn-strong-text:#f7f1e4;
  --on-accent:#211803;
}
[data-theme="green"]{
  --silo-dark:#f5f9f5; --silo-dark-2:#eaf3ea; --panel:#ffffff; --panel-2:#eef6ee; --line:#d3e6d3;
  --wheat:#2f8f52; --wheat-light:#49ad6c; --wheat-dim:#1f6b3c;
  --cream:#ffffff; --cream-2:#eef6ee; --ink:#16281c; --ink-soft:#5c7566;
  --surface-text:#16281c; --muted-text:#5c7566; --input-bg:#eef6ee;
  --btn-strong-bg:#1f6b3c; --btn-strong-bg-2:#123f23; --btn-strong-text:#f3fbf5; --on-accent:#f3fbf5;
}
[data-theme="mono"]{
  --silo-dark:#ffffff; --silo-dark-2:#f5f5f5; --panel:#ffffff; --panel-2:#f0f0f0; --line:#dcdcdc;
  --wheat:#111111; --wheat-light:#3a3a3a; --wheat-dim:#555555;
  --cream:#ffffff; --cream-2:#f2f2f2; --ink:#111111; --ink-soft:#65656b;
  --surface-text:#111111; --muted-text:#65656b; --input-bg:#f0f0f0;
  --btn-strong-bg:#111111; --btn-strong-bg-2:#2b2b2b; --btn-strong-text:#ffffff; --on-accent:#ffffff;
}
[data-theme="ocean"]{
  --silo-dark:#f2f7fc; --silo-dark-2:#e7f0f9; --panel:#ffffff; --panel-2:#eaf2fa; --line:#cfe0ef;
  --wheat:#2566c4; --wheat-light:#4c85dd; --wheat-dim:#184a94;
  --cream:#ffffff; --cream-2:#eaf2fa; --ink:#122238; --ink-soft:#5c7188;
  --surface-text:#122238; --muted-text:#5c7188; --input-bg:#eaf2fa;
  --btn-strong-bg:#184a94; --btn-strong-bg-2:#0f2f5e; --btn-strong-text:#f2f7fc; --on-accent:#f2f7fc;
}

*{box-sizing:border-box;}
body{margin:0;font-family:var(--sans);background:var(--silo-dark);color:var(--surface-text);transition:background-color .25s ease,color .25s ease;}
/* Smooth, non-jarring theme switches across every surface */
.topbar,.console,.sidenav,.sidenav-overlay,.consolebody,.panel-card,.dkpi,.navitem,.cnf-shell,.cnf-header,.login-card,.modal-dark,.modal,table.dtable,.chip,.barrow .track,input,select,.big-cta,.hist-item,.prow,.kpi,.dtable td,.dtable th{
  transition: background-color .22s ease, border-color .22s ease, color .22s ease;
}
/* Tactile press feedback on anything clickable */
.btn:active,.chip:active,.navitem:active,.roletab:active,.cat-tab:active,.month-pill:active,.dkpi[data-kpi]:active,.big-cta:active,tr[data-rowdetail]:active,tr[data-cnfrow]:active,.barrow[data-catbar]:active,.barrow[data-statusbar]:active{
  transform: scale(.96);
}
.btn,.chip,.navitem,.cat-tab,.month-pill{ transition: transform .1s ease, background-color .15s ease, border-color .15s ease, color .15s ease; }
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalPop{from{opacity:0;transform:scale(.95) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes toastPop{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes sheetUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.modal-bg{animation:fadeIn .16s ease-out;}
.modal-bg .modal-dark,.modal-bg.center .modal{animation:modalPop .18s cubic-bezier(.2,.8,.3,1);}
.modal-bg:not(.center) .modal{animation:sheetUp .2s cubic-bezier(.2,.8,.3,1);}
::selection{background:var(--wheat);color:var(--on-accent);}
button{font-family:var(--sans);cursor:pointer;}
input,select{font-family:var(--sans);}

/* ---------- Shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:0;background:var(--silo-dark-2);border-bottom:1px solid var(--line);padding:0 16px;position:sticky;top:0;z-index:50;}
.brand{display:flex;align-items:center;gap:10px;padding:14px 18px 14px 0;margin-right:8px;border-right:1px solid var(--line);}
.brand .mark{width:26px;height:26px;position:relative;flex:none;}
.brand .mark svg{width:100%;height:100%;}
.brand .name{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:.2px;color:var(--surface-text);line-height:1.1;}
.brand .sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.7px;color:var(--wheat-dim);text-transform:uppercase;}
.roletabs{display:flex;gap:2px;}
.roletab{background:none;border:none;color:var(--ink-soft);padding:16px 18px;font-size:13px;font-weight:600;letter-spacing:.3px;border-bottom:2px solid transparent;transition:.15s;}
.roletab:hover{color:var(--surface-text);}
.roletab.active{color:var(--wheat-light);border-bottom-color:var(--wheat);}
.topbar .spacer{flex:1;}
.whoami{font-family:var(--mono);font-size:11px;color:var(--ink-soft);padding-right:4px;}
.theme-switch{position:relative;}
.notif-wrap{position:relative;}
.topbar-sync-btn{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--panel);color:var(--surface-text);font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.3px;cursor:pointer;transition:transform .12s ease,border-color .15s ease;white-space:nowrap;}
.topbar-sync-btn:hover:not(:disabled){border-color:var(--wheat-light);transform:scale(1.03);}
.topbar-sync-btn:active:not(:disabled){transform:scale(.95);}
.topbar-sync-btn:disabled{opacity:.4;cursor:not-allowed;}
.notif-btn{position:relative;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:transform .12s ease,border-color .15s ease;}
.notif-btn:hover{border-color:var(--wheat-light);transform:scale(1.06);}
.notif-btn:active{transform:scale(.92);}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-family:var(--mono);font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.notify-on-badge{font-family:var(--mono);font-size:11px;font-weight:700;color:#2f8f52;background:var(--green-bg,#e7f5ec);border-radius:17px;padding:8px 12px;white-space:nowrap;}
.notify-off-badge{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--panel-2);border-radius:17px;padding:8px 12px;white-space:nowrap;opacity:.7;}
.nav-badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-family:var(--mono);font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 3px;}
.msg-card{background:#fff;border:1px solid #ecdfbe;border-left:3px solid var(--wheat);border-radius:11px;padding:12px 14px;margin-bottom:10px;}
.msg-card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;}
.msg-card-top b{font-family:var(--disp);font-size:14px;color:var(--ink);}
.msg-card-time{font-family:var(--mono);font-size:10px;color:var(--ink-soft);white-space:nowrap;flex-shrink:0;}
.msg-card-body{font-size:13px;color:var(--ink);line-height:1.6;}
.msg-card-from{font-family:var(--mono);font-size:10px;color:var(--wheat-dim);margin-top:8px;}
.notif-pop{position:absolute;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;width:280px;max-height:400px;overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:80;animation:modalPop .16s cubic-bezier(.2,.8,.3,1);}
.notif-head{font-family:var(--disp);font-size:14px;font-weight:600;color:var(--surface-text);padding:2px 4px 8px;}
.notif-grp{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--wheat-dim);padding:8px 4px 4px;display:flex;justify-content:space-between;}
.notif-grp .num{background:var(--panel-2);border-radius:10px;padding:1px 6px;}
.notif-item{padding:7px 8px;border-radius:8px;cursor:pointer;transition:background-color .12s ease;font-size:12px;color:var(--surface-text);}
.notif-item:hover{background:var(--panel-2);}
.notif-sub{font-family:var(--mono);font-size:10px;color:var(--muted-text);margin-top:2px;}
.notif-empty{font-size:12px;color:var(--muted-text);padding:8px 4px;}
.theme-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:conic-gradient(from 200deg,var(--wheat),var(--wheat-light),var(--wheat-dim),var(--wheat));cursor:pointer;transition:transform .12s ease,border-color .15s ease;flex:none;}
.theme-btn:hover{border-color:var(--wheat-light);transform:scale(1.06);}
.theme-btn:active{transform:scale(.92);}
.theme-pop{position:absolute;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;width:200px;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:80;animation:modalPop .16s cubic-bezier(.2,.8,.3,1);}
.theme-pop .tlabel{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--wheat-dim);padding:2px 4px 8px;}
.theme-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px;border-radius:8px;border:none;background:none;cursor:pointer;text-align:left;transition:background-color .12s ease;}
.theme-opt:hover{background:var(--panel-2);}
.theme-opt.active{background:var(--panel-2);}
.theme-opt .sw{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15);}
.theme-opt .tn{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--surface-text);}
.theme-opt .td{font-family:var(--mono);font-size:9.5px;color:var(--muted-text);margin-top:1px;}
.theme-opt.active .tn::after{content:' ✓';color:var(--wheat-light);}
.whoami b{color:var(--wheat-light);}

main{flex:1;}

/* ---------- CNF (field) panel — light, mobile-first ---------- */
.cnf-shell{background:var(--cream);color:var(--ink);min-height:calc(100vh - 54px);}
.cnf-shell .cnf-header{position:sticky;top:54px;z-index:40;background:var(--cream);border-bottom:1px solid #e2d5b4;padding:14px 16px;}
.cnf-shell .cnf-body{max-width:720px;margin:0 auto;padding:16px;padding-bottom:100px;}
.login-card{max-width:420px;margin:60px auto;background:#fff;border:1px solid #e6dabf;border-radius:14px;padding:28px;box-shadow:0 10px 30px rgba(60,45,15,.08);}
.login-card h2{font-family:var(--disp);font-size:22px;margin:0 0 4px;}
.login-bg{background:radial-gradient(900px 380px at 50% -80px,rgba(204,143,63,.22),transparent 70%),var(--cream);padding:34px 16px 40px;}
.login-hero{text-align:center;max-width:560px;margin:0 auto;}
.login-hero .lh-mark{height:84px;margin:0 auto 12px;}
.login-hero .lh-mark img{height:100%;width:auto;display:inline-block;}
.lh-brandline{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 14px;}
.lh-brandline span{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(90deg,#1f8a4c,#cc8f3f);-webkit-background-clip:text;background-clip:text;color:transparent;}
.lh-brandline i{display:block;width:44px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#cc8f3f);}
.lh-brandline i:last-child{background:linear-gradient(90deg,#cc8f3f,transparent);}
.login-hero .lh-tag{position:relative;font-weight:600;color:var(--ink);}
.login-hero h1{font-family:var(--disp);font-size:34px;font-weight:700;letter-spacing:.2px;margin:0 0 8px;color:var(--ink);}
.login-hero .lh-tag{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin:0 auto 14px;max-width:440px;}
.login-hero .lh-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.login-hero .lh-chips span{font-family:var(--mono);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:#fff;border:1px solid #e6dabf;color:var(--wheat-dim);}
.login-bg .login-card{margin:26px auto 0;border-radius:18px;padding:30px;box-shadow:0 18px 44px rgba(60,45,15,.12);border-top:4px solid var(--wheat);}
.login-bg .login-card .btn-primary{padding:12px 16px;font-size:14.5px;border-radius:10px;}
.brand .mark{width:auto;height:46px;background:#fff;border-radius:9px;padding:3px 6px;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.brand .mark img{height:100%;width:auto;display:block;}
.brand .name{font-size:18px;font-weight:700;}
.brand .sub{max-width:300px;line-height:1.35;}
@media(max-width:700px){.login-hero h1{font-size:27px;}.login-bg{padding-top:22px;}.login-bg .login-card{padding:22px;}}
.login-card p.hint{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
.field select,.field input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #ddceac;font-size:14px;background:#fffdf8;color:var(--ink);}
.field-check{margin-bottom:16px;}
.pw-field-wrap{position:relative;}
.pw-field-wrap input{width:100%;padding-right:38px;}
.pw-eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;background:transparent;cursor:pointer;font-size:15px;opacity:.55;border-radius:6px;padding:0;}
.pw-eye-btn:hover{opacity:1;background:rgba(0,0,0,.06);}
.pw-eye-btn.revealed{opacity:1;}
.field-check label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;font-weight:500;}
.field-check input{width:auto;margin:0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:9px;padding:12px 18px;font-weight:700;font-size:14px;letter-spacing:.2px;transition:.15s;}
.btn-primary{background:var(--wheat);color:var(--on-accent);}
.btn-primary:hover{background:var(--wheat-light);}
.btn-block{width:100%;}
.btn-ghost{background:transparent;border:1px solid #d9caa3;color:var(--ink);}
.btn-ghost:hover{background:#f0e6cc;}
.btn-dark{background:var(--btn-strong-bg);color:var(--btn-strong-text);}
.btn-dark:hover{background:var(--silo-dark-2);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:7px;}
/* ---- 3D tactile buttons ---- */
.btn{position:relative;--bd:rgba(0,0,0,.28);box-shadow:0 4px 0 var(--bd),0 8px 14px rgba(40,28,8,.18),inset 0 1px 0 rgba(255,255,255,.35);transform:translateY(0);transition:transform .08s ease,box-shadow .08s ease,filter .15s ease,background .15s ease;text-shadow:0 1px 0 rgba(0,0,0,.12);}
.btn-primary{background:linear-gradient(180deg,var(--wheat-light),var(--wheat));--bd:color-mix(in srgb,var(--wheat) 55%,#000);}
.btn-primary:hover{background:linear-gradient(180deg,var(--wheat-light),var(--wheat-light));filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 5px 0 var(--bd),0 12px 18px rgba(40,28,8,.22),inset 0 1px 0 rgba(255,255,255,.4);}
.btn-dark{background:linear-gradient(180deg,var(--btn-strong-bg-2),var(--btn-strong-bg));--bd:#000;}
.btn-dark:hover{background:linear-gradient(180deg,var(--btn-strong-bg-2),var(--btn-strong-bg));filter:brightness(1.25);transform:translateY(-1px);}
.btn-ghost{background:linear-gradient(180deg,#fff,#f4ecd8);--bd:#cdbb8c;text-shadow:none;}
.btn-ghost:hover{background:linear-gradient(180deg,#fffdf6,#efe3c2);transform:translateY(-1px);}
.btn-danger{background:linear-gradient(180deg,#d1604f,var(--red))!important;--bd:#7a2c20;}
.btn:active{transform:translateY(3px) scale(1)!important;box-shadow:0 1px 0 var(--bd),0 2px 4px rgba(40,28,8,.2),inset 0 2px 4px rgba(0,0,0,.18)!important;}
.btn:disabled,.btn[disabled]{box-shadow:0 2px 0 var(--bd);filter:grayscale(.4) opacity(.65);transform:none!important;cursor:not-allowed;}
.btn-sm{box-shadow:0 3px 0 var(--bd),0 5px 9px rgba(40,28,8,.15),inset 0 1px 0 rgba(255,255,255,.3);}
.btn:focus-visible{outline:3px solid rgba(204,143,63,.45);outline-offset:2px;}
.login-bg .login-card .btn-primary{padding:14px 16px;font-size:15px;letter-spacing:.4px;}

.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
.cadence-banner{border-radius:11px;padding:11px 14px;font-size:13px;margin-bottom:14px;}
.cadence-banner.ok{background:var(--green-bg);color:var(--green);}
.cadence-banner.overdue{background:var(--red-bg);color:var(--red);}
.kpi-row.four{grid-template-columns:repeat(4,1fr);}
.kpi{background:#fff;border:1px solid #ecdfbe;border-radius:12px;padding:12px 14px;}
.kpi .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);font-weight:700;}
.kpi .val{font-family:var(--mono);font-size:22px;font-weight:700;margin-top:2px;color:var(--ink);}
.kpi .val.alert{color:var(--red);}
.kpi .val.warn{color:var(--orange);}

.section-title{font-family:var(--disp);font-size:15px;font-weight:600;margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
.section-title .num{font-family:var(--mono);font-size:11px;color:var(--wheat-dim);background:var(--amber-bg);padding:2px 7px;border-radius:20px;}

.big-cta{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--btn-strong-bg),var(--btn-strong-bg-2));color:var(--btn-strong-text);border-radius:14px;padding:18px 20px;margin:6px 0 18px;cursor:pointer;border:none;width:100%;text-align:left;}
.big-cta .t1{font-family:var(--disp);font-size:18px;font-weight:600;}
.big-cta .t2{font-family:var(--mono);font-size:11px;color:var(--wheat-light);margin-top:3px;}
.big-cta .arrow{font-size:22px;color:var(--wheat);}

.silo{width:8px;height:26px;border-radius:3px;background:#e7dcc0;overflow:hidden;position:relative;flex:none;}
.silo i{position:absolute;bottom:0;left:0;right:0;border-radius:3px 3px 0 0;}

.date-strip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #ecdfbe;border-radius:10px;padding:8px 10px;margin-bottom:12px;flex-wrap:wrap;}
.date-strip select{border:none;background:#f2e8d0;border-radius:6px;padding:6px 8px;font-family:var(--mono);font-size:12px;font-weight:600;}
.month-pills{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;}
.month-pill{font-family:var(--mono);font-size:11px;padding:5px 8px;border-radius:6px;border:1px solid #e6dabf;background:#fff;color:var(--ink-soft);white-space:nowrap;}
.month-pill.active{background:var(--wheat);border-color:var(--wheat);color:var(--on-accent);font-weight:700;}

.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;position:sticky;top:126px;background:var(--cream);z-index:30;}
.cat-tab{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.4px;padding:8px 12px;border-radius:20px;border:1px solid #e2d3a9;background:#fff;color:var(--ink-soft);white-space:nowrap;transition:transform .25s ease, box-shadow .25s ease;}
.cat-tab-advanced{animation:gsi-cat-advance .9s ease;}
@keyframes gsi-cat-advance{0%{transform:scale(1.12);box-shadow:0 0 0 4px var(--amber-bg);}60%{transform:scale(1.04);}100%{transform:scale(1);box-shadow:none;}}
.cat-tab.active{background:var(--btn-strong-bg);border-color:var(--btn-strong-bg);color:var(--wheat-light);}
.cat-tab.cat-zero{opacity:.55;}
.cat-tab .cnt{opacity:.6;margin-left:4px;}

/* Category tabs, v2 — each one is a tiny grain silo filling up as the CNF
   enters batches, on-brand with the product's own "silo" identity rather
   than a generic progress pill. */
.cat-tab-v2{display:inline-flex;align-items:center;gap:8px;padding:7px 13px 7px 9px;border-radius:13px;border:1px solid #e2d3a9;background:#fff;cursor:pointer;white-space:nowrap;transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;}
.cat-tab-v2:hover{transform:translateY(-1px);}
.cat-tab-v2.active{border-color:var(--wheat);box-shadow:0 0 0 2px var(--amber-bg);}
.cat-tab-v2.cat-tab-done{border-color:var(--green,#2f8f52);background:var(--green-bg,#e7f5ec);}
.cat-tab-v2.cat-zero{opacity:.5;}
.cat-tab-v2.cat-tab-advanced{animation:gsi-cat-advance .9s ease;}
.cat-tab-gauge{width:7px;height:24px;border-radius:4px;background:#f0e6cc;overflow:hidden;display:flex;align-items:flex-end;flex-shrink:0;}
.cat-tab-gauge-fill{width:100%;background:linear-gradient(180deg,var(--wheat-light),var(--wheat));border-radius:4px;transition:height .45s cubic-bezier(.34,1.3,.64,1);}
.cat-tab-done .cat-tab-gauge-fill{background:linear-gradient(180deg,#6fbf87,#2f8f52);}
.cat-tab-textwrap{display:flex;flex-direction:column;line-height:1.3;}
.cat-tab-label{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--ink);}
.cat-tab-cnt{font-family:var(--mono);font-size:8.5px;color:var(--ink-soft);opacity:.75;}
.cat-tab-check{color:#2f8f52;font-weight:900;font-size:13px;}

/* Overall progress — a real visual bar, not just a line of small text, so
   "how far along am I" reads at a glance. */
.overall-progress{margin:2px 0 12px;}
.overall-progress-bar{height:7px;border-radius:5px;background:#f0e6cc;overflow:hidden;margin-bottom:6px;}
.overall-progress-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--wheat-dim),var(--wheat-light));transition:width .4s cubic-bezier(.34,1.3,.64,1);}
.overall-progress-label{font-family:var(--mono);font-size:11px;color:var(--ink-soft);}

/* Manual "Next Category" — a real, inviting call-to-action so moving on is
   always the CNF's own deliberate tap, never something that happens to
   them mid-entry. */
.next-cat-cta{width:100%;margin-top:16px;padding:14px 18px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--wheat-dim),var(--wheat));color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px;transition:transform .15s ease, box-shadow .15s ease;box-shadow:0 4px 14px rgba(204,143,63,.28);text-align:left;}
.next-cat-cta:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(204,143,63,.38);}
.next-cat-cta:active{transform:translateY(0);}
.next-cat-cta-label{font-family:var(--mono);font-size:10px;opacity:.9;letter-spacing:.2px;}
.next-cat-cta-target{font-family:var(--serif);font-size:19px;font-weight:600;display:flex;align-items:center;gap:8px;}
.next-cat-cta-arrow{display:inline-block;transition:transform .2s ease;}
.next-cat-cta:hover .next-cat-cta-arrow{transform:translateX(5px);}

.chip.chip-warn{background:var(--red-bg);border-color:var(--red);color:var(--red);cursor:pointer;}

.searchbar{display:flex;gap:8px;margin-bottom:10px;}
.searchbar input{flex:1;padding:10px 12px;border-radius:9px;border:1px solid #e2d3a9;background:#fff;font-size:13px;}

.prow{background:#fff;border:1px solid #ecdfbe;border-radius:11px;padding:0 12px 10px;margin-bottom:8px;display:flex;flex-direction:column;gap:2px;border-left:3px solid #ecdfbe;transition:border-color .15s ease;}
.prow.filled{border-left-color:var(--wheat);background:#fffaf0;}
.prow.needs-reason{border-left-color:var(--red);background:var(--red-bg);}
.prow.prow-flash{border-left-color:var(--red);background:var(--red-bg);box-shadow:0 0 0 3px rgba(192,57,43,.35);animation:prowflash 0.9s ease-in-out 3;}
@keyframes prowflash{0%,100%{box-shadow:0 0 0 3px rgba(192,57,43,.15);}50%{box-shadow:0 0 0 6px rgba(192,57,43,.45);}}
.prow .pinfo{min-width:0;position:sticky;top:178px;background:inherit;z-index:8;padding:10px 0 6px;box-shadow:0 4px 6px -4px rgba(60,45,15,.1);}
.prow .pname{font-size:13.5px;font-weight:600;color:var(--ink);}
.cat-pill{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.3px;color:var(--wheat-dim);background:var(--amber-bg);border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap;}
.uom-equiv{color:var(--ink-soft);font-weight:400;}
.prow .pmeta{font-family:var(--mono);font-size:13.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
.prow .pmeta2{font-family:var(--mono);font-size:12.5px;color:var(--wheat-dim);margin-top:4px;line-height:1.5;}
.prow .pinputs{display:flex;align-items:center;gap:6px;flex:none;}
.prow input.qty{width:64px;padding:9px 6px;text-align:center;border-radius:7px;border:1px solid #ddceac;font-family:var(--mono);font-weight:700;font-size:14px;}
.prow select.uom{padding:9px 4px;border-radius:7px;border:1px solid #ddceac;font-family:var(--mono);font-size:11px;background:#fbf6ea;}
.prow input.mfd{width:112px;padding:8px 6px;border-radius:7px;border:1px solid #ddceac;font-family:var(--mono);font-size:11px;}
.batchlist{display:flex;flex-direction:column;}
.batchrow{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding-top:8px;border-top:1px dashed #ecdfbe;}
.batch-badge{width:18px;height:18px;border-radius:50%;background:var(--wheat);color:#fff;font-family:var(--mono);font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px;}
.batch-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.mfd-row{display:flex;gap:6px;align-items:center;flex:1;min-width:150px;flex-wrap:wrap;}
.mfd-input-wrap{position:relative;display:flex;align-items:center;flex:1;min-width:130px;}
.mfd-text{width:100%;padding-right:34px;}
.mfd-text.mfd-error-state{border-color:var(--red);background:var(--red-bg);}
.mfd-cal-btn{position:absolute;right:2px;background:none;border:none;cursor:pointer;font-size:14px;padding:4px 6px;opacity:.6;}
.mfd-cal-btn:hover{opacity:1;}
.mfd-picker-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0;}
.mfd-error{font-family:var(--mono);font-size:10.5px;color:var(--red);margin:2px 0 0;}
.mfd-copyall-btn{white-space:nowrap;font-family:var(--mono);font-size:10px;font-weight:700;padding:5px 8px;border-radius:6px;border:1px solid var(--wheat-dim);background:var(--amber-bg);color:var(--wheat-dim);cursor:pointer;}
.mfd-copyall-btn:hover{background:var(--wheat);color:#fff;}
.mfd-row label{font-family:var(--mono);font-size:9px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
.uom-fixed{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-soft);padding:9px 10px;background:#f2e8d0;border-radius:7px;flex:none;}
.uom-warn{font-family:var(--mono);font-size:10px;color:var(--orange);background:var(--amber-bg);border-radius:7px;padding:6px 9px;margin-top:6px;line-height:1.5;}
.uom-warn-blocking{color:#fff;background:var(--red);font-weight:700;}
.reason-row{margin-top:8px;padding-top:10px;border-top:1px dashed #ecdfbe;}
.reason-row label{display:block;font-family:var(--mono);font-size:9px;color:var(--red);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;font-weight:700;}
.reason-row input{width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--red);background:#fff;font-size:13px;}
.reason-row-optional label{color:var(--ink-soft);}
.reason-row-optional input{border-color:var(--line);background:#faf7ef;}
.sap-banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--wheat-dim);border-radius:11px;padding:10px 14px;margin-bottom:12px;}
.sap-banner b{font-size:13px;color:var(--ink);}
.sap-banner .sm{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
.sap-gate{max-width:460px;margin:30px auto;text-align:center;background:#fff;border:1px solid #e6dabf;border-radius:14px;padding:32px 26px;box-shadow:0 10px 30px rgba(60,45,15,.08);}
.sap-gate-icon{font-size:36px;margin-bottom:10px;}
.sap-gate-icon-spin{animation:gsi-grain-sway 1.8s ease-in-out infinite;display:inline-block;}
@keyframes gsi-grain-sway{0%,100%{transform:rotate(-8deg) scale(1);}50%{transform:rotate(8deg) scale(1.08);}}
.sap-loading-dots{display:flex;justify-content:center;gap:6px;margin:14px 0;}
.sap-loading-dots span{width:7px;height:7px;border-radius:50%;background:var(--wheat);animation:gsi-dot-bounce 1.2s ease-in-out infinite;}
.sap-loading-dots span:nth-child(2){animation-delay:.15s;}
.sap-loading-dots span:nth-child(3){animation-delay:.3s;}
@keyframes gsi-dot-bounce{0%,80%,100%{transform:translateY(0);opacity:.5;}40%{transform:translateY(-7px);opacity:1;}}
.sap-gate .t1{font-family:var(--disp);font-size:18px;font-weight:600;margin-bottom:8px;}
.sap-gate .t2{font-size:13px;color:var(--ink-soft);line-height:1.6;margin-bottom:20px;}
.sap-gate-note{font-family:var(--mono);font-size:11px;color:var(--ink-soft);line-height:1.6;margin-top:16px;text-align:left;background:#f6efdb;border-radius:8px;padding:10px 12px;}
.addbatch-btn{align-self:flex-start;background:#fff;border:1.5px dashed #ddceac;color:var(--wheat-dim);font-family:var(--mono);font-size:11px;font-weight:700;padding:8px 14px;border-radius:9px;margin-top:8px;cursor:pointer;transition:all .15s ease;}
.addbatch-btn:hover{border-color:var(--wheat);background:var(--amber-bg);color:var(--wheat);}
.addbatch-btn:hover{color:var(--wheat);}
.rmbatch-btn{background:var(--red-bg);color:var(--red);border:none;border-radius:7px;width:32px;height:37px;font-size:13px;font-weight:700;flex:none;}

.sticky-submit{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--cream) 75%,transparent);padding:14px 16px 10px;z-index:40;}
.sticky-submit .row{display:flex;gap:8px;background:#fff;border:1px solid #ecdfbe;border-radius:12px;padding:10px;box-shadow:0 -6px 18px rgba(60,45,15,.1);max-width:720px;margin:0 auto;}
.sticky-submit .prog{font-family:var(--mono);font-size:11px;color:var(--ink-soft);flex:1;align-self:center;}

.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.3px;}
.badge.fresh{background:var(--green-bg);color:var(--green);}
.badge.normal{background:#eef1e4;color:#6b7a4a;}
.badge.ageing{background:var(--amber-bg);color:var(--amber);}
.badge.critical{background:var(--orange-bg);color:var(--orange);}
.badge.expiring{background:var(--red-bg);color:var(--red);}
.badge.expired{background:#3a1f19;color:#e7a08e;}
.badge.ok{background:var(--green-bg);color:var(--green);}
.badge.low{background:var(--red-bg);color:var(--red);}
.badge.unknown{background:#eee7d4;color:#8a7d54;}

.hist-item{background:#fff;border:1px solid #ecdfbe;border-radius:11px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.attn-panel{margin-bottom:16px;}
.attn-head{font-family:var(--disp);font-size:15px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.attn-head .attn-sub{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--ink-soft);text-transform:none;letter-spacing:0;}
.attn-row{background:#fff;border:1px solid #ecdfbe;border-left:4px solid var(--ink-soft);border-radius:10px;padding:10px 12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.attn-row .an b{font-size:13px;color:var(--ink);}
.attn-row .am{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
.attn-row.attn-ageing{border-left-color:var(--amber);}
.attn-row.attn-critical{border-left-color:var(--orange);}
.attn-row.attn-expiring{border-left-color:var(--red);}
.attn-row.attn-expired{border-left-color:#7a2e20;background:#fbeeea;}
tr[data-attn]{cursor:pointer;}
.attn-row[data-attn]{cursor:pointer;transition:transform .1s ease;}
.attn-row[data-attn]:hover{transform:translateX(2px);}
.attn-panel.dark .attn-head{color:var(--surface-text);}
.attn-panel.dark .attn-row{background:var(--panel);border-color:var(--line);}
.attn-panel.dark .attn-row.attn-expired{background:#3a1f19;}
.attn-panel.dark .an b{color:var(--surface-text);}
.attn-panel.dark .am{color:var(--muted-text);}
.hist-item .d{font-family:var(--mono);font-weight:700;font-size:13px;}
.hist-item .m{font-size:11px;color:var(--ink-soft);margin-top:2px;}

.modal-bg{position:fixed;inset:0;background:rgba(20,15,8,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal-bg.center{align-items:center;}
.modal{background:#fff;color:var(--ink);border-radius:16px 16px 0 0;max-width:480px;width:100%;padding:22px;max-height:85vh;overflow:auto;}
.modal-bg.center .modal{border-radius:16px;}
.modal h3{font-family:var(--disp);font-size:19px;margin:0 0 4px;}
.confirm-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0e6cc;font-size:13px;}
.confirm-row b{font-family:var(--mono);}

.modal-bg.dark{align-items:center;}
.modal-dark{background:var(--panel);color:var(--surface-text);border:1px solid var(--line);border-radius:14px;max-width:520px;width:92%;padding:22px 24px;max-height:85vh;overflow:auto;}
.modal-dark h3{font-family:var(--disp);font-size:19px;margin:0 0 2px;color:var(--surface-text);}
.modal-dark .msub{font-family:var(--mono);font-size:11px;color:var(--wheat-dim);margin-bottom:14px;}
.modal-dark .drow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted-text);}
.modal-dark .drow b{font-family:var(--mono);color:var(--surface-text);font-weight:600;}

.version-update-card{background:var(--panel);color:var(--surface-text);border:1px solid var(--wheat-dim);border-radius:18px;max-width:360px;width:90%;padding:32px 26px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.version-update-card h3{font-family:var(--disp);font-size:19px;margin:4px 0 6px;}
.version-update-card .msub{font-family:var(--mono);font-size:11.5px;color:var(--wheat-dim);line-height:1.6;margin-bottom:0;}
.version-update-icon{position:relative;width:76px;height:76px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;}
.version-update-icon span{position:relative;z-index:2;font-size:30px;color:var(--wheat);display:inline-block;animation:versionSpin 2.2s linear infinite;}
.version-update-ring,.version-update-ring2{position:absolute;inset:0;border-radius:50%;border:2px solid var(--wheat);opacity:0;animation:versionPulse 2s ease-out infinite;}
.version-update-ring2{animation-delay:1s;}
@keyframes versionPulse{0%{transform:scale(.5);opacity:.7;}100%{transform:scale(1.3);opacity:0;}}
@keyframes versionSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.modal-dark .dgrp{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--wheat-dim);margin:16px 0 2px;}
.modal-dark .dgrp:first-of-type{margin-top:4px;}
.modal-close{width:100%;margin-top:16px;}

/* ---------- Console (Admin / MIS) — dark data-console ---------- */
.console{display:flex;min-height:calc(100vh - 54px);}
.sidenav{width:208px;flex:none;background:var(--silo-dark-2);border-right:1px solid var(--line);padding:18px 10px;}
.sidenav .grp{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--wheat-dim);padding:14px 10px 6px;}
.navitem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;color:var(--muted-text);font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left;}
.navitem:hover{background:var(--panel);color:var(--surface-text);}
.navitem.active{background:var(--panel-2);color:var(--wheat-light);font-weight:600;}
.navitem .dot{width:6px;height:6px;border-radius:50%;background:var(--wheat-dim);flex:none;}
.navitem.active .dot{background:var(--wheat);}

.consolebody{flex:1;padding:22px 26px 60px;overflow-x:hidden;}
.ch-title{font-family:var(--disp);font-size:22px;font-weight:600;color:var(--surface-text);margin:0 0 2px;}
.ch-sub{font-family:var(--mono);font-size:11px;color:var(--wheat-dim);margin-bottom:20px;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px;}
.dkpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;}
.dkpi[data-kpi]{cursor:pointer;transition:.12s;text-align:left;font-family:var(--sans);width:100%;}
.dkpi[data-kpi]:hover{border-color:var(--wheat-dim);background:var(--panel-2);transform:translateY(-1px);}
.dkpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);font-weight:700;}
.dkpi .v{font-family:var(--mono);font-size:23px;font-weight:700;color:var(--surface-text);margin-top:3px;}
.dkpi .v.g{color:var(--green);}
.dkpi .v.a{color:var(--amber);}
.dkpi .v.o{color:var(--orange);}
.dkpi .v.r{color:var(--red);}
.dkpi .hint{font-family:var(--mono);font-size:9px;color:var(--wheat-dim);margin-top:6px;opacity:.8;}

/* KPI cards v2 — a real "power dashboard" hero row: icon, gradient
   accent bar, and a number that visibly counts up into place on load
   rather than just appearing static. Same click-to-drill-in behaviour as
   before (data-kpi is unchanged), just a much stronger first impression. */
.kpi-grid-v2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px;}
.kpi-card-v2{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;overflow:hidden;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;text-align:left;font-family:var(--sans);width:100%;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.kpi-card-v2:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.14);}
.kpi-card-v2::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--kpi-accent,var(--wheat));}
.kpi-card-v2 .kpi-icon{font-size:20px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--kpi-accent-bg,var(--amber-bg));margin-bottom:12px;}
.kpi-card-v2 .kpi-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);font-weight:700;}
.kpi-card-v2 .kpi-value{font-family:var(--mono);font-size:30px;font-weight:800;color:var(--surface-text);margin-top:4px;line-height:1;letter-spacing:-.5px;}
.kpi-card-v2 .kpi-value.g{color:var(--green);} .kpi-card-v2 .kpi-value.r{color:var(--red);} .kpi-card-v2 .kpi-value.o{color:var(--orange);}
.kpi-card-v2 .kpi-hint{font-family:var(--mono);font-size:9.5px;color:var(--wheat-dim);margin-top:8px;opacity:.85;}

/* Donut chart — genuine SVG-drawn, not a decorative image, built straight
   from the same status counts the bars below already used. Animates its
   stroke in on load. */
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.donut-svg circle{transition:stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1);}
.donut-legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:160px;}
.donut-legend-row{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted-text);}
.donut-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.donut-legend-row b{color:var(--surface-text);margin-left:auto;}
.donut-center-label{font-family:var(--mono);}

.panel-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px;}
.panel-card h4{font-family:var(--disp);font-size:15px;margin:0 0 12px;color:var(--surface-text);display:flex;align-items:center;justify-content:space-between;}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.filters .fg{display:flex;flex-direction:column;gap:4px;}
.filters label{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--wheat-dim);}
.filters select,.filters input{background:var(--input-bg);border:1px solid var(--line);color:var(--surface-text);padding:7px 9px;border-radius:7px;font-size:12px;min-width:120px;}
.filters .btn-sm{align-self:flex-end;}

table.dtable{width:100%;border-collapse:collapse;font-size:12.5px;}

/* CNF Panel on desktop/laptop — same workflow, wider layout so it isn't
   just the phone column stretched out with empty space either side.
   Deliberately still a SINGLE column, even on a big screen — a multi-column
   grid let cards grow to different heights (a product with 2 MFD batches
   vs. one with none), so the page scrolled unevenly and a product's name
   could scroll out of view while its own input fields were still on
   screen — the actual reported problem: no longer being sure which
   product you were typing into. One column keeps the header for whatever
   you're editing always directly above it. */
@media(min-width:900px){
  .cnf-shell .cnf-body{max-width:1180px;}
  .cnf-shell .cnf-header-inner{max-width:1180px;margin:0 auto;}
  #prodRows{max-width:760px;}
  .kpi-row{grid-template-columns:repeat(4,1fr);}
  .sticky-submit .row{max-width:1180px;margin:0 auto;}
  /* Deliberately still a single scrollable line here too, not wrapped —
     a taller category bar (from wrapping onto 2-3 lines, easy to hit with
     10+ real categories on a normal laptop width) would silently grow past
     the fixed pixel offset the product card's own sticky header below is
     calibrated against, pushing that header out of view behind it. A
     constant-height bar is what makes a fixed sticky offset safe to use
     at all — this was a real, confirmed bug on desktop specifically,
     distinct from the mobile-only fix made earlier for the same symptom. */
}

     while still supporting real fill colours, bold headers, and column

     Both carry `defer`: without it, these are render-blocking — the
     browser can't parse/show ANYTHING in <body> (not even the loading

<script>
/* ============================================================
   GANESH STOCK IQ — CNF Physical Stock · Ageing · FIFO
   Manage Stock. Reduce Ageing. Improve Planning.
   Single-file app. Persists via window.storage (shared=true)
   so CNF submissions, Admin masters and MIS all read the
   same live data set.
============================================================ */

const CATS = ["ATTA","MAIDA","SOOJI","SATTU","BESAN","DALIA","SPICES","SNACKS","INSTANT","MILLET","PAPAD","OTHERS"]; // seed default only — live list is state.masters.categories
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// LOCAL calendar date, not UTC. .toISOString() always returns the UTC date —
// for anyone in India (UTC+5:30), that's WRONG for roughly the first 5.5
// hours of every day (12:00 AM–5:29 AM IST), where it would still show
// YESTERDAY's date: e.g. 1:00 AM on the 19th IST is 7:30 PM UTC on the
// 18th, so .toISOString() reports the 18th. That mismatch is exactly what
// caused "today's" stock date, submit-date range, and auto-downloaded
// filenames to show yesterday's date for early-morning submissions.
// Everything in this app is shown in Indian Standard Time (IST) and as DD-MM-YYYY,
// whatever time zone or locale the device itself is set to.
const IST_TZ = 'Asia/Kolkata';
function istParts_(v){
  if(typeof v==='string' && !/^\d{4}-\d{2}-\d{2}/.test(v.trim())) return null; // only ISO timestamps are converted
  const d = v instanceof Date ? v : new Date(v);
  if(isNaN(d.getTime())) return null;
  const o = {};
  new Intl.DateTimeFormat('en-GB',{timeZone:IST_TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d).forEach(x=>{ o[x.type]=x.value; });
  if(o.hour==='24') o.hour='00';
  return o;
}
// Date only -> DD-MM-YYYY. A plain YYYY-MM-DD is just re-ordered (no time-zone shift); a full timestamp is converted to IST first.
function fmtD(v){
  if(v==null || v==='') return '';
  const t = String(v).trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  if(/^\d{2}-\d{2}-\d{4}$/.test(t)) return t;
  if(v instanceof Date || /^\d{4}-\d{2}-\d{2}[T ]/.test(t)){ const q = istParts_(v instanceof Date ? v : t); return q ? `${q.day}-${q.month}-${q.year}` : t; }
  return t;
}
function fmtT(v, withSec){ const q = v ? istParts_(v) : null; return q ? `${q.hour}:${q.minute}${withSec?':'+q.second:''}` : ''; }
function fmtDT(v){ const q = v ? istParts_(v) : null; return q ? `${q.day}-${q.month}-${q.year} ${q.hour}:${q.minute}` : ''; }
function localDateISO(d){
  const q = istParts_(d);
  return q ? `${q.year}-${q.month}-${q.day}` : '';
}
const todayISO = () => localDateISO(new Date());
// Stock submission date is deliberately restricted to "current stock" only —
// today, or yesterday's closing if catching up a day late. Never further
// back (this isn't a historical-entry tool) and never forward (nothing
// physical has happened on a day that hasn't arrived yet). MFD dates are a
// completely separate concept and are NOT subject to this — a batch's
// Manufacturing Date is often, correctly, far in the past.
// Stock is always today's physical stock — there is no date picker for the
// CNF to choose an older (or future) date at all, so this always resolves
// to today regardless of what's passed in. Kept as a named function (rather
// than inlining todayISO() everywhere) so the few remaining callers read
// clearly as "clamp to the only valid submit date."
const clampSubmitDate = (dateStr) => todayISO();

// Lets an MFD date be TYPED fast (any of "1-8-26", "01.08.2026", "1,8.26",
// "010826") instead of always clicking through a calendar — but a wrong
// MFD silently accepted would corrupt every ageing calculation downstream,
// so this NEVER guesses when genuinely unsure. It only returns a date when
// there's exactly one sane reading of what was typed; anything truly
// ambiguous returns null so the caller can reject it and ask for another
// try, rather than silently picking a possibly-wrong interpretation.
function buildDatePartsIfValid_(dStr, mStr, yStr){
  const d = parseInt(dStr,10), m = parseInt(mStr,10);
  let y = parseInt(yStr,10);
  if(isNaN(d)||isNaN(m)||isNaN(y)) return null;
  if(yStr.length<=2) y += (y<=49 ? 2000 : 1900); // 2-digit year: assume 21st century for anything plausible as a recent MFD
  if(m<1||m>12 || d<1||d>31) return null;
  const dt = new Date(y, m-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return null; // catches Feb 30, etc.
  return {y, m, d, iso: `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
}
function parseFlexibleDate(raw){
  const s = String(raw||'').trim();
  if(!s) return null;
  // Any separator (dash, dot, slash, comma, space) between D, M, and Y —
  // this is the common case and almost never ambiguous.
  const sep = s.match(/^(\d{1,2})[\s.,/-]+(\d{1,2})[\s.,/-]+(\d{2}|\d{4})$/);
  if(sep){
    const built = buildDatePartsIfValid_(sep[1], sep[2], sep[3]);
    return built ? built.iso : null;
  }
  // No separator at all, but a fixed, unambiguous length: DDMMYYYY or DDMMYY.
  if(/^\d{8}$/.test(s)){
    const built = buildDatePartsIfValid_(s.slice(0,2), s.slice(2,4), s.slice(4,8));
    return built ? built.iso : null;
  }
  if(/^\d{6}$/.test(s)){
    const built = buildDatePartsIfValid_(s.slice(0,2), s.slice(2,4), s.slice(4,6));
    return built ? built.iso : null;
  }
  // A short unseparated run (e.g. "1826") is genuinely ambiguous on its own
  // — could split as 1/8/26 or 18/2/6, both calendar-valid. Try every
  // sane split, but only trust one if it's the ONLY candidate landing in a
  // plausible MFD window (the last 6 years) — an FMCG batch dated 2006
  // being entered in 2026 is not a real possibility, so that candidate is
  // discarded rather than left to cause a genuine tie.
  if(/^\d{3,5}$/.test(s)){
    const today = new Date();
    const minYear = today.getFullYear() - 6;
    const candidates = [];
    for(let dLen=1; dLen<=2; dLen++){
      for(let mLen=1; mLen<=2; mLen++){
        if(dLen+mLen >= s.length) continue;
        const built = buildDatePartsIfValid_(s.slice(0,dLen), s.slice(dLen,dLen+mLen), s.slice(dLen+mLen));
        if(built && built.y>=minYear && built.y<=today.getFullYear()) candidates.push(built.iso);
      }
    }
    const unique = [...new Set(candidates)];
    return unique.length===1 ? unique[0] : null; // 0 or 2+ plausible readings — refuse to guess
  }
  return null;
}

// Defends against masters loaded from an older sheet/session that predates
// Admin/MIS user accounts, or the editable category list — fills in sensible
// defaults rather than crashing.
function normalizeMasters(m){
  // A header row delivered as a user ("userId" / "password") is a working
  // login — verified against a real Sheet whose CNF/Admin/MIS tabs have a
  // title in row 1 and the header in row 2, which Code.gs reads as data.
  // Anyone typing userId / password got in as Admin. Dropped before the
  // default-user fallback below so it can't be mistaken for a real account.
  const userHeaderWord = v => ['userid','user id','user_id','id','name','password'].includes(String(v==null?'':v).trim().toLowerCase());
  m.scUsers = (m.scUsers||[]).filter(u=>!userHeaderWord(u.userId));
  m.adminUsers = (m.adminUsers||[]).filter(u=>!userHeaderWord(u.userId));
  m.misUsers = (m.misUsers||[]).filter(u=>!userHeaderWord(u.userId));
  // Built-in demo logins only exist for the offline demo. On Supabase the server owns the accounts: inventing a
  // default one here would get saved back to the database with a known password.
  if(!isSupabaseMode()){
    if(!m.adminUsers || !m.adminUsers.length) m.adminUsers = [{userId:'admin', name:'Administrator', password:'admin123', status:'Active'}];
    if(!m.misUsers || !m.misUsers.length) m.misUsers = [{userId:'mis', name:'Back Office', password:'mis123', status:'Active'}];
  }
  if(!m.categories || !m.categories.length) m.categories = Object.keys(m.categorySelfLife||{}).length ? Object.keys(m.categorySelfLife) : CATS.slice();
  if(!m.categoryThresholds) m.categoryThresholds = {};
  // A header row pasted back into CNF_Master as if it were data shows up as a
  // CNF literally named "name" with code "code" (visible as a "name · code"
  // chip). Products and categories already had this guard; CNFs didn't.
  const headerWord = v => ['code','cnf code','plant','name','cnf name'].includes(String(v==null?'':v).trim().toLowerCase());
  m.cnfs = (m.cnfs||[]).filter(c=>!(headerWord(c.code) || headerWord(c.name)));
  (m.cnfs||[]).forEach(c=>{ if(!c.submissionFrequencyDays) c.submissionFrequencyDays = 7; });
  return m;
}

function seedSubmissions(masters){
  // Build a couple of historical + current submissions so MIS/Admin have data to show.
  const out = [];
  const mk = (cnf, daysAgoSubmitted, ageProfile) => {
    const submDate = new Date(Date.now() - daysAgoSubmitted*86400000);
    const items = [];
    masters.products.forEach((p,idx)=>{
      const totalQty = Math.round(20 + Math.random()*180);
      const uom = 'KG';
      // Demo: every 6th product on this CNF's stock arrived across several
      // production runs, so it's held as multiple MFD batches, not one line.
      const batchCount = (idx % 6 === 0) ? (2 + (idx % 3)) : 1;
      let remaining = totalQty;
      for(let b=0; b<batchCount; b++){
        const isLast = b===batchCount-1;
        const qty = isLast ? remaining : Math.max(1, Math.round(totalQty/batchCount));
        remaining -= qty;
        const ageDays = ageProfile==='fresh' ? Math.round(Math.random()*15)
                       : ageProfile==='mixed' ? Math.round(Math.random()* (idx%5===0?200:60)) + b*20
                       : Math.round(40+Math.random()*250) + b*15;
        const mfd = new Date(submDate.getTime() - ageDays*86400000).toISOString().slice(0,10);
        items.push({code:p.code,name:p.name,category:p.category,qty,uom,kgQty:qty,mfd});
      }
    });
    return {
      id: 'SUB'+Math.random().toString(36).slice(2,9).toUpperCase(),
      cnfCode: cnf.code, cnfName: cnf.name,
      date: localDateISO(submDate),
      timestamp: submDate.toISOString(),
      items,
      productsUpdated: new Set(items.map(i=>i.code)).size,
      productsZero: 0,
      submittedBy: cnf.userId,
      status:'Final'
    };
  };
  out.push(mk(masters.cnfs[0], 0, 'mixed'));
  out.push(mk(masters.cnfs[0], 6, 'mixed'));
  out.push(mk(masters.cnfs[1], 1, 'fresh'));
  out.push(mk(masters.cnfs[2], 2, 'old'));
  out.push(mk(masters.cnfs[3], 0, 'mixed'));
  return out;
}

// below fetches this SAME page fresh (bypassing cache) and compares — if the
// deployed copy's version differs from what's currently running in this tab,
// people get a "a newer version is available" prompt instead of silently

// Fails fast instead of hanging the UI if the backend is slow/congested —
// with 26 CNFs potentially hitting it at once, a request should either
// succeed quickly or drop into the offline retry queue, never spin forever.
// 25s (not 20s) specifically to comfortably cover a genuine cache-miss —
// the one read that has to build the response straight from the Sheet
// tabs instead of a warm cache, and the one case most likely to occasionally
// need every bit of that room.
// Text from the server can arrive as a WHOLE HTML PAGE (an error or quota page
// from Google instead of our JSON). Dropped raw into an error message and then
// into the page, one unclosed <title>/<style> in it swallowed everything below
// the banner — the blank white screen. Two defences: errors only ever carry a
// plain-text digest (title + readable words, never markup), and every place an
// error is drawn escapes it anyway.
function responseDigest(raw){
  const s = String(raw==null?'':raw);
  if(!s.trim()) return '(empty response — the server sent nothing back)';
  const title = ((s.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||'').replace(/\s+/g,' ').trim();
  const text = s
    .replace(/<(script|style|head)[\s\S]*?<\/\1>/gi,' ')
    .replace(/<[^>]*>?/g,' ')
    .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/\s+/g,' ').trim();
  const out = (title ? `[${title}] ` : '') + text;
  return out ? out.slice(0,220) : '(a web page with no readable text)';
}
function escapeHtml(v){
  return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('Request timed out')), ms))
  ]);
}
// Everything the Apps Script backend did is one door on Supabase: the
// app_call(action, payload) function in supabase_schema.sql. Same action names,
// same JSON shapes — so nothing else in the app needed to learn a new protocol.
// ---- Sign-in token (Supabase mode) ----
// The server checks the password and hands back a random token. It lives in sessionStorage only (gone when the
// tab closes), never in localStorage, and is attached to every call. Passwords are never held by the browser.
let _authTokenMem = null;
function getAuthToken(){ try{ return sessionStorage.getItem('gsi:tok') || _authTokenMem; }catch(e){ return _authTokenMem; } }
function setAuthToken(t){ _authTokenMem = t || null; try{ if(t) sessionStorage.setItem('gsi:tok', t); else sessionStorage.removeItem('gsi:tok'); }catch(e){} }
// Last line of defence against stored XSS: whatever HTML the app builds (including text typed by other users —
// names, messages, SAP file contents) is stripped of scripts, event handlers and javascript: links before it
// reaches the page. The app itself uses no inline handlers, so nothing legitimate is removed.
function sanitizeHtml_(html){
  try{
    const t = document.createElement('template');
    t.innerHTML = String(html==null?'':html);
    t.content.querySelectorAll('script,iframe,frame,object,embed,link,meta,base,applet,form').forEach(n=>n.remove());
    t.content.querySelectorAll('*').forEach(el=>{
      Array.from(el.attributes).forEach(a=>{
        const n = a.name.toLowerCase(), v = String(a.value).replace(/[\s\u0000-\u001f]+/g,'').toLowerCase();
        if(n.startsWith('on') || n==='srcdoc' || n==='formaction'){ el.removeAttribute(a.name); return; }
        if((n==='href'||n==='src'||n==='xlink:href'||n==='action') && (/^(javascript|vbscript):/.test(v) || /^data:(?!image\/(png|jpe?g|gif|webp|svg\+xml);)/.test(v))) el.removeAttribute(a.name);
      });
    });
    return t.innerHTML;
  }catch(e){ return escapeHtml(html); }
}
function setHtml_(el, html){ el.innerHTML = sanitizeHtml_(html); }
const SUPABASE_EMAIL_ACTIONS = ['sendTestEmail','sendOverdueReminders','sendSubmissionReport'];
async function supabaseCall(action, payload, timeoutMs){
  if(SUPABASE_EMAIL_ACTIONS.includes(action)){
    // Sending email was Apps Script's job (Gmail); the Supabase backend stores the settings
    // but does not send yet. Answered locally — no point uploading a 1 MB attachment to refuse it.
    throw new Error('Email sending is not available on the Supabase backend yet — use the Email Broadcaster app for now.');
  }
  const base = getSupabaseBase();
  if(!base) throw new Error('No Supabase project URL is set — add it under Admin → API Connection.');
  const key = getSupabaseKey();
  if(!key) throw new Error('Supabase is selected but no public API key is set — add it under Admin → API Connection.');
  const headers = {'Content-Type':'application/json', 'apikey':key};
  // Legacy anon keys are JWTs and are also sent as a Bearer token; the newer "publishable"
  // keys are not JWTs and must go in the apikey header only.
  if(/^eyJ/.test(key)) headers['Authorization'] = 'Bearer '+key;
  const res = await withTimeout(fetch(base+'/rest/v1/rpc/app_call', {
    method:'POST', headers, body: JSON.stringify({p_action:action, p_payload: (action==='ping'||action==='login') ? (payload||{}) : Object.assign({}, payload||{}, {_t:getAuthToken()||''})})
  }), timeoutMs||25000);
  const rawText = await res.text();
  let data;
  try{ data = JSON.parse(rawText); }
  catch(parseErr){ throw new Error(`Supabase did not return valid data (HTTP ${res.status}). What it sent: ${responseDigest(rawText)}`); }
  if(!res.ok){
    // PostgREST error object: {code, message, details, hint}
    const msg = data && (data.message || data.error);
    throw new Error(msg ? String(msg)+(data.hint?` — ${data.hint}`:'') : `Supabase error (HTTP ${res.status})`);
  }
  if(data && data.error){
    const err = new Error(data.error); err.code = data.code || '';
    if(data.code==='AUTH' && action!=='login') onSessionExpired_();
    throw err;
  }
  return data;
}
// The server no longer recognises our token (idle too long, signed out elsewhere, account switched off).
function onSessionExpired_(){
  if(!getAuthToken() && !state.role) return;          // nobody was signed in — nothing to undo
  setAuthToken(null);
  if(state.role){ doLogout(true); state.loginError = 'Your session has ended. Please sign in again.'; try{ render(); }catch(e){} }
}
// The Google Apps Script path (the Sheet) — exactly what apiGet always was.
async function appsScriptGet(action, params, opts){
  const apiUrl = getApiUrl();
  if(!apiUrl) return null;
  const qs = new URLSearchParams(Object.assign({action}, params||{})).toString();
  const url = apiUrl + (apiUrl.indexOf('?')>-1?'&':'?') + qs;
  // One silent retry — reads have no side effects, so retrying is always
  // safe, and a single retry quietly absorbs the most common real-world
  // cause of a timeout here: the very first request after the backend's
  // cache has expired (up to every 6 hours) or was just cleared, which has
  // to rebuild from the Sheet tabs directly and is genuinely slower than
  // every request after it. Rather than surface that as a hard failure and
  // make someone manually retry, this gives it one more try automatically
  // — by then the cache is usually warm.
  const fetchAndParse = async ()=>{
    const res = await withTimeout(fetch(url), (opts && opts.timeoutMs) || 25000);
    const rawText = await res.text();
    let data;
    // Same reasoning as apiPost: a parse failure here means the response
    // wasn't JSON at all — an HTML error page from a stale/broken
    // deployment, not anything doPost/doGet's own try/catch would produce.
    try{ data = JSON.parse(rawText); }
    catch(parseErr){
      throw new Error(`Server did not return valid data (likely a stale or broken Apps Script deployment — redeploy Code.gs and re-check the API URL). What the server sent: ${responseDigest(rawText)}`);
    }
    if(data && data.error) throw new Error(data.error);
    return data;
  };
  // A caller that wants to know exactly what happened on the FIRST attempt
  // (the Test Connection button) opts out of the silent retry.
  if(opts && opts.retry===false) return await fetchAndParse();
  try{ return await fetchAndParse(); }
  catch(e){ return await fetchAndParse(); }
}
// Converts a binary ArrayBuffer (an in-memory .xlsx, in this app's case)
// to a base64 string for JSON transport to Apps Script, which expects
// Utilities.base64Decode() on the other end. Chunked to avoid blowing the
// call-stack limit String.fromCharCode.apply() hits on large buffers —
// a multi-hundred-product detailed report can be tens of KB, comfortably
// past that limit if done in one call.
function arrayBufferToBase64(buffer){
  const bytes = new Uint8Array(buffer);
  let binary = '';
  const chunkSize = 8192;
  for(let i=0; i<bytes.length; i+=chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
  }
  return btoa(binary);
}
async function appsScriptPost(action, payload, timeoutMs){
  const apiUrl = getApiUrl();
  if(!apiUrl) throw new Error('No backend configured');
  // Deliberately NO automatic retry here, unlike apiGet — a POST can have a
  // real side effect (saving a submission, sending an email); retrying one
  // that actually succeeded server-side but timed out on the way back risks
  // doing it twice, which is worse than surfacing the failure once and
  // letting the existing offline-queue/manual-retry paths handle it
  // deliberately instead.
  const res = await withTimeout(fetch(apiUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight against Apps Script
    body: JSON.stringify(Object.assign({action}, payload||{}))
  }), timeoutMs||25000);
  // A "JSON fail"/parse-error here almost always means the response wasn't
  // JSON at all — most commonly an HTML error page from Apps Script itself
  // (a stale/broken deployment URL, an authorization page, or the script
  // failing to even start) rather than anything doPost's own try/catch
  // could have produced, since that always returns real JSON. Surfacing
  // the raw response text (not just "invalid JSON") turns an opaque
  // browser parse error into something that immediately says "redeploy/
  // reconnect the backend" instead of looking like a bug in this action.
  const rawText = await res.text();
  let data;
  try{ data = JSON.parse(rawText); }
  catch(parseErr){
    throw new Error(`Server did not return valid data (likely a stale or broken Apps Script deployment — redeploy Code.gs and re-check the API URL). What the server sent: ${responseDigest(rawText)}`);
  }
  if(data && data.error) throw new Error(data.error);
  return data;
}

// ---- who answers what ----
// Reads that feed dashboards/reports come from Supabase in hybrid mode. If Supabase can't
// answer (down, paused, or simply not filled yet), the old Sheet path answers instead — so
// switching to hybrid can never leave anyone unable to log in or see data.
const HYBRID_READS = ['bootstrap','allSubmissions','cnfSubmissions','allMessages','messagesForCnf'];
// Writes made by Admin/MIS that the reporting copy must also learn about (best effort; the
// Sheet is the one that has to succeed). A CNF's submission is handled separately in syncSubmission.
const HYBRID_MIRRORED_WRITES = ['saveMasters','addProducts','sendMessage'];
function reportDbRecentlyDown(){ return !!(state.reportDbDownAt && Date.now()-state.reportDbDownAt < 20000); }
function markReportStale(why){ state.reportStaleAt = Date.now(); lsSet('reportStaleAt', {at:state.reportStaleAt, why:String(why||'').slice(0,200)}); }
function mirrorToSupabase(action, payload){

async function apiGet(action, params, opts){
  const apiUrl = getApiUrl();
  if(!apiUrl) return null;
  if(isSupabaseUrl(apiUrl)){
    const tms = (opts && opts.timeoutMs) || 25000;
    if(opts && opts.retry===false) return await supabaseCall(action, params, tms);
    try{ return await supabaseCall(action, params, tms); }
    catch(e){ return await supabaseCall(action, params, tms); } // reads are safe to retry once
  }
  // opts.fresh = someone is waiting on THIS call (signing in, tapping Sync): always try Supabase, never go by the "it failed a moment ago" note.
  if(isHybridMode() && HYBRID_READS.includes(action) && (!reportDbRecentlyDown() || (opts && opts.fresh))){
    try{
      // Supabase answers in milliseconds, so it gets a short leash — a slow one is a broken one.
      const data = await supabaseCall(action, params, Math.min((opts && opts.timeoutMs) || 25000, 15000));
      if(action==='bootstrap' && !(((data && data.masters && data.masters.cnfs) || []).length)){
        return await appsScriptGet(action, params, opts); // not filled yet — fall back, don't strand logins
      }
      state.reportDbDownAt = null;
      return data;
    }catch(e){
      state.reportDbDownAt = Date.now();                  // don't make every background call wait out the same failure
      try{ return await appsScriptGet(action, params, opts); }
      catch(e2){ throw new Error(`Supabase: ${(e&&e.message)||e} · Google Sheet: ${(e2&&e2.message)||e2}`); } // both failed — say both, not just the last
    }

}
async function apiPost(action, payload, timeoutMs){
  const apiUrl = getApiUrl();
  if(!apiUrl) throw new Error('No backend configured');
  if(action==='saveMasters' && state.mastersAreDemo) throw new Error('Not saved: this device is showing built-in demo data, not your real CNF/product list — saving it would overwrite the real one. Reload once the server is reachable.');
  if(isSupabaseUrl(apiUrl)) return await supabaseCall(action, payload, timeoutMs); // no auto-retry for writes
  const result = await appsScriptPost(action, payload, timeoutMs);                   // the Sheet first — it must succeed
  if(isHybridMode() && HYBRID_MIRRORED_WRITES.includes(action)) mirrorToSupabase(action, payload);
  return result;
}


// Master data is treated as a STATIC, locally-cached set for speed — a CNF
// opening their dashboard should never wait on a network round-trip just to
// see it. The very first login on a device (or after the cache is cleared)
// does one real fetch; every load after that renders instantly from the
// local copy, and only refreshes from the server in the background, at
// most once every MASTER_SYNC_INTERVAL — not on every single open. New
// products from a SAP upload are still pushed live immediately (that's a
// separate, targeted sync) — this only throttles the general "pull
// everything again" refresh.
const MASTER_SYNC_INTERVAL_MS = 6 * 60 * 60 * 1000; // 6 hours

async function loadAll(){
  // Opening this file directly from disk (double-clicking a download,
  // file:///C:/...) instead of via the real hosted URL is a real,
  // recurring source of confusion: browsers block a file:// page from
  // talking to any https:// backend for security reasons — no code here
  // can work around that, in any browser. Symptom is always the same:
  // the loading screen climbs toward 92% and sits there, because the
  // Google Sheet connection can never actually complete. Catching this
  // up front with a clear, specific message beats another silent
  // eventual-timeout that leaves someone thinking the app is just broken.
  if(typeof window!=='undefined' && window.location && window.location.protocol==='file:'){
    document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--silo-dark);gap:16px;padding:24px;text-align:center;">
      <div style="width:52px;height:52px;">${Mark()}</div>
      <div style="font-family:var(--serif);font-size:19px;color:var(--wheat-light);">Ganesh&nbsp;Stock&nbsp;IQ</div>
      <div style="max-width:420px;font-family:var(--mono);font-size:12.5px;color:var(--wheat-dim);line-height:1.7;">
        This file was opened directly from your computer — it can't connect to the Google Sheet from here, no matter how long you wait.<br><br>
        Please open the real link instead:<br><b style="color:var(--wheat-light);">https://ganeshstockiq.github.io/ganesh-stock-iq/</b>
      </div>
    </div>`;
    return;
  }
  const apiUrl = getApiUrl();
  state.backendConnected = !!apiUrl;
  state.backendError = null;

  const cachedMasters = lsGet('masters');
  if(cachedMasters){
    // FAST PATH — the cached copy is already good enough to work from, so
    // there's no real reason to make anyone wait on the network just to
    // SEE their dashboard: restoring which account is logged in is pure
    // local state (no network), so the loading screen can release the
    // moment that's done, while the actual masters/messages refresh
    // happens after, quietly, re-rendering once it lands. The difference
    // is real — a login that used to wait on two Apps Script round-trips
    // before showing anything now shows the (already-cached) dashboard
    // immediately and gets it slightly fresher a moment later, instead of
    // making that freshness a precondition for seeing anything at all.
    state.masters = normalizeMasters(cachedMasters);
    state.submissions = normalizeSubmissionList(lsGet('submissions') || []);
    state.currentSnapshots = lsGet('currentSnapshots') || {};   // MIS/Admin's merged per-CNF picture — without this a reload would forget it
    state.importedBackup = lsGet('importedBackup') || null;
    state.reportSync = lsGet('reportSync') || null;
    state.loaded = true;
    startFakeProgress(['Restoring your session…']);
    let restored = null;
    try{ restored = tryRestoreSessionFast_(); }catch(e){ /* never leave the progress bar stuck — worst case they land on the login screen and can try again */ }
    finishFakeProgress('Ready');
    render();
    flushPendingQueue();
    if(restored){
      tr9yMnTm4NSzvG9rrwjM2ec8xZgh1cafXH8_(restored).then(()=>render()).catch(()=>{});
    }
    if(apiUrl && !(isSupabaseMode() && !getAuthToken())) maybeBackgroundSyncMasters(); // silent, throttled, never blocks the UI
    if(state.role) checkForNewVersion(); // fire-and-forget — "sync" for the app's own code, not just its data
    return;
  }

  // COLD START — nothing cached yet on this device, so a real fetch is
  // unavoidable exactly once.
  startFakeProgress(['Connecting to Google Sheet…','Loading CNF list…','Loading product catalog…','Almost ready…']);
  if(apiUrl && isSupabaseMode() && !getAuthToken()){
    // Supabase hands out nothing before sign-in. Show the login screen; the real data loads right after sign-in.
    state.masters = normalizeMasters(seedMasters()); state.mastersAreDemo = true;
    state.submissions = []; state.backendConnected = true;
  } else if(apiUrl){
    try{
      const boot = await apiGet('bootstrap');
      state.masters = normalizeMasters(boot.masters);
      state.submissions = normalizeSubmissionList(boot.latestSubmissions || []);
      state.currentSnapshots = {};
      state.submissions.forEach(sn=>{ state.currentSnapshots[String(sn.cnfCode)] = sn; });
      state.lastDataSyncAt = Date.now();
      state.mastersAreDemo = false;
      lsSet('masters', state.masters);
      lsSet('submissions', state.submissions);
      lsSet('currentSnapshots', state.currentSnapshots);
      lsSet('masterSyncedAt', Date.now());
    }catch(e){
      // A URL being configured is NOT the same as the fetch having actually
      // succeeded — this was a real, misleading bug: on failure, this used
      // to silently fall back to fake demo data (3 seed CNFs) while the
      // header kept claiming "● LIVE — synced to your Google Sheet", because
      // backendConnected was only ever set from "is a URL present", never
      // from "did the last real fetch work." Someone could stare at a
      // "LIVE" label backed entirely by demo data with no way to tell.
      state.backendConnected = false;
      state.backendError = String((e&&e.message)||e);
      const legacyMasters = await legacyWindowStorageMasters();
      state.mastersAreDemo = !legacyMasters;
      state.masters = normalizeMasters(legacyMasters || seedMasters());
      state.submissions = [];
    }
  } else {
    state.masters = normalizeMasters((await legacyWindowStorageMasters()) || seedMasters());
    state.submissions = seedSubmissions(state.masters);
    lsSet('masters', state.masters);
    lsSet('submissions', state.submissions);
  }
  // Same "show first, sync after" split as the fast path above — the
  // masters fetch just above already got everything fresh in this cold-
  // start case, so tryRestoreSessionFast_() only needs to restore WHICH
  // account is logged in (pure local state), and only messages still need
  // a network call, done in the background rather than adding yet another
  // blocking round-trip on top of the one just completed.
  let restored = null;
  try{ restored = tryRestoreSessionFast_(); }catch(e){ /* never leave the progress bar stuck — worst case they land on the login screen and can try again */ }
  state.loaded = true;
  finishFakeProgress('Ready');
  render();
  flushPendingQueue();
  if(restored){
    const msgPromise = restored.role==='cnf' ? loadMessagesForCnf(restored.cnf.code) : loadAllMessages();
    msgPromise.then(()=>render()).catch(()=>{});
  }
  if(state.role) checkForNewVersion();
}

// Refreshes the cached master data in the background, at most once per
// MASTER_SYNC_INTERVAL_MS, and never interrupts a CNF mid-submission —
// if they've already started filling in stock, the refresh still fetches
// (to keep the cache warm) but holds off re-rendering until they're back
// on the dashboard, so nothing shifts under their fingers while typing.
async function maybeBackgroundSyncMasters(){
  if(isSupabaseMode() && !getAuthToken()) return;
  const lastSync = Number(lsGet('masterSyncedAt')) || 0;
  if(Date.now() - lastSync < MASTER_SYNC_INTERVAL_MS) return;
  try{
    const boot = await apiGet('bootstrap');
    state.masters = normalizeMasters(boot.masters);
    lsSet('masters', state.masters);
    lsSet('masterSyncedAt', Date.now());
    const midSubmission = state.cnfUser && Object.keys(state.draftItems||{}).length>0;
    if(!midSubmission) render();
  }catch(e){ /* silent — keep using the cached copy, try again next throttle window */ }
}

// Manual "get me the truth right now" — pulls BOTH masters AND every
// CNF's latest submission fresh from the server, regardless of the
// throttle window. This is what was missing: Admin's old "Sync Now" only
// refreshed masters (CNFs/products), never submissions — so a CNF's brand
// new stock submission could sync to the server just fine and still never
// show up in MIS, because MIS's cached "latest submissions" pool was never
// told to refresh. MIS calls this on login and via its own Refresh button.
//
// IMPORTANT: this merges with whatever's already known locally rather than
// blindly replacing it. A server response that's momentarily behind (lag,
// read timing, or a sync that's still in flight) must never make a
// just-submitted, already-visible-on-screen submission disappear — that's
// strictly worse than just leaving it stale for a few seconds.
async function forceSyncMasters(opts){
  if(!getApiUrl()) return;
  const boot = await apiGet('bootstrap', null, opts);
  state.masters = normalizeMasters(boot.masters);
  const serverList = normalizeSubmissionList(boot.latestSubmissions || []);
  const serverIds = new Set(serverList.map(s=>s.id));
  const localOnly = state.submissions.filter(s=>!serverIds.has(s.id));
  state.submissions = serverList.concat(localOnly);
  state.currentSnapshots = {};
  serverList.forEach(sn=>{ state.currentSnapshots[String(sn.cnfCode)] = sn; });
  state.lastDataSyncAt = Date.now();
  state.mastersAreDemo = false;
  lsSet('masters', state.masters);
  lsSet('submissions', state.submissions);
  lsSet('currentSnapshots', state.currentSnapshots);
  lsSet('masterSyncedAt', Date.now());
}
