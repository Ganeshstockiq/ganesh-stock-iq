function CnfSubmit(){
  if(!state.sapUpload) return SapUploadGate();

  const catGroups = sapCategoryGroups();
  if(!catGroups.find(g=>g.cat===state.submitCat)) state.submitCat = catGroups.length ? catGroups[0].cat : null;
  const missing = missingRequiredCodes();
  // "Only what's still missing" is a filtered view — the moment nothing is
  // missing any more it has nothing left to show, and (since the chip that
  // switches it off only appears while something IS missing) it would strand
  // the CNF on an empty page with the category tabs hidden and no way back.
  // Switch it off automatically instead, so the normal view always returns.
  if(state.sapMissingOnlyFilter && !missing.length) state.sapMissingOnlyFilter = false;

  let baseRows;
  if(state.sapMissingOnlyFilter){
    baseRows = state.sapUpload.rows.filter(r=>missing.includes(r.code));
  } else {
    const activeGroup = catGroups.find(g=>g.cat===state.submitCat);
    baseRows = activeGroup ? activeGroup.rows : [];
  }
  const nonZeroCount = baseRows.filter(r=>r.currentStockKg>0).length;
  let rows = state.sapMissingOnlyFilter ? baseRows : baseRows.filter(r => state.sapShowZero || r.currentStockKg > 0);
  if(state.sapSearch) rows = rows.filter(r => r.name.toLowerCase().includes(state.sapSearch.toLowerCase()) || r.code.toLowerCase().includes(state.sapSearch.toLowerCase()));

  const filledTotal = Object.values(state.draftItems).filter(batches=>(batches||[]).some(b=>b.qty!==undefined && b.qty!=='')).length;
  const varianceCodes = state.sapUpload.rows.filter(r=>hasUnresolvedVariance(r.code)).map(r=>r.code);
  const totalCurrentStock = state.sapUpload.rows.reduce((s,r)=>s+r.currentStockKg,0);
  const totalApproved = state.sapUpload.rows.reduce((s,r)=>s+(r.approvedOrder||0),0);
  const totalPending = state.sapUpload.rows.reduce((s,r)=>s+(r.pendingOrder||0),0);
  const requiredTotal = state.sapUpload.rows.filter(r=>r.currentStockKg>0).length;

    <span class="chip chip-warn" data-missingfilter="${state.sapMissingOnlyFilter?'off':'on'}">⚠ ${missing.length} item${missing.length!==1?'s':''} with stock still need${missing.length===1?'s':''} entry${state.sapMissingOnlyFilter?' · showing only these — tap to clear':' · tap to jump to them'}</span>

// A product's draft entry is an ARRAY of MFD batches: [{qty,uom,mfd}, ...]
// This lets the same product (e.g. 100kg on hand) be entered as several
// lines with different Manufacturing Dates — required for FIFO/ageing
// when godown stock for one product spans multiple production batches.
function getBatches(code, product){
  const arr = state.draftItems[code];
  if(arr && arr.length) return arr;
  return [{qty:'', uom:product.defaultUOM||'KG', mfd:''}];
}

function enteredKgFor(code){
  const p = state.masters.products.find(pp=>pp.code===code);
  if(!p) return 0;
  const batches = state.draftItems[code] || [];
  return batches.filter(b=>b.qty!==undefined && b.qty!=='').reduce((s,b)=>s+convertToKg(p,b.qty,b.uom||p.defaultUOM),0);
}
// A batch only counts as genuinely "filled" once it has BOTH a quantity
// AND an MFD — a quantity with no manufacturing date is an incomplete
// entry (ageing can't be judged, and it shouldn't count toward progress),
// not a finished one. This is the single place that decision is made, so
// progress counts (Pending, category-complete, required-remaining) and
// the actual submit-blocking check below always agree with each other.
function batchFilled(code){
  const batches = state.draftItems[code] || [];
  return batches.some(b=>b.qty!==undefined && b.qty!=='' && b.mfd);
}
// Specifically the "typed a quantity but forgot the date" case — kept
// separate from batchFilled so Final/Partial Submit can give a precise,
// actionable message ("add the MFD") instead of the more generic "still
// pending" a CNF would otherwise have to guess the reason for.
function findMissingMfdBatches(){
  const missing = [];
  Object.keys(state.draftItems).forEach(code=>{
    const p = state.masters.products.find(pp=>pp.code===code);
    (state.draftItems[code]||[]).forEach((b,idx)=>{
      if(b.qty!==undefined && b.qty!=='' && !b.mfd){
        missing.push({code, idx, name: p?p.name:code});
      }
    });
  });
  return missing;
}
// A Manufacturing Date can be today or any day in the past — never even
// one day ahead of today, since stock cannot have been produced in the
// future. YYYY-MM-DD strings compare correctly as plain text, so this is
// an exact "is it after today" check with no timezone edge cases.
function isFutureMfd(iso){
  return !!iso && iso > todayISO();
}
// Safety net at submit time: the entry fields already refuse a future date
// as it's typed/picked, but a draft saved earlier (or restored from an
// older app version) could still be carrying one — this makes sure none
// can ever reach a submission regardless of how it got into the draft.
function findFutureMfdBatches(){
  const bad = [];
  Object.keys(state.draftItems).forEach(code=>{
    const p = state.masters.products.find(pp=>pp.code===code);
    (state.draftItems[code]||[]).forEach((b,idx)=>{
      if(isFutureMfd(b.mfd)) bad.push({code, idx, name: p?p.name:code, mfd: b.mfd});
    });
  });
  return bad;
}
// Shows a kg figure at its real precision (up to 2 decimals, trailing
// zeros dropped) — 208.08 must read 208.08, not a rounded 208.1.
function fmtKg(n){
  const v = Math.round((Number(n)||0)*100)/100;
  return String(v);
}
// Takes the CNF straight to the exact product card an error is about,
// instead of leaving them to hunt for it: opens the right category,
// clears any filter/search that could hide that card, scrolls it into the
// middle of the screen, flashes it, and puts the cursor in the field that
// needs attention (field: 'mfd' | 'qty'). Used by every submit-time error.
function goToProductCard(code, idx, field){
  const p = state.masters.products.find(pp=>pp.code===code);
  const sapRow = state.sapUpload ? state.sapUpload.rows.find(r=>r.code===code) : null;
  state.cnfModal = null;
  state.varianceReasonModal = false;
  state.cnfScreen = 'submit';
  state.sapMissingOnlyFilter = false;
  state.sapSearch = '';
  if(p && p.category) state.submitCat = p.category;
  // A card with zero SAP stock is hidden under "Stocked only" — show all
  // so the card we're sending them to is actually on screen.
  if(sapRow && !(sapRow.currentStockKg>0)) state.sapShowZero = true;
  render();
  const focusIt = ()=>{
    const row = document.querySelector(`[data-prow="${code}"]`);
    if(!row) return;
    row.scrollIntoView({behavior:'smooth', block:'center'});
    row.classList.add('prow-flash');
    setTimeout(()=>row.classList.remove('prow-flash'), 2800);
    const sel = field==='mfd'
      ? `[data-mfdcode="${code}"][data-batch="${idx||0}"]`
      : `[data-qtycode="${code}"][data-batch="${idx||0}"]`;
    const inp = row.querySelector(sel) || row.querySelector('input');
    if(inp){ try{ inp.focus({preventScroll:true}); }catch(e){ inp.focus(); } }
  };
  setTimeout(focusIt, 60);
}
function categoryComplete(cat){
  // Is every SAP line in this category that actually needs entry (nonzero
  // current stock) filled in yet? Drives the tab auto-advance below — a
  // category with nothing to enter counts as trivially complete so it's
  // skipped over rather than stalling the flow.
  const group = sapCategoryGroups().find(g=>g.cat===cat);
  if(!group) return false;
  const required = group.rows.filter(r=>r.currentStockKg>0);
  if(!required.length) return true;
  return required.every(r=>batchFilled(r.code));
}
// Real entry progress for a category — how many of the SAP lines that
// actually need a batch (nonzero current stock) have one yet. Drives the
// silo-style fill gauge on each category tab.
function categoryEntryProgress(cat){
  const group = sapCategoryGroups().find(g=>g.cat===cat);
  if(!group) return {required:0, entered:0, pct:100};
  const required = group.rows.filter(r=>r.currentStockKg>0);
  if(!required.length) return {required:0, entered:0, pct:100};
  const entered = required.filter(r=>batchFilled(r.code)).length;
  return {required: required.length, entered, pct: Math.round((entered/required.length)*100)};
}
// Groups the uploaded SAP rows by the matching product's category, sorted so
// categories that actually have current stock come first (alphabetically
// among themselves), with all-zero categories pushed to the end.
function sapCategoryGroups(){
  if(!state.sapUpload) return [];
  const groups = {};
  state.sapUpload.rows.forEach(r=>{
    const p = state.masters.products.find(pp=>pp.code===r.code);
    const cat = (p && p.category) || 'OTHERS';
    (groups[cat] = groups[cat]||[]).push(r);
  });
  const cats = Object.keys(groups).map(cat=>{
    const rows = groups[cat];
    const stockedCount = rows.filter(r=>r.currentStockKg>0).length;
    return {cat, rows, hasStock: stockedCount>0, stockedCount, total: rows.length};
  });
  cats.sort((a,b)=>{
    if(a.hasStock !== b.hasStock) return a.hasStock ? -1 : 1;
    return a.cat.localeCompare(b.cat);
  });
  return cats;
}
// Every SAP line with current stock > 0 must get at least one MFD batch
// entered before Final Submit — this is the mandatory-coverage rule.
function missingRequiredCodes(){
  if(!state.sapUpload) return [];
  // Only rows that actually have a product card to fill in count as
  // "missing" — a SAP line whose product isn't in Product Master renders no
  // card at all (SapProductRow skips it) and can't be submitted, so
  // demanding it would block Final Submit on something no one could reach.
  return state.sapUpload.rows
    .filter(r=>r.currentStockKg>0 && !batchFilled(r.code) && state.masters.products.some(pp=>pp.code===r.code))
    .map(r=>r.code);
}
// Sub-50g gaps between entered and SAP stock are floating-point/unit-
// conversion rounding noise (e.g. converting BAG/PC to kg with a
// non-round factor), not a real physical difference — don't force anyone
// to write a reason explaining a 10-gram rounding artifact. Everything
// that decides "does this need a reason" or "does this match SAP" goes
// through these two so the threshold is consistent everywhere.
const VARIANCE_TOLERANCE_KG = 0.05;
function roundedDiffKg(a, b){ return Math.round((a-b)*100)/100; }
function withinTolerance(diff){ return Math.abs(diff) <= VARIANCE_TOLERANCE_KG; }

function hasUnresolvedVariance(code){
  if(!state.sapUpload) return false;
  const row = state.sapUpload.rows.find(r=>r.code===code);
  if(!row) return false;
  const batches = state.draftItems[code] || [];
  const anyEntered = batches.some(b=>b.qty!==undefined && b.qty!=='');
  if(!anyEntered) return false; // nothing entered yet — not a variance until they start entering
  const entered = enteredKgFor(code);
  const diff = roundedDiffKg(entered, row.currentStockKg);
  return !withinTolerance(diff) && !(state.varianceReasons[code] && state.varianceReasons[code].trim());
}

// Every product across EVERY category (not just whichever one the CNF
// currently has open) that still needs a difference reason — this is what
// "tap to fill them in" on the toast, and the modal it opens, are built
// from, so a reason sitting in a category the CNF isn't even looking at
// is never invisible to them.
function findAllUnresolvedVarianceRows(){
  if(!state.sapUpload) return [];
  return state.sapUpload.rows.filter(r=>hasUnresolvedVariance(r.code));
}

// A dedicated, cross-category checklist for exactly the thing Final/
// Partial Submit's error is about: every product still missing its
// difference reason, wherever it happens to live in the category list,
// shown together with its own reason input right here so nothing has to
// be hunted down category by category.
function VarianceReasonModal_(){
  if(!state.varianceReasonModal) return '';
  const rows = findAllUnresolvedVarianceRows();
  return `<div class="modal-bg dark" id="varianceReasonModalBg"><div class="modal-dark" style="max-width:560px;">
    <h3 style="margin-top:0;">⚠ Difference Reason Needed</h3>
    <p style="color:var(--wheat-dim);font-size:12.5px;margin-top:-6px;">${rows.length ? `${rows.length} product${rows.length!==1?'s':''} — across whichever categories they're in — entered qty doesn't match SAP Current Stock, and still need a reason before you can submit.` : 'Nothing outstanding right now.'}</p>
    <div style="max-height:50vh;overflow-y:auto;margin:0 -4px;">
      ${rows.map(r=>{
        const p = state.masters.products.find(pp=>pp.code===r.code);
        const entered = enteredKgFor(r.code);
        const diff = roundedDiffKg(entered, r.currentStockKg);
        return `<div style="padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.08);">
          <div style="font-size:13px;font-weight:600;">${r.name || (p&&p.name) || r.code} <span style="font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--wheat-dim);">${r.code}${p?' · '+p.category:''}</span></div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--wheat-dim);margin:2px 0 6px;">SAP ${fmtKg(r.currentStockKg)}kg · Entered ${fmtKg(entered)}kg · Diff ${diff>0?'+':''}${fmtKg(diff)}kg</div>
          <input type="text" data-modalreasoncode="${r.code}" placeholder="e.g. Damage, unrecorded dispatch, counting error…" value="${state.varianceReasons[r.code]||''}" style="width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);box-sizing:border-box;">
        </div>`;
      }).join('') || `<div style="padding:16px 4px;text-align:center;color:var(--wheat-dim);">✓ All resolved — you can close this and submit.</div>`}
    </div>
    <button class="btn btn-dark btn-block" id="btnCloseVarianceModal" style="margin-top:14px;">Close</button>
  </div></div>`;
}

// Convenience-only display: shows what a KG figure equals in BAG/PC too,
// wherever a product's conversion factors are known. Never changes any
// actual math — KG stays the number of record everywhere; this is purely
// "so a CNF doesn't have to do the division in their head."
// BAG and PC are PHYSICAL units — a bag or a piece either exists or it
// doesn't, so neither can ever be shown as a fraction (0.999 BAG, 999.5
// PC are never valid). Only KG is a true weight and can be decimal.
//
// BAG specifically represents physical bag COUNT, not "kg divided by bag
// size" — once a bag is opened, it still counts as one of the bags on
// hand (nothing physically vanished), it's just no longer sealed. So the
// count of whole, still-sealed bags is shown, PLUS a "(1 Open)" note the
// moment there's any partial remainder — never a fractional bag number.
function bagEquivDisplay(kgQty, product){
  if(!product || !product.bagToKg) return '';
  const bagKg = product.bagToKg;
  const wholeBags = Math.floor((kgQty/bagKg) + 1e-6); // tiny epsilon absorbs float rounding noise
  const remainder = kgQty - wholeBags*bagKg;
  return remainder > 0.0005 ? `${wholeBags+1} (1 Open)` : String(wholeBags);
}
// PC is always a whole physical piece count — rounds, never shows a
// decimal, unlike KG.
function pcEquivDisplay(kgQty, product){
  if(!product || !product.pcToKg) return '';
  return String(Math.round(kgQty / product.pcToKg));
}
// How many pieces make up one whole bag — a purely informational number
// (Bag KG ÷ PC KG), shown so a CNF or Admin can see the full picture (e.g.
// "1 BAG = 30 KG = 600 PC") without doing the division themselves.
function pcPerBag(product){
  if(!product || !product.bagToKg || !product.pcToKg) return null;
  return Math.round(product.bagToKg / product.pcToKg);
}
function formatUomEquivalents(kg, product){
  const parts = [];
  if(product.bagToKg) parts.push(`${bagEquivDisplay(kg, product)} BAG`);
  if(product.pcToKg) parts.push(`${pcEquivDisplay(kg, product)} PC`);
  return parts.length ? ` <span class="uom-equiv">(≈ ${parts.join(' / ')})</span>` : '';
}

function SapProductRow(sapRow){
  const p = state.masters.products.find(pp=>pp.code===sapRow.code);
  if(!p) return '';
  const batches = getBatches(p.code, p);
  const filledBatches = batches.filter(b=>b.qty!==undefined && b.qty!=='');
  const filled = filledBatches.length>0;
  const totalKg = enteredKgFor(p.code);
  const diff = filled ? roundedDiffKg(totalKg, sapRow.currentStockKg) : null;
  const needsReason = filled && diff!==null && !withinTolerance(diff);
  const reasonFilled = state.varianceReasons[p.code] && state.varianceReasons[p.code].trim();
  // Straight from THIS CNF's own file (Column M), not Product Master's
  // global default — see safetyNormFor's comment for why that distinction
  // matters. sapRow always wins here since it's this exact upload's own
  // figure; safetyNormFor's Product Master fallback only matters for a
  // file with no Safety Stock column at all.
  const safetyNorm = safetyNormFor(sapRow, p);
  const hasSafetyNorm = safetyNorm>0;
  const belowSafety = filled && hasSafetyNorm && totalKg < safetyNorm;
  return `
  <div class="prow ${filled?'filled':''} ${needsReason && !reasonFilled?'needs-reason':''}" data-prow="${p.code}">
    <div class="pinfo">
      <div class="pname">${p.name} <span class="cat-pill">${p.category}</span></div>
      <div class="pmeta">${p.code} · SAP Current Stock <b>${fmtKg(sapRow.currentStockKg)}kg</b>${formatUomEquivalents(sapRow.currentStockKg, p)}${filled?` · Entered <b>${fmtKg(totalKg)}kg</b>${formatUomEquivalents(totalKg, p)}`:''}
        ${filled ? (withinTolerance(diff) ? ' · <span class="badge ok">Matches SAP</span>' : ` · <span class="badge low">Δ ${diff>0?'+':''}${fmtKg(diff)}kg vs SAP</span>`) : ''}
      </div>
      <div class="pmeta2">Approved Order <b>${(sapRow.approvedOrder||0).toLocaleString('en-IN',{maximumFractionDigits:1})}</b> · Pending Order <b>${(sapRow.pendingOrder||0).toLocaleString('en-IN',{maximumFractionDigits:1})}</b> · ${hasSafetyNorm ? `Safety Norm <b>${safetyNorm}kg</b>` : `<span class="badge unknown">No Safety Norm Set</span>`}${belowSafety?` · <span class="badge low">Below Safety — short ${fmtKg(safetyNorm-totalKg)}kg</span>`:''}${pcPerBag(p) ? ` · 1 BAG = ${p.bagToKg}kg = ${pcPerBag(p)} PC` : ''}</div>
    </div>
    <div class="batchlist">
      ${batches.map((b,i)=>BatchRow(p,b,i,batches.length)).join('')}
    </div>
    <button class="addbatch-btn" data-addbatch="${p.code}">+ Add another MFD batch</button>
    ${filled ? `<div class="reason-row ${needsReason?'':'reason-row-optional'}">
      <label>${needsReason ? 'Reason for difference (required)' : 'Note (optional)'}</label>
      <input type="text" data-reasoncode="${p.code}" placeholder="${needsReason ? 'e.g. Damage, unrecorded dispatch, counting error…' : 'Matches SAP — add a note if you want to record anything'}" value="${state.varianceReasons[p.code]||''}">
    </div>` : ''}
  </div>`;
}

function ddmmyyyy(iso){ return fmtD(iso); }

function BatchRow(p,b,i,total){
  // A product still pending Admin review (auto-created from an unmapped SAP
  // material — see the SAP-upload handler) can ONLY be entered in KG. There's
  // no trustworthy PC/BAG conversion for it yet, and unlike a normal product
  // with a merely-missing conversion, we don't want to silently accept an
  // unconverted PC/BAG number here — force KG until Admin fills it in.
  const pending = !!p.pendingReview;
  const uom = pending ? 'KG' : (b.uom || p.defaultUOM || 'KG');
  const noConversion = !pending && ((uom==='BAG' && !p.bagToKg) || (uom==='PC' && !p.pcToKg));

function CnfHistory(){
  // Always scoped to the current calendar month — this is a submission
  // log for "what have I sent this month," not an ever-growing archive to
  // scroll through. Export any older submission's date directly from its
  // audit trail on request if ever needed (the full history is never
  // deleted server-side, only this view is scoped).
  const now = new Date();
  const monthStart = localDateISO(new Date(now.getFullYear(), now.getMonth(), 1));
  const monthLabel = now.toLocaleDateString('en-IN', {month:'long', year:'numeric'});
  const subs = state.submissions.filter(s=>s.cnfCode===state.cnfUser.code && s.date>=monthStart).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  return `<div class="section-title">Submission History <span class="num">${subs.length}</span> <span style="font-family:var(--mono);font-size:10px;color:var(--ink-soft);font-weight:400;">${monthLabel} · click Export on any date to download that day's full stock report</span></div>
  ${subs.map(s=>`
    <div class="hist-item">
      <div><div class="d">${fmtD(s.date)}</div><div class="m">${new Set(s.items.map(i=>i.code)).size} products · ${s.items.length} MFD batch lines · Submitted ${fmtT(s.timestamp)} · ID ${s.id}</div></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="badge ok">${s.status}</span>
        <button class="btn btn-ghost btn-sm" data-exportsub="${s.id}">⬇ Export</button>
      </div>
    </div>`).join('') || `<div class="empty">No submissions yet in ${monthLabel}.</div>`}
  `;
}

function buildSubmissionItems(){
  // Flattens {code: [batches]} into one line per MFD batch — a product with
  // 6 different manufacturing dates produces 6 items with the same code.
  const items = [];
  Object.entries(state.draftItems).forEach(([code,batches])=>{
    const p = state.masters.products.find(pp=>pp.code===code);
    if(!p) return;
    const sapRow = state.sapUpload ? state.sapUpload.rows.find(r=>r.code===code) : null;
    (batches||[]).forEach(b=>{
      if(b.qty===undefined || b.qty==='') return;
      items.push({
        code, name:p.name, category:p.category, qty:Number(b.qty)||0, uom:b.uom||p.defaultUOM,
        kgQty: convertToKg(p, b.qty, b.uom||p.defaultUOM), mfd: b.mfd||'',
        sapQtyKg: sapRow ? sapRow.currentStockKg : null,
        varianceReason: sapRow ? (state.varianceReasons[code]||'') : '',
        approvedOrder: sapRow ? (sapRow.approvedOrder||0) : null,
        pendingOrder: sapRow ? (sapRow.pendingOrder||0) : null,
        // CNF × product-code specific — straight from THIS CNF's own SAP
        // Current Stock file (Column M), captured here so every report
        // downstream always shows exactly what was on file at this moment,
        // never a different CNF's number or today's Product Master default.
        safetyStockKg: sapRow && sapRow.safetyStockKg!=null ? sapRow.safetyStockKg : null
      });
    });
  });
  return items;
}

function CnfFinalModal(){
  const items = buildSubmissionItems();
  const byCode = {};
  items.forEach(i=>{ (byCode[i.code]=byCode[i.code]||[]).push(i); });
  const productsUpdated = Object.keys(byCode).length;
  const productsZero = Object.values(byCode).filter(list=>list.reduce((s,i)=>s+i.qty,0)===0).length;
  const multiMfd = Object.values(byCode).filter(list=>list.length>1).length;
  const unresolvedCodes = state.sapUpload ? state.sapUpload.rows.filter(r=>hasUnresolvedVariance(r.code)) : [];
  const missing = missingRequiredCodes();
  const varianceCount = Object.entries(byCode).filter(([code,list])=>{
    const sapRow = state.sapUpload && state.sapUpload.rows.find(r=>r.code===code);
    if(!sapRow) return false;
    const total = list.reduce((s,i)=>s+i.kgQty,0);
    return !withinTolerance(roundedDiffKg(total, sapRow.currentStockKg));
  }).length;
  const canSubmit = unresolvedCodes.length===0 && missing.length===0 && productsUpdated>0;
  return `<div class="modal-bg center" id="finalModalBg"><div class="modal">
    <h3>Confirm Final Submission</h3>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:0;">Review before locking today's physical stock position.</p>
    <div class="confirm-row"><span>Stock Date</span><b>${state.submitDate}</b></div>
    <div class="confirm-row"><span>CNF</span><b>${state.cnfUser.name} (${state.cnfUser.code})</b></div>
    <div class="confirm-row"><span>SAP Current Stock File</span><b>${state.sapUpload?state.sapUpload.fileName:'—'}</b></div>
    <div class="confirm-row"><span>Products with SAP Stock &gt; 0</span><b>${state.sapUpload?state.sapUpload.rows.filter(r=>r.currentStockKg>0).length:0}</b></div>
    <div class="confirm-row"><span>Products Updated</span><b>${productsUpdated}</b></div>
    <div class="confirm-row"><span>Total MFD Batch Lines</span><b>${items.length}</b></div>
    <div class="confirm-row"><span>Products with Multiple MFD Batches</span><b>${multiMfd}</b></div>
    <div class="confirm-row"><span>Products with Zero Stock</span><b>${productsZero}</b></div>
    <div class="confirm-row"><span>Products with a Difference vs SAP</span><b style="color:${varianceCount?'var(--orange)':'inherit'}">${varianceCount}</b></div>
    ${missing.length ? `<div class="confirm-row" style="border:none;"><span style="color:var(--red);font-weight:600;">⚠ ${missing.length} product${missing.length!==1?'s':''} with SAP current stock still ${missing.length===1?'has':'have'} nothing entered — every product with stock must be submitted. Go back and fill ${missing.length===1?'it':'them'} in.</span></div>` : ''}
    ${unresolvedCodes.length ? `<div class="confirm-row" style="border:none;"><span style="color:var(--red);font-weight:600;">⚠ ${unresolvedCodes.length} item${unresolvedCodes.length!==1?'s':''} still need${unresolvedCodes.length===1?'s':''} a difference reason before you can submit — go back and fill ${unresolvedCodes.length===1?'it':'them'} in.</span></div>` : ''}
    <div style="display:flex;gap:8px;margin-top:18px;">
      <button class="btn btn-ghost btn-block" id="btnCancelFinal">Cancel</button>
      <button class="btn btn-primary btn-block" id="btnConfirmFinal" ${canSubmit?'':'disabled'}>FINAL SUBMIT STOCK</button>
    </div>
  </div></div>`;
}

// Same {TOKEN} find-and-replace as Code.gs's applyTemplate_ — kept as a
// twin, not shared code (this runs client-side, that runs in Apps
// Script), but deliberately identical logic so a preview here never shows

function applyEmailTemplate_(template, vars){
  let out = String(template||'');
  Object.keys(vars).forEach(k=>{ out = out.split('{'+k+'}').join(String(vars[k])); });
  return out;
}

/* ================= Sheet backup import (offline fallback) =================
   A downloaded copy of the Google Sheet (File → Download → Microsoft Excel
   .xlsx) can be loaded straight into this browser, so the MIS/Admin dashboards
   and the Export Centre keep working even if the link to the Sheet is down.
   Entirely client-side: nothing here is ever written back to the Sheet. */
const BACKUP_HEADER_WORDS = ['code','cnf code','plant','name','cnf name','userid','user id','category','categories','cat','product','products','product code','material','selflifedays','self-life','self life','n/a','na'];
function backupIsDataRow(r){
  const f = String(r[0]==null?'':r[0]).trim();
  // Title sentences ("CNF_MASTER — one row per CNF…") are long and header rows
  // are header words; both are template furniture, not data. Code.gs reads
  // these tabs from row 2, so a title in row 1 pushes the header row into the
  // data — the same trap this skips.
  return f!=='' && f.length<25 && !BACKUP_HEADER_WORDS.includes(f.toLowerCase());
}
function backupNum(v){ return (v===''||v==null||isNaN(Number(v))) ? null : Number(v); }
function backupDate(v){
  if(v==null||v==='') return '';
  if(v instanceof Date) return localDateISO(v);
  // Excel stores dates as day-serials; converting arithmetically (not via a JS
  // Date) is what keeps them off-by-one-day-proof in every timezone.
  if(typeof v==='number'){ const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}` : ''; }
  return cleanDateField(String(v));
}
function backupTimestamp(v){
  if(typeof v==='number') return new Date(Math.round((v-25569)*86400000)).toISOString();
  if(v instanceof Date) return v.toISOString();
  return String(v==null?'':v);
}

// A submission whose line list is the SAME block repeated k≥2 times was saved
// k times — a timed-out save is retried, and the backend used to append the
// same SubmissionID again on every retry (one real backup had 28 of 101
// submissions saved 2–8 times, ~5,000 duplicate lines). One copy is the real
// submission. Only a whole-list repeat is collapsed, so a genuine pair of
// separate lines inside one submission is never touched.
function collapseResentItems(items){
  const n = items.length;
  if(n<2) return {items, removed:0};
  const keys = items.map(it=>JSON.stringify([it.code,it.qty,it.uom,it.kgQty,it.mfd,it.sapQtyKg,it.varianceReason,it.approvedOrder,it.pendingOrder,it.safetyStockKg]));
  for(let p=1;p<=n/2;p++){
    if(n%p) continue;
    let same = true;
    for(let i=p;i<n;i++){ if(keys[i]!==keys[i%p]){ same=false; break; } }
    if(same) return {items: items.slice(0,p), removed: n-p};
  }
  return {items, removed:0};
}
function dedupeResentSubmissions(list){
  return (list||[]).map(sub=>{
    const r = collapseResentItems(sub.items||[]);
    return r.removed ? Object.assign({}, sub, {items:r.items}) : sub;
  });
}

function parseBackupMasters(wb){
  const rowsOf = n => wb.Sheets[n] ? XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:'', raw:true}) : null;
  const res = {found:{}, ignored:{}, cnfs:[], products:[], categories:[], categorySelfLife:{}, adminUsers:[], misUsers:[], dupInFile:0};
  const take = (name, rowToObj, valid, keyFn) => {
    const rows = rowsOf(name); if(!rows) return [];
    const nonEmpty = rows.filter(r=>r.some(c=>c!==''));
    const objs = nonEmpty.filter(backupIsDataRow).map(rowToObj).filter(valid);
    const m = new Map();
    objs.forEach(o=>{ const k = keyFn(o); if(m.has(k)) res.dupInFile++; m.set(k, o); }); // a code listed twice: the later row wins
    const out = Array.from(m.values());
    res.found[name] = out.length; res.ignored[name] = nonEmpty.length - objs.length;
    return out;
  };
  res.cnfs = take('CNF_Master', r=>({
    code:String(r[0]).trim(), name:String(r[1]).trim(), userId:String(r[2]===''?r[0]:r[2]).trim(), password:String(r[3]===''?'':r[3]),
    status:r[4]||'Active', location:r[5]||'', submissionFrequencyDays: backupNum(r[6])||7, email:String(r[7]||'').trim()
  }), c=>c.name!=='', c=>c.code);
  res.products = take('Product_Master', r=>{
    const cat = String(r[2]===''?'OTHERS':r[2]).trim().toUpperCase();
    return {
      code:String(r[0]).trim(), name:String(r[1]).trim(), category: BACKUP_HEADER_WORDS.includes(cat.toLowerCase())?'OTHERS':cat,
      packSize:r[3]===''?null:r[3], defaultUOM:String(r[4]||'KG').toUpperCase(),
      bagToKg:backupNum(r[5]), pcToKg:backupNum(r[6]), safetyStockKg:backupNum(r[7])||0,
      selfLifeOverride:backupNum(r[8]), ageingDaysOverride:backupNum(r[9]),
      pendingReview: r[10]===true || String(r[10]).toUpperCase()==='TRUE'
    };
  }, p=>p.name!=='', p=>p.code);
  const cats = take('Categories', r=>({name:String(r[0]).trim().toUpperCase(), days:backupNum(r[1])}), c=>c.name!=='', c=>c.name);
  cats.forEach(c=>{ res.categories.push(c.name); res.categorySelfLife[c.name] = c.days||180; });
  const userRow = r=>({userId:String(r[0]).trim(), name:String(r[1]||'').trim(), password:String(r[2]==null?'':r[2]), status:r[3]||'Active'});
  res.adminUsers = take('Admin_Users', userRow, u=>u.password!=='', u=>u.userId);
  res.misUsers   = take('MIS_Users',   userRow, u=>u.password!=='', u=>u.userId);
  return res;
}

// Submissions (full log) and CurrentStock share one 21-column layout. Located
// by header NAME where possible (the real Sheet's last header, SafetyStockKg,
// was never written, so column U is read by position when its header is blank).
function parseBackupStockSheet(wb, name){
  const ws = wb.Sheets[name]; if(!ws) return null;
  const raw = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
  const hi = raw.findIndex((r,i)=>i<6 && r.some(c=>String(c).trim().toLowerCase()==='submissionid'));
  if(hi<0) throw new Error(`The "${name}" tab has no SubmissionID header row — is this the right file?`);
  const hdr = raw[hi].map(c=>String(c).trim().toLowerCase());
  const need = h => { const i = hdr.indexOf(h.toLowerCase()); if(i<0) throw new Error(`The "${name}" tab is missing the "${h}" column.`); return i; };
  const C = {
    ts:need('Timestamp'), id:need('SubmissionID'), cnf:need('CNFCode'), date:need('StockDate'), code:need('ProductCode'), kg:need('KGQty'),
    cnfName:hdr.indexOf('cnfname'), pname:hdr.indexOf('productname'), cat:hdr.indexOf('category'), qty:hdr.indexOf('enteredqty'), uom:hdr.indexOf('entereduom'),
    mfd:hdr.indexOf('mfd'), by:hdr.indexOf('submittedby'), status:hdr.indexOf('status'), sap:hdr.indexOf('sapqtykg'), reason:hdr.indexOf('variancereason'),
    sapFile:hdr.indexOf('sapfilename'), sapAt:hdr.indexOf('sapuploadedat'), appr:hdr.indexOf('approvedorder'), pend:hdr.indexOf('pendingorder'),
    safety: hdr.indexOf('safetystockkg')>-1 ? hdr.indexOf('safetystockkg') : (hdr.length>20 ? 20 : -1)
  };
  const at = (r,i) => i>-1 ? r[i] : '';
  const lines = raw.slice(hi+1).filter(r=>String(r[C.id]).trim()!=='' && String(r[C.cnf]).trim()!=='');
  let badKg = 0;
  const groups = new Map();
  lines.forEach(r=>{
    const id = String(r[C.id]).trim();
    let g = groups.get(id);
    if(!g){
      g = {id, cnfCode:String(r[C.cnf]).trim(), cnfName:String(at(r,C.cnfName)), date:backupDate(r[C.date]), timestamp:backupTimestamp(r[C.ts]),
           submittedBy:String(at(r,C.by)), status:String(at(r,C.status))||'Final', sapFileName:String(at(r,C.sapFile)||''), sapUploadedAt:String(at(r,C.sapAt)||''), items:[]};
      groups.set(id, g);
    }
    const kg = backupNum(r[C.kg]); if(kg===null) badKg++;
    g.items.push({
      code:String(r[C.code]).trim(), name:at(r,C.pname), category:at(r,C.cat), qty:backupNum(at(r,C.qty))||0, uom:String(at(r,C.uom)||'KG'),
      kgQty: kg===null?0:kg, mfd:backupDate(at(r,C.mfd)), sapQtyKg:backupNum(at(r,C.sap)), varianceReason:at(r,C.reason)||'',
      approvedOrder:backupNum(at(r,C.appr)), pendingOrder:backupNum(at(r,C.pend)), safetyStockKg:backupNum(at(r,C.safety))
    });
  });
  return {groups:Array.from(groups.values()), lineCount:lines.length, badKg};
}

// "Google Sheet → Supabase": reads everything from the Sheet through Apps Script (the slow path —
// done here once, patiently, instead of on every dashboard load) and writes it into Supabase.
// Safe to repeat. A submission already in Supabase that is newer than the Sheet's copy of that CNF
// is kept (importCurrent never moves a CNF backwards). If the Sheet can't be read in time, the
// "Import Backup" route with a downloaded .xlsx does the same job without Apps Script.
async function syncSheetToSupabase(onProgress){
  const say = t=>{ if(onProgress) onProgress(t); };
  if(!hasSupabase()) throw new Error('Add the Supabase URL and public key first.');
  say('Step 1/4 — reading masters and current stock from the Google Sheet… (can take a minute)');
  const boot = await appsScriptGet('bootstrap', null, {retry:false, timeoutMs:120000});
  const masters = normalizeMasters(boot.masters);
  if(!(masters.cnfs||[]).length) throw new Error('The Google Sheet returned no CNFs — nothing was synced.');
  const snaps = normalizeSubmissionList(boot.latestSubmissions || []);
  say('Step 2/4 — reading the full submission history from the Google Sheet…');
  let history = null, historyError = null;
  try{
    const h = await appsScriptGet('allSubmissions', null, {retry:false, timeoutMs:180000});
    history = dedupeResentSubmissions(normalizeSubmissionList(h.submissions || [])); // repeated saves counted once
  }catch(e){ historyError = (e && e.message) || String(e); }
  say('Step 3/4 — saving masters to Supabase…');
  await supabaseCall('saveMasters', {masters}, 60000);
  const out = {cnfs:masters.cnfs.length, products:masters.products.length, submissions:0, snapshots:0, historyError};
  if(history){
    let batch = [], lines = 0;
    const flush = async ()=>{ if(!batch.length) return; say(`Step 4/4 — saving history… ${out.submissions}/${history.length} submissions`); const r = await supabaseCall('importSubmissions', {subs:batch}, 60000); out.submissions += (r && r.imported!=null) ? r.imported : batch.length; batch = []; lines = 0; };
    for(const sub of history){ batch.push(sub); lines += sub.items.length; if(lines>=1500) await flush(); }
    await flush();
  }
  {
    let batch = [], lines = 0;
    const flush = async ()=>{ if(!batch.length) return; say(`Step 4/4 — saving current stock… ${out.snapshots}/${snaps.length} CNFs`); await supabaseCall('importCurrent', {snaps:batch}, 60000); out.snapshots += batch.length; batch = []; lines = 0; };
    for(const sn of snaps){ batch.push(sn); lines += sn.items.length; if(lines>=1500) await flush(); }
    await flush();
  }
  state.reportSync = {at: Date.now(), summary: out};
  lsSet('reportSync', state.reportSync);
  if(!historyError){ state.reportStaleAt = null; lsSet('reportStaleAt', null); }
  return out;
}

// Writes an imported backup into the connected Supabase database, in small requests
// (a few hundred lines each) so none of them is slow or large. Masters are UPSERTED from the
// file only — never the whole local masters object, which on a fresh device can carry demo
// CNFs and demo logins that must never reach the real database. Everything is safe to re-run.
async function pushBackupToSupabase(parsed, opts, onProgress){
  const say = t=>{ if(onProgress) onProgress(t); };
  const out = {masters:null, subs:{sent:0,total:0}, current:{replaced:0,kept:0,total:0}};
  if(opts.masters || opts.users){
    const mp = {};
    if(opts.masters){ mp.cnfs = parsed.masters.cnfs; mp.products = parsed.masters.products; mp.categories = parsed.masters.categories; mp.categorySelfLife = parsed.masters.categorySelfLife; }
    if(opts.users){ mp.adminUsers = parsed.masters.adminUsers; mp.misUsers = parsed.masters.misUsers; }
    say('Saving masters to Supabase…');
    out.masters = await supabaseCall('importMasters', mp, 60000);
  }
  if(opts.stock && parsed.history){
    const subs = parsed.history.subs; out.subs.total = subs.length;
    let batch = [], lines = 0;
    const flush = async ()=>{
      if(!batch.length) return;
      say(`Saving history to Supabase… ${out.subs.sent}/${subs.length} submissions`);
      const r = await supabaseCall('importSubmissions', {subs:batch}, 60000);
      out.subs.sent += (r && r.imported!=null) ? r.imported : batch.length;
      batch = []; lines = 0;
    };
    for(const sub of subs){ batch.push(sub); lines += sub.items.length; if(lines>=1500) await flush(); }
    await flush();
  }
  if(opts.stock && parsed.current){
    const snaps = Object.values(parsed.current.snaps); out.current.total = snaps.length;
    let batch = [], lines = 0;
    const flush = async ()=>{
      if(!batch.length) return;
      say(`Saving current stock to Supabase… ${out.current.replaced+out.current.kept}/${snaps.length} CNFs`);
      const r = await supabaseCall('importCurrent', {snaps:batch}, 60000);
      out.current.replaced += (r && r.replaced) || 0; out.current.kept += (r && r.kept) || 0;
      batch = []; lines = 0;
    };
    for(const sn of snaps){ batch.push(sn); lines += sn.items.length; if(lines>=1500) await flush(); }
    await flush();
  }
  return out;
}

function parseBackupWorkbook(wb){
  const masters = parseBackupMasters(wb);
  const hist = parseBackupStockSheet(wb, 'Submissions');
  const cur = parseBackupStockSheet(wb, 'CurrentStock');
  const recognised = ['CNF_Master','Product_Master','Categories','Admin_Users','MIS_Users','Submissions','CurrentStock'].filter(n=>wb.Sheets[n]);
  if(!recognised.length) throw new Error('This does not look like a CFA Stock Audit Sheet backup — none of its tabs (CNF_Master, Product_Master, Submissions, CurrentStock…) were found.');
  // History: collapse whole-submission repeats (see collapseResentItems).
  let resentSubs = 0, removedLines = 0, history = null;
  if(hist){
    const subs = hist.groups.map(g=>{ const r = collapseResentItems(g.items); if(r.removed){ resentSubs++; removedLines += r.removed; } return r.removed ? Object.assign({}, g, {items:r.items}) : g; });
    history = {subs, lineCount:hist.lineCount, keptLines:hist.lineCount-removedLines, resentSubs, removedLines, badKg:hist.badKg};
  }
  // Current stock: one merged picture per CNF, built the way the server builds it.
  let current = null;
  if(cur){
    const snaps = {};
    cur.groups.forEach(g=>{
      const e = snaps[g.cnfCode] || (snaps[g.cnfCode] = {id:g.id, cnfCode:g.cnfCode, cnfName:g.cnfName, date:g.date, timestamp:g.timestamp, submittedBy:g.submittedBy, status:g.status, sapFileName:g.sapFileName, sapUploadedAt:g.sapUploadedAt, items:[]});
      if(new Date(g.timestamp) > new Date(e.timestamp)){ Object.assign(e, {id:g.id, cnfName:g.cnfName, date:g.date, timestamp:g.timestamp, submittedBy:g.submittedBy, status:g.status, sapFileName:g.sapFileName, sapUploadedAt:g.sapUploadedAt}); }
      g.items.forEach(it=>e.items.push(it));
    });
    current = {snaps, cnfCount:Object.keys(snaps).length, lineCount:cur.lineCount, badKg:cur.badKg};
  }
  const newestStockDate = current ? Object.values(current.snaps).map(x=>x.date).sort().pop() : (history ? history.subs.map(x=>x.date).sort().pop() : '');
  return {masters, history, current, recognised, newestStockDate};
}

// What importing WOULD do, against what's here right now — shown before anything changes.
function computeBackupPreview(p){
  const cmp = (incoming, existing, keyFn) => { const ex = new Set((existing||[]).map(keyFn)); let nw=0, ov=0; incoming.forEach(x=>{ ex.has(keyFn(x)) ? ov++ : nw++; }); return {total:incoming.length, nw, ov}; };
  const m = state.masters;
  const out = {
    cnfs: cmp(p.masters.cnfs, m.cnfs, x=>x.code), products: cmp(p.masters.products, m.products, x=>x.code),
    categories: cmp(p.masters.categories.map(n=>({n})), (m.categories||[]).map(n=>({n})), x=>x.n),
    adminUsers: cmp(p.masters.adminUsers, m.adminUsers, x=>x.userId), misUsers: cmp(p.masters.misUsers, m.misUsers, x=>x.userId),
    submissions: p.history ? cmp(p.history.subs, state.submissions, x=>x.id) : null,
    snapshots: null
  };
  if(p.current){
    let nw=0, replace=0, keep=0;
    Object.values(p.current.snaps).forEach(inc=>{
      const ex = state.currentSnapshots && state.currentSnapshots[inc.cnfCode];
      if(!ex) nw++; else if(new Date(inc.timestamp) >= new Date(ex.timestamp)) replace++; else keep++;
    });
    out.snapshots = {total:p.current.cnfCount, nw, replace, keep};
  }
  return out;
}

// Same as lsSet, but says whether it actually fit — lsSet swallows a full
// browser storage silently, which is exactly wrong for "will this survive a reload?".
function lsSetChecked(key, value){ try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); return true; }catch(e){ return false; } }

function applyBackupImport(p, opts, fileName){
  const res = {opts, masters:null, users:null, stock:null, persist:{}};
  if(!Array.isArray(state.submissions)) state.submissions = [];
  if(!state.currentSnapshots) state.currentSnapshots = {};
  const upsert = (list, incoming, keyFn, merge) => {
    let nw=0, ov=0;
    incoming.forEach(inc=>{
      const i = list.findIndex(x=>keyFn(x)===keyFn(inc));
      if(i>-1){ list[i] = merge ? merge(list[i], inc) : inc; ov++; } else { list.push(inc); nw++; }
    });
    return {nw, ov};
  };
  const m = state.masters;
  if(opts.masters){
    res.masters = {
      cnfs: upsert(m.cnfs, p.masters.cnfs, c=>c.code, (old,inc)=>Object.assign({}, old, inc, {email: inc.email || old.email || ''})), // the Sheet predates the email column — never blank an email we have
      products: upsert(m.products, p.masters.products, x=>x.code),
      categories: {nw:0, ov:0}
    };
    if(!m.categories) m.categories = [];
    if(!m.categorySelfLife) m.categorySelfLife = {};
    p.masters.categories.forEach(c=>{ if(m.categories.includes(c)) res.masters.categories.ov++; else { m.categories.push(c); res.masters.categories.nw++; } m.categorySelfLife[c] = p.masters.categorySelfLife[c]; });
  }
  if(opts.masters || opts.users) state.mastersAreDemo = false;
  if(opts.users){
    res.users = { admin: upsert(m.adminUsers, p.masters.adminUsers, u=>u.userId), mis: upsert(m.misUsers, p.masters.misUsers, u=>u.userId) };
  }
  if(opts.stock){
    res.stock = {subs:null, snaps:null};
    if(p.history){
      const incomingIds = new Set(p.history.subs.map(s=>s.id));
      const existingIds = new Set(state.submissions.map(s=>s.id));
      let ov = 0; incomingIds.forEach(id=>{ if(existingIds.has(id)) ov++; });
      state.submissions = state.submissions.filter(s=>!incomingIds.has(s.id)).concat(p.history.subs);
      res.stock.subs = {total:p.history.subs.length, nw:p.history.subs.length-ov, ov, removedLines:p.history.removedLines, resentSubs:p.history.resentSubs};
    }
    if(p.current){
      if(!state.currentSnapshots) state.currentSnapshots = {};
      let nw=0, replaced=0, kept=0;
      Object.values(p.current.snaps).forEach(inc=>{
        const ex = state.currentSnapshots[inc.cnfCode];
        if(!ex){ state.currentSnapshots[inc.cnfCode] = inc; nw++; }
        else if(new Date(inc.timestamp) >= new Date(ex.timestamp)){ state.currentSnapshots[inc.cnfCode] = inc; replaced++; }
        else kept++; // what's already here is newer than the file — the file never rolls a CNF backwards
      });
      res.stock.snaps = {total:p.current.cnfCount, nw, replaced, kept};
    }
  }
  // Persist, and report honestly whether it fit.
  res.persist.masters = (opts.masters||opts.users) ? lsSetChecked('masters', state.masters) : null;
  if(opts.stock){
    res.persist.snapshots = lsSetChecked('currentSnapshots', state.currentSnapshots);
    if(lsSetChecked('submissions', state.submissions)) res.persist.history = 'full';
    else {
      const cutoff = new Date(Date.now()-45*86400000).toISOString().slice(0,10);
      const recent = state.submissions.filter(s=>(s.date||'')>=cutoff);
      if(lsSetChecked('submissions', recent)) res.persist.history = 'recent';
      else { try{ localStorage.removeItem(LS_PREFIX+'submissions'); }catch(e){} res.persist.history = 'none'; }
    }
  }
  if(opts.masters||opts.users||opts.stock){
    state.importedBackup = {fileName, importedAt:Date.now(), newestStockDate:p.newestStockDate||''};
    lsSetChecked('importedBackup', state.importedBackup);
  }
  return res;
}

  if(!ts) return '—';

      <li>Same code / ID already here → the file <b>overrides</b> it. Re-importing the same file changes nothing. Nothing is deleted.</li>
      <li>A submission that was saved to the Sheet more than once is counted <b>once</b>.</li>
      <li><b>Nothing is written to the Google Sheet.</b> The data is kept in this browser only. Whenever the Sheet is reachable again, its live data takes over.</li>
    </ul>
    <input type="file" id="backupFile" accept=".xlsx,.xls" style="display:none;">
    <button class="btn btn-primary" id="btnPickBackup">⬆ Choose Sheet backup (.xlsx)</button>
    <div id="backupProg" style="margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--wheat-dim);display:none;"></div>
    ${imp ? `<p style="font-family:var(--mono);font-size:11.5px;color:var(--wheat-dim);margin:14px 0 0;">Backup currently on this device: <b>${imp.fileName}</b> · imported ${fmtWhen(imp.importedAt)}${imp.newestStockDate?` · newest stock dated ${imp.newestStockDate}`:''}</p>` : ''}
  </div>
  ${state.backupPreview ? BackupPreviewCard(state.backupPreview) : ''}
  ${state.lastImportResult ? BackupResultCard(state.lastImportResult) : ''}`;
}

function ReportingDbCard(){
  const on = isHybridMode(), rs = state.reportSync;
  const stale = state.reportStaleAt && (!rs || state.reportStaleAt > rs.at);
  const sm = rs && rs.summary;
  return `<div class="panel-card">
    <h4>Reporting database (Supabase) <span style="font-family:var(--mono);font-size:9px;color:var(--wheat-dim);text-transform:none;letter-spacing:0;font-weight:400;">fast dashboards, reports and exports</span></h4>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:0;line-height:1.6;">Saves keep going to the Google Sheet exactly as before. Dashboards, analytics and exports read from a Supabase copy instead, so they load in a moment and the Sheet is no longer asked for everything every time. If Supabase can't answer, the app quietly falls back to the Sheet.</p>
    <div class="formgrid" style="grid-template-columns:1fr;">
      <div class="fg"><label>Supabase project URL</label><input type="text" id="reportUrlInput" placeholder="https://xxxxxxxx.supabase.co" value="${escapeHtml(getReportUrl())}"></div>
      <div class="fg"><label>Supabase public key — the "publishable" or "anon" key; it is meant to be public</label><input type="text" id="reportKeyInput" placeholder="sb_publishable_…  or  eyJ…" value="${escapeHtml(getSupabaseKey())}"></div>
    </div>
    <div class="small-btn-row">
      <button class="btn btn-primary btn-sm" id="btnSaveReport">Save</button>
      <button class="btn btn-ghost btn-sm" id="btnTestReport">Test Supabase</button>
      <button class="btn btn-dark btn-sm" id="btnSyncSheetToSupabase" ${on?'':'disabled title="Save the Supabase URL and key first"'}>⟳ Sync Google Sheet → Supabase now</button>
    </div>
    <div id="reportTestResult" style="font-family:var(--mono);font-size:12px;color:var(--wheat-dim);margin-top:8px;white-space:pre-wrap;"></div>
    <div id="reportSyncProg" style="font-family:var(--mono);font-size:12px;color:var(--wheat-dim);margin-top:8px;display:none;"></div>
    <hr class="hr">
    <div class="drow" style="border:none;padding:4px 0;"><span style="font-family:var(--mono);font-size:11px;color:var(--wheat-dim);text-transform:uppercase;">Status</span>
      <b style="font-family:var(--mono);font-size:13px;color:${on?'var(--green)':'var(--orange)'}">${on ? '● Active — reports read from Supabase' : '● Not active — reports still read from the Google Sheet'}</b></div>
    <div class="drow" style="border:none;padding:4px 0;"><span style="font-family:var(--mono);font-size:11px;color:var(--wheat-dim);text-transform:uppercase;">Last Sheet → Supabase sync</span>
      <b style="font-family:var(--mono);font-size:13px;">${rs ? fmtWhen(rs.at) : 'never'}</b></div>
    ${sm ? `<p style="font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin:4px 0 0;">${sm.cnfs} CNFs · ${sm.products} products · ${sm.submissions} submissions · current stock for ${sm.snapshots} CNFs${sm.historyError?` · <span style="color:var(--orange);">history could not be read from the Sheet (${escapeHtml(sm.historyError).slice(0,120)})</span>`:''}</p>` : ''}
    ${stale ? `<p style="font-size:12px;color:var(--orange);margin:8px 0 0;">⚠ A recent save could not reach Supabase, so it may be slightly behind the Sheet. Run the sync above to catch it up.</p>` : ''}
    <p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin:10px 0 0;line-height:1.6;"><b>Best way to keep it filled:</b> in the Google Sheet open <b>⚡ Ganesh Stock IQ ▸ ☁ Sync everything to Supabase now</b>, then <b>⏰ Turn on automatic Supabase sync</b>. The Sheet then feeds Supabase by itself every few minutes, with no browser involved — so no timeouts. A downloaded copy of the Sheet loaded with <b>Import Backup</b> does the same job once, and the button above does it from here. Either way, every new CNF submission is also written to both at the same moment.</p>
  </div>`;
}
function AdminApi(){
  const apiUrl = getApiUrl();
  const isDefault = apiUrl === DEFAULT_API_URL;
  return `
  <div class="panel-card">
    <h4>Backend / API Connection</h4>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:0;line-height:1.6;">
      This app ships with a backend URL <b style="color:var(--wheat-light)">baked in</b> — every device that opens the hosted file (any CNF's phone, any desktop) connects automatically, with zero per-device setup. You only need the fields below if you're pointing at a <i>different</i> backend than the one built in.
    </p>
    ${isDefault ? `<p style="background:var(--green-bg);color:var(--green);font-size:12.5px;padding:8px 10px;border-radius:8px;margin:0 0 12px;">✓ Using the built-in backend URL — this is correct for normal use, nothing to change here.</p>` : ''}
    <div class="formgrid" style="grid-template-columns:1fr;">
      <div class="fg"><label>Backend URL — a Supabase project URL (https://xxxx.supabase.co) or a Google Apps Script web app URL (ends in /exec)</label>
        <input type="text" id="apiUrlInput" placeholder="https://xxxxxxxx.supabase.co" value="${apiUrl}">
      </div>
      <div class="fg" id="apiKeyField" style="${isSupabaseUrl(apiUrl) ? '' : 'display:none;'}"><label>Supabase public key — the "publishable" or "anon" key; it is meant to be public</label>
        <input type="text" id="apiKeyInput" placeholder="sb_publishable_…  or  eyJ…" value="${escapeHtml(getSupabaseKey())}">
      </div>
    </div>
    <div class="small-btn-row">
      <button class="btn btn-primary btn-sm" id="btnSaveApiUrl">Save &amp; Connect</button>
      <button class="btn btn-ghost btn-sm" id="btnTestApiUrl">Test Connection</button>
      ${apiUrl?`<button class="btn btn-ghost btn-sm" id="btnDisconnectApi">Disconnect (use local demo mode)</button>`:''}
    </div>
    <hr class="hr">
    <div class="drow" style="border:none;padding:4px 0;"><span style="font-family:var(--mono);font-size:11px;color:var(--wheat-dim);text-transform:uppercase;">Status</span>
      <b style="font-family:var(--mono);font-size:13px;color:${state.backendConnected?'var(--green)':'var(--orange)'}">${state.backendConnected ? '● Connected' : '● Not connected — running in local demo mode'}</b>
    </div>
    ${state.backendError ? `<div class="drow" style="border:none;padding:4px 0;"><span style="font-family:var(--mono);font-size:11px;color:var(--wheat-dim);text-transform:uppercase;">Last Error</span><b style="color:var(--red);font-size:12px;">${escapeHtml(state.backendError)}</b></div>` : ''}
    <div id="apiTestResult" style="font-family:var(--mono);font-size:12px;color:var(--wheat-dim);margin-top:8px;"></div>
  </div>
  ${isSupabaseUrl(apiUrl) ? '' : ReportingDbCard()}
  <div class="panel-card">
    <h4>Master Data Sync <span style="font-family:var(--mono);font-size:9px;color:var(--wheat-dim);text-transform:none;letter-spacing:0;font-weight:400;">for speed, CNFs/Admin/MIS don't re-pull this on every screen</span></h4>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:0;">CNFs, product list, categories, and self-life settings are cached on each device and treated as static — nobody waits on a network fetch just to see their dashboard. This device refreshes that cache automatically in the background at most once every 6 hours. Force it now if you've just made changes Admin needs everyone to see immediately (e.g. adding a CNF or product).</p>
    <div class="drow" style="border:none;padding:4px 0;"><span style="font-family:var(--mono);font-size:11px;color:var(--wheat-dim);text-transform:uppercase;">Last synced</span><b style="font-family:var(--mono);font-size:13px;">${lsGet('masterSyncedAt') ? new Date(Number(lsGet('masterSyncedAt'))).toLocaleString('en-IN') : 'never'}</b></div>
    <div class="small-btn-row" style="margin-top:8px;">
      <button class="btn btn-dark btn-sm" id="btnForceSync" ${state.backendConnected?'':'disabled title="Connect a backend first"'}>⟳ Sync Now</button>
      <button class="btn btn-ghost btn-sm" id="btnClearCacheAdmin">🗑 Clear Cached Data on This Device</button>
    </div>
    <p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-top:8px;">If a CNF reports a password that "should" work but doesn't, it's almost always this device holding an old cached copy from before a password reset — have them use "Clear cached data & reload" on their own login screen, or clear it here if it's happening on your device.</p>
  </div>
  <div class="panel-card">
    <h4>What "Local Demo Mode" means</h4>
    <p style="color:var(--ink-soft);font-size:13px;line-height:1.7;margin:0;">
      Without a backend connected, all data (CNF submissions, masters, drafts) is saved only in <b style="color:var(--wheat-light)">this browser on this device</b> — nothing syncs between a CNF's phone and your desktop. It's fine for trying the app out, but not for real multi-CNF, multi-device use. Connect the backend above before going live with real CNFs.
    </p>
  </div>`;
}

function AdminCnfs(){
  return `
  <div class="panel-card">
    <h4>CNF Master
      <span class="small-btn-row">
        <button class="btn btn-ghost btn-sm" data-samplecsv="cnf">⬇ Sample CSV</button>
        <button class="btn btn-ghost btn-sm" data-triggerimport="cnf">⬆ Import CSV</button>
        <button class="btn btn-primary btn-sm" data-openadd="cnf">+ Add CNF</button>
      </span>
    </h4>
    <input type="file" id="importCnfFile" accept=".csv,.xlsx,.xls" style="display:none;">
    <div class="tablewrap"><table class="dtable">
      <thead><tr><th>Code</th><th>Name</th><th>User ID</th><th>Location</th><th>Email</th><th>Status</th><th>Last Submission</th><th class="mono">Submit Every (days)</th><th>Compliance</th><th></th></tr></thead>
      <tbody>
        ${state.masters.cnfs.map(c=>{
          const sub = latestSubmissionFor(c.code);
          const cadence = cnfSubmissionStatus(c);
          return `<tr>
            <td class="mono">${c.code}</td><td>${c.name}</td><td class="mono">${c.userId}</td><td>${c.location}</td>
            <td><input type="email" data-emailcnf="${c.code}" value="${c.email||''}" placeholder="cnf@example.com" style="width:150px;background:var(--input-bg);border:1px solid var(--line);color:var(--surface-text);padding:5px 7px;border-radius:6px;font-family:var(--mono);font-size:11px;"></td>
            <td><span class="badge ${c.status==='Active'?'ok':'low'}">${c.status}</span></td>
            <td class="mono">${sub?sub.date:'—'}</td>
            <td class="mono"><input type="number" min="1" data-freqcnf="${c.code}" value="${c.submissionFrequencyDays||7}" style="width:56px;background:var(--input-bg);border:1px solid var(--line);color:var(--surface-text);padding:5px 7px;border-radius:6px;font-family:var(--mono);"></td>
            <td>${cadence.neverSubmitted?`<span class="badge low">Never submitted</span>`:cadence.overdue?`<span class="badge low">${cadence.days}d overdue</span>`:`<span class="badge ok">On time</span>`}</td>
            <td class="small-btn-row">
              <button class="btn btn-ghost btn-sm" data-toggle-cnf="${c.code}">${c.status==='Active'?'Deactivate':'Activate'}</button>
              <button class="btn btn-ghost btn-sm" data-resetpw="cnf:${c.code}">Reset Password</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
    <button class="btn btn-dark btn-sm" style="margin-top:12px;" id="btnSaveCnfFreq">Save Cadence &amp; Emails</button>
    <p style="font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:8px;">Each CNF's required submission cadence, in days (default 7). Email is where overdue reminders and ageing/near-expiry summaries go — see <b>Messages to CNFs → Employee Mapping</b> to also CC a Ganesh employee on those.</p>
  </div>`;
}

function AdminProducts(){
  const uncategorized = state.masters.products.filter(p=>p.category==='OTHERS');
  const likelySwapped = state.masters.products.filter(p=>p.bagToKg && p.pcToKg && p.bagToKg < p.pcToKg);
  const pendingReview = state.masters.products.filter(p=>p.pendingReview);
  const filterOn = state.adminProductFilter==='uncategorized';
  const swapFilterOn = state.adminProductFilter==='swapped';
  const pendingFilterOn = state.adminProductFilter==='pending';
  const visibleProducts = filterOn ? uncategorized : swapFilterOn ? likelySwapped : pendingFilterOn ? pendingReview : state.masters.products;
  const selectedCount = state.selectedProductCodes.length;
  return `
  <div class="panel-card">
    <h4>Product Master
      <span class="small-btn-row">
        <button class="btn btn-ghost btn-sm" data-samplecsv="product">⬇ Sample CSV</button>
        <button class="btn btn-primary btn-sm" id="btnExportFullMaster">⬇ Export Full Product Master</button>
        <button class="btn btn-ghost btn-sm" data-triggerimport="product">⬆ Import CSV (update/add)</button>
        <button class="btn btn-danger btn-sm" id="btnReplaceMaster" style="background:var(--red);color:#fff;border:none;">⚠ Replace Entire Master (from file)</button>
        <button class="btn btn-primary btn-sm" data-openadd="product">+ Add Product</button>
      </span>
    </h4>
    <input type="file" id="importProductFile" accept=".csv,.xlsx,.xls" style="display:none;">
    <input type="file" id="replaceMasterFile" accept=".csv,.xlsx,.xls" style="display:none;">
    <p style="color:var(--ink-soft);font-size:12px;margin:-6px 0 12px;">"Import CSV" only updates the columns your file actually has, leaving everything else untouched — good for small fixes. If a product's data has been wrong for a while from an earlier bad import, <b>Replace Entire Master</b> rebuilds every product fresh from one trusted file instead, so nothing old can quietly survive.</p>
    ${pendingReview.length ? `<div class="cadence-banner overdue" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--amber-bg);">
      <span>🆕 <b>${pendingReview.length} New Product Suggestion${pendingReview.length!==1?'s':''}</b> — CNF${pendingReview.length!==1?'s':''} uploaded SAP stock for material${pendingReview.length!==1?'s':''} not yet in your Product Master. They can only submit in <b>KG</b> until you fill in Category / Self-Life / Ageing / Safety Stock / UOM conversions below.</span>
      <button class="btn btn-dark btn-sm" data-pendingfilter="${pendingFilterOn?'off':'on'}">${pendingFilterOn?'Show All Products':`Review These ${pendingReview.length}`}</button>
    </div>` : ''}
    ${likelySwapped.length ? `<div class="cadence-banner overdue" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
      <span>⚠ <b>${likelySwapped.length} product${likelySwapped.length!==1?'s':''}</b> ha${likelySwapped.length!==1?'ve':'s'} a BAG size smaller than the PC size — almost certainly swapped (a bag should be much bigger than one piece).</span>
      <button class="btn btn-dark btn-sm" data-swapfilter="${swapFilterOn?'off':'on'}">${swapFilterOn?'Show All Products':`Show Only These ${likelySwapped.length}`}</button>
    </div>` : ''}
    ${uncategorized.length ? `<div class="cadence-banner overdue" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
      <span>⚠ <b>${uncategorized.length} product${uncategorized.length!==1?'s':''}</b> landed in "Others" — no real category was matched (usually a SAP-auto-created item whose description didn't resemble anything already in your Product Master). Worth reviewing and assigning a real category.</span>
      <button class="btn btn-dark btn-sm" id="btnToggleUncategorized">${filterOn?'Show All Products':'Show Only Uncategorized'}</button>
    </div>` : ''}
    ${selectedCount ? `<div class="cadence-banner ok" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
      <span><b>${selectedCount} product${selectedCount!==1?'s':''} selected.</b> Assign category:</span>
      <span style="display:flex;gap:8px;align-items:center;">
        <select id="bulkCategorySelect" style="padding:6px 8px;border-radius:6px;border:1px solid var(--line);">
          ${state.masters.categories.map(c=>`<option value="${c}">${c}</option>`).join('')}
        </select>
        <button class="btn btn-dark btn-sm" id="btnApplyBulkCategory">Apply to Selected</button>
        <button class="btn btn-ghost btn-sm" id="btnClearProductSelection">Clear Selection</button>
      </span>
    </div>` : ''}
    <div class="tablewrap"><table class="dtable">
      <thead><tr><th><input type="checkbox" id="chkSelectAllProducts" ${visibleProducts.length && visibleProducts.every(p=>state.selectedProductCodes.includes(p.code))?'checked':''}></th><th>Code</th><th>Name</th><th>Pack Size</th><th>Category</th><th>Default UOM</th><th class="mono">1 BAG = kg</th><th class="mono">1 PC = kg</th><th class="mono">PC per Bag</th><th class="mono">Self-Life Override</th><th class="mono">Ageing Override</th><th class="mono" title="Fallback only — actual reports use each CNF's own Safety Stock column (M) from their upload file whenever one was captured">Safety (kg) — fallback</th><th></th></tr></thead>
      <tbody>
        ${visibleProducts.map(p=> p.pendingReview ? PendingProductRow_(p) : `<tr ${p.category==='OTHERS'?'style="background:var(--amber-bg);"':''}>
          <td><input type="checkbox" class="prod-select" data-prodcode="${p.code}" ${state.selectedProductCodes.includes(p.code)?'checked':''}></td>
          <td class="mono">${p.code}</td><td>${p.name}</td><td class="mono">${p.packSize||'—'}</td><td>${p.category==='OTHERS'?'<span class="badge low">OTHERS — uncategorized</span>':p.category}</td><td class="mono">${p.defaultUOM}</td>
          <td class="mono">${p.bagToKg??'—'}</td><td class="mono">${p.pcToKg??'—'}</td><td class="mono">${pcPerBag(p)??'—'}</td>
          <td class="mono">${p.selfLifeOverride? p.selfLifeOverride+'d' : `<span style="color:var(--ink-soft)">inherits ${state.masters.categorySelfLife[p.category]}d</span>`}</td>
          <td class="mono">${p.ageingDaysOverride? p.ageingDaysOverride+'d remaining' : `<span style="color:var(--ink-soft)">category default</span>`}</td>
          <td class="mono">${p.safetyStockKg}</td>
          <td><span data-removeproduct="${p.code}" title="Remove this product" style="cursor:pointer;color:var(--red);font-weight:700;">✕</span></td>
        </tr>`).join('') || `<tr><td colspan="13" style="text-align:center;padding:20px;">Nothing here 🎉</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}

// One editable row for a pendingReview product inside the same Product Master
// table — Admin fills Category/BAG-kg/PC-kg/Self-Life/Ageing/Safety Stock right
// here and hits "✓ Approve" (data-approveproduct), which clears pendingReview
// and saves. Kept as its own function so the normal read-only row above stays
// simple and unchanged for everything that ISN'T pending.
function PendingProductRow_(p){
  return `<tr data-pendingrow="${p.code}" style="background:var(--amber-bg);">
    <td></td>
    <td class="mono">${p.code}</td>
    <td>${p.name}</td>
    <td class="mono">${p.packSize||'—'}</td>
    <td><select data-pf="category" data-pcode="${p.code}" style="padding:4px 6px;border-radius:6px;border:1px solid var(--line);">
      ${state.masters.categories.map(c=>`<option value="${c}" ${p.category===c?'selected':''}>${c}</option>`).join('')}
    </select></td>
    <td class="mono">KG <span style="color:var(--ink-soft);font-size:10px;">(locked)</span></td>
    <td><input type="number" min="0" step="0.001" data-pf="bagToKg" data-pcode="${p.code}" value="${p.bagToKg??''}" placeholder="e.g. 25" style="width:64px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);"></td>
    <td><input type="number" min="0" step="0.001" data-pf="pcToKg" data-pcode="${p.code}" value="${p.pcToKg??''}" placeholder="e.g. 0.5" style="width:64px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);"></td>
    <td class="mono">${pcPerBag(p)??'—'}</td>
    <td><input type="number" min="0" data-pf="selfLifeOverride" data-pcode="${p.code}" value="${p.selfLifeOverride??''}" placeholder="days" style="width:64px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);"></td>
    <td><input type="number" min="0" data-pf="ageingDaysOverride" data-pcode="${p.code}" value="${p.ageingDaysOverride??''}" placeholder="days" style="width:64px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);"></td>
    <td><input type="number" min="0" data-pf="safetyStockKg" data-pcode="${p.code}" value="${p.safetyStockKg??0}" style="width:64px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);"></td>
    <td class="small-btn-row">
      <button class="btn btn-dark btn-sm" data-approveproduct="${p.code}" title="Save these details and let this product be submitted normally">✓ Approve</button>
      <span data-removeproduct="${p.code}" title="Remove this product" style="cursor:pointer;color:var(--red);font-weight:700;">✕</span>
    </td>
  </tr>`;
}

  return `
  <div class="panel-card">
    <h4>Category-wise Self-Life (days) <button class="btn btn-primary btn-sm" data-openadd="category">+ Add Category</button></h4>

  </div>
  <div class="panel-card">

    <div class="formgrid" style="grid-template-columns:repeat(4,1fr);">
      <div class="fg"><label>Fresh ≥</label><input type="number" id="thFresh" value="${t.fresh}"></div>
