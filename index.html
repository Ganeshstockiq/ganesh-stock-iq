/* ---------------- Bulk Import (CSV) — Product Master & CNF Master ---------------- */
function parseCsv(text){
  const rows = [];
  let i=0, field='', row=[], inQuotes=false;
  const pushField = ()=>{ row.push(field); field=''; };
  const pushRow = ()=>{ pushField(); rows.push(row); row=[]; };
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQuotes=false; i++; continue; }
      field+=c; i++; continue;
    }
    if(c==='"'){ inQuotes=true; i++; continue; }
    if(c===','){ pushField(); i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ pushRow(); i++; continue; }
    field+=c; i++; continue;
  }
  if(field.length || row.length){ pushRow(); }
  return rows.filter(r=>!(r.length===1 && r[0].trim()===''));
}
function csvRowsToObjects(rows){
  if(!rows.length) return [];
  const headers = rows[0].map(h=>String(h).trim().toLowerCase());
  return rows.slice(1).map(r=>{
    const o = {};
    headers.forEach((h,idx)=>{ o[h] = String(r[idx]!==undefined && r[idx]!==null ? r[idx] : '').trim(); });
    return o;
  });
}

function downloadCsvFile(filename, text){
  const blob = new Blob([text], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------------- Styled Excel exports (CNF/MIS/Admin reports) ----------------
   Plain CSV can't carry colour, so a genuinely "someone built this in Excel"
   look needs actual Excel formatting — done here via an HTML table saved
   with an .xls extension, which Excel/Sheets/LibreOffice all open natively
   and render with full colour/borders/bold, without needing any paid
   library. The DATA is built exactly the same way it always was (same
   values, same order) — only the presentation layer changes, so nothing
   about correctness is at risk; styling is applied on top of values
   already computed elsewhere, never recalculated here.
   Every export gets its own title, generated-by, and exact
   date+timestamp — because a report is only trustworthy if you can tell
   at a glance exactly when it was pulled, and by whom. */
const AGEING_STATUS_COLORS = {
  'Expired':      {bg:'#7b241c', fg:'#ffffff'},
  'Near Expiry':  {bg:'#c0392b', fg:'#ffffff'},
  'Critical':     {bg:'#e67e22', fg:'#2b1400'},
  'Ageing':       {bg:'#f0c419', fg:'#3a2c00'},
  'Normal':       {bg:'#2874a6', fg:'#ffffff'},
  'Fresh':        {bg:'#1e8449', fg:'#ffffff'},
  'No MFD':       {bg:'#bdc3c7', fg:'#2c2c2c'},
};
function excelEsc_(v){
  return String(v===null||v===undefined?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function generatedByLabel(){
  if(state.cnfUser) return `CNF ${state.cnfUser.code} · ${state.cnfUser.name}`;
  if(state.adminUser) return `Admin · ${state.adminUser.name}`;
  if(state.misUser) return `MIS/Back Office · ${state.misUser.name}`;
  return 'CFA Stock Audit';
}
// headers: string[]; rows: array of arrays (cell values, in header order);
// summaryRows: optional array of [label, value] pairs — becomes its own
// "Summary" sheet ahead of the data, instead of squeezed into spacer rows
// above a single sheet (which the old HTML-table version needed; a real
// workbook can just have two sheets). A genuine XLSX file — proper column
// types (numbers stay numbers, sortable/filterable in Excel), no colour
// coding (the free build of the library this app already uses can't
// reliably write cell fill colours), but that trade is worth it: this
// never triggers Excel's "file format and extension don't match" warning,
// which the earlier HTML-labelled-as-.xls approach did on every open.
// headers: string[]; rows: array of arrays (cell values, in header order);
// statusColIndex: which column (if any) holds an Ageing-style label to
// colour-code; summaryRows: optional array of [label, value] pairs —
// becomes its own "Summary" sheet ahead of the data.
//
// Built with ExcelJS rather than the SheetJS instance loaded elsewhere in
// this app (which only reads uploaded files) — ExcelJS's free build can
// actually WRITE cell fill colours and bold headers, producing the same
// professional look these reports had before, while still being a
// genuinely valid .xlsx file that never triggers Excel's "format and
// extension don't match, could be corrupted" warning the way an HTML file
// wearing an .xls extension used to.
async function buildXlsxWorkbook({title, subtitle, headers, rows, summaryRows, summaryTable, statusColIndex, statusColors, cellStyleFn, wrapCols, extraSheets, dataSheetName, colWidths}){
  const wb = new ExcelJS.Workbook();
  wb.creator = 'CFA Stock Audit';
  const genStamp = fmtDT(new Date());
  const BRAND = 'FF5A3D1A', HEADBG = 'FFCC8F3F', HEADFG = 'FFFFFFFF', METAFG = 'FF666666';

  function writeMeta(ws, colCount, tOv, stOv){
    const T = tOv!==undefined ? tOv : title, ST = stOv!==undefined ? stOv : subtitle;
    ws.mergeCells(1,1,1,colCount);
    ws.getCell(1,1).value = 'CFA Stock Audit';
    ws.getCell(1,1).font = {bold:true, size:16, color:{argb:BRAND}};
    ws.mergeCells(2,1,2,colCount);
    ws.getCell(2,1).value = T||'';
    ws.getCell(2,1).font = {bold:true, size:12.5};
    let row = 3;
    if(ST){
      ws.mergeCells(row,1,row,colCount);
      ws.getCell(row,1).value = ST;
      ws.getCell(row,1).font = {size:10, color:{argb:METAFG}};
      row++;
    }
    ws.mergeCells(row,1,row,colCount);
    ws.getCell(row,1).value = `Generated: ${genStamp}  ·  By: ${generatedByLabel()}`;
    ws.getCell(row,1).font = {size:9.5, color:{argb:METAFG}};
    row++;
    return row+1; // blank spacer row, next real content starts after
  }

  if(summaryRows && summaryRows.length){
    const wsSummary = wb.addWorksheet('Summary');
    wsSummary.columns = [{width:34},{width:34}];
    let r = writeMeta(wsSummary, 2);
    summaryRows.forEach(([label,value])=>{
      const isHeading = value==='' && label!=='' && label===label.toUpperCase();
      const row = wsSummary.getRow(r);
      row.getCell(1).value = label; row.getCell(2).value = value;
      if(isHeading){
        row.getCell(1).font = {bold:true, color:{argb:HEADFG}};
        row.getCell(1).fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF1C1712'}};
        wsSummary.mergeCells(r,1,r,2);
      } else if(label!==''){
        row.getCell(1).font = {bold:true};
        row.getCell(1).fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFF6EED4'}};
      }
      r++;
    });
    if(summaryTable && summaryTable.rows && summaryTable.rows.length){
      const nc = summaryTable.headers.length;
      wsSummary.columns = [{width:34},{width:34},{width:18},{width:16},{width:14},{width:14},{width:24}].slice(0,Math.max(nc,2));
      r++;
      wsSummary.mergeCells(r,1,r,nc);
      const th = wsSummary.getRow(r).getCell(1);
      th.value = summaryTable.title; th.font = {bold:true, color:{argb:HEADFG}};
      th.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF1C1712'}};
      r++;
      summaryTable.headers.forEach((h,i)=>{
        const c = wsSummary.getRow(r).getCell(i+1);
        c.value = h; c.font = {bold:true, color:{argb:HEADFG}, size:10.5};
        c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:HEADBG}};
      });
      r++;
      summaryTable.rows.forEach(rv=>{
        const row = wsSummary.getRow(r);
        rv.forEach((val,i)=>{
          const c = row.getCell(i+1); c.value = val; c.font = {size:10};
          if(i===summaryTable.statusColIndex){
            const k = Object.keys(AGEING_STATUS_COLORS).find(k=>String(val).startsWith(k));
            if(k){ const cc = AGEING_STATUS_COLORS[k]; c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF'+cc.bg.replace('#','')}}; c.font = {bold:true, size:10, color:{argb:'FF'+cc.fg.replace('#','')}}; }
          }
        });
        r++;
      });
    }
  }

  const wsData = wb.addWorksheet(dataSheetName || (summaryRows&&summaryRows.length ? 'Data' : 'Report'));
  wsData.columns = headers.map((h,i)=>({width: (colWidths && colWidths[i]) ? colWidths[i] : (wrapCols&&wrapCols.includes(i)) ? 60 : Math.max(12, String(h).length+2)}));
  let r = writeMeta(wsData, headers.length);
  const headerRow = wsData.getRow(r);
  headers.forEach((h,i)=>{
    const cell = headerRow.getCell(i+1);
    cell.value = h;
    cell.font = {bold:true, color:{argb:HEADFG}, size:10.5};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:HEADBG}};
    cell.border = {top:{style:'thin',color:{argb:'FFA97A30'}}, bottom:{style:'thin',color:{argb:'FFA97A30'}}, left:{style:'thin',color:{argb:'FFA97A30'}}, right:{style:'thin',color:{argb:'FFA97A30'}}};
  });
  r++;
  const firstDataRow = r;
  rows.forEach(rowVals=>{
    const row = wsData.getRow(r);
    rowVals.forEach((val,i)=>{
      const cell = row.getCell(i+1);
      cell.value = val;
      cell.font = {size:10};
      // Status now reads "Ageing — 31d old, past 30d threshold" rather
      // than a bare label, so an exact-match lookup would miss every row —
      // matching on which known label the cell STARTS WITH keeps the
      // colour-coding working against the combined text.
      if(wrapCols && wrapCols.includes(i)) cell.alignment = {wrapText:true, vertical:'top'};
      const isStatus = statusColIndex!=null && i===statusColIndex;
      const COLS = statusColors || AGEING_STATUS_COLORS;
      const c = isStatus ? Object.keys(COLS).map(k=>COLS[String(val).startsWith(k)?k:null]).find(Boolean) : null;
      const cs = cellStyleFn ? cellStyleFn(r - firstDataRow, i, val) : null;
      if(cs){ cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF'+cs.bg.replace('#','')}}; cell.font = {bold:!!cs.bold, size:10, color:{argb:'FF'+cs.fg.replace('#','')}}; }
      if(c){ cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF'+c.bg.replace('#','')}}; cell.font = {bold:true, size:10, color:{argb:'FF'+c.fg.replace('#','')}}; }
    });
    r++;
  });
  (extraSheets||[]).forEach(sh=>{
    const ws = wb.addWorksheet(sh.name);
    ws.columns = sh.widths.map(w=>({width:w}));
    let rr = writeMeta(ws, sh.headers.length, sh.title, sh.subtitle);
    const hr = ws.getRow(rr);
    sh.headers.forEach((h,i)=>{
      const c = hr.getCell(i+1);
      c.value = h; c.font = {bold:true, color:{argb:HEADFG}, size:10.5};
      c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:HEADBG}};
      c.border = {top:{style:'thin',color:{argb:'FFA97A30'}}, bottom:{style:'thin',color:{argb:'FFA97A30'}}, left:{style:'thin',color:{argb:'FFA97A30'}}, right:{style:'thin',color:{argb:'FFA97A30'}}};
    });
    rr++;
    sh.rows.forEach((rv,ri)=>{
      if(!rv){ rr++; return; } // null = blank spacer row
      const row = ws.getRow(rr);
      rv.forEach((val,i)=>{
        const c = row.getCell(i+1);
        c.value = val; c.font = {size:10};
        c.border = {bottom:{style:'hair',color:{argb:'FFCCCCCC'}}};
        if(sh.wrapCols && sh.wrapCols.includes(i)) c.alignment = {wrapText:true, vertical:'top'};
        const st = sh.styles && sh.styles[ri] && sh.styles[ri][i];
        if(st){ c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF'+st.bg.replace('#','')}}; c.font = {bold:!!st.bold, size:10, color:{argb:'FF'+st.fg.replace('#','')}}; }
      });
      rr++;
    });
  });
  return wb;
}
async function downloadRealXlsx(filenameBase, wb){
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filenameBase.replace(/\.(csv|xlsx?)$/i,'') + '.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// Import behaves as an UPSERT: a code that already exists (e.g. auto-created
// by a SAP Current Stock upload with no UOM conversion yet) gets its provided
// fields UPDATED in place — this is how a "UOM Converter" file (code + bagToKg
// + pcToKg, everything else left blank) is meant to be uploaded. A code that
// doesn't exist yet needs name + category and gets CREATED.

// Guards against a real bug: an import/header row leaking in as if it were
// actual data (e.g. the literal word "Category" ending up as a category
// name with whatever number happened to be in the next column as its
// self-life). Any of these values are refused as a category name anywhere
// categories get created — import, Push from Sheet, or the Add Category
// form.
const BOGUS_CATEGORY_NAMES = new Set(['CATEGORY','CATEGORIES','CAT','NAME','PRODUCT','PRODUCTS','SELFLIFEDAYS','SELF-LIFE','SELF LIFE','N/A','NA','']);
function isBogusCategoryName(name){
  return BOGUS_CATEGORY_NAMES.has(String(name||'').trim().toUpperCase());
}

// Same guard, for products: a header row leaking in as literal data (code
// "code", name "name") — this is exactly the bug seen in the field, likely
// from a header row surviving a copy/paste into row 2 of Product_Master.
const BOGUS_PRODUCT_FIELD_VALUES = new Set(['CODE','PRODUCT CODE','PRODUCTCODE','NAME','PRODUCT NAME','PRODUCTNAME','MATERIAL','MATERIAL CODE','MATERIALCODE']);
function isBogusProductRow(code, name){
  return BOGUS_PRODUCT_FIELD_VALUES.has(String(code||'').trim().toUpperCase()) || BOGUS_PRODUCT_FIELD_VALUES.has(String(name||'').trim().toUpperCase());
}

// Supports two CSV header styles for Product Master imports: the original
// machine-style headers (code,name,category,defaultuom,bagtokg,pctokg,
// Supports multiple CSV header styles for Product Master imports — the
// original machine-style headers (code,name,category,defaultuom,bagtokg,
// pctokg,...), and two human-readable styles: the current, unambiguous
// "1 PC KG" / "1 Bag KG" (exactly the two numbers a GCPL shelf-life sheet
// actually has — kg weight of one piece, kg weight of one bag), and the
// earlier three-column "Kg / Pc / Bag" attempt this replaced, which caused
// real confusion (a "Kg" column that was sometimes a UOM-default flag and
// sometimes empty looked like missing data even when the actual PC
// conversion was correctly present elsewhere).
function normalizeProductImportRow_(o){
  const code = o.code || o['product code'] || '';
  const name = o.name || o['product name'] || '';
  const category = o.category || '';
  const packsize = o['pack size'] || o.packsize || '';
  let defaultuom = o.defaultuom || '';
  let bagtokg = o.bagtokg, pctokg = o.pctokg;
  if(bagtokg===undefined && pctokg===undefined){
    if('1 pc kg' in o || '1 bag kg' in o){
      // Current format: two unambiguous values, always independent of
      // each other — a piece's kg weight is a fact about the product
      // regardless of which unit a CNF happens to enter it in.
      pctokg = o['1 pc kg']!==undefined ? o['1 pc kg'] : '';
      bagtokg = o['1 bag kg']!==undefined ? o['1 bag kg'] : '';
    } else if('kg' in o || 'pc' in o || 'bag' in o){
      // Earlier three-column format, kept for backward compatibility with
      // any file already built against it.
      if(o.kg){ defaultuom = 'KG'; }
      else if(o.pc){ defaultuom = 'PC'; }
      else if(o.bag){ defaultuom = 'BAG'; }
      pctokg = o.pc!==undefined ? o.pc : (o.kg!==undefined ? o.kg : '');
      bagtokg = o.bag!==undefined ? o.bag : '';
    }
  }
  // Which unit a CNF starts on when entering this product — purely a
  // starting point (they can still switch KG/PC/BAG per batch). Always KG
  // unless a file explicitly says otherwise: the SAP Current Stock export
  // every CNF uploads is always denominated in KG, so starting there
  // matches what they're actually reading off that file, for every
  // product, not just the bulk/loose ones.
  if(!defaultuom){
    defaultuom = 'KG';
  }
  const safetystockkg = o.safetystockkg!==undefined ? o.safetystockkg : (o['safety stock']!==undefined ? o['safety stock'] : '');
  const selflifeoverride = o.selflifeoverride!==undefined ? o.selflifeoverride : (o.selflife!==undefined ? o.selflife : '');
  const ageing = o.ageing!==undefined ? o.ageing : (o.ageingdaysoverride!==undefined ? o.ageingdaysoverride : '');
  return {code, name, category, packsize, defaultuom, bagtokg: bagtokg||'', pctokg: pctokg||'', safetystockkg, selflifeoverride, ageing};
}

// Builds a product record FRESH from one file row, ignoring whatever
// might already exist for that code — used by "Replace Entire Product
// Master" (a full rebuild) as well as the "create new" branch of the
// normal merge-import above. Kept as one function so both paths can never
// silently diverge on how a category gets inferred or a UOM gets derived.
function buildFreshProductFromRow_(o, wordMap, newCategories, warnings, rowNum){
  const code = o.code, name = o.name;
  let category = (o.category||'').toUpperCase();
  if(!category){
    const inferred = inferCategoryFromName(name, wordMap);
    if(inferred){ category = inferred; warnings.push(`Row ${rowNum} (${code}): no category given — inferred "${inferred}" from the product name.`); }
    else { category = 'OTHERS'; }
  }
  else if(isBogusCategoryName(category)){ warnings.push(`Row ${rowNum} (${code}): category "${o.category}" looks like a stray header value, not a real category — set to OTHERS.`); category = 'OTHERS'; }
  else if(!state.masters.categories.includes(category) && !newCategories[category]){
    newCategories[category] = 180;
  }
  let uom = (o.defaultuom||'KG').toUpperCase();
  if(!['KG','PC','BAG'].includes(uom)){ warnings.push(`Row ${rowNum} (${code}): unknown UOM "${o.defaultuom}" — set to KG.`); uom = 'KG'; }
  return {
    code, name, category, packSize: o.packsize||null, defaultUOM: uom,
    bagToKg: o.bagtokg ? Number(o.bagtokg) : null,
    pcToKg: o.pctokg ? Number(o.pctokg) : null,
    safetyStockKg: o.safetystockkg ? Number(o.safetystockkg)||0 : 0,
    selfLifeOverride: o.selflifeoverride ? Number(o.selflifeoverride)||null : null,
    ageingDaysOverride: o.ageing ? Number(o.ageing)||null : null,
    pendingReview: false, // a file Admin trusted enough to build the whole master from is never "pending"
  };
}
// A full rebuild, not a merge: every code in the file becomes a fresh
// product record, and any product code NOT in the file is dropped. This
// is the deliberate, stronger fix for a real problem — patch-style
// imports only touch the columns present in a given file, so any field
// corrupted by an earlier bad import (a defaultUOM that ended up holding
// a raw number instead of "KG"/"PC"/"BAG", for instance) can survive
// indefinitely if no later file happens to re-specify that exact field.
// Treating one trusted, complete file as the master eliminates that
// entire class of lingering corruption in one pass.
function buildFullProductMasterReplacement(rawObjs){
  const objs = rawObjs.map(normalizeProductImportRow_);
  const valid = [], errors = [], warnings = [];
  const seenCodes = new Set();
  const newCategories = {};
  const wordMap = buildCategoryWordMap();
  function learnCategoryWords(name, category){
    if(!name || !category || category==='OTHERS') return;
    tokenizeProductName(name).forEach(w=>{ wordMap[w] = wordMap[w]||{}; wordMap[w][category] = (wordMap[w][category]||0)+1; });
  }
  objs.forEach((o,idx)=>{
    const rowNum = idx+2;
    const code = o.code;
    if(!code){ errors.push(`Row ${rowNum}: missing product code — skipped.`); return; }
    if(isBogusProductRow(code, o.name)){ errors.push(`Row ${rowNum}: "${code}" / "${o.name}" looks like a stray header row, not a real product — skipped.`); return; }
    if(seenCodes.has(code)){ errors.push(`Row ${rowNum}: code "${code}" appears twice in this file — first occurrence used.`); return; }
    seenCodes.add(code);
    if(!o.name){ errors.push(`Row ${rowNum} (${code}): missing product name — skipped.`); return; }
    const product = buildFreshProductFromRow_(o, wordMap, newCategories, warnings, rowNum);
    learnCategoryWords(product.name, product.category);
    valid.push(product);
  });
  if(Object.keys(newCategories).length){
    warnings.unshift(`${Object.keys(newCategories).length} new categor${Object.keys(newCategories).length===1?'y':'ies'} will be added: ${Object.keys(newCategories).join(', ')} (180-day default self-life — adjust anytime in Self-Life & Thresholds).`);
  }
  return {valid, errors, warnings, newCategories};
}

function validateProductRows(rawObjs){
  const objs = rawObjs.map(normalizeProductImportRow_);
  const valid = [], errors = [], warnings = [];
  const seenCodes = new Set();
  const newCategories = {}; // name -> default self-life, auto-created by this import
  // Builds fresh once per import, then grows as rows in THIS SAME file get
  // categorized (inferred or explicit) — so later rows in a big batch can
  // benefit from earlier ones too, not just whatever was already in the
  // Product Master before the import started.
  const wordMap = buildCategoryWordMap();
  function learnCategoryWords(name, category){
    if(!name || !category || category==='OTHERS') return;
    tokenizeProductName(name).forEach(w=>{ wordMap[w] = wordMap[w]||{}; wordMap[w][category] = (wordMap[w][category]||0)+1; });
  }
  objs.forEach((o,idx)=>{
    const rowNum = idx+2; // header is row 1
    const code = o.code;
    if(!code){ errors.push(`Row ${rowNum}: missing product code — skipped.`); return; }
    if(isBogusProductRow(code, o.name)){ errors.push(`Row ${rowNum}: "${code}" / "${o.name}" looks like a stray header row, not a real product — skipped.`); return; }
    if(seenCodes.has(code)){ errors.push(`Row ${rowNum}: code "${code}" appears twice in this file — first occurrence used.`); return; }
    seenCodes.add(code);

    const existing = state.masters.products.find(p=>p.code===code);

    if(!existing){
      const name = o.name;
      if(!name){ errors.push(`Row ${rowNum} (${code}): new code with no name — need a name to create a product. Skipped.`); return; }
      let category = (o.category||'').toUpperCase();
      if(!category){
        // Blank category — try to infer it from the product name against
        // everything else already categorized, the same word-matching this
        // app already uses for SAP-upload auto-created products. Checked
        // BEFORE the bogus-value check below: an empty string is itself in
        // that bogus-value list (guarding against a stray blank header
        // cell), so checking bogus-ness first would always short-circuit
        // straight to OTHERS and this inference would never run.
        const inferred = inferCategoryFromName(name, wordMap);
        if(inferred){ category = inferred; warnings.push(`Row ${rowNum} (${code}): no category given — inferred "${inferred}" from the product name.`); }
        else { category = 'OTHERS'; }
      }
      else if(isBogusCategoryName(category)){ warnings.push(`Row ${rowNum} (${code}): category "${o.category}" looks like a stray header value, not a real category — set to OTHERS.`); category = 'OTHERS'; }
      else if(!state.masters.categories.includes(category) && !newCategories[category]){
        newCategories[category] = 180; // new category from the file — auto-created with a default self-life, editable after
      }
      learnCategoryWords(name, category);
      let uom = (o.defaultuom||'KG').toUpperCase();
      if(!['KG','PC','BAG'].includes(uom)){ warnings.push(`Row ${rowNum} (${code}): unknown UOM "${o.defaultuom}" — set to KG.`); uom = 'KG'; }
      const bagToKg = o.bagtokg ? Number(o.bagtokg) : null;
      const pcToKg = o.pctokg ? Number(o.pctokg) : null;
      const packSize = o.packsize || null;
      const safetyStockKg = o.safetystockkg ? Number(o.safetystockkg)||0 : 0;
      const selfLifeOverride = o.selflifeoverride ? Number(o.selflifeoverride)||null : null;
      const ageingDaysOverride = o.ageing ? Number(o.ageing)||null : null;
      valid.push({action:'create', code, name, category, packSize, defaultUOM:uom, bagToKg, pcToKg, safetyStockKg, selfLifeOverride, ageingDaysOverride, pendingReview:false});
      return;
    }

    // Existing product — only update fields actually present in this row,
    // so a UOM-converter-only file (blank name/category/etc) never wipes
    // out data that's already correct.
    const patch = {};
    const changed = [];
    // If this code was sitting in "New Product Suggestions" (auto-created from
    // an unmapped SAP material), an Admin explicitly importing data for it is
    // exactly the review it was waiting on — clear the flag so it stops being
    // KG-locked for the CNF, same as clicking "Approve" would.
    if(existing.pendingReview){ patch.pendingReview = false; changed.push('pendingReview'); }
    if(o.name){ patch.name = o.name; changed.push('name'); }
    if(o.packsize){ patch.packSize = o.packsize; changed.push('packSize'); }
    if(o.category){
      const cat = o.category.toUpperCase();
      if(isBogusCategoryName(cat)){
        warnings.push(`Row ${rowNum} (${code}): category "${o.category}" looks like a stray header value, not a real category — left unchanged.`);
      } else {
        if(!state.masters.categories.includes(cat) && !newCategories[cat]) newCategories[cat] = 180;
        patch.category = cat; changed.push('category');
      }
    }
    if(o.defaultuom){
      const u = o.defaultuom.toUpperCase();
      if(['KG','PC','BAG'].includes(u)){ patch.defaultUOM = u; changed.push('defaultUOM'); }
      else warnings.push(`Row ${rowNum} (${code}): unknown UOM "${o.defaultuom}" — left unchanged.`);
    }
    if(o.bagtokg!==''){ patch.bagToKg = Number(o.bagtokg)||null; changed.push('bagToKg'); }
    if(o.pctokg!==''){ patch.pcToKg = Number(o.pctokg)||null; changed.push('pcToKg'); }
    if(o.safetystockkg!==''){ patch.safetyStockKg = Number(o.safetystockkg)||0; changed.push('safetyStockKg'); }
    if(o.selflifeoverride!==''){ patch.selfLifeOverride = Number(o.selflifeoverride)||null; changed.push('selfLifeOverride'); }
    if(o.ageing!==''){ patch.ageingDaysOverride = Number(o.ageing)||null; changed.push('ageingDaysOverride'); }
    if(!changed.length){ warnings.push(`Row ${rowNum} (${code}): matches an existing product but no fields to update — skipped.`); return; }
    valid.push({action:'update', code, name: existing.name, category: existing.category, packSize: patch.packSize!==undefined?patch.packSize:existing.packSize, defaultUOM: patch.defaultUOM||existing.defaultUOM, bagToKg: patch.bagToKg!==undefined?patch.bagToKg:existing.bagToKg, pcToKg: patch.pcToKg!==undefined?patch.pcToKg:existing.pcToKg, safetyStockKg: patch.safetyStockKg!==undefined?patch.safetyStockKg:existing.safetyStockKg, selfLifeOverride: patch.selfLifeOverride!==undefined?patch.selfLifeOverride:existing.selfLifeOverride, ageingDaysOverride: patch.ageingDaysOverride!==undefined?patch.ageingDaysOverride:existing.ageingDaysOverride, pendingReview: patch.pendingReview!==undefined?patch.pendingReview:existing.pendingReview, patch, changed});
  });
  if(Object.keys(newCategories).length){
    warnings.unshift(`${Object.keys(newCategories).length} new categor${Object.keys(newCategories).length===1?'y':'ies'} will be added: ${Object.keys(newCategories).join(', ')} (180-day default self-life — adjust anytime in Self-Life & Thresholds).`);
  }
  return {valid, errors, warnings, newCategories};
}
function validateCnfRows(objs){
  const valid = [], errors = [], warnings = [];
  const seenCodes = new Set();
  objs.forEach((o,idx)=>{
    const rowNum = idx+2;
    const code = o.code, name = o.name;
    if(!code){ errors.push(`Row ${rowNum}: missing CNF code — skipped.`); return; }
    if(!name){ errors.push(`Row ${rowNum} (${code}): missing CNF name — skipped.`); return; }
    if(state.masters.cnfs.some(c=>c.code===code) || seenCodes.has(code)){ errors.push(`Row ${rowNum}: code "${code}" already exists — skipped.`); return; }
    const userId = o.userid || code;
    const password = o.password || '';   // blank = the server sets an unguessable one; Admin then uses Reset Password
    let status = o.status && ['Active','Inactive'].includes(o.status) ? o.status : 'Active';
    if(o.status && !['Active','Inactive'].includes(o.status)) warnings.push(`Row ${rowNum} (${code}): unknown status "${o.status}" — set to Active.`);
    const location = o.location || '';
    const email = o.email || '';
    seenCodes.add(code);
    valid.push({code, name, userId, password, status, location, email});
  });
  return {valid, errors, warnings};
}

function ActiveFilterBanner(){

// A real SVG donut chart — not a decorative image, built directly from the
// same status counts the app already computes everywhere else. Final
// values are correct from the first paint (no risk of an animation glitch
// showing a wrong number mid-transition); a CSS keyframe on the whole SVG
// gives the "just arrived" feel instead of animating individual arcs,
// which is the part that's genuinely easy to get subtly wrong for a
// multi-segment chart.
function buildAgeingDonutSvg(statusCounts, colors, size){
  size = size || 148;
  const total = Object.values(statusCounts).reduce((a,b)=>a+b,0);
  const radius = size/2 - 15;
  const circumference = 2 * Math.PI * radius;
  const cx = size/2, cy = size/2;
  if(!total){
    return `<svg class="donut-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--panel-2)" stroke-width="16"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" class="donut-center-label" font-size="12" fill="var(--ink-soft)">No data</text>
    </svg>`;
  }
  let offset = 0;
  const order = ['expired','expiring','critical','ageing','normal','fresh'];
  const segments = order.filter(k=>statusCounts[k]>0).map(k=>{
    const frac = statusCounts[k]/total;
    const dash = frac * circumference;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${colors[k]}" stroke-width="16" stroke-dasharray="${dash.toFixed(2)} ${(circumference-dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
    return seg;
  }).join('');
  return `<svg class="donut-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--panel-2)" stroke-width="16"/>
    ${segments}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" class="donut-center-label" font-size="24" font-weight="800" fill="var(--surface-text)">${total}</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" class="donut-center-label" font-size="9" letter-spacing="1" fill="var(--ink-soft)">LINES</text>
  </svg>`;
}

// KPI numbers that visibly count up into place, and bars that grow in
// rather than just appearing — the actual "feels alive" difference between
// a spreadsheet-in-a-browser and a dashboard. Purely cosmetic: the final
// values rendered are always the exact numbers already computed elsewhere;
// this only controls how they arrive on screen.
function animateDashboardIn(){
  document.querySelectorAll('[data-countup]').forEach(el=>{
    const target = Number(el.dataset.countup)||0;
    const isDecimal = el.dataset.countupDecimals === '1';
    const duration = 900;
    const start = performance.now();
    function tick(now){
      const t = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-t, 3);
      const val = target * eased;
      el.textContent = isDecimal ? val.toLocaleString('en-IN',{maximumFractionDigits:1}) : Math.round(val).toLocaleString('en-IN');
      if(t<1) requestAnimationFrame(tick); else el.textContent = target.toLocaleString('en-IN',{maximumFractionDigits:isDecimal?1:0});
    }
    requestAnimationFrame(tick);
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.barrow .fill[data-fillwidth]').forEach(el=>{
      el.style.width = el.dataset.fillwidth;
    });
  }));
}

// Shared export helper — every report screen with a table gets its own
// quick "⬇ Export" that respects whatever filters are currently applied,
// instead of forcing a trip to the central Export Centre for a one-off.
function exportGenericCsv(filename, headers, dataRows){
  const esc = v => { const s = (v===null||v===undefined) ? '' : String(v); return s.includes(',') ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = [headers.map(esc).join(',')];
  dataRows.forEach(r=> lines.push(r.map(esc).join(',')));
  downloadCsvFile(filename, lines.join('\n'));
}

// Full submission-level history across all CNFs — a date range, per-CNF
// filter, and month-over-month movement comparison. Uses ensureAllHistory()
// on demand rather than always (bootstrap only carries each CNF's latest
// submission, to keep the main dashboards fast) — click "Load Full History"
// once to pull everything, then filter freely without re-fetching.
function MisMovement(){
  if(!state.movementFilters){
    const today = new Date();
    const twoMonthsAgo = new Date(today.getFullYear(), today.getMonth()-2, 1);
    state.movementFilters = { cnf:'ALL', fromDate: localDateISO(twoMonthsAgo), toDate: todayISO() };
  }
  const f = state.movementFilters;
  const filtered = state.submissions
    .filter(s=>s.date>=f.fromDate && s.date<=f.toDate && (f.cnf==='ALL' || s.cnfCode===f.cnf))
    .sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp));

  const toD = new Date(f.toDate);
  const thisMonthStart = localDateISO(new Date(toD.getFullYear(), toD.getMonth(), 1));
  const thisMonthEnd = f.toDate;
  const lastMonthStart = localDateISO(new Date(toD.getFullYear(), toD.getMonth()-1, 1));
  const lastMonthEnd = localDateISO(new Date(toD.getFullYear(), toD.getMonth(), 0));

  const cnfsToShow = f.cnf==='ALL' ? state.masters.cnfs.filter(c=>c.status==='Active') : state.masters.cnfs.filter(c=>c.code===f.cnf);
  const monthlyStats = cnfsToShow.map(c=>{
    const thisSubs = state.submissions.filter(s=>s.cnfCode===c.code && s.date>=thisMonthStart && s.date<=thisMonthEnd);
    const lastSubs = state.submissions.filter(s=>s.cnfCode===c.code && s.date>=lastMonthStart && s.date<=lastMonthEnd);
    const thisKg = thisSubs.reduce((sum,s)=>sum+s.items.reduce((a,i)=>a+i.kgQty,0),0);
    const lastKg = lastSubs.reduce((sum,s)=>sum+s.items.reduce((a,i)=>a+i.kgQty,0),0);
    const pctChange = lastKg>0 ? Math.round(((thisKg-lastKg)/lastKg)*1000)/10 : (thisKg>0?100:0);
    return {cnf:c, thisCount:thisSubs.length, lastCount:lastSubs.length, thisKg, lastKg, pctChange};
  });

  return `
  <div class="panel-card">
    <h4>Filters</h4>
    <div class="formgrid" style="grid-template-columns:repeat(3,1fr);">
      <div class="fg"><label>CNF</label><select id="movCnfSel"><option value="ALL" ${f.cnf==='ALL'?'selected':''}>All CNFs</option>${state.masters.cnfs.map(c=>`<option value="${c.code}" ${f.cnf===c.code?'selected':''}>${c.name} · ${c.code}</option>`).join('')}</select></div>
      <div class="fg"><label>From</label><input type="date" id="movFromDate" value="${f.fromDate}" max="${todayISO()}"></div>
      <div class="fg"><label>To</label><input type="date" id="movToDate" value="${f.toDate}" max="${todayISO()}"></div>
    </div>
    <div class="small-btn-row" style="margin-top:8px;">
      <button class="btn btn-dark btn-sm" id="btnLoadFullHistory">${state.allHistoryLoaded?'⟳ Refresh Full History':'Load Full History'}</button>
      <button class="btn btn-ghost btn-sm" id="btnExportMovement">⬇ Export</button>
    </div>
    ${!state.allHistoryLoaded ? `<p style="font-family:var(--mono);font-size:11px;color:var(--orange);margin-top:8px;">⚠ Only showing what's already cached (usually just each CNF's latest submission) — click "Load Full History" to pull every submission in this range from the server.</p>` : ''}
  </div>

  <div class="panel-card">
    <h4>Month-over-Month <span style="font-family:var(--mono);font-size:9px;color:var(--wheat-dim);text-transform:none;letter-spacing:0;font-weight:400;">${new Date(thisMonthStart+'T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})} vs ${new Date(lastMonthStart+'T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</span></h4>
    <div class="tablewrap"><table class="dtable">
      <thead><tr><th>CNF</th><th class="mono">Code</th><th class="mono">This Month Submits</th><th class="mono">This Month kg</th><th class="mono">Last Month Submits</th><th class="mono">Last Month kg</th><th class="mono">Change</th><th>Trend</th></tr></thead>
      <tbody>
      ${monthlyStats.map(m=>`<tr>
        <td>${m.cnf.name}</td><td class="mono">${m.cnf.code}</td>
        <td class="mono">${m.thisCount}</td><td class="mono">${m.thisKg.toFixed(0)}</td>
        <td class="mono">${m.lastCount}</td><td class="mono">${m.lastKg.toFixed(0)}</td>
        <td class="mono" style="color:${m.pctChange>0?'var(--green)':m.pctChange<0?'var(--red)':'inherit'}">${m.pctChange>0?'+':''}${m.pctChange}%</td>
        <td>${m.pctChange>5?'📈 Up':m.pctChange<-5?'📉 Down':'➡ Flat'}</td>
      </tr>`).join('') || `<tr><td colspan="8" style="text-align:center;padding:20px;">No active CNFs to compare.</td></tr>`}
      </tbody>
    </table></div>
    <p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-top:8px;">"kg" is the total physical stock across all products in that CNF's submissions that month — a rough movement/volume signal, not a sales figure (this app tracks stock levels, not dispatches).</p>
  </div>

  <div class="panel-card">
    <h4>Submission History <span style="font-family:var(--mono);font-size:11px;color:var(--wheat-dim);">${filtered.length} submissions in range · click a row for that day's full stock</span></h4>
    <div class="tablewrap"><table class="dtable">
      <thead><tr><th class="mono">Date</th><th>CNF</th><th class="mono">Code</th><th class="mono">Products</th><th class="mono">Batch Lines</th><th class="mono">Total kg</th><th class="mono">Ageing/Critical</th><th>Submission ID</th></tr></thead>
      <tbody>
      ${filtered.map(s=>{
        const kg = s.items.reduce((a,i)=>a+i.kgQty,0);
        const ag = s.items.filter(it=>{
          const p = state.masters.products.find(pp=>pp.code===it.code);
          if(!p) return false;
          const st = ageingStatus(p, it.mfd);
          return ['critical','expiring','expired'].includes(st.cls);
        }).length;
        return `<tr data-movsub="${s.id}"><td class="mono dt">${fmtD(s.date)}</td><td>${s.cnfName}</td><td class="mono">${s.cnfCode}</td>
          <td class="mono">${new Set(s.items.map(i=>i.code)).size}</td><td class="mono">${s.items.length}</td>
          <td class="mono">${kg.toFixed(0)}</td><td class="mono" style="color:${ag?'var(--orange)':'inherit'}">${ag}</td>
          <td class="mono">${s.id}</td></tr>`;
      }).join('') || `<tr><td colspan="8" style="text-align:center;padding:20px;">No submissions in this range.</td></tr>`}
      </tbody>
    </table></div>
  </div>
  `;
}

// The period a comparison covers, worked out from the mode picked in the Export Centre.
function effectiveCompareRange(sel){
  const d = sel.date || todayISO();

}

// Parses the SAME file format each CNF's own SAP upload does (Plant,
// Material, Approved Order, Unpproved Order) — the only difference is this
// one is expected to carry rows for MANY CNFs (many different Plant
// values) in a single file, whereas a CNF's own upload only ever has its
// own. Only these two figures are ever pulled from it; anything else in
// the file (Current Stock, Safety Stock, etc.) is irrelevant here and
// ignored, since those still come only from each CNF's own submission.
async function parseOrdersBulkFile(file){
  if(typeof XLSX === 'undefined') throw new Error('Excel reader failed to load — check your internet connection and try again.');
  const buf = await readFileAsArrayBuffer(file);
  const wb = XLSX.read(buf, {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
  if(!raw.length) throw new Error('This file has no rows.');
  const header = raw[0];
  const cPlant = findCol(header, ['Plant']);
  const cMaterial = findCol(header, ['Material']);
  const cApproved = findCol(header, ['Approved Order']);
  const cPending = findCol(header, ['Unpproved Order','Unapproved Order','Un-approved Order']);
  if(cPlant===-1 || cMaterial===-1){
    throw new Error('Missing expected columns — need at least Plant and Material.');
  }
  if(cApproved===-1 && cPending===-1){
    throw new Error('Missing expected columns — need Approved Order and/or Unpproved Order to update anything.');
  }
  const rows = raw.slice(1)
    .filter(r=>r[cMaterial]!=='' && r[cMaterial]!==undefined && r[cPlant]!=='' && r[cPlant]!==undefined)
    .map(r=>({
      cnfCode: String(r[cPlant]).trim(),
      productCode: normalizeMaterialCode(r[cMaterial]),
      approvedOrder: cApproved>-1 ? sapNum_(r[cApproved]) : null,
      pendingOrder: cPending>-1 ? sapNum_(r[cPending]) : null,
    }));
  if(!rows.length) throw new Error('No rows found in this file.');
  return rows;
}
// SAP stores a material number zero-padded out to 18 characters
// ("000000000000100342"), while this app's stock rows and Product Master
// use the plain number ("100342"). Compared as-is the two never match —
// which is exactly why Approved/Pending came out blank or wrong for almost
// every product. Everything before the first non-zero digit is padding,
// not part of the code, so it's dropped on both sides before comparing. A
// code that is nothing but zeros stays "0" rather than becoming empty.
function normalizeMaterialCode(v){
  const s = String(v==null?'':v).trim();
  if(!s) return '';
  return s.replace(/^0+/, '') || '0';
}
// Turns the parsed rows into a {cnfCode+'||'+productCode: row} lookup —
// what the merged export below actually reads from, keyed the same way
// the export's own rows are matched against it.
function buildOrdersLookup(rows){
  const lookup = {};
  let duplicateLines = 0;
  const round3 = n => Math.round(n*1000)/1000;
  rows.forEach(r=>{
    const key = r.cnfCode+'||'+r.productCode;
    const ex = lookup[key];
    if(!ex){ lookup[key] = {approvedOrder:r.approvedOrder, pendingOrder:r.pendingOrder}; return; }
    // The same plant+material on more than one line is a split (e.g. by
    // storage location), not a repeat — the orders on each line add up.
    duplicateLines++;
    if(r.approvedOrder!=null) ex.approvedOrder = round3((ex.approvedOrder||0) + r.approvedOrder);
    if(r.pendingOrder!=null) ex.pendingOrder = round3((ex.pendingOrder||0) + r.pendingOrder);
  });
  return {lookup, duplicateLines};
}
// The whole point of this feature: a plain export — same headers, same
// builder (buildMisExportRows) as "Export Filtered Stock" already uses —
// with Approved/Pending Order swapped out for whatever this CNF+product
// combination has in the uploaded file, wherever it has one. A row this
// file doesn't mention keeps its normal (usually 0/blank) figure exactly
// as the plain export would show it — this only ever fills gaps, never
// invents data for a combination the file didn't include.
function buildMergedOrdersExportRows(rows, lookup){
  const {headers, dataRows} = buildMisExportRowsBase_(rows);
  const cnfCodeIdx = headers.indexOf('CNF Code');
  const prodCodeIdx = headers.indexOf('Product Code');
  const apprIdx = headers.indexOf('Approved Order');
  const pendIdx = headers.indexOf('Pending Order');
  let matched = 0, unmatched = 0;
  const mergedRows = dataRows.map(row=>{
    const key = String(row[cnfCodeIdx]).trim()+'||'+normalizeMaterialCode(row[prodCodeIdx]);
    const match = lookup[key];
    const copy = row.slice();
    // These two columns come ONLY from the uploaded file. A CNF/product the
    // file doesn't list has no order on record there, so it shows 0 — not
    // whatever figure happened to be sitting in that CNF's own submission,
    // which would mix two different sources into one column.
    if(match){
      matched++;
      copy[apprIdx] = match.approvedOrder!=null ? match.approvedOrder : 0;
      copy[pendIdx] = match.pendingOrder!=null ? match.pendingOrder : 0;
    } else {
      unmatched++;
      copy[apprIdx] = 0;
      copy[pendIdx] = 0;
    }
    return copy;
  });
  // Order To Be Taken = KG − Approved Order − Pending Order. Always the KG column
  // (Approved/Pending are in kg, so Entered Qty in any other UOM is never used).
  const kgIdx = headers.indexOf('KG');
  const outHeaders = headers.slice(), outRows = mergedRows.map(r=>r.slice());
  outHeaders[apprIdx] = 'Approved Order - Kg'; outHeaders[pendIdx] = 'Pending Order - Kg';
  const ordIdx = pendIdx + 1;
  outHeaders.splice(ordIdx, 0, 'Order To Be Taken');
  outRows.forEach(r=>{ r.splice(ordIdx, 0, orderToBeTaken_(r[kgIdx], r[apprIdx], r[pendIdx])); });
  const cellStyleFn = (ri, ci, val)=> ci===ordIdx && typeof val==='number' ? (val<0 ? {bg:'#fadbd8', fg:'#922b21', bold:true} : {bg:'#d5f5e3', fg:'#1e5b2b', bold:true}) : null;
  return {headers: outHeaders, dataRows: outRows, statusColIndex: headers.indexOf('Ageing Status'), matched, unmatched, cellStyleFn};
}

// Sends every active CNF's current report right now, on demand — the exact
// same .xlsx-attachment + ageing-highlight email a CNF's own Final Submit
// triggers automatically, just fired in a batch by MIS instead of waiting
// for each CNF's next submission. Reuses the same builders (and the same
// backend action) as that CNF-side flow so there is only ever one way this
// report gets built, never a second, separately-computed version.
async function broadcastReportsToAllCnfs(onProgress){
  const activeCnfs = state.masters.cnfs.filter(c=>c.status==='Active' && !isDemoCnf(c));
  const targets = activeCnfs.map(c=>({cnf:c, sub: latestSubmissionFor(c.code)})).filter(t=>t.sub);
  if(!targets.length) return {sent:0, failed:0, skipped:0, total:0};
  let sent=0, failed=0;
  for(let i=0;i<targets.length;i++){
    const {cnf, sub} = targets[i];
    if(onProgress) onProgress(i+1, targets.length, cnf.name);
    try{
      const detailedReport = buildDetailedReportRows(sub);
      const wb = await buildXlsxWorkbook({
        title: `${sub.cnfName} (${sub.cnfCode}) — Current Stock Report`,
        subtitle: `Stock date: ${fmtD(sub.date)} · Submission ID: ${sub.id}`,
        headers: detailedReport.headers, rows: detailedReport.rows, summaryRows: detailedReport.summaryRows, statusColIndex: detailedReport.statusColIndex,
      });
      const buffer = await wb.xlsx.writeBuffer();
      const xlsxBase64 = arrayBufferToBase64(buffer);
      const ageingTable = buildAgeingHighlightTableHtml(sub);
      const result = await apiPost('sendSubmissionReport', {
        report: {
          cnfCode: sub.cnfCode, cnfName: sub.cnfName, date: fmtD(sub.date),
          itemCount: sub.items.length, fileName: detailedReport.filename, xlsxBase64,
          ageingTableHtml: ageingTable.html, ageingCount: ageingTable.count,
        },
      });
      if(result && result.ok) sent++; else failed++;
    }catch(e){ failed++; }
  }
  return {sent, failed, skipped: activeCnfs.length-targets.length, total: targets.length};
}

/* ---------------- CSV export ---------------- */
// Single source of truth for the MIS export's row VALUES — both the plain
// CSV path and the new styled-Excel path build from this exact same
// function, so there's no risk of the two ever silently disagreeing on a
// number. Only the presentation differs downstream.
// Every detailed stock export goes through here. Once an Approved/Pending Orders
// file has been uploaded, Approved/Pending Order - Kg and Order To Be Taken are
// filled in automatically (KG − Approved − Pending), in every export.
function buildMisExportRows(rows){

  return o && o.lookup ? buildMergedOrdersExportRows(rows, o.lookup) : buildMisExportRowsBase_(rows);
}
function buildMisExportRowsBase_(rows){
  const headers = ['Stock Date','CNF Name','CNF Code','Product Code','Product Name','Category','Entered Qty','Entered UOM','KG','1 Bag = KG (fixed)','BAG Equiv','1 PC = KG (fixed)','PC Equiv','MFD','Stock Age (d)','Self-Life (d)','Remaining Shelf Life (d)','Ageing Status','Recommended Action','Safety Stock (kg)','Safety Status','Shortfall (kg)','SAP Qty (kg)','Variance Reason','Approved Order','Pending Order','Submission ID','Audit By'];
  const dataRows = rows.map(r=>{

    const safetyNorm = safetyNormFor(r.item,r.product);

    return [fmtD(r.sub.date), r.cnf.name, r.cnf.code, r.product.code, r.product.name, r.product.category, r.item.qty, safeUomLabel(r.item.uom), r.item.kgQty.toFixed(2), r.product.bagToKg||'', bagEquiv, r.product.pcToKg||'', pcEquiv, fmtD(r.item.mfd), r.ageStatus.age??'', r.ageStatus.life??'', r.ageStatus.remaining??'', ageingStatusCell(r.ageStatus), recommendedAction(r.ageStatus.cls, r.safetyStatus==='low'), safetyNorm, safetyStatusLabel(r.safetyStatus), shortfall, r.item.sapQtyKg!=null?r.item.sapQtyKg.toFixed(2):'', r.item.varianceReason||'', r.item.approvedOrder??'', r.item.pendingOrder??'', r.sub.id, auditByLabel(r.sub)];
  });
  return {headers, dataRows, statusColIndex: headers.indexOf('Ageing Status')};
}

const CMP_SEVERITY_COLORS = {
  'High':   {bg:'#c0392b', fg:'#ffffff'},
  'Medium': {bg:'#c2410c', fg:'#ffffff'},
  'Low':    {bg:'#5dade2', fg:'#0b2b40'},

function subsInRange(fromDate, toDate, cnfCode){
  return state.submissions
    .filter(s=>s.date>=fromDate && s.date<=toDate && (cnfCode==='ALL' ? !isDemoCode_(s.cnfCode) : String(s.cnfCode)===String(cnfCode)))
    .sort((a,b)=> a.date===b.date ? new Date(a.timestamp)-new Date(b.timestamp) : (a.date<b.date?-1:1));
}
// Same row shape allCurrentStockRows() produces, so buildMisExportRows() /
// buildMisPivotSummaryRows() work on historical data unchanged.
function buildRangeStockRows(subs){
  const rows = [];
  subs.forEach(sub=>{
    const cnf = state.masters.cnfs.find(c=>String(c.code)===String(sub.cnfCode)) || {name: sub.cnfName||sub.cnfCode, code: sub.cnfCode};
    rptItems_(sub).forEach(it=>{
      const product = state.masters.products.find(p=>p.code===it.code);
      if(!product) return;
      rows.push({cnf, sub, item:it, product, ageStatus: ageingStatus(product, it.mfd), safetyStatus: safetyStatusFor(it, product)});
    });
  });
  return rows;
}
function cmpBatchText(batches){
  const keys = Object.keys(batches).sort();
  return keys.length ? keys.map(m=>`${fmtD(m)} (${Number(batches[m].toFixed(1))} kg)`).join('; ') : '—';
}
// For every CNF + product, compares each submission inside the date range
// with the one right before it for that same product (the baseline may be
// from before the range). Only differences that look unusual come out.
function buildComparisonReport(subs, fromDate, toDate, allSubsForBaseline, cnfLabel, opts){
  opts = opts || {};
  const histOk = opts.histOk!==false;
  const baselineMode = opts.baseline==='chain' ? 'chain' : opts.baseline==='within' ? 'within' : 'before';
  const groups = {};
  const pool = (allSubsForBaseline||subs).filter(s=>s.date<=toDate);
  pool.forEach(sub=>{
    const byCode = {};
    rptItems_(sub).forEach(it=>{
      const o = byCode[it.code] || (byCode[it.code] = {name:it.name, cat:it.category||'', batches:{}, kg:0, sap:0, hasSap:false, reason:''});
      const m = it.mfd || 'No MFD';
      const kg = Number(it.kgQty)||0;
      o.batches[m] = (o.batches[m]||0) + kg; o.kg += kg;

/* ---------------- CNF-wise management summary: Comparison + Ageing in one file ---------------- */
const CNF_RISK_COLORS = {
  'High Risk':     {bg:'#c0392b', fg:'#ffffff'},
  'Medium Risk':   {bg:'#c2410c', fg:'#ffffff'},
  'Low Risk':      {bg:'#1e8449', fg:'#ffffff'},
  'No Submission': {bg:'#bdc3c7', fg:'#2c2c2c'},

// The stock a CNF holds at the end of the period, product by product: for each product, the lines of the
// most recent submission (inside the period) that mentions it — so a Final followed by a Partial still gives
// the full picture. Ageing is worked out as of TODAY, the same way every other report here does it.
function cnfHeldStock_(subsOfCnf){
  const byProduct = new Map();
  subsOfCnf.slice().sort((a,b)=> new Date(a.timestamp)-new Date(b.timestamp)).forEach(sub=>{
    const mine = {};
    rptItems_(sub).forEach(it=>{ (mine[it.code] = mine[it.code] || []).push(it); });
    Object.entries(mine).forEach(([code, items])=> byProduct.set(code, {sub, items}));
  });
  const lines = [];
  byProduct.forEach(({sub, items})=> items.forEach(it=> lines.push({sub, it})));
  return lines;
}
function buildCnfSummaryReport(inRange, fromDate, toDate, pool, cnfLabel, opts){

  const agedRows = [], agedStyles = [];
  const per = [];
  [...cnfCodes].forEach(code=>{
    const cnf = state.masters.cnfs.find(c=>String(c.code)===String(code));
    const subs = subsByCnf[code] || [];
    const name = cnf ? cnf.name : ((subs[0]&&subs[0].cnfName) || code);
    const st = {code, name, nSubs: new Set(subs.map(x=>x.id)).size, lastDate:'', daysSince:'', total:0,
      kg:{expired:0, expiring:0, critical:0, ageing:0, ok:0, nomfd:0}, belowSafety:0, products:new Set(), aged:[]};
    if(subs.length){
      st.lastDate = subs.map(x=>x.date).sort().slice(-1)[0];
      st.daysSince = Math.max(0, Math.round((new Date(today+'T00:00:00') - new Date(st.lastDate+'T00:00:00'))/86400000));
      cnfHeldStock_(subs).forEach(({sub, it})=>{
        const product = state.masters.products.find(p=>p.code===it.code);
        const kg = Number(it.kgQty)||0;
        st.total += kg; st.products.add(it.code);
        const a = ageingStatus(product, it.mfd);
        if(!it.mfd) st.kg.nomfd += kg;
        else if(a.cls==='expired') st.kg.expired += kg;
        else if(a.cls==='expiring') st.kg.expiring += kg;
        else if(a.cls==='critical') st.kg.critical += kg;
        else if(a.cls==='ageing') st.kg.ageing += kg;
        else st.kg.ok += kg;
        const low = product && safetyStatusFor(it, product)==='low';
        if(low) st.belowSafety++;
        if(it.mfd && ['expired','expiring','critical','ageing'].includes(a.cls)){
          st.aged.push({cls:a.cls, label:a.label, row:[name, code, it.code, product?product.name:(it.name||''), product?product.category:(it.category||''), it.mfd, a.age??'', a.remaining??'', kg1(kg), ageingStatusCell(a), recommendedAction(a.cls, low), sub.date]});
        }
      });
    }
    const cs = rep.cnfStats[code] || {High:0, Medium:0, Low:0, types:{}};
    const atRiskKg = st.kg.expired + st.kg.expiring + st.kg.critical;
    const atRiskPct = st.total>0 ? atRiskKg/st.total*100 : 0;
    let rating, why = [];
    if(!subs.length){ rating = 'No Submission'; }
    else {
      if(st.kg.expired>0) why.push(`Expired stock ${kg1(st.kg.expired)} kg`);
      if(st.kg.expiring+st.kg.critical>0) why.push(`Near-expiry/critical ${kg1(st.kg.expiring+st.kg.critical)} kg`);
      if(cs.High) why.push(`${cs.High} High comparison flag${cs.High>1?'s':''}`);
      if(cs.Medium) why.push(`${cs.Medium} Medium comparison flag${cs.Medium>1?'s':''}`);
      if(st.kg.nomfd>0) why.push(`${kg1(st.kg.nomfd)} kg without MFD`);
      if(st.kg.expired>0 || cs.High>0 || atRiskPct>=20) rating = 'High Risk';
      else if(st.kg.expiring+st.kg.critical>0 || cs.Medium>0 || atRiskPct>=5) rating = 'Medium Risk';
      else rating = 'Low Risk';
    }
    const topTypes = Object.entries(cs.types).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t,n])=>`${t} ×${n}`).join(', ');
    let action;
    if(rating==='No Submission') action = 'No stock submitted in this period — follow up with the CNF/CFA.';
    else {
      const acts = [];
      if(cs.High||cs.Medium) acts.push('Ask the CNF/CFA to verify the highlighted MFD / quantity entries (see "Comparison Flags" and the Comparison Report\'s CNF Email View)');
      if(st.kg.expired>0) acts.push('Find out why expired stock is still held and arrange disposal / return');
      if(st.kg.expiring+st.kg.critical+st.kg.ageing>0) acts.push('Push the ageing lines for early movement (oldest MFD first)');
      action = acts.length ? acts.join('. ')+'.' : 'No action needed — stock is fresh and entries are consistent.';
    }
    per.push({st, cs, rating, atRiskKg, atRiskPct, why, topTypes, action, pairs: rep.pairsByCnf[code]||0});
  });
  const rank = {'High Risk':0, 'Medium Risk':1, 'Low Risk':2, 'No Submission':3};
  per.sort((a,b)=> rank[a.rating]-rank[b.rating] || b.atRiskKg-a.atRiskKg || (b.cs.High-a.cs.High) || String(a.st.code).localeCompare(String(b.st.code),undefined,{numeric:true}));

  const headers = ['Risk Rating','CNF Name','CNF Code','Submissions in Period','Last Submission','Days Since Last','Products Held','Total Stock (kg)','Expired (kg)','Near Expiry (kg)','Critical (kg)','Ageing (kg)','Normal / Fresh (kg)','No MFD (kg)','At-Risk % (Expired+Near Expiry+Critical)','Lines Below Safety','Compared Products','High Flags','Medium Flags','Low Flags','Main Comparison Issues','Why this rating','Action Required'];
  const rows = per.map(x=>[x.rating, x.st.name, x.st.code, x.st.nSubs, x.st.lastDate||'—', x.st.daysSince, x.st.products.size, kg1(x.st.total), kg1(x.st.kg.expired), kg1(x.st.kg.expiring), kg1(x.st.kg.critical), kg1(x.st.kg.ageing), kg1(x.st.kg.ok), kg1(x.st.kg.nomfd), x.st.total>0 ? Number(x.atRiskPct.toFixed(1)) : '', x.st.belowSafety, x.pairs, x.cs.High, x.cs.Medium, x.cs.Low, x.topTypes||'—', x.why.join('; ')||'—', x.action]);
  const sum = i => per.reduce((t,x)=>t+(Number(rows[per.indexOf(x)][i])||0),0);
  const totTotal = sum(7), totRisk = sum(8)+sum(9)+sum(10);
  rows.push(['TOTAL','All CNFs shown','', sum(3), '', '', '', kg1(totTotal), kg1(sum(8)), kg1(sum(9)), kg1(sum(10)), kg1(sum(11)), kg1(sum(12)), kg1(sum(13)), totTotal>0 ? Number((totRisk/totTotal*100).toFixed(1)) : '', sum(15), sum(16), sum(17), sum(18), sum(19), '', '', '']);
  const lastIdx = rows.length-1;
  const cellStyleFn = (ri, ci, val)=>{
    if(ri===lastIdx) return {bg:'#e8e0cc', fg:'#1c1712', bold:true};
    const h = headers[ci];
    if(h==='Expired (kg)' && val>0) return {bg:'#f8d0cc', fg:'#8a1f11', bold:true};
    if((h==='Near Expiry (kg)' || h==='Critical (kg)') && val>0) return {bg:'#fde2c4', fg:'#8a4b0a', bold:true};
    if(h==='Ageing (kg)' && val>0) return {bg:'#fff2a8', fg:'#5c3b00'};
    if(h==='High Flags' && val>0) return {bg:'#f8d0cc', fg:'#8a1f11', bold:true};
    if(h==='Medium Flags' && val>0) return {bg:'#fde2c4', fg:'#8a4b0a'};
    if(h.startsWith('At-Risk') && val!=='' && val>=20) return {bg:'#f8d0cc', fg:'#8a1f11', bold:true};
    if(h.startsWith('At-Risk') && val!=='' && val>=5) return {bg:'#fde2c4', fg:'#8a4b0a'};
    return null;
  };
  // ---- extra sheet: ageing lines, worst first ----
  const sevOrder = {expired:0, expiring:1, critical:2, ageing:3};
  const allAged = [];
  per.forEach(x=> x.st.aged.forEach(a=> allAged.push(a)));
  allAged.sort((a,b)=> sevOrder[a.cls]-sevOrder[b.cls] || String(a.row[1]).localeCompare(String(b.row[1]),undefined,{numeric:true}) || (Number(a.row[7])-Number(b.row[7])));
  const AGE_UI = {expired:AGEING_STATUS_COLORS['Expired'], expiring:AGEING_STATUS_COLORS['Near Expiry'], critical:AGEING_STATUS_COLORS['Critical'], ageing:AGEING_STATUS_COLORS['Ageing']};
  allAged.forEach(a=> agedStyles.push(a.row.map((_,i)=> i===9 ? {bg:AGE_UI[a.cls].bg, fg:AGE_UI[a.cls].fg, bold:true} : null)));
  const agingSheet = {
    name:'Ageing Detail', title:'Ageing Detail — every product line that is Expired, Near Expiry, Critical or Ageing',
    subtitle:`Stock as held at the end of ${fromDate===toDate?fromDate:fromDate+' to '+toDate} (each product from its latest submission in the period) · ageing calculated as of ${today} · worst first`,
    headers:['CNF Name','CNF Code','Product Code','Product Name','Category','MFD','Stock Age (d)','Remaining Shelf Life (d)','Stock (kg)','Ageing Status','Action','Submission Date'],
    rows: allAged.map(a=>a.row), styles: agedStyles, widths:[22,10,13,36,16,12,12,14,12,48,16,14], wrapCols:[9],
  };
  // ---- extra sheet: comparison flags in short form ----
  const sevCols = rep.headers;
  const ix = n => sevCols.indexOf(n);
  const flagRows = rep.rows.map(r=>[r[ix('Severity')], r[ix('CNF Name')], r[ix('CNF Code')], r[ix('Product Code')], r[ix('Product Name')], r[ix('Previous Date')], r[ix('Current Date')], r[ix('Previous MFD (kg)')], r[ix('Current MFD (kg)')], r[ix('What Changed')]]);
  const flagStyles = flagRows.map(r=>{ const c = CMP_SEVERITY_COLORS[r[0]]; return r.map((_,i)=> i===0 && c ? {bg:c.bg, fg:c.fg, bold:true} : null); });
  const flagSheet = {
    name:'Comparison Flags', title:'Comparison Flags — what differs from each CNF/CFA\'s previous submission',
    subtitle:'Full logic, calculation and reason for every line are in the Comparison Report download · High first',
    headers:['Severity','CNF Name','CNF Code','Product Code','Product Name','Previous Date','Current Date','Previous MFD (kg)','Current MFD (kg)','What Changed'],
    rows: flagRows, styles: flagStyles, widths:[11,22,10,13,34,13,13,34,34,70], wrapCols:[7,8,9],
  };
  const cnt = k => per.filter(x=>x.rating===k).length;
  const worst = per.filter(x=>x.rating==='High Risk').slice(0,5);
  const summaryRows = [
    ['REPORT BASIS',''],
    ['Submissions dated', fromDate===toDate ? fromDate : `${fromDate}  to  ${toDate}`],
    ['CNF / CFA', cnfLabel||'All CNFs'],
    ['Comparison', opts.baseline==='within' ? 'Latest submission vs the one before it, both inside the period' : opts.baseline==='chain' ? 'Each submission vs the one right before it' : 'Latest submission in the period vs the CNF/CFA\'s last submission before it'],
    ['Ageing', `Stock held at the end of the period (each product from its latest submission in the period), ageing status as of ${today}`],
    ['Data source', opts.histOk===false ? '⚠ SERVER HISTORY NOT LOADED — built only from submissions already on this device. Press Sync and download again.' : 'Full submission history loaded from the server'],
    ['',''],
    ['AT A GLANCE',''],
    ['CNFs / CFAs covered', per.length],
    ['High Risk', cnt('High Risk')],
    ['Medium Risk', cnt('Medium Risk')],
    ['Low Risk', cnt('Low Risk')],
    ['No submission in period', cnt('No Submission')],
    ['Total stock held (kg)', kg1(totTotal)],
    ['Expired (kg)', kg1(sum(8))],
    ['Near Expiry + Critical (kg)', kg1(sum(9)+sum(10))],
    ['Ageing (kg)', kg1(sum(11))],
    ['At-risk share of stock', totTotal>0 ? `${(totRisk/totTotal*100).toFixed(1)}%  (Expired + Near Expiry + Critical)` : '—'],
    ['Comparison flags (High / Medium / Low)', `${rep.sevCount.High} / ${rep.sevCount.Medium} / ${rep.sevCount.Low}   of ${rep.compared} product comparisons`],
    ['',''],
    ['CNFs NEEDING ATTENTION FIRST',''],
    ...(worst.length ? worst.map(x=>[`${x.st.name} (${x.st.code})`, x.why.join('; ')||'—']) : [['None','No CNF/CFA is rated High Risk']]),
    ['',''],
    ['HOW THE RISK RATING IS DECIDED',''],
    ['High Risk', 'Any expired stock, OR at least one High comparison flag, OR 20% or more of the stock is Expired / Near Expiry / Critical'],
    ['Medium Risk', 'Any Near Expiry or Critical stock, OR a Medium comparison flag, OR 5% or more of the stock is at risk'],
    ['Low Risk', 'None of the above (Ageing stock and Low flags alone do not raise the rating)'],
    ['No Submission', 'Active CNF/CFA that submitted nothing inside the period'],
    ['',''],
    ['SHEETS IN THIS FILE',''],
    ['1  Summary', 'This page'],
    ['2  CNF Summary', 'One row per CNF/CFA: rating, stock, ageing split in kg, comparison flags, why, and the action required'],
    ['3  Ageing Detail', 'Every Expired / Near Expiry / Critical / Ageing product line, worst first'],
    ['4  Comparison Flags', 'Every product whose MFD or quantity differs unusually from the previous submission'],
  ];
  return {headers, rows, summaryRows, cellStyleFn, extraSheets:[agingSheet, flagSheet], counts:{high:cnt('High Risk'), medium:cnt('Medium Risk'), low:cnt('Low Risk'), none:cnt('No Submission')}, n: per.length, rep};
}

/* ---------------- Sales Coordinator audit report: who audited which CNF, how many times, when ---------------- */
function scRange(){
  if(!state.scRangeSel){ const d=new Date(); d.setDate(d.getDate()-30); state.scRangeSel = {from: localDateISO(d), to: todayISO(), cnf:'ALL', who:'ALL'}; }
  return state.scRangeSel;
}
function buildScAuditReport(sel, allSubs){
  const kg1 = n => Number((Number(n)||0).toFixed(1));
  const today = todayISO();
  const inRange = subsInRange(sel.from, sel.to, sel.cnf);
  const audits = inRange.filter(sb=>{ const a = parseAuditBy(sb.submittedBy); return a.role==='SC' && (sel.who==='ALL' || a.id===sel.who); });
  const nameOf = id => { const u = (state.masters.scUsers||[]).find(x=>x.userId===id); if(u) return u.name; const hit = audits.find(sb=>parseAuditBy(sb.submittedBy).id===id) || (allSubs||[]).find(sb=>parseAuditBy(sb.submittedBy).id===id); return hit ? parseAuditBy(hit.submittedBy).name : id; };
  const scIds = new Set((state.masters.scUsers||[]).filter(u=>sel.who==='ALL' || u.userId===sel.who).map(u=>u.userId));
  audits.forEach(sb=> scIds.add(parseAuditBy(sb.submittedBy).id));
  const cnfName = code => { const c = state.masters.cnfs.find(x=>String(x.code)===String(code)); return c ? c.name : code; };
  const timeOf = sb => { try{ return fmtT(sb.timestamp); }catch(e){ return ''; } };
  const ageingOf = sb => {
    let expired=0, risk=0, expLines=0, nearLines=0, total=0;
    rptItems_(sb).forEach(it=>{
      const pr = state.masters.products.find(p=>p.code===it.code); const kg = Number(it.kgQty)||0; total += kg;
      if(!pr || !it.mfd) return; const a = ageingStatus(pr, it.mfd);
      if(a.cls==='expired'){ expired += kg; risk += kg; expLines++; } else if(a.cls==='expiring' || a.cls==='critical'){ risk += kg; nearLines++; }
    });
    return {expired, risk, expLines, nearLines, total};
  };
  // a "visit" = one SC at one CNF on one date (a Final plus a Partial the same day is still one visit)
  const visitKey = sb => parseAuditBy(sb.submittedBy).id+'|'+sb.cnfCode+'|'+sb.date;
  const perSc = {};
  [...scIds].forEach(id=>{ perSc[id] = {id, name:nameOf(id), status:((state.masters.scUsers||[]).find(u=>u.userId===id)||{}).status||'—', visits:new Set(), subs:0, cnfs:new Map(), dates:[], lines:0, kg:0}; });
  audits.forEach(sb=>{
    const a = parseAuditBy(sb.submittedBy); const o = perSc[a.id];
    o.visits.add(visitKey(sb)); o.subs++; o.dates.push(sb.date);
    const c = o.cnfs.get(sb.cnfCode) || {dates:new Set(), last:''}; c.dates.add(sb.date); if(sb.date>c.last) c.last = sb.date; o.cnfs.set(sb.cnfCode, c);
    o.lines += rptItems_(sb).length; o.kg += rptItems_(sb).reduce((t,i)=>t+(Number(i.kgQty)||0),0);
  });
  const scList = Object.values(perSc).sort((a,b)=> b.visits.size-a.visits.size || a.name.localeCompare(b.name));
  const headers = ['SC Name','SC ID','Status','Visits (CNF-days)','Submissions','CNFs Audited','Repeat Visits (same CNF again)','First Audit','Last Audit','Lines Audited','Stock Audited (kg)','CNFs Audited (names)'];
  const rows = scList.map(o=>{
    const ds = o.dates.slice().sort();
    return [o.name, o.id, o.status, o.visits.size, o.subs, o.cnfs.size, o.visits.size - o.cnfs.size, fmtD(ds[0])||'—', fmtD(ds[ds.length-1])||'—', o.lines, kg1(o.kg), [...o.cnfs.keys()].map(c=>`${cnfName(c)} (${c})`).join(', ') || '—'];
  });
  const sum = i => rows.reduce((t,r)=>t+(Number(r[i])||0),0);
  rows.push(['TOTAL','','', sum(3), sum(4), new Set(audits.map(sb=>sb.cnfCode)).size, '', '', '', sum(9), kg1(sum(10)), '']);
  const lastIdx = rows.length-1;
  const cellStyleFn = (ri, ci, val)=>{
    if(ri===lastIdx) return {bg:'#e8e0cc', fg:'#1c1712', bold:true};
    if(ci===3 && val===0) return {bg:'#f8d0cc', fg:'#8a1f11', bold:true};
    if(ci===3 && val>0) return {bg:'#dff0e0', fg:'#1e5b2b', bold:true};
    return null;
  };
  // ---- SC x CNF ----
  const pairRows = [];
  scList.forEach(o=> [...o.cnfs.entries()].sort((a,b)=> b[1].last.localeCompare(a[1].last)).forEach(([code,c])=>{
    pairRows.push([o.name, o.id, cnfName(code), code, c.dates.size, [...c.dates].sort().map(fmtD).join(', '), fmtD(c.last)]);
  }));
  const pairSheet = {name:'SC x CNF', title:'Which Sales Coordinator audited which CNF/CFA, and on which dates',
    subtitle:`${fmtD(sel.from)} to ${fmtD(sel.to)} · one row per Sales Coordinator and CNF · Visits = distinct audit dates`,
    headers:['SC Name','SC ID','CNF Name','CNF Code','Visits','Audit Dates','Last Audit'], rows:pairRows, widths:[22,10,26,10,9,60,13], wrapCols:[5]};
  // ---- Audit Log ----
  const logSubs = audits.slice().sort((a,b)=> a.date===b.date ? new Date(a.timestamp)-new Date(b.timestamp) : (a.date<b.date?-1:1));
  const logRows = logSubs.map(sb=>{ const a = parseAuditBy(sb.submittedBy); const g = ageingOf(sb);
    return [fmtD(sb.date), timeOf(sb), a.name, a.id, cnfName(sb.cnfCode), sb.cnfCode, sb.status||'Final', new Set((sb.items||[]).map(i=>i.code)).size, (sb.items||[]).length, kg1(g.total), kg1(g.expired), kg1(g.risk), g.expLines, g.nearLines, sb.id]; });
  const logStyles = logRows.map(r=> r.map((_,i)=> (i===10 && r[10]>0) ? {bg:'#f8d0cc', fg:'#8a1f11', bold:true} : (i===11 && r[11]>0) ? {bg:'#fde2c4', fg:'#8a4b0a'} : null));
  const logSheet = {name:'Audit Log', title:'Audit Log — every stock audit made by a Sales Coordinator',
    subtitle:`${fmtD(sel.from)} to ${fmtD(sel.to)} · ageing as of ${fmtD(today)} · At-risk = Expired + Near Expiry + Critical`,
    headers:['Audit Date','Time','SC Name','SC ID','CNF Name','CNF Code','Status','Products','Lines','Stock (kg)','Expired (kg)','At-Risk (kg)','Expired Lines','Near-Expiry / Critical Lines','Submission ID'],
    rows:logRows, styles:logStyles, widths:[12,8,22,10,26,10,9,10,8,12,12,12,10,14,24]};
  // ---- CNF coverage ----
  const activeCnfs = state.masters.cnfs.filter(c=>c.status==='Active' && (sel.cnf!=='ALL' ? String(c.code)===String(sel.cnf) : !isDemoCnf(c)));
  const byCnf = {};
  audits.forEach(sb=>{ (byCnf[sb.cnfCode] = byCnf[sb.cnfCode] || []).push(sb); });
  const lastEver = {};
  (allSubs||[]).forEach(sb=>{ if(parseAuditBy(sb.submittedBy).role==='SC' && (!lastEver[sb.cnfCode] || sb.date>lastEver[sb.cnfCode].date)) lastEver[sb.cnfCode] = sb; });
  const covRows = activeCnfs.map(c=>{
    const list = byCnf[c.code] || [];
    const visits = new Set(list.map(visitKey)).size;
    const le = lastEver[c.code];
    const days = le ? Math.max(0, Math.round((new Date(today+'T00:00:00') - new Date(le.date+'T00:00:00'))/86400000)) : '';
    return [visits ? 'Audited' : 'Not audited', c.name, c.code, visits, [...new Set(list.map(sb=>parseAuditBy(sb.submittedBy).name))].join(', ') || '—', visits ? fmtD(list.map(sb=>sb.date).sort().slice(-1)[0]) : '—', le ? fmtD(le.date) : 'Never (in loaded history)', days, le ? parseAuditBy(le.submittedBy).name : '—'];
  }).sort((a,b)=> (a[0]===b[0]?0:(a[0]==='Not audited'?-1:1)) || String(a[2]).localeCompare(String(b[2]),undefined,{numeric:true}));
  const covStyles = covRows.map(r=> r.map((_,i)=> i===0 ? (r[0]==='Audited' ? {bg:'#27ae60', fg:'#ffffff', bold:true} : {bg:'#c0392b', fg:'#ffffff', bold:true}) : null));
  const covSheet = {name:'CNF Coverage', title:'CNF / CFA Coverage — which CNFs a Sales Coordinator audited in this period',
    subtitle:`${fmtD(sel.from)} to ${fmtD(sel.to)} · active CNFs only${sel.cnf==='ALL'?' (training/demo CNF left out)':''} · Not audited first`,
    headers:['Coverage','CNF Name','CNF Code','Visits in Period','Audited By','Last Audit in Period','Last SC Audit Ever','Days Since That','Last Audited By'],
    rows:covRows, styles:covStyles, widths:[14,28,10,12,30,16,22,12,22]};
  const audited = covRows.filter(r=>r[0]==='Audited').length;
  const busiest = scList.length && scList[0].visits.size ? scList[0] : null;
  const idle = scList.filter(o=>o.visits.size===0 && o.status==='Active');
  const summaryRows = [
    ['REPORT BASIS',''],
    ['Audits dated', `${fmtD(sel.from)}  to  ${fmtD(sel.to)}`],
    ['Sales Coordinator', sel.who==='ALL' ? 'All Sales Coordinators' : `${nameOf(sel.who)} (${sel.who})`],
    ['CNF / CFA', sel.cnf==='ALL' ? 'All CNFs (training/demo CNF left out)' : `${cnfName(sel.cnf)} (${sel.cnf})`],
    ['What counts as an audit', 'A stock submission made by a Sales Coordinator on a CNF/CFA\'s behalf (shown as "Audit by SC - name"). A visit is one Sales Coordinator at one CNF on one date.'],
    ['',''],
    ['AT A GLANCE',''],
    ['Audit visits (CNF-days)', sum(3)],
    ['Audit submissions (Final + Partial)', sum(4)],
    ['Sales Coordinators who audited', scList.filter(o=>o.visits.size>0).length],
    ['CNFs / CFAs audited', audited + ' of ' + covRows.length + ' active'],
    ['CNFs / CFAs NOT audited', covRows.length - audited],
    ['Stock audited (kg)', kg1(sum(10))],
    ['Most visits', busiest ? `${busiest.name} — ${busiest.visits.size} visit(s) to ${busiest.cnfs.size} CNF(s)` : '—'],
    ['Active coordinators with no audit', idle.length ? idle.map(o=>o.name).join(', ') : 'None'],
    ['',''],
    ['SHEETS IN THIS FILE',''],
    ['1  Summary', 'This page'],
    ['2  SC Summary', 'One row per Sales Coordinator: visits, CNFs audited, repeat visits, first/last audit, stock audited, CNF names'],
    ['3  SC x CNF', 'Which coordinator audited which CNF, how many times, on which dates'],
    ['4  Audit Log', 'Every audit with date, time, stock and expired / at-risk stock found'],
    ['5  CNF Coverage', 'Every active CNF: audited in this period or not, by whom, and when it was last audited by anyone'],
  ];
  return {headers, rows, cellStyleFn, summaryRows, extraSheets:[pairSheet, logSheet, covSheet], audits:audits.length, visits:sum(3), cnfsAudited:audited, cnfsTotal:covRows.length};

function noSubsMessage(sel, histOk){

function toCsv(rows){
  const {headers, dataRows} = buildMisExportRows(rows);
  const esc = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : v;
  const lines = [headers.map(esc).join(',')];
  dataRows.forEach(row=>{ lines.push(row.map(esc).join(',')); });
  return lines.join('\n');
}
// The pivot/insight block every MIS export leads with — the same numbers
// the raw rows already contain, just pre-aggregated so the picture is
// visible in one glance instead of needing a fresh pivot table built by
// hand every time.
function buildMisPivotSummaryRows(rows){
  const totalKg = rows.reduce((s,r)=>s+r.item.kgQty,0);
  const byCategory = {}, byCnf = {}, byStatus = {};
  let belowSafety = 0;
  rows.forEach(r=>{
    byCategory[r.product.category] = (byCategory[r.product.category]||0) + r.item.kgQty;
    byCnf[r.cnf.name] = (byCnf[r.cnf.name]||0) + r.item.kgQty;
    byStatus[r.ageStatus.label] = (byStatus[r.ageStatus.label]||0) + 1;
    if(r.safetyStatus==='low') belowSafety++;
  });
  const kgFmt = n => Number(n.toFixed(1));
  const out = [
    ['AT A GLANCE',''],
    ['Total Stock (kg)', kgFmt(totalKg)],
    ['Total Lines', rows.length],
    ['CNFs Represented', new Set(rows.map(r=>r.cnf.code)).size],
    ['Below Safety Stock', belowSafety],
    ['',''],
    ['STOCK BY CATEGORY (kg)',''],
    ...Object.entries(byCategory).sort((a,b)=>b[1]-a[1]).map(([cat,kg])=>[cat, kgFmt(kg)]),
    ['',''],
    ['STOCK BY CNF (kg)',''],
    ...Object.entries(byCnf).sort((a,b)=>b[1]-a[1]).map(([cnf,kg])=>[cnf, kgFmt(kg)]),
    ['',''],
    ['AGEING BREAKDOWN (line count)',''],
    ...['Expired','Near Expiry','Critical','Ageing','Normal','Fresh','No MFD'].filter(s=>byStatus[s]).map(s=>[s, byStatus[s]]),
  ];
  return out;
}
// An export is exactly the moment someone needs the NEWEST data — yet it
// used to build straight from whatever this tab had loaded when it was
// opened (or last synced), with nothing pulling from the server first. A
// CNF submitting after that point simply never appeared, with no sign
// anything was out of date. So every export now fetches first. If that
// fetch fails (offline, backend down) the export still goes ahead from
// what's loaded — better than nothing — but it says so, with the time that
// data is actually from, instead of quietly passing it off as current.
function fmtClock(ts){ return ts ? fmtT(ts,true) : '—'; }
// Says plainly where the data on screen actually came from when it is NOT
// freshly pulled from the server — the imported backup if that is the newest
// thing this device has, otherwise the last real sync. null = nothing known.
function dataSourceNote(){
  const synced = Number(lsGet('masterSyncedAt')) || 0;
  const imp = state.importedBackup;
  if(imp && (imp.importedAt||0) >= synced) return `the imported backup "${imp.fileName}" (newest stock dated ${imp.newestStockDate||'unknown'})`;
  if(synced) return `the data last loaded from ${backendName()} at ${fmtWhen(synced)}`;
  return null;
}
// The Overview's "Data as of" used to show only the last Sheet sync — so after
// importing a newer backup it kept claiming an old date next to fresh numbers.
// Whichever is newer (last real sync, or the imported backup) is what's named.
function overviewDataAsOfHtml(){
  const synced = Number(lsGet('masterSyncedAt')) || 0;
  const imp = state.importedBackup;
  const st = 'font-family:var(--mono);font-size:13px;color:var(--surface-text);';
  if(imp && (imp.importedAt||0) >= synced){
    return `<b style="${st}">Imported backup — newest stock dated ${imp.newestStockDate||'unknown'}</b>
      <div style="font-family:var(--mono);font-size:10.5px;color:var(--wheat-dim);margin-top:2px;">${imp.fileName} · imported ${fmtDT(imp.importedAt)}${synced?` · last live sync ${fmtDT(synced)}`:''}</div>`;
  }
  return `<b style="${st}">${synced ? fmtDT(synced) : 'never synced'}</b>`;
}
function dataAsOfText(){
  if(state.lastDataSyncAt) return `Data as of ${fmtClock(state.lastDataSyncAt)} — pulled from the server`;
  const note = dataSourceNote();
  return note ? `Showing ${note} — the server has not been reached this session` : 'Not yet refreshed from the server in this session';
}
function updateDataAsOfLabel(){
  const el = document.getElementById('dataAsOf');
  if(el) el.textContent = dataAsOfText();
}
// An export is exactly the moment someone needs the NEWEST data — yet it used
// to build straight from whatever this tab had loaded, with nothing pulling
// from the server first. So every export fetches first. If that fails
// (offline, backend down) the export still goes ahead from what's loaded —
// the imported backup counts — but says so and says where that data is from.
// A server that just failed to answer won't answer a second later either, so
// a recent failure is remembered and later exports don't wait it out again.
async function refreshBeforeExport(){
  if(!getApiUrl()) return {refreshed:false, reason:'No backend connected'};
  if(state.lastRefreshFailedAt && Date.now()-state.lastRefreshFailedAt < 20000){
    return {refreshed:false, skipped:true, reason:`the server did not answer ${Math.round((Date.now()-state.lastRefreshFailedAt)/1000)}s ago`};
  }
  try{
    await withTimeout(forceSyncMasters({retry:false, timeoutMs:40000, fresh:true}), 45000);
    state.lastRefreshFailedAt = null;
    updateDataAsOfLabel();
    return {refreshed:true};
  }catch(e){
    state.lastRefreshFailedAt = Date.now();
    return {refreshed:false, reason:(e&&e.message)||String(e)};
  }
}
function warnIfStale(fresh){
  if(fresh && !fresh.refreshed && getApiUrl()){
    const note = dataSourceNote();
    showToast(`⚠ Couldn't reach the server (${fresh.reason}) — exporting ${note || 'the data currently loaded'}. Contact IT if this persists: 1800-121-0144`);
  }
}
