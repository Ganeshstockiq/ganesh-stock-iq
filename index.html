<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>GCPL Stock Audit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --accent:#6f5bff;
    --accent-2:#00d4b8;
    --bg-1:#0f1229;
    --bg-2:#1a1f4d;
    --card:#ffffff;
    --text-dark:#161832;
    --text-mid:#5b5f7a;
    --danger:#ff5470;
    --ok:#00a892;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;font-family:'Segoe UI',Roboto,-apple-system,sans-serif;
    background:radial-gradient(circle at top,var(--bg-2),var(--bg-1) 70%);
    min-height:100vh;color:var(--text-dark);padding-bottom:40px;
    transition:background .4s;
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;color:#fff;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;box-shadow:0 4px 18px rgba(111,91,255,.5);}
  .brand-text h1{margin:0;font-size:16px;font-weight:700;}
  .brand-text span{font-size:10.5px;opacity:.65;letter-spacing:.5px;}
  .top-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:#fff;}
  .version-pill{font-size:10.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);padding:4px 9px;border-radius:20px;opacity:.85;}

  .status-strip{margin:0 16px 10px;display:flex;gap:8px;}
  .status-chip{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:9px 12px;color:#fff;font-size:12px;display:flex;align-items:center;gap:8px;}
  .status-chip .big{font-size:15px;font-weight:700;}
  .status-chip small{display:block;opacity:.7;font-size:10px;}

  .progress-wrap{margin:0 16px 14px;}
  .progress-track{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .35s;}
  .progress-label{color:#fff;font-size:11px;opacity:.75;margin-top:5px;display:flex;justify-content:space-between;}

  .stepper{display:flex;gap:6px;padding:0 16px 14px;}
  .step-dot{flex:1;height:5px;border-radius:4px;background:rgba(255,255,255,.15);transition:.3s;}
  .step-dot.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));}

  .card{background:var(--card);margin:0 16px 16px;border-radius:var(--radius);padding:22px 20px;box-shadow:0 20px 40px rgba(0,0,0,.35);animation:rise .35s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .card h2{margin:0 0 4px;font-size:18px;}
  .card p.sub{margin:0 0 16px;color:var(--text-mid);font-size:13px;}

  .last-audit-card{background:#f5f4ff;border:1px solid #e4e1ff;border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:var(--text-mid);}
  .last-audit-card b{color:var(--text-dark);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-mid);margin-bottom:6px;}
  .field input, .field select{width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid #e7e8f2;font-size:14.5px;background:#fafaff;transition:.2s;}
  .field input:focus, .field select:focus{outline:none;border-color:var(--accent);background:#fff;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin:18px 0 10px;}

  .btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#8b7bff);color:#fff;box-shadow:0 10px 24px rgba(111,91,255,.4);}
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.5;box-shadow:none;cursor:not-allowed;}
  .btn-ghost{background:#f1f1f8;color:var(--text-dark);}
  .btn-outline{background:#fff;color:var(--accent);border:1.5px solid var(--accent);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}

  .photo-box{border:2px dashed #d8d9ee;border-radius:16px;padding:24px 14px;text-align:center;color:var(--text-mid);position:relative;overflow:hidden;}
  .photo-box.has-photo{border-style:solid;border-color:var(--accent-2);padding:0;}
  .photo-box img{width:100%;display:block;border-radius:14px;}
  .photo-icon{font-size:34px;margin-bottom:8px;}
  .badge-req{display:inline-block;background:rgba(255,84,112,.1);color:var(--danger);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:10px;}
  .badge-ok{display:inline-block;background:rgba(0,212,184,.12);color:var(--ok);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:10px;}
  .badge-warn{display:inline-block;background:rgba(255,159,10,.12);color:#b5730a;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:10px;}
  input[type=file]{display:none;}

  .ai-card{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;}
  .ai-card.severity-none, .ai-card.severity-low{background:#eafbf6;color:#0a6b56;}
  .ai-card.severity-medium{background:#fff6e5;color:#8a5a00;}
  .ai-card.severity-high{background:#fff0f1;color:#a11c30;}

  .loc-status{font-size:12.5px;color:var(--text-mid);margin-top:8px;display:flex;align-items:center;gap:6px;}
  .dot-pulse{width:8px;height:8px;border-radius:50%;background:var(--accent-2);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}

  .review-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f0f6;font-size:13.5px;gap:10px;}
  .review-row span:first-child{color:var(--text-mid);white-space:nowrap;}
  .review-row span:last-child{font-weight:600;text-align:right;}

  .overlay{position:fixed;inset:0;background:rgba(10,12,30,.92);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;}
  .overlay-card{background:#fff;border-radius:20px;padding:30px 24px;max-width:340px;text-align:center;}
  .overlay-card .icon{font-size:40px;margin-bottom:10px;}
  .overlay-card h3{margin:0 0 8px;}
  .overlay-card p{color:var(--text-mid);font-size:13.5px;margin:0 0 20px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1f4d;color:#fff;padding:12px 20px;border-radius:30px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:1000;opacity:0;transition:.3s;pointer-events:none;max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .success-screen{text-align:center;padding:36px 20px;}
  .success-screen .icon{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--accent-2),#00b89f);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:36px;color:#fff;box-shadow:0 15px 30px rgba(0,212,184,.35);}

  .spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .loading-overlay{position:fixed;inset:0;background:rgba(15,18,41,.96);z-index:1200;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:16px;}
  .loading-ring{width:56px;height:56px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--accent-2);border-radius:50%;animation:spin .9s linear infinite;}
  .loader-orb{position:relative;width:92px;height:92px;display:flex;align-items:center;justify-content:center;}
  .loader-orb .ring{position:absolute;inset:0;border-radius:50%;border:3.5px solid transparent;}
  .loader-orb .ring1{border-top-color:var(--accent-2);animation:spin 1.1s linear infinite;}
  .loader-orb .ring2{inset:12px;border-right-color:var(--accent);animation:spin 1.6s linear infinite reverse;}
  .loader-orb .ring3{inset:24px;border-bottom-color:#fff;opacity:.5;animation:spin 2.2s linear infinite;}
  .loader-orb .pct{position:relative;font-size:15px;font-weight:800;letter-spacing:.5px;}
  .loading-bar-track{width:220px;height:6px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:4px;}
  .loading-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s ease;}
  .loading-msg{font-size:14px;opacity:.85;text-align:center;padding:0 30px;}

  .theme-panel{position:fixed;top:60px;right:16px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 20px 40px rgba(0,0,0,.3);z-index:1100;width:180px;}
  .theme-panel h4{margin:0 0 10px;font-size:12.5px;color:var(--text-mid);}
  .swatch-row{display:flex;gap:8px;flex-wrap:wrap;}
  .swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .swatch.active{border-color:#161832;}

  .reports-list{max-height:60vh;overflow-y:auto;}
  .report-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #eee;border-radius:12px;margin-bottom:10px;}
  .report-item .meta{font-size:12px;color:var(--text-mid);}
  .report-item .meta b{color:var(--text-dark);display:block;font-size:13.5px;}
  .mini-btn{padding:7px 11px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-size:11.5px;font-weight:600;cursor:pointer;margin-left:6px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-logo">G</div>
    <div class="brand-text">
      <h1>GCPL Stock Audit</h1>
      <span>Field Audit App</span>
    </div>
  </div>
  <div class="top-actions">
    <div class="version-pill" id="versionPill">v...</div>
    <div class="icon-btn" onclick="showReports()" title="My Reports">🗂️</div>
    <div class="icon-btn" onclick="toggleThemePanel()" title="Theme">🎨</div>
  </div>
</div>

<div class="status-strip" id="statusStrip"></div>
<div class="progress-wrap" id="progressWrap"></div>
<div class="stepper" id="stepper"></div>

<div id="appRoot"></div>
<div id="toast" class="toast"></div>
<div id="themeLayer"></div>

<script>
/* ======================= CONFIG ======================= */
const API_URL = "https://script.google.com/macros/s/AKfycbz7i34IVvrrpbui2SDIgmq-b5-IgSUMPvH1Cfz3HKWwxAF0lYoKOXMyoworr4AL6OxV5Q/exec";

    productRack: "रैक पर उत्पाद किस तरह रखे गए हैं उसकी फोटो लें — व्यवस्था और लेबल साफ़ दिखने चाहिए।",
    tap: "कैमरा खोलने के लिए टैप करें", skip: "छोड़ें (वैकल्पिक)"
  },

    wide: "পিছনে সরে, জুম আউট করে পুরো গুদামটি একটি ফ্রেমে ধরুন।",
    productRack: "র‍্যাকে পণ্যগুলো কীভাবে সাজানো আছে তার ছবি তুলুন — গোছানো ও লেবেল স্পষ্ট দেখাতে হবে।",

  },

    wide: "ପଛକୁ ଯାଇ, ଜୁମ୍ ଆଉଟ୍ କରି ସମ୍ପୂର୍ଣ୍ଣ ଗୋଦାମକୁ ଏକ ଫ୍ରେମ୍‌ରେ ଧରନ୍ତୁ।",

  te: {
    wide: "వెనక్కి జరిగి, జూమ్ అవుట్ చేసి మొత్తం గోడౌన్‌ని ఒకే ఫ్రేమ్‌లో బంధించండి.",

/* ======================= LOADING OVERLAY ======================= */
function showLoading(messages){
  hideLoading();
  const div = document.createElement('div');
  div.className = 'loading-overlay';
  div.id = 'loadingOverlay';
  div.innerHTML = `
    <div class="loader-orb">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>
      <div class="pct" id="loadingPct">0%</div>
    </div>
    <div class="loading-msg" id="loadingMsg">${messages[0]}</div>
    <div class="loading-bar-track"><div class="loading-bar-fill" id="loadingBarFill" style="width:0%;"></div></div>`;
  document.body.appendChild(div);

  let i = 0;
  div._interval = setInterval(()=>{
    i = (i+1) % messages.length;
    const el = document.getElementById('loadingMsg');
    if (el) el.textContent = messages[i];
  }, 1400);

  // Simulated progress — eases toward 92% and holds, then hideLoading()
  // jumps it to 100% right before removal so it always feels complete,
  // never stuck or misleading about real completion.
  let pct = 0;
  div._progressInterval = setInterval(()=>{
    pct += (92 - pct) * 0.12 + 0.4;
    if (pct > 92) pct = 92;
    const p = Math.round(pct);
    const pctEl = document.getElementById('loadingPct');
    const barEl = document.getElementById('loadingBarFill');
    if (pctEl) pctEl.textContent = p + '%';
    if (barEl) barEl.style.width = p + '%';
  }, 220);
}
function hideLoading(){
  const el = document.getElementById('loadingOverlay');
  if (el){
    const pctEl = document.getElementById('loadingPct');
    const barEl = document.getElementById('loadingBarFill');
    if (pctEl) pctEl.textContent = '100%';
    if (barEl) barEl.style.width = '100%';
    clearInterval(el._interval);
    clearInterval(el._progressInterval);
    setTimeout(()=> el.remove(), 150);
  }
}

/* ======================= FORCE LOCATION ======================= */
function requestLocationForce(){
  if (!navigator.geolocation){
    toast("Location is not supported on this device/browser");
    onLocationReady();
    return;
  }

  // Reuse a recent location for this browser session instead of asking again.
  const cached = sessionStorage.getItem('gcpl_location');
  if (cached){
    try{
      const c = JSON.parse(cached);
      if (Date.now() - c.ts < 15 * 60 * 1000){ // 15 minutes
        state.lat = c.lat; state.lng = c.lng;
        state.weatherTemp = c.weatherTemp || "";
        state.weatherDesc = c.weatherDesc || "";
        onLocationReady();
        if (state.weatherTemp === "") fetchWeather();
        return;
      }
    }catch(e){ /* ignore bad cache */ }
  }

  const getPosition = () => {
    showLocationOverlay();
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        removeLocationOverlay();
        state.lat = pos.coords.latitude;
        state.lng = pos.coords.longitude;
        fetchWeather();
        cacheLocation();
        onLocationReady();
      },
      ()=>{ showLocationOverlay(true); },
      { enableHighAccuracy:true, timeout:15000 }
    );
  };

  // If the browser already granted permission, skip the "please allow"
  // messaging and fetch silently — the browser itself won't re-prompt.
  if (navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({ name: 'geolocation' }).then((status)=>{
      if (status.state === 'granted'){
        navigator.geolocation.getCurrentPosition(
          (pos)=>{
            state.lat = pos.coords.latitude;
            state.lng = pos.coords.longitude;
            fetchWeather();
            cacheLocation();
            onLocationReady();
          },
          ()=> getPosition(),
          { enableHighAccuracy:true, timeout:15000 }
        );
      } else {
        getPosition();
      }
    }).catch(getPosition);
  } else {
    getPosition();
  }
}
function cacheLocation(){
  sessionStorage.setItem('gcpl_location', JSON.stringify({
    lat: state.lat, lng: state.lng,
    weatherTemp: state.weatherTemp, weatherDesc: state.weatherDesc, ts: Date.now()
  }));
}
function showLocationOverlay(denied){
  let div = document.getElementById('locOverlay');
  if (!div){
    div = document.createElement('div');

    document.body.appendChild(div);

    <div class="overlay-card">

      <h3>${denied ? "Location Permission Needed" : "Enabling Location..."}</h3>
      <p>${denied
        ? "Location is required before you can start an audit. Please allow location access, then tap Retry."
        : "Please allow location access when your browser asks — this is required to start the audit."}</p>
      ${denied ? `<button class="btn btn-primary" onclick="requestLocationForce()">Retry</button>` : `<div class="loading-ring" style="margin:0 auto;"></div>`}
    </div>`;
}

/* ======================= PHOTO CAPTURE + STAMP (MULTI-VIEW) ======================= */
function onPhotoSelected(input){
  const file = input.files[0];
  if (!file) return;
  const view = PHOTO_VIEWS[state.currentPhotoView];
  showLoading(["Processing photo…", "Compressing for a faster upload…", `Labeling as "${view.label}"…`]);
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      // Downscale large camera photos (often 3000px+) to keep uploads fast.
      const MAX_DIM = 1100;
      let w = img.width, h = img.height;
      if (Math.max(w,h) > MAX_DIM){
        const scale = MAX_DIM / Math.max(w,h);
        w = Math.round(w*scale); h = Math.round(h*scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      // Top banner: auto view label (fast, deterministic — printed immediately).
      const bannerH = Math.max(34, Math.round(h * 0.075));
      ctx.fillStyle = "rgba(111,91,255,0.88)";
      ctx.fillRect(0, 0, w, bannerH);
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.max(14, Math.round(w*0.032))}px sans-serif`;
      ctx.textBaseline = "middle";
      ctx.fillText(`VIEW: ${view.label.toUpperCase()}`, Math.round(w*0.03), bannerH/2);

      // Bottom footer: audit identity + GPS (3 lines, no address).
      const footerH = Math.max(58, Math.round(h * 0.1));
      ctx.fillStyle = "rgba(0,0,0,0.62)";
      ctx.fillRect(0, h - footerH, w, footerH);

      const fontSize = Math.max(13, Math.round(w * 0.024));
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${fontSize}px sans-serif`;
      const padX = Math.round(w * 0.03);
      const rowGap = footerH / 3;

      const line1 = `DB Code: ${state.dbCode || "N/A"}  |  DB Name: ${state.dbName || "N/A"}`;
      const line2 = `Photo by: ${state.soName || "N/A"}  •  Date: ${state.dateOfAudit || "N/A"}`;
      const latStr = state.lat ? Number(state.lat).toFixed(6) : "N/A";
      const lngStr = state.lng ? Number(state.lng).toFixed(6) : "N/A";
      const line3 = `Lat: ${latStr}   Long: ${lngStr}`;

      ctx.fillText(line1, padX, h - footerH + rowGap*0.6);
      ctx.font = `${Math.round(fontSize*0.85)}px sans-serif`;
      ctx.fillText(line2, padX, h - footerH + rowGap*1.6);
      ctx.fillText(line3, padX, h - footerH + rowGap*2.6);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      state.photos[view.key] = { dataUrl, aiAnalysis: null };
      hideLoading();
      render();
      runAiAnalysis(view.key);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ======================= COMPLETION % ======================= */
function computeCompletion(){
  const allFields = REQUIRED_FIELDS.concat(["dbCity","asmName"]).concat(QUANTITY_FIELDS);
  const filled = allFields.filter(f => String(state[f]||"").trim() !== "").length;
  const mandatoryPhotoDone = state.photos.wide && state.photos.wide.dataUrl ? 1 : 0;
  const total = allFields.length + 1;
  const done = filled + mandatoryPhotoDone;
  return Math.round((done/total)*100);
}

/* ======================= SUBMIT ======================= */
async function submitAudit(){
  if (state.submitting) return;
  state.submitting = true; render();
  showLoading(["Uploading your photos…", "Saving audit to the sheet…", "Almost done…"]);

  try{
    // Upload all 4 views in parallel — much faster than one-by-one.
    const uploadPromises = PHOTO_VIEWS.map(v => {
      const photo = state.photos[v.key];
      if (!photo) return Promise.resolve({ key: v.key, url: "" });
      return fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "uploadPhoto",
          payload: {
            imageBase64: photo.dataUrl,
            dbCode: state.dbCode, dbName: state.dbName,
            soName: state.soName, dateOfAudit: state.dateOfAudit,
            viewLabel: v.label
          }
        })
      }).then(r=>r.json()).then(d => ({ key: v.key, url: d.ok ? d.photoUrl : "", error: d.ok ? null : d.error }));
    });
    const uploadResults = await Promise.all(uploadPromises);
    const photoUrls = {};
    uploadResults.forEach(r => {
      photoUrls[r.key] = r.url;
      if (r.error) console.error(`Photo upload failed (${r.key}):`, r.error);
    });
    const failedCount = uploadResults.filter(r=>!r.url).length;
    if (failedCount > 0){
      toast(`${failedCount} photo(s) failed to upload to Drive — report will save with the links that succeeded`);
    }

    // Primary photo link (existing single "Photo Link" column) is the
    // mandatory wide/complete view; the optional rack view goes into
    // its own new "Photo Link - Product Rack" column.
    const payload = Object.assign({}, state, {
      photoUrl: photoUrls.wide || "",
      photoUrlProductRack: photoUrls.productRack || ""
    });
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "submit", payload })
    });
    const data = await res.json();
    if (data.ok){
      state.step = 5;
      hideLoading();
      state.submitting = false;
      render();
      // Generate the PDF in the background so the success screen shows
      // immediately — the heavy PDF/image work no longer blocks submit.
      setTimeout(()=>{ generateAndStorePdf(); render(); }, 30);
      return;
    } else {
      toast("Error: " + (data.error || "Submit failed"));
    }
  }catch(err){
    toast("Network error — please try again");
  }
  hideLoading();
  state.submitting = false;
  render();
}

function dataUrlToBlob(dataUrl){
  const [header, base64] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function shareReport(dataUrl, fileName){
  try{
    const blob = dataUrlToBlob(dataUrl);
    const file = new File([blob], fileName, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Stock Audit Report', text: 'GCPL Stock Audit Report' });
    } else {
      toast("Sharing not supported on this browser — downloading instead");
      downloadReport(dataUrl, fileName);
    }
  }catch(e){ /* user cancelled or unsupported */ }
}
function downloadReport(dataUrl, fileName){
  const a = document.createElement('a');
  a.href = dataUrl; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ======================= MY REPORTS ======================= */
function showReports(){
  const reports = JSON.parse(localStorage.getItem('gcpl_reports') || "[]");
  const root = document.getElementById('appRoot');
  document.getElementById('themeLayer').innerHTML = "";
  root.innerHTML = `
    <div class="card">
      <h2>My Reports</h2>
      <p class="sub">Previously generated audit PDFs, saved on this device</p>
      <div class="reports-list">
        ${reports.length === 0 ? '<p class="sub">No reports yet — submit an audit to generate one.</p>' :
          reports.map((r,i)=>`
            <div class="report-item">
              <div class="meta"><b>${r.dbCode} — ${r.dbName||''}</b>${r.date||''}</div>
              <div>
                <button class="mini-btn" onclick='downloadReport(${JSON.stringify(r.dataUrl)},${JSON.stringify(r.fileName)})'>Download</button>
                <button class="mini-btn" onclick='shareReport(${JSON.stringify(r.dataUrl)},${JSON.stringify(r.fileName)})'>Share</button>
              </div>
            </div>`).join('')}
      </div>
      <button class="btn btn-ghost" style="margin-top:14px;" onclick="render()">Back to Audit</button>
    </div>`;
}

/* ======================= FIELD BINDING ======================= */
function bind(key){ return `oninput="state.${key}=this.value;renderProgress();"`; }

/* ======================= DB CODE VALIDATION ======================= */
// DB Code must always be a plain numeric value — never text — and
// exactly 7 digits, no more, no less.
function onDbCodeInput(el){
  // Strip anything that isn't a digit as the user types (blocks text
  // entirely, not just at submit time).
  const digitsOnly = el.value.replace(/[^0-9]/g, "").slice(0, 7);
  el.value = digitsOnly;
  state.dbCode = digitsOnly;
  renderStep1Validation();
  renderProgress();
}
function isValidDbCode(code){
  return /^[0-9]{7}$/.test(String(code||"").trim());
}
function dbCodeErrorMessage(code){
  const len = String(code||"").trim().length;
  if (len < 7) return `DB Code must be exactly 7 digits (currently ${len}).`;
  if (len > 7) return `DB Code must be exactly 7 digits (currently ${len}) — too long.`;
  return "DB Code must contain only numbers.";
}
// Re-render just the DB Code field's error state without losing focus
// on other fields (avoids re-rendering the whole step on every keystroke).
function renderStep1Validation(){
  if (state.step !== 1) return;
  const input = document.querySelector('input[oninput^="onDbCodeInput"]');
  if (!input) return;
  const valid = !state.dbCode || isValidDbCode(state.dbCode);
  input.style.borderColor = valid ? '' : 'var(--danger)';
  input.style.background = valid ? '' : '#fff5f6';
  let errEl = input.parentElement.querySelector('.dbcode-error');
  if (!valid){
    if (!errEl){
      errEl = document.createElement('div');
      errEl.className = 'dbcode-error';
      errEl.style.cssText = 'color:var(--danger);font-size:12px;margin-top:5px;';
      input.insertAdjacentElement('afterend', errEl);
    }
    errEl.textContent = dbCodeErrorMessage(state.dbCode);
  } else if (errEl){
    errEl.remove();
  }
}

/* ======================= RENDER ======================= */
function render(){
  renderStepper();
  renderProgress();
  renderStatusStrip();
  const root = document.getElementById('appRoot');
  if (state.step === 1) root.innerHTML = stepDetails();
  else if (state.step === 2) root.innerHTML = stepQuantities();
  else if (state.step === 3) root.innerHTML = stepPhoto();
  else if (state.step === 4) root.innerHTML = stepReview();
  else if (state.step === 5) root.innerHTML = stepSuccess();
}

function renderStatusStrip(){
  const strip = document.getElementById('statusStrip');
  if (!strip) return;
  if (state.step >= 5){ strip.innerHTML = ""; return; }
  const coordsText = state.lat ? `${Number(state.lat).toFixed(6)}, ${Number(state.lng).toFixed(6)}` : "Locating…";
  strip.innerHTML = `
    <div class="status-chip">
      <span>📍</span>
      <div><div class="big" style="font-size:12.5px;">${coordsText}</div><small>Current Location (GPS)</small></div>
    </div>
    <div class="status-chip">
      <span>🌤️</span>
      <div><div class="big">${state.weatherTemp !== "" ? state.weatherTemp + "°C" : "—"}</div><small>${state.weatherDesc || "Weather"}</small></div>
    </div>`;
}

function renderProgress(){
  const wrap = document.getElementById('progressWrap');
  if (!wrap) return;
  if (state.step >= 5){ wrap.innerHTML = ""; return; }
  const pct = computeCompletion();
  wrap.innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <div class="progress-label"><span>Audit Completion</span><span>${pct}%</span></div>`;
}

function renderStepper(){
  const s = document.getElementById('stepper');
  if (state.step >= 5){ s.innerHTML = ""; return; }
  s.innerHTML = "";
  for (let i=1;i<=TOTAL_STEPS;i++){
    const d = document.createElement('div');
    d.className = 'step-dot' + (i <= state.step ? ' active' : '');
    s.appendChild(d);
  }
}

function stepDetails(){
  return `
  <div class="card">
    <h2>Audit Details</h2>
    <p class="sub">Enter distributor and audit basics</p>
    ${state.lastAudit ? `
      <div class="last-audit-card">
        <b>Last audit for this DB:</b> ${state.lastAudit["Date of Audit"] || "—"}<br/>
        ATTA: <b>${state.lastAudit["ATTA (Bags ONLY)"]||0}</b> · MAIDA: <b>${state.lastAudit["MAIDA (BAGS)"]||0}</b> · SOOJI: <b>${state.lastAudit["SOOJI (BAGS)"]||0}</b>
      </div>` : ''}
    <div class="field"><label>Date of Audit</label>
      <input type="date" value="${state.dateOfAudit}" ${bind('dateOfAudit')} /></div>
    <div class="field"><label>DB Code * <span style="font-weight:400;color:var(--text-mid);">(numeric, exactly 7 digits)</span></label>
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="7"
        value="${state.dbCode}" oninput="onDbCodeInput(this)" onblur="fetchLastAudit()"
        placeholder="e.g. 1002035"
        style="${state.dbCode && !isValidDbCode(state.dbCode) ? 'border-color:var(--danger);background:#fff5f6;' : ''}" />
      ${state.dbCode && !isValidDbCode(state.dbCode) ? `<div style="color:var(--danger);font-size:12px;margin-top:5px;">${dbCodeErrorMessage(state.dbCode)}</div>` : ''}
    </div>
    <div class="field"><label>DB Name *</label>
      <input type="text" value="${state.dbName}" ${bind('dbName')} placeholder="Distributor name" /></div>
    <div class="field"><label>DB City/Town</label>
      <input type="text" value="${state.dbCity}" ${bind('dbCity')} /></div>
    <div class="field"><label>SO Name *</label>
      <input type="text" value="${state.soName}" ${bind('soName')} /></div>
    <div class="field"><label>ASM/ASE Name</label>
      <input type="text" value="${state.asmName}" ${bind('asmName')} /></div>
    <button class="btn btn-primary" onclick="goNext()">Continue</button>
  </div>`;
}

function stepQuantities(){
  const bags = [["atta","ATTA (Bags)"],["maida","MAIDA (Bags)"],["sooji","SOOJI (Bags)"],
    ["sattu","SATTU (Bags)"],["besan","BESAN (Bags)"],["dalia","DALIA (Bags)"],
    ["others","OTHERS (Bags)"],["spicesTotal","Spices Total (Bags)"]];
  const spices = [["haldi","Haldi Powder (Kgs)"],["chili","Chili Powder (Kgs)"],
    ["dhania","Dhania Powder (Kgs)"],["jeeraPowder","Jeera Powder (Kgs)"],
    ["jeeraWhole","Jeera Whole (Kgs)"],["panchForon","Panch Foron Whole (Kgs)"],
    ["methi","Methi Whole (Kgs)"],["ajwain","Ajawan Whole (Kgs)"],["saunf","Saunf Whole (Kgs)"],
    ["sarson","Sarson Whole (Kgs)"],["shahiGaramMasala","Shahi Garam Masala (Kgs)"],
    ["chickenMasala","Chicken Masala (Kgs)"],["meatMasala","Meat Masala (Kgs)"],
    ["kashmiriMirch","Kashmiri Mirch (Kgs)"],["kalajeera","Kalajeera Whole (Kgs)"]];

  const field = ([k,label]) => `
    <div class="field"><label>${label}</label>
      <input class="qty-input" type="number" min="0" inputmode="decimal" value="${state[k]}"
        oninput="onQtyInput('${k}', this)" placeholder="0" /></div>`;

  return `
  <div class="card">
    <h2>Stock Quantities</h2>
    <p class="sub">Enter bag and spice quantities — the app auto-advances to the next field as you type</p>
    <div class="section-label">Bags</div>
    <div class="grid2">${bags.map(field).join('')}</div>
    <div class="section-label">Spices (Kgs)</div>
    <div class="grid2">${spices.map(field).join('')}</div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goBack()">Back</button>
      <button class="btn btn-primary" onclick="goNext()">Continue</button>
    </div>
  </div>`;
}

function aiCardHtml(analysis){
  if (!analysis) return '';
  if (analysis.loading) return `<div class="ai-card severity-low"><span>🤖</span><span><span class="spinner" style="border-top-color:#0a6b56;border-color:rgba(10,107,86,.3);"></span>Analyzing this view (hygiene, space, product placement)…</span></div>`;
  if (analysis.skipped) return '';
  const a = analysis;
  const sev = (a.severity || "None").toLowerCase();
  return `<div class="ai-card severity-${sev}">
    <span>🤖</span>
    <span>
      <b>AI Check (${a.severity || 'None'}):</b> ${a.summary || 'No issues detected'}<br/>
      <span style="opacity:.85;">
        Hygiene: <b>${a.hygieneScore != null ? a.hygieneScore+'/10' : '—'}</b> ·
        ${a.cleanliness || '—'} ·
        ${a.congested ? 'Congested' : 'Not congested'} ·
        ${a.spacious ? 'Spacious' : 'Tight space'}
        ${a.approxAreaSqft ? ' · ~' + a.approxAreaSqft + ' sqft' : ''}
      </span><br/>
      ${a.recommendedAction ? `<span style="opacity:.85;">Action: ${a.recommendedAction}</span>` : ''}
    </span>
  </div>`;
}

function stepPhoto(){
  const idx = state.currentPhotoView;
  const view = PHOTO_VIEWS[idx];
  const photo = state.photos[view.key];
  const lang = loadGuideLang();
  const guide = (GUIDE_TEXT[lang] || GUIDE_TEXT.en)[view.key];
  const tapText = (GUIDE_TEXT[lang] || GUIDE_TEXT.en).tap;
  const skipText = (GUIDE_TEXT[lang] || GUIDE_TEXT.en).skip;

  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <h2>Godown Photo${view.mandatory ? '' : ' (Optional)'} (${idx+1} of ${PHOTO_VIEWS.length})</h2>
        <p class="sub" style="margin-bottom:8px;">Live camera only — gallery upload is not allowed.</p>
      </div>
      <select onchange="setGuideLang(this.value)" style="border-radius:10px;border:1.5px solid #e7e8f2;padding:6px 8px;font-size:12px;background:#fafaff;">
        ${GUIDE_LANGUAGES.map(l=>`<option value="${l.code}" ${l.code===lang?'selected':''}>${l.name}</option>`).join('')}
      </select>
    </div>

    <div class="stepper" style="padding:0 0 14px;">
      ${PHOTO_VIEWS.map((v,i)=>`<div class="step-dot" style="background:${state.photos[v.key] ? 'var(--accent-2)' : (i===idx ? 'var(--accent)' : '#e7e8f2')};"></div>`).join('')}
    </div>

    <div style="background:#f5f4ff;border:1px solid #e4e1ff;border-radius:14px;padding:12px 14px;margin-bottom:14px;">
      <b style="color:var(--accent);">📷 ${view.label}${view.mandatory ? '' : ' — Optional'}</b>
      <p style="margin:6px 0 0;font-size:12.5px;color:var(--text-mid);">${guide}</p>
    </div>

    ${photo ? '<span class="badge-ok">✓ Captured</span>' : (view.mandatory ? '<span class="badge-req">Required</span>' : '<span class="badge-warn">Optional</span>')}

    <label for="photoInput">
      <div class="photo-box ${photo ? 'has-photo':''}">
        ${photo
          ? `<img src="${photo.dataUrl}" />`
          : `<div class="photo-icon">📷</div><div>${tapText}</div>`}
      </div>
    </label>
    <input id="photoInput" type="file" accept="image/*" capture="environment"
      onchange="onPhotoSelected(this)" />

    ${photo ? aiCardHtml(photo.aiAnalysis) : ''}

    <div style="background:#101330;border-radius:14px;padding:12px 14px;margin-top:12px;color:#fff;">
      <div style="display:flex;align-items:center;gap:6px;font-size:13px;">
        <span class="dot-pulse"></span>
        <b>${state.lat ? `Lat: ${Number(state.lat).toFixed(6)}  ·  Long: ${Number(state.lng).toFixed(6)}` : 'Fetching current location…'}</b>
      </div>
      <div style="font-size:11px;opacity:.65;margin-top:5px;">Current GPS location — captured automatically</div>
    </div>

    <div class="btn-row" style="margin-top:18px;">
      <button class="btn btn-ghost" onclick="${idx===0 ? 'goBack()' : 'prevPhotoView()'}">Back</button>
      ${!view.mandatory && !photo ? `<button class="btn btn-outline" onclick="skipCurrentPhotoView()">${skipText}</button>` : ''}
      ${idx < PHOTO_VIEWS.length - 1
        ? `<button class="btn btn-primary" onclick="nextPhotoView()" ${photo?'':'disabled'}>Next</button>`
        : `<button class="btn btn-primary" onclick="goNext()" ${allPhotosCaptured()?'':'disabled'}>Continue</button>`}
    </div>
  </div>`;
}

function stepReview(){
  const rows = [
    ["Date", state.dateOfAudit], ["DB Code", state.dbCode], ["DB Name", state.dbName],
    ["City", state.dbCity], ["SO Name", state.soName], ["ASM/ASE", state.asmName],
    ["Coordinates", state.lat ? `${Number(state.lat).toFixed(6)}, ${Number(state.lng).toFixed(6)}` : "—"], ["Weather", state.weatherTemp !== "" ? `${state.weatherTemp}°C, ${state.weatherDesc}` : "—"]
  ];
  return `
  <div class="card">
    <h2>Review & Submit</h2>
    <p class="sub">Please confirm everything is correct</p>
    ${rows.map(([k,v])=>`<div class="review-row"><span>${k}</span><span>${v||'—'}</span></div>`).join('')}
    <div class="section-label">Godown Photos</div>
    <div class="grid2">
      ${PHOTO_VIEWS.map(v => state.photos[v.key] ? `
        <div>
          <img src="${state.photos[v.key].dataUrl}" style="width:100%;border-radius:10px;" />
          <div style="font-size:11px;color:var(--text-mid);margin-top:4px;text-align:center;">${v.label}</div>
        </div>` : '').join('')}
    </div>
    <div class="btn-row" style="margin-top:18px;">
      <button class="btn btn-ghost" onclick="goBack()" ${state.submitting?'disabled':''}>Back</button>
      <button class="btn btn-primary" onclick="submitAudit()" ${state.submitting?'disabled':''}>
        ${state.submitting ? '<span class="spinner"></span>Submitting…' : 'Submit Audit'}
      </button>
    </div>
  </div>`;
}

function stepSuccess(){
  const pdf = state._lastPdf;
  return `
  <div class="card success-screen">
    <div class="icon">✓</div>
    <h2>Audit Submitted</h2>
    <p class="sub">Your report and photo have been saved successfully. A PDF report has also been saved to your device.</p>
    ${pdf ? `
      <div class="btn-row" style="margin-bottom:12px;">
        <button class="btn btn-outline" onclick='downloadReport(${JSON.stringify(pdf.pdfDataUrl)},${JSON.stringify(pdf.fileName)})'>Download PDF</button>
        <button class="btn btn-outline" onclick='shareReport(${JSON.stringify(pdf.pdfDataUrl)},${JSON.stringify(pdf.fileName)})'>Share PDF</button>
      </div>` : ''}
    <button class="btn btn-primary" onclick="resetForm()">Start New Audit</button>
  </div>`;
}

function resetForm(){
  const keepDate = new Date().toISOString().slice(0,10);
  const lat = state.lat, lng = state.lng;
  const wt = state.weatherTemp, wd = state.weatherDesc;
  state = Object.assign({}, state, {
    step:1, dbCode:"", dbName:"", dbCity:"", soName:"", asmName:"",
    atta:"", maida:"", sooji:"", sattu:"", besan:"", dalia:"", others:"", spicesTotal:"",
    haldi:"", chili:"", dhania:"", jeeraPowder:"", jeeraWhole:"", panchForon:"",
    methi:"", ajwain:"", saunf:"", sarson:"", shahiGaramMasala:"", chickenMasala:"",
    meatMasala:"", kashmiriMirch:"", kalajeera:"",
    photos:{}, currentPhotoView:0, dateOfAudit: keepDate,
    lat, lng, weatherTemp:wt, weatherDesc:wd, lastAudit:null
  });
  render();
}

/* ======================= INIT ======================= */
loadTheme();
checkVersion();
requestLocationForce();
render();
</script>
