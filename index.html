// Outlook desktop (Word engine) and several mail clients ignore CSS colour on table
// cells — the text then shows up in the client's default colour. Every cell that
// sets a colour also gets an old-style <font color> / <b> wrapper, which every
// client honours, so text and fills look the same on the receiver's machine.
function hardenEmailHtml_(html){
  return html.replace(/<(td|th)\b([^>]*)>([^]*?)<\/\1>/g, (m,tag,attrs,inner)=>{
    const st = (attrs.match(/style="([^"]*)"/)||[])[1]||'';
    const cm = Array.from(st.matchAll(/(?:^|;)\s*color:\s*(#[0-9a-fA-F]{3,6})/g)); const col = cm.length ? cm[cm.length-1][1] : undefined;
    if(!col) return m;
    let body = inner;
    if(/font-weight:\s*bold/.test(st) && !/^<b[ >]/.test(body)) body = '<b>'+body+'</b>';
    const px = Number((st.match(/font-size:\s*(\d+)px/)||[])[1])||12;
    return `<${tag}${attrs}><font color="${col}" face="Calibri, Arial, sans-serif" size="${px>=15?4:2}">${body}</font></${tag}>`;
  });
}
function buildEmailStockHtml(rows, mode){ return hardenEmailHtml_(buildEmailStockHtmlRaw_(rows, mode)); }

// Plain-language names for each comparison finding. wrong:true = an MFD / stock entry that is probably incorrect.
const CMP_TYPES_ = {
  'Same qty, MFD changed': {label:'Same stock, MFD changed', score:3, wrong:true},
  'Older MFD appeared':    {label:'Older batch appeared',    score:2, wrong:true},
  'Batch qty increased':   {label:'Batch stock went up',     score:2, wrong:true},
  'MFD missing':           {label:'MFD left blank',          score:2, wrong:true},
  'MFD changed':           {label:'MFD changed',             score:1, wrong:true},
  'Big qty swing':         {label:'Big stock swing',         score:0, wrong:false},
  'Far from SAP qty':      {label:'Far from SAP stock',      score:0, wrong:false},
};
const CMP_ACTION_ = {
  'Same qty, MFD changed': 'Stock is unchanged but the MFD is different. Check the MFD printed on the pack and re-submit the correct one.',
  'Older MFD appeared':    'An older batch appeared behind newer stock. Check the MFD on the pack and re-submit.',
  'Batch qty increased':   'Batch stock went up without a new batch. Check the quantity and the MFD.',

function cmlCnfCodes_(){
  const valid = state.masters.cnfs.filter(c=>latestSubmissionFor(c.code) && !isDemoCnf(c)).map(c=>c.code);
  if(!state.cmlCnfSel) return valid;
  const s = new Set(state.cmlCnfSel); return valid.filter(c=>s.has(c));
}
// Works out, per CNF, how many products were compared and how many look wrongly entered.
function cmpEmailStats_(rep, cnfCodes){
  const stats = {};
  const get = code => stats[code] || (stats[code] = {code, wrong:new Set(), review:new Set(), types:{}, score:0, compared:rep.pairsByCnf[code]||0, firstPrev:null, lastCur:null});
  Object.keys(rep.pairsByCnf).forEach(get);
  rep.out.forEach(x=>{
    const st = get(x.cur.sub.cnfCode);
    x.flags.forEach(f=>{
      const info = CMP_TYPES_[f.type]; if(!info) return;
      if(info.wrong){ st.wrong.add(x.cur.code); st.types[f.type] = (st.types[f.type]||0)+1; st.score += info.score; }
      else st.review.add(x.cur.code);
    });
    if(!st.firstPrev || x.prev.sub.date < st.firstPrev.date) st.firstPrev = x.prev.sub;
    if(!st.lastCur || new Date(x.cur.sub.timestamp) > new Date(st.lastCur.timestamp)) st.lastCur = x.cur.sub;
  });
  const list = Object.values(stats).filter(s=>s.compared>0 && (!cnfCodes || cnfCodes.has(String(s.code)))).map(s=>{
    const pct = s.compared ? s.wrong.size/s.compared*100 : 0;
    s.pct = pct; s.level = s.wrong.size===0 ? 'Clean' : pct>=30 ? 'High' : pct>=10 ? 'Medium' : 'Low';
    const c = state.masters.cnfs.find(cc=>String(cc.code)===String(s.code)); s.name = c ? c.name : s.code;
    return s;
  });
  list.sort((a,b)=> (b.pct-a.pct) || (b.wrong.size-a.wrong.size) || (b.score-a.score) || String(a.name).localeCompare(String(b.name))); // worst = highest % of compared products wrong
  return list;
}

  const worst = bad[0];

    bad.forEach((s,i)=>{
      const bg = i%2 ? '#f6f8fa' : '#ffffff', sv = SEV[s.level], t = s.types;

      top += `<tr><td bgcolor="${bg}" align="center" style="${TD}background:${bg};text-align:center;font-weight:bold;">${i+1}</td>`
        + `<td bgcolor="${bg}" style="${TD}background:${bg};font-weight:bold;">${E(s.name)} &middot; ${E(String(s.code))}</td>`
        + `<td bgcolor="${bg}" style="${TD}background:${bg};">${E(s.lastCur?subBy(s.lastCur):'')}</td>`
        + `<td bgcolor="${bg}" align="center" style="${TD}background:${bg};text-align:center;">${s.compared}</td>`
        + `<td bgcolor="${bg}" align="center" style="${TD}background:${bg};text-align:center;font-weight:bold;">${s.wrong.size}</td>`
        + `<td bgcolor="${bg}" align="center" style="${TD}background:${bg};text-align:center;font-weight:bold;">${Math.round(s.pct)}%</td>`
        + num(t['Same qty, MFD changed']) + num(t['Batch qty increased']) + num(t['Older MFD appeared']) + num((t['MFD missing']||0)+(t['MFD changed']||0))
        + `<td bgcolor="${sv.bg}" align="center" style="${TD}background:${sv.bg};color:${sv.fg};font-weight:bold;text-align:center;">${sevLbl(s.level)}</td></tr>`;
    });
    top += `</table><table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;width:100%;margin:4px 0 8px 0;"><tr><td bgcolor="#eef3f8" style="background:#eef3f8;color:#1f3a5f;border-left:4px solid #1f3a5f;padding:5px 9px;font-size:11px;${F}"><b>Suspicion</b> = share of compared products with a wrong MFD entry: <b>High</b> 30% or more &middot; <b>Medium</b> 10% to 30% &middot; <b>Normal</b> below 10%. <b>Same stock, MFD changed</b> is the strongest sign &mdash; the stock did not change, so one of the two MFD entries must be wrong.</td></tr></table>`;

      + `</table><table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;width:100%;margin:4px 0 8px 0;"><tr><td bgcolor="#eef3f8" style="background:#eef3f8;color:#1f3a5f;border-left:4px solid #1f3a5f;padding:5px 9px;font-size:11px;${F}">If a product has more than one finding, its Severity is the <b>highest</b> of them.</td></tr></table>`;
  }
  const clean = stats.filter(s=>s.wrong.size===0);
  if(clean.length) top += `<table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;width:100%;margin:2px 0 8px 0;"><tr><td bgcolor="#e6f4ea" style="background:#e6f4ea;color:#1e5b2b;border-left:4px solid #1e8449;padding:5px 9px;font-size:11px;${F}"><b>No wrong MFD found (${clean.length}):</b> ${clean.map(s=>E(s.name)).join(', ')}</td></tr></table>`;

  /* ---- 3. product-wise details per CNF, with merged cells ---- */
  const parts = [];
  const details = [];
  if(o.detail!=='summary'){
    const groups = new Map();
    rep.out.forEach(x=>{
      const code = String(x.cur.sub.cnfCode); if(o.cnfCodes && !o.cnfCodes.has(code)) return;
      const k = code+'|'+x.cur.code;
      const g = groups.get(k) || {cnfCode:code, code:x.cur.code, name:x.cur.name, snaps:new Map(), curIds:new Set(), flags:[]};
      g.snaps.set(x.prev.sub.id, x.prev); g.snaps.set(x.cur.sub.id, x.cur); g.curIds.add(x.cur.sub.id); g.flags.push(...x.flags);

    const sideTable_ = (s, items)=>{
      const heads = ['#','Product','Last submission<br>MFD &middot; stock','Recent submission<br>MFD &middot; stock','Total stock (kg)<br>Last &rarr; Recent','Severity','Action required'];
      const widths = [28,165,150,160,118,66,250];
      let h = `<table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;width:100%;margin-top:12px;"><tr><td bgcolor="#2c3e50" style="background:#2c3e50;color:#ffffff;padding:6px 8px;font-size:13px;font-weight:bold;${F}">${E(s.name)} &middot; ${E(String(s.code))} &nbsp;|&nbsp; Last submission ${E(fmtD(s.firstPrev.date))} &rarr; Recent submission ${E(fmtD(s.lastCur.date))} &nbsp;|&nbsp; Stock Submitted by ${E(subBy(s.lastCur))} &nbsp;|&nbsp; ${items.length} product(s) to check</td></tr></table>`
        + `<table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;width:100%;"><tr>${heads.map((x,i)=>`<th width="${widths[i]}" style="${TH}">${x}</th>`).join('')}</tr>`;
      items.forEach((it,i)=>{

        const sc = CMP_SEVERITY_COLORS[sev];

        const anyBad = snap => Object.keys(snap.batches).some(m=>{ const lv = lvl(snap,m); return lv && (lv!=='review' || o.includeReview); });

        const types = []; it.g.flags.forEach(f=>{ if(CMP_TYPES_[f.type] && (CMP_TYPES_[f.type].wrong || o.includeReview) && !types.includes(f.type)) types.push(f.type); });

        const action = types.slice(0,2).map(t=>CMP_ACTION_[t]).join(' ');
        h += `<tr><td bgcolor="${bg}" align="center" valign="top" style="${TD}background:${bg};text-align:center;vertical-align:top;font-weight:bold;">${i+1}</td>`
          + `<td bgcolor="${bg}" valign="top" style="${TD}background:${bg};vertical-align:top;"><b>${E(it.g.name)}</b><br><font color="#5a6772" size="1">Code ${E(String(it.g.code))}</font><br><font color="#8a1f11"><b>${E(it.verdict)}</b></font></td>`
          + `<td bgcolor="${lastBg}" valign="top" style="${TD}background:${lastBg};vertical-align:top;">${lines(prev)}<br><font color="#5a6772" size="1">${E(fmtD(prev.sub.date))} &middot; by ${E(subBy(prev.sub))}</font></td>`
          + `<td bgcolor="${recBg}" valign="top" style="${TD}background:${recBg};vertical-align:top;">${lines(cur)}<br><font color="#5a6772" size="1">${E(fmtD(cur.sub.date))} &middot; by ${E(subBy(cur.sub))}</font></td>`

    };
    const orderedCnf = stats.filter(s=>byCnf.has(String(s.code)));

      if(o.layout!=='merged'){ details.push({html:sideTable_(s, items), rows:nRows, name:s.name}); return; }
      const heads = ['Product','Submission','MFD','Stock (kg)','Check','What is wrong'];
      const widths = [170,112,82,64,142,300];
      let h = `<table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;width:100%;margin-top:12px;"><tr><td bgcolor="#2c3e50" style="background:#2c3e50;color:#ffffff;padding:6px 8px;font-size:13px;font-weight:bold;${F}">${E(s.name)} &middot; ${E(String(s.code))} &nbsp;|&nbsp; Last submission ${E(fmtD(s.firstPrev.date))} &rarr; Recent submission ${E(fmtD(s.lastCur.date))} &nbsp;|&nbsp; Stock Submitted by ${E(subBy(s.lastCur))} &nbsp;|&nbsp; ${items.length} product(s) to check</td></tr></table>`
        + `<table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;width:100%;"><tr>${heads.map((x,i)=>`<th width="${widths[i]}" style="${TH}">${x}</th>`).join('')}</tr>`;
      items.forEach((it,pi)=>{
        const bg = pi%2 ? '#f6f8fa' : '#ffffff';
        const bySnap = [];
        it.snapList.forEach(snap=>{ bySnap.push({snap, rows: it.rowsMeta.filter(r=>r.snap===snap)}); });
        let first = true;
        bySnap.forEach((bs,si)=>{

            h += '<tr>';
            if(first){
              h += `<td rowspan="${it.rowsMeta.length}" valign="top" bgcolor="${bg}" style="${TD}background:${bg};vertical-align:top;"><b>${E(it.g.name)}</b><br><font color="#5a6772" size="1">Code ${E(String(it.g.code))}</font><br><font color="#8a1f11"><b>${E(it.verdict)}</b></font></td>`;

            if(ri===0){
              h += `<td rowspan="${bs.rows.length}" valign="top" bgcolor="${sBg}" style="${TD}background:${sBg};vertical-align:top;"><b>${isFirstSnap?'Last submission':'Recent submission'}</b><br>${E(stamp(bs.snap.sub))}<br><font color="#5a6772" size="1">by ${E(subBy(bs.snap.sub))}</font></td>`;
            }
            const ui = r.mk ? LEVEL_UI[r.mk.level] : null;
            const showUi = ui && (r.mk.level!=='review' || o.includeReview);
            const ck = showUi ? ui : {label:'&#10004; OK', bg:'#dff0e0', fg:'#1e5b2b'};
            const mfdBg = showUi ? ck.bg : bg;
            h += `<td bgcolor="${mfdBg}" style="${TD}background:${mfdBg};${showUi?`color:${ck.fg};font-weight:bold;`:''}white-space:nowrap;">${E(fmtD(r.m))}</td>`
              + `<td bgcolor="${bg}" align="right" style="${TD}background:${bg};text-align:right;">${E((Math.round(bs.snap.batches[r.m]*10)/10).toLocaleString('en-IN'))}</td>`
              + `<td bgcolor="${ck.bg}" style="${TD}background:${ck.bg};color:${ck.fg};font-weight:bold;">${ck.label}</td>`
              + `<td bgcolor="${bg}" style="${TD}background:${bg};">${showUi ? E(dmyText_(r.mk.issues.join('; '))) : ''}</td></tr>`;
          });
        });
      });
      h += `</table>`;
      details.push({html:h, rows:nRows, name:s.name});
    });
  }
  /* ---- split into parts ---- */
  const MAXROWS = o.maxRows || 90;
  let cur = top, curRows = 0, curNames = [];
  const flush = last => { parts.push({html: cur + (last?'':'') + `</div>`, names:curNames.slice()}); cur = `<div style="${F}color:#1f2933;background:#ffffff;">`; curRows = 0; curNames = []; };
  details.forEach(d=>{
    if(curRows && curRows + d.rows > MAXROWS) flush();
    cur += d.html; curRows += d.rows; curNames.push(d.name);
  });
  flush(true);
  return {parts: parts.map(p=>hardenEmailHtml_(p.html)), partNames: parts.map(p=>p.names), stats, nWrong, nCompared, nBad: bad.length};
}

async function copyEmailHtml_(html){
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ')],{type:'text/plain'})})]);
      return true;
    }
  }catch(e){}
  try{
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;left:-99999px;top:0;background:#fff;';
    setHtml_(el, html); document.body.appendChild(el);
    const r = document.createRange(); r.selectNodeContents(el);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    const ok = document.execCommand('copy'); sel.removeAllRanges(); el.remove(); return ok;
  }catch(e){ return false; }
}
// A huge table makes Outlook freeze on paste, so a big report is split into parts of
// roughly maxLines lines each (whole CNFs stay together) — copy and paste one part at a time.
function splitRowsForPaste_(rows, maxLines){
  const byCnf = {}; rows.forEach(r=>{ (byCnf[r.cnf.code] = byCnf[r.cnf.code] || []).push(r); });
  const w = list=>list.filter(emailShow_).length;
  const parts = []; let cur = [];
  Object.values(byCnf).sort((a,b)=>String(a[0].cnf.name).localeCompare(String(b[0].cnf.name))).forEach(list=>{
    if(cur.length && w(cur) + w(list) > maxLines){ parts.push(cur); cur = []; }
    cur = cur.concat(list);
  });
  if(cur.length) parts.push(cur);
  return parts;
}

/* ---------------- Toast ---------------- */
function showToast(msg, onClick){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  if(onClick){
    t.style.cursor = 'pointer';
    t.style.textDecoration = 'underline';
    t.title = 'Tap for details';
    t.onclick = ()=>{ t.remove(); onClick(); };
    setTimeout(()=>{ if(t.parentNode) t.remove(); }, 6000); // longer window since there's something to tap
  }else{
    setTimeout(()=>t.remove(), 2400);
  }
  document.body.appendChild(t);
}

    // waiting for. Splitting it tells apart the two very different
    // failures: the script never answering at all (wrong/dead URL, or
    // access not set to "Anyone") versus answering fine but being slow to
    // read the Sheet.
    let stepLabel = 'Step 1/2 — contacting the server';
    const t0 = Date.now();
    const paint = ()=>{ result.textContent = `Testing… ${stepLabel} (${Math.round((Date.now()-t0)/1000)}s)`; };
    paint();
    const timer = setInterval(paint, 500);
    let pingMs = null;
    try{
      const testCall = (a,pr,o)=> isSupabaseUrl(getApiUrl()) ? supabaseCall(a,pr,(o&&o.timeoutMs)||25000) : appsScriptGet(a,pr,o);
      const ping = await testCall('ping', null, {retry:false, timeoutMs:20000});
      pingMs = Date.now()-t0;
      stepLabel = 'Step 2/2 — reading CNFs & products from the Sheet';
      const boot = await testCall('bootstrap', null, {retry:false, timeoutMs:45000});
      const totalS = ((Date.now()-t0)/1000).toFixed(1);
      const sb = ping.backend==='supabase';
      result.innerHTML = `✓ Connected to ${sb?'':'Google Sheet '}<b>"${escapeHtml(ping.connectedSpreadsheet)}"</b> — found ${(boot.masters.cnfs||[]).length} CNFs and ${(boot.masters.products||[]).length} products.<br><span style="font-family:var(--mono);font-size:10px;">${sb?'Database':'Script'} answered in ${(pingMs/1000).toFixed(1)}s · data loaded in ${totalS}s total · ${sb?'Database':'Sheet ID'}: ${escapeHtml(ping.spreadsheetId)} · ${sb?'Tables':'Tabs'}: ${escapeHtml((ping.sheets||[]).join(', '))}</span>`;
      result.style.color = 'var(--green)';
    }catch(e){
      const msg = String((e&&e.message)||e);
      let hint = '';
      if(pingMs===null && /timed out/i.test(msg)) hint = 'The server did not answer at all within 20s — usually the URL is wrong or points to a deleted deployment, or the deployment access is not set to "Anyone".';
      else if(pingMs!==null && /timed out/i.test(msg)) hint = `The server IS reachable (it answered in ${(pingMs/1000).toFixed(1)}s) but took over 45s to read the Sheet — that points at the Sheet/backend being slow, not the URL.`;
      else if(/failed to fetch|networkerror|load failed/i.test(msg)) hint = 'The browser could not reach it — check the URL, that deployment access is "Anyone", and your internet connection.';
      else if(/valid data/i.test(msg)) hint = 'The URL answered with a web page instead of data — a stale or broken deployment.';
      result.style.whiteSpace = 'pre-wrap';
      result.textContent = `✗ Could not connect at ${pingMs===null?'step 1 (contacting the server)':'step 2 (reading the Sheet)'}: ${msg}${hint?'\n→ '+hint:''}\nIf it persists, contact IT: 1800-121-0144`;

function ensureBatch(code, idx){
  const p = state.masters.products.find(pp=>pp.code===code);
  if(!state.draftItems[code] || !state.draftItems[code].length){
    state.draftItems[code] = [{qty:'', uom:p.defaultUOM, mfd:''}];
  }
  while(state.draftItems[code].length <= idx){
    state.draftItems[code].push({qty:'', uom:p.defaultUOM, mfd:''});
  }
  return state.draftItems[code][idx];
}

// Debounced auto-save — every quantity, MFD, or UOM change now persists to
// this device automatically, not just on an explicit "Save Draft" click.
// This is the actual fix for a real risk: entered data only ever lived in
// memory until someone remembered to tap Save Draft — a crashed tab, an
// accidental back-navigation, or a phone that killed the browser to save
// memory would silently lose everything typed since the last manual save.
// Debounced (not on every keystroke) so rapid typing doesn't hammer
// localStorage; 800ms after the last change is plenty fast to survive
// anything short of the exact instant of a crash.
let __autoSaveDraftTimer = null;
function autoSaveDraft(){
  if(!state.cnfUser) return;
  if(__autoSaveDraftTimer) clearTimeout(__autoSaveDraftTimer);
  __autoSaveDraftTimer = setTimeout(()=>{
    saveDraft(state.cnfUser.code, {date: state.submitDate, items: state.draftItems, sapUpload: state.sapUpload, varianceReasons: state.varianceReasons});
  }, 800);
}

// Once every SAP line in the active category that needs entry has a
// A CNF taps "Next Category" only when THEY decide this category is truly
// done — never automatically. A single filled batch does not mean a
// product is finished: many products arrive as several dated lots
// (multiple MFD batches), and jumping away the moment the first batch got
// a quantity would skip the rest before they'd had a chance to add them.
// This function is only ever called from that manual button click, and
// always goes to the specific category shown on the button — no
// recomputation that could disagree with what was actually on screen.
function goToNextCategory(targetCat){
  if(!targetCat) return;
  state.submitCat = targetCat;
  state.sapMissingOnlyFilter = false;
  state.categoryJustAdvanced = targetCat;
  render();
  setTimeout(()=>{ state.categoryJustAdvanced = null; render(); }, 900);
}

function bindRowInputs(){
  document.querySelectorAll('[data-qtycode]').forEach(inp=>inp.oninput=()=>{
    const code = inp.dataset.qtycode, idx = Number(inp.dataset.batch);
    const b = ensureBatch(code, idx);
    b.qty = inp.value;
    updateRowMeta(code);
    updateUomWarning(code, idx, b.uom || (state.masters.products.find(p=>p.code===code)||{}).defaultUOM);
    autoSaveDraft();
  });
  document.querySelectorAll('[data-uomcode]').forEach(sel=>sel.onchange=()=>{
    const code = sel.dataset.uomcode, idx = Number(sel.dataset.batch);
    const b = ensureBatch(code, idx);
    b.uom = sel.value;
    updateRowMeta(code);
    updateUomWarning(code, idx, sel.value);
    autoSaveDraft();
  });
  // MFD as a typed text field — fast entry with flexible formats
  // ("1-8-26", "01.08.2026", "1,8.26", "010826"), but never silently
  // accepts a guess it isn't sure about (see parseFlexibleDate). An
  // invalid/ambiguous entry shows a clear inline error and leaves the
  // stored MFD blank rather than risk a wrong date corrupting ageing
  // calculations downstream.
  document.querySelectorAll('[data-mfdcode]').forEach(inp=>inp.onblur=()=>{
    const code = inp.dataset.mfdcode, idx = Number(inp.dataset.batch);
    const errEl = document.querySelector(`[data-mfderror="${code}:${idx}"]`);
    const raw = inp.value.trim();
    const b = ensureBatch(code, idx);
    if(!raw){
      b.mfd = '';
      inp.classList.remove('mfd-error-state');
      if(errEl){ errEl.style.display='none'; errEl.textContent=''; }
      autoSaveDraft();
      return;
    }
    const parsed = parseFlexibleDate(raw);
    if(parsed && isFutureMfd(parsed)){
      // A batch cannot have been manufactured after today — today and any
      // earlier date is fine, but even tomorrow is refused outright, and
      // nothing is stored so a wrong date can never reach ageing/reports.
      b.mfd = '';
      inp.classList.add('mfd-error-state');
      if(errEl){ errEl.style.display='block'; errEl.textContent = `⚠ MFD ${ddmmyyyy(parsed)} is in the future — manufacturing date can be today or earlier only.`; }
      autoSaveDraft();
      return;
    }
    if(parsed){
      b.mfd = parsed;
      inp.value = ddmmyyyy(parsed);
      inp.classList.remove('mfd-error-state');
      if(errEl){ errEl.style.display='none'; errEl.textContent=''; }
      const picker = document.querySelector(`[data-mfdpicker="${code}:${idx}"]`);
      if(picker) picker.value = parsed;
      autoSaveDraft();
    } else {
      b.mfd = ''; // never keep a half-guessed date silently — force a clear correction
      inp.classList.add('mfd-error-state');
      if(errEl){ errEl.style.display='block'; errEl.textContent = `⚠ "${raw}" not understood — try DD-MM-YYYY (e.g. 01-08-2026), or tap 📅.`; }
    }
  });
  document.querySelectorAll('[data-mfdcal]').forEach(btn=>btn.onclick=()=>{
    const [code, idxStr] = btn.dataset.mfdcal.split(':');
    const picker = document.querySelector(`[data-mfdpicker="${code}:${idxStr}"]`);
    if(picker && picker.showPicker) { try{ picker.showPicker(); }catch(e){ picker.focus(); picker.click(); } }
    else if(picker){ picker.focus(); picker.click(); }
  });
  document.querySelectorAll('[data-mfdpicker]').forEach(picker=>picker.onchange=()=>{
    const [code, idxStr] = picker.dataset.mfdpicker.split(':');
    const idx = Number(idxStr);
    const b = ensureBatch(code, idx);
    if(isFutureMfd(picker.value)){
      b.mfd = ''; picker.value = '';
      const t = document.querySelector(`[data-mfdcode="${code}"][data-batch="${idx}"]`);
      const e = document.querySelector(`[data-mfderror="${code}:${idx}"]`);
      if(t){ t.value=''; t.classList.add('mfd-error-state'); }
      if(e){ e.style.display='block'; e.textContent='⚠ MFD cannot be in the future — pick today or an earlier date.'; }
      autoSaveDraft();
      return;
    }
    b.mfd = picker.value;
    const textInp = document.querySelector(`[data-mfdcode="${code}"][data-batch="${idx}"]`);
    if(textInp){ textInp.value = ddmmyyyy(picker.value); textInp.classList.remove('mfd-error-state'); }
    const errEl = document.querySelector(`[data-mfderror="${code}:${idx}"]`);
    if(errEl){ errEl.style.display='none'; errEl.textContent=''; }
    autoSaveDraft();
  });
  document.querySelectorAll('[data-addbatch]').forEach(btn=>btn.onclick=()=>{
    const code = btn.dataset.addbatch;
    const p = state.masters.products.find(pp=>pp.code===code);
    if(!state.draftItems[code] || !state.draftItems[code].length){
      state.draftItems[code] = [{qty:'', uom:p.defaultUOM, mfd:''}];
    }
    state.draftItems[code].push({qty:'', uom:p.defaultUOM, mfd:''});
    rerenderOneRow(code);
    autoSaveDraft();
  });
  document.querySelectorAll('[data-removebatch]').forEach(btn=>btn.onclick=()=>{
    const [code, idxStr] = btn.dataset.removebatch.split(':');
    const idx = Number(idxStr);
    if(state.draftItems[code] && state.draftItems[code].length>1){
      state.draftItems[code].splice(idx,1);
      rerenderOneRow(code);
      autoSaveDraft();
    }
  });
  // "Same date for all N" — for a product with many MFD batches (e.g. 50kg+
  // stock split across a dozen dated lots), typing the identical date into
  // every single batch one at a time was the actual reported time sink.
  // One tap fills every batch with batch #1's date; anything genuinely
  // different just gets corrected on that one row afterward, instead of
  // typed from scratch N times.
  document.querySelectorAll('[data-copymfd]').forEach(btn=>btn.onclick=()=>{
    const code = btn.dataset.copymfd;
    const batches = state.draftItems[code];
    if(!batches || !batches.length) return;
    const firstMfd = batches[0].mfd;
    if(!firstMfd){ showToast('Enter the first MFD date, then tap this to copy it to the rest.'); return; }
    batches.forEach(b=>{ b.mfd = firstMfd; });
    rerenderOneRow(code);
    autoSaveDraft();
    showToast(`Copied ${firstMfd} to all ${batches.length} batches — adjust any that are actually different.`);
  });
  document.querySelectorAll('[data-reasoncode]').forEach(inp=>inp.oninput=()=>{
    state.varianceReasons[inp.dataset.reasoncode] = inp.value;
    autoSaveDraft();
  });
  wireKeyboardFlow();
}

// Enter-to-advance so a CNF entering 50+ batches never has to reach for
// the mouse: MFD -> Enter -> lands in that same batch's Quantity ->
// Enter -> jumps straight to the NEXT batch's MFD (which may be the next
// batch of the same product, or the first batch of the next product —
// whichever comes next on screen). UOM is skipped in this chain since it's
// almost always left at the product default; it's still reachable with a
// normal Tab press for the rare case it needs changing. If the date just
// typed didn't parse, focus deliberately stays put so the error (shown by
// the blur handler) doesn't get jumped past unnoticed.
function wireKeyboardFlow(){
  const mfdInputs = Array.from(document.querySelectorAll('.mfd-text'));
  const qtyInputs = Array.from(document.querySelectorAll('.qty'));
  mfdInputs.forEach((inp,i)=>{
    inp.onkeydown = (e)=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      inp.blur(); // runs the existing parse/validate/normalize logic synchronously
      if(!inp.classList.contains('mfd-error-state') && qtyInputs[i]){
        qtyInputs[i].focus();
        qtyInputs[i].select();
      }
    };
  });
  qtyInputs.forEach((inp,i)=>{
    inp.onkeydown = (e)=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const next = mfdInputs[i+1];
      if(next){ next.focus(); next.select(); }
      else { inp.blur(); } // last field on the page — nothing further to jump to
    };
  });
}

function rerenderOneRow(code){
  const row = document.querySelector(`[data-prow="${code}"]`);
  if(!row) return;
  const sapRow = state.sapUpload && state.sapUpload.rows.find(r=>r.code===code);
  if(sapRow){ const t_=document.createElement('template'); t_.innerHTML=sanitizeHtml_(SapProductRow(sapRow)); row.replaceWith(t_.content); } else row.remove();
  bindRowInputs();
  updateProgress();
}

// PC/Bag-opened check lives here alongside the missing-conversion-factor
// check since both are "something about this UOM choice needs the CNF's
// attention" — PC and BAG are both physical, whole-number units (a
// piece or a sealed bag either exists or it doesn't), so a non-whole
// count in either means the actual stock is loose/opened and should be
// counted in KG instead. This both warns inline and (via the CSS class)
// marks the field as blocking so Final Submit can refuse to go through
// with it still set.
function updateUomWarning(code, idx, uom){
  const p = state.masters.products.find(pp=>pp.code===code);
  const warnEl = document.querySelector(`[data-uomwarn="${code}:${idx}"]`);
  if(!warnEl || !p) return;
  const batch = (state.draftItems[code]||[])[idx];
  const qty = batch && batch.qty!==undefined && batch.qty!=='' ? Number(batch.qty) : null;
  const notWhole = (uom==='BAG' || uom==='PC') && qty!==null && !isNaN(qty) && Math.abs(qty - Math.round(qty)) > 0.001;
  const noConversion = (uom==='BAG' && !p.bagToKg) || (uom==='PC' && !p.pcToKg);
  if(notWhole){
    warnEl.style.display = '';
    warnEl.classList.add('uom-warn-blocking');
    setHtml_(warnEl, uom==='BAG' ? `⚠️ Bag opened. Submit stock in KG or PC.` : `⚠️ PC must be a whole number. Submit stock in KG instead.`);
  } else if(noConversion){
    warnEl.style.display = '';
    warnEl.classList.remove('uom-warn-blocking');
    setHtml_(warnEl, `⚠ No ${uom} size set for this product yet — Admin can add it in Product Master or via UOM Converter import. Until then, this ${uom} quantity is <b>not converted</b>, it's used as-is.`);
  } else {
    warnEl.style.display = 'none';
    warnEl.classList.remove('uom-warn-blocking');
    warnEl.innerHTML = '';
  }
}
// Whole-catalog version of the same check — used right before Final
// Submit so a partial bag or a fractional piece can never slip through
// just because nobody happened to re-trigger the inline warning for that
// one row.
function findOpenBagViolations(){
  const violations = [];
  Object.keys(state.draftItems).forEach(code=>{
    (state.draftItems[code]||[]).forEach((b,idx)=>{
      if((b.uom==='BAG' || b.uom==='PC') && b.qty!==undefined && b.qty!==''){
        const qty = Number(b.qty);
        if(!isNaN(qty) && Math.abs(qty - Math.round(qty)) > 0.001){
          const p = state.masters.products.find(pp=>pp.code===code);
          violations.push({code, idx, name: p?p.name:code, qty, uom: b.uom});
        }
      }
    });
  });
  return violations;
}

function updateProgress(){
  const prog = document.querySelector('.sticky-submit .prog');
  if(!prog || !state.sapUpload) return;
  const unresolved = state.sapUpload.rows.filter(r=>hasUnresolvedVariance(r.code)).length;
  const requiredTotal = state.sapUpload.rows.filter(r=>r.currentStockKg>0).length;
  const requiredDone = requiredTotal - missingRequiredCodes().length;
  prog.textContent = `${requiredDone}/${requiredTotal} required entered${unresolved?` · ${unresolved} unresolved`:''}`;
}

// Updates only the meta line + reason-field visibility for a row, WITHOUT
// touching the batch inputs themselves — full re-render would drop input
// focus mid-keystroke while the CNF is still typing a quantity.
function updateRowMeta(code){
  const row = document.querySelector(`[data-prow="${code}"]`);
  if(!row || !state.sapUpload) return;
  const sapRow = state.sapUpload.rows.find(r=>r.code===code);
  if(!sapRow) return;
  const p = state.masters.products.find(pp=>pp.code===code);
  const batches = state.draftItems[code] || [];
  const filledBatches = batches.filter(b=>b.qty!==undefined && b.qty!=='');
  const filled = filledBatches.length>0;
  const totalKg = filledBatches.reduce((s,b)=>s+convertToKg(p,b.qty,b.uom||p.defaultUOM),0);
  const diff = filled ? roundedDiffKg(totalKg, sapRow.currentStockKg) : null;
  const needsReason = filled && diff!==null && !withinTolerance(diff);
  const reasonFilled = state.varianceReasons[code] && state.varianceReasons[code].trim();

  row.classList.toggle('filled', !!filled);
  row.classList.toggle('needs-reason', needsReason && !reasonFilled);

  const meta = row.querySelector('.pmeta');
  if(meta){
    setHtml_(meta, `${p.code} · SAP Current Stock <b>${fmtKg(sapRow.currentStockKg)}kg</b>${formatUomEquivalents(sapRow.currentStockKg, p)}${filled?` · Entered <b>${fmtKg(totalKg)}kg</b>${formatUomEquivalents(totalKg, p)}`:''}
      ${filled ? (withinTolerance(diff) ? ' · <span class="badge ok">Matches SAP</span>' : ` · <span class="badge low">Δ ${diff>0?'+':''}${fmtKg(diff)}kg vs SAP</span>`) : ''}`);
  }

  // The Safety Norm / Below-Safety badge lives on the SECOND meta line
  // (.pmeta2), not the one above — it was being left stale while typing
  // (only refreshed on a full re-render, e.g. switching category), so a
  // breach wouldn't show the red badge until well after the number that
  // caused it was actually entered. Keeping this in sync live, on every
  // keystroke, matters here specifically because it's a stock-risk signal
  // the CNF should see the moment it becomes true, not several actions later.
  const meta2 = row.querySelector('.pmeta2');
  if(meta2){
    const safetyNorm = safetyNormFor(sapRow, p);
    const hasSafetyNorm = safetyNorm>0;
    const belowSafety = filled && hasSafetyNorm && totalKg < safetyNorm;
    setHtml_(meta2, `Approved Order <b>${(sapRow.approvedOrder||0).toLocaleString('en-IN',{maximumFractionDigits:1})}</b> · Pending Order <b>${(sapRow.pendingOrder||0).toLocaleString('en-IN',{maximumFractionDigits:1})}</b> · ${hasSafetyNorm ? `Safety Norm <b>${safetyNorm}kg</b>` : `<span class="badge unknown">No Safety Norm Set</span>`}${belowSafety?` · <span class="badge low">Below Safety — short ${fmtKg(safetyNorm-totalKg)}kg</span>`:''}${pcPerBag(p) ? ` · 1 BAG = ${p.bagToKg}kg = ${pcPerBag(p)} PC` : ''}`);
  }

  let reasonRow = row.querySelector('.reason-row');
  if(filled && !reasonRow){
    const div = document.createElement('div');
    div.className = needsReason ? 'reason-row' : 'reason-row reason-row-optional';
    setHtml_(div, `<label>${needsReason?'Reason for difference (required)':'Note (optional)'}</label><input type="text" data-reasoncode="${code}" placeholder="${needsReason?'e.g. Damage, unrecorded dispatch, counting error…':'Matches SAP — add a note if you want to record anything'}" value="${escapeHtml(state.varianceReasons[code]||'')}">`);
    row.appendChild(div);
    div.querySelector('input').oninput = (e)=>{ state.varianceReasons[code] = e.target.value; autoSaveDraft(); };
  } else if(filled && reasonRow){
    // matched/mismatched can flip live as someone edits quantity — keep the
    // label and required/optional styling in sync without losing whatever
    // they've already typed into the note.
    reasonRow.className = needsReason ? 'reason-row' : 'reason-row reason-row-optional';
    const label = reasonRow.querySelector('label');
    const input = reasonRow.querySelector('input');
    if(label) label.textContent = needsReason ? 'Reason for difference (required)' : 'Note (optional)';
    if(input) input.placeholder = needsReason ? 'e.g. Damage, unrecorded dispatch, counting error…' : 'Matches SAP — add a note if you want to record anything';
  } else if(!filled && reasonRow){
    reasonRow.remove();
  }
  updateProgress();
}

function renderRowsOnly(){
  const wrap = document.getElementById('prodRows');
  if(!wrap || !state.sapUpload) return;
  const missing = missingRequiredCodes();
  // Same guard as CnfSubmit(): nothing left missing means the filtered view
  // has nothing to show — do a full render so the category tabs and the
  // normal card list come back, rather than leaving an empty list behind.
  if(state.sapMissingOnlyFilter && !missing.length){ state.sapMissingOnlyFilter = false; render(); return; }
  let baseRows;
  if(state.sapMissingOnlyFilter){
    baseRows = state.sapUpload.rows.filter(r=>missing.includes(r.code));
  } else {
    const catGroups = sapCategoryGroups();
    const activeGroup = catGroups.find(g=>g.cat===state.submitCat);
    baseRows = activeGroup ? activeGroup.rows : [];
  }
  let rows = state.sapMissingOnlyFilter ? baseRows : baseRows.filter(r => state.sapShowZero || r.currentStockKg > 0);
  if(state.sapSearch) rows = rows.filter(r => r.name.toLowerCase().includes(state.sapSearch.toLowerCase()) || r.code.toLowerCase().includes(state.sapSearch.toLowerCase()));
  setHtml_(wrap, rows.map(r=>SapProductRow(r)).join('') || '<div class="empty"><div class="big">No items</div>Try another search term, or enable "Show all".</div>');
  bindRowInputs();
}

setTheme(getTheme());
// A CNF opening this on a slow mobile connection could otherwise stare at
// a genuinely blank white page for however long the first network fetch
// takes — nothing was ever rendered before that fetch resolved. This
// paints the "Loading stock system…" state immediately, synchronously,
// before any async work starts, so there's always something on screen
// within milliseconds — worst case a loading message, never true blankness.
render();
loadAll();
</script>
</body>
